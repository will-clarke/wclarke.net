<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- T58 PWA icon source: the favicon's nested-window motif, full-bleed linen
       so it survives Android's maskable crop (motif stays in the safe circle).
       Window frames are filled rects, not strokes - ImageMagick's bundled SVG
       rasterizer drops stroke on rects. Regenerate the PNGs with:
       magick icon.svg -resize 512x512 icon-512.png
       magick icon.svg -resize 192x192 icon-192.png
       magick icon.svg -resize 180x180 apple-touch-icon.png -->
  <rect width="512" height="512" fill="#f3ecdf"/>
  <rect x="115" y="115" width="282" height="282" rx="36" fill="#5f95c9"/>
  <rect x="145" y="145" width="222" height="222" rx="12" fill="#f3ecdf"/>
  <rect x="190" y="190" width="132" height="132" rx="24" fill="#9a86cb"/>
  <rect x="214" y="214" width="84" height="84" rx="8" fill="#f3ecdf"/>
  <rect x="244" y="244" width="24" height="24" fill="#d9a94e"/>
</svg>
