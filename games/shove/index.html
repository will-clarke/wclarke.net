<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12101c">
<title>Shove</title>
<style>
:root{
  --bg:#12101c; --panel:#1d1a2c; --panel2:#262238; --ink:#efe9dc; --dim:#8d86a3;
  --acc:#ff8a4d; --red:#ff4d5e; --gold:#f5b942; --blue:#58d5ff; --green:#a8f06e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:flex;flex-direction:column;height:100dvh}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top));
  background:linear-gradient(#1c1930,#171427);border-bottom:1px solid #2c2745;min-height:44px}
#hName{font-weight:800;letter-spacing:.5px;font-size:14px;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hTurn{margin-left:auto;font-size:13px;color:var(--dim);font-weight:700;white-space:nowrap}
#hGate{font-size:15px;letter-spacing:1px;white-space:nowrap}
.hbtn{width:34px;height:34px;border-radius:9px;background:#2b2744;color:var(--dim);font-size:15px;font-weight:800;flex:none}
.hbtn:active{background:#3a3560}
#cvwrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tip{position:absolute;left:10px;right:10px;top:8px;z-index:5;background:#241f3ae6;border:1px solid #3b3560;
  border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.45;color:#d9d3ea;box-shadow:0 6px 20px #0008}
#tip b{color:var(--gold)}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;background:#241f3af0;
  border:1px solid #3b3560;border-radius:10px;padding:7px 12px;font-size:12px;color:#d9d3ea;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .25s}
.hidden{display:none!important}
#dock{background:linear-gradient(#171427,#12101c);border-top:1px solid #2c2745;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
#chips,#abil,#ctrl{width:100%;max-width:520px;margin:0 auto}
#chips{display:flex;gap:7px}
.chip{flex:1;background:var(--panel2);border-radius:12px;padding:6px 4px 5px;text-align:center;
  border:2px solid transparent;line-height:1.25;position:relative;transition:border-color .12s}
.chip b{display:block;font-size:12px;letter-spacing:1px;color:var(--cc,#fff)}
.chip .hp{display:block;font-size:10px;letter-spacing:1.5px;color:#79e07a}
.chip .ch{display:block;font-size:9px;letter-spacing:2px;color:var(--gold)}
.chip.sel{border-color:var(--cc,#fff);background:#2e2949}
.chip.done{opacity:.42}
.chip.dead{opacity:.3}
.chip.dead b::after{content:" ✕";color:var(--red)}
#abil{display:flex;gap:7px;min-height:46px;align-items:stretch}
.ab{flex:1;background:var(--panel2);border-radius:12px;padding:5px 8px;text-align:left;border:2px solid transparent;line-height:1.2}
.ab b{display:block;font-size:12.5px}
.ab span{display:block;font-size:10px;color:var(--dim);margin-top:1px}
.ab.armed{border-color:var(--acc);background:#332a45}
.ab.full{box-shadow:0 0 12px #f5b94255;border-color:#f5b94288}
.ab:disabled{opacity:.38}
#abhint{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;text-align:center;padding:0 6px}
#ctrl{display:flex;gap:7px}
#ctrl button{flex:1;padding:11px 0;border-radius:12px;font-weight:800;font-size:14px;letter-spacing:.5px}
#bUndo{background:#2b2744;color:#b7b0cf}
#bUndo:disabled{opacity:.35}
#bEnd{background:var(--acc);color:#241205}
#bEnd.pulse{animation:pl 1s infinite}
@keyframes pl{50%{filter:brightness(1.25)}}
/* menu + overlay */
#menu,#over{position:fixed;inset:0;z-index:10;background:radial-gradient(120% 90% at 50% 0%,#1e1a33,#0e0c17);
  overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
#over{background:#0e0c17e8;display:flex;align-items:center;justify-content:center}
.title{font-size:52px;font-weight:900;letter-spacing:6px;text-align:center;margin:14px 0 2px;
  color:var(--ink);text-shadow:0 4px 0 #6b2f14,0 10px 30px #ff8a4d33;transform:skewX(-4deg)}
.subtitle{text-align:center;color:var(--dim);font-size:13px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid #2c2745;border-radius:16px;padding:14px;margin:0 auto 14px;max-width:440px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:2px;color:var(--dim);font-weight:800}
#fights{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fbtn{background:var(--panel2);border-radius:12px;padding:9px 2px;text-align:center;border:1px solid #343052}
.fbtn .n{font-weight:900;font-size:16px}
.fbtn .s{font-size:11px;color:var(--gold);height:14px;display:block}
.fbtn:disabled{opacity:.3}
.bigbtn{display:block;width:100%;background:var(--acc);color:#241205;font-weight:900;font-size:16px;
  padding:13px;border-radius:13px;letter-spacing:1px;margin-top:8px}
.bigbtn.ghost{background:#2b2744;color:#b7b0cf}
.rules{font-size:12.5px;line-height:1.55;color:#cfc9e0}
.rules li{margin-bottom:5px}
.rules b{color:var(--gold)}
.mini{font-size:11.5px;color:var(--dim);text-align:center;margin-top:4px}
#overbox{max-width:400px;width:calc(100% - 36px);text-align:center}
#overbox h1{font-size:34px;margin:2px 0 6px;letter-spacing:3px}
#overbox .star{font-size:40px;color:var(--gold);text-shadow:0 0 22px #f5b94288;margin:2px 0}
#overbox .stats{color:var(--dim);font-size:13px;line-height:1.7;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button class="hbtn" id="bBack">✕</button>
    <div id="hName"></div>
    <div id="hTurn"></div>
    <div id="hGate"></div>
    <button class="hbtn" id="bRetry">↻</button>
  </div>
  <div id="cvwrap">
    <canvas id="cv"></canvas>
    <div id="tip" class="hidden"></div>
    <div id="toast"></div>
  </div>
  <div id="dock">
    <div id="chips"></div>
    <div id="abil"></div>
    <div id="ctrl">
      <button id="bUndo" disabled>Undo</button>
      <button id="bEnd">End Turn</button>
    </div>
  </div>
</div>
<div id="menu"></div>
<div id="over" class="hidden"><div id="overbox" class="card"></div></div>
<script>
"use strict";
/* ============================== data ============================== */
const W=5,H=7,ZONE=5; // rows >= ZONE are the charge zone (enemies march 2)
const DIRS={up:[0,1],down:[0,-1],left:[-1,0],right:[1,0]};
const DKEYS=['up','right','down','left'];
const OPP={up:'down',down:'up',left:'right',right:'left'};

const KITS={
  ram:{name:'RAM',col:'#ff8a4d',hp:4,move:2,chMax:4,
    basic:{n:'Punch',d:'1 dmg + shove an adjacent enemy'},
    charged:{n:'Bull Rush',d:'Charge 3 tiles, plowing enemies'}},
  lancer:{name:'LANCER',col:'#58d5ff',hp:3,move:2,chMax:3,
    basic:{n:'Stab',d:'Hit 2 tiles in a line, far one shoved'},
    charged:{n:'Skewer',d:'1 dmg + pin an enemy for 2 turns'}},
  gale:{name:'GALE',col:'#a8f06e',hp:3,move:3,chMax:4,
    basic:{n:'Shove',d:'Push all adjacent enemies 1'},
    charged:{n:'Gust',d:'Push a whole row up 2'}},
};
const FOES={
  grunt:{name:'Grunt',hp:2,dmg:1,gate:1,col:'#ddd2c0',info:'walks and hits for 1'},
  archer:{name:'Archer',hp:2,dmg:1,gate:1,col:'#e6c98f',info:'shoots down its column'},
  shield:{name:'Shield',hp:3,dmg:1,gate:2,col:'#cfc6b6',info:'front plate blocks damage'},
  bomber:{name:'Bomber',hp:1,dmg:0,gate:2,col:'#4a4458',info:'explodes on death: 1 dmg + shove around it'},
  brute:{name:'Brute',hp:4,dmg:2,gate:2,col:'#c9a98a',info:'big, slow to die, hits for 2'},
};
const CH={G:'grunt',A:'archer',S:'shield',B:'bomber',X:'brute'};

const FIGHTS=[
 {name:'First Shove',turns:5,map:[
  '.....','...G.','.....','G....','.....','..r..','.l.g.'],
  spawns:[[2,4,'grunt'],[3,2,'grunt']],
  tip:'<b>Tap a unit</b>, tap a blue tile to move, tap a red-ringed enemy to hit. Shove into an <b>edge or wall</b> for +1 damage. The tinted top rows are the <b>charge zone</b>: enemies there march 2. Keep the gate clean and everyone alive for a Perfect.'},
 {name:'The Long Drop',turns:5,map:[
  '.....','.G.G.','..O..','.O...','....G','..r..','.l.g.'],
  spawns:[[2,2,'grunt'],[3,4,'grunt'],[4,0,'grunt']],
  tip:'A shove into a <b>pit</b> is a kill. Any pit, any enemy, any size.'},
 {name:'Arrows',turns:6,map:[
  '.A.A.','.....','..G..','.....','.....','.r.l.','..g..'],
  spawns:[[2,2,'archer'],[3,0,'grunt'],[4,4,'grunt']],
  tip:'<b>Archers</b> shoot down their column every turn. Step off the lane - or shove the archer onto a new one and let it shoot its friends.'},
 {name:'Brickwork',turns:6,map:[
  '..A..','G...G','.....','#.#.#','.....','.rlg.','.....'],
  spawns:[[2,1,'grunt'],[3,3,'archer'],[4,1,'grunt'],[5,3,'grunt']],
  tip:'Walls hurt. A body slammed into <b>brick</b> takes 1. The gaps are the only way down - make them expensive.'},
 {name:'Tortoise',turns:6,map:[
  '..S..','.....','.G.G.','....O','.....','.r.g.','..l..'],
  spawns:[[3,2,'shield'],[4,0,'grunt']],
  tip:'<b>Shields</b> ignore anything that lands on their front plate. Flank them, hit their back, or just shove them somewhere useless.'},
 {name:'Sparks',turns:6,map:[
  '.....','.GBG.','..B..','.....','O...O','..r..','.l.g.'],
  spawns:[[2,2,'grunt'],[3,1,'bomber'],[4,3,'grunt']],
  tip:'<b>Bombers</b> explode on death: 1 damage and a shove to everything adjacent. Herd the crowd first, then light the fuse.'},
 {name:'The Chute',turns:7,map:[
  '#...#','#.A.#','#G.S#','#...#','.....','.rlg.','.....'],
  spawns:[[2,2,'grunt'],[3,1,'archer'],[4,3,'grunt'],[5,2,'shield'],[6,2,'grunt']],
  tip:null},
 {name:'Big Lad',turns:7,map:[
  '..X..','.....','.G.G.','.....','..O..','.r.g.','..l..'],
  spawns:[[2,0,'grunt'],[3,4,'archer'],[5,2,'grunt']],
  tip:'The <b>Brute</b> takes 4 hits and deals 2. The pit does not care how big he is.'},
 {name:'Full House',turns:7,map:[
  '.A.B.','.....','G.S.G','.#.#.','..O..','.r.g.','..l..'],
  spawns:[[2,0,'grunt'],[3,2,'brute'],[4,4,'archer'],[5,2,'bomber']],
  tip:null},
 {name:'Hold the Gate',turns:8,map:[
  '.G.G.','..X..','.....','.O.O.','.....','.rlg.','.....'],
  spawns:[[2,2,'archer'],[3,0,'bomber'],[3,4,'bomber'],[4,2,'grunt'],[5,1,'shield'],[6,3,'grunt'],[7,2,'archer']],
  tip:null},
];

/* ============================== save ============================== */
const SVK='shove_v1';
let SV;
try{SV=JSON.parse(localStorage.getItem(SVK))||{}}catch(e){SV={}}
SV.unlocked=SV.unlocked||1; SV.stars=SV.stars||{}; SV.daily=SV.daily||null; SV.mute=!!SV.mute;
function save(){try{localStorage.setItem(SVK,JSON.stringify(SV))}catch(e){}}

/* ============================== sim ============================== */
const clone=o=>JSON.parse(JSON.stringify(o));
const inb=(c,r)=>c>=0&&c<W&&r>=0&&r<H;
const ti=(c,r)=>r*W+c;

function parseDef(def){
  const ter=new Array(W*H).fill(0), foes=[], units=[];
  const uorder={r:'ram',l:'lancer',g:'gale'};
  for(let row=0;row<H;row++){
    const r=H-1-row, line=def.map[row];
    for(let c=0;c<W;c++){
      const ch=line[c];
      if(ch==='#')ter[ti(c,r)]=1;
      else if(ch==='O')ter[ti(c,r)]=2;
      else if(CH[ch])foes.push({k:CH[ch],c,r});
      else if(uorder[ch])units.push({k:uorder[ch],c,r});
    }
  }
  return {name:def.name,turns:def.turns,tip:def.tip,ter,foes,units,
    spawns:def.spawns.map(s=>({t:s[0],c:s[1],k:s[2]}))};
}
function newFight(nd,gate0){
  const st={turn:1,turns:nd.turns,gate:gate0,gateStart:gate0,ter:nd.ter.slice(),
    units:[],foes:[],spawns:clone(nd.spawns),nid:1,kills:0,ev:[]};
  for(const u of nd.units){const k=KITS[u.k];
    st.units.push({id:st.nid++,k:u.k,c:u.c,r:u.r,hp:k.hp,mhp:k.hp,ch:0,moved:false,acted:false,dead:false});}
  for(const f of nd.foes)addFoe(st,f.k,f.c,f.r,false);
  computeIntents(st);
  return st;
}
function addFoe(st,k,c,r,ev){
  const d=FOES[k],f={id:st.nid++,k,c,r,hp:d.hp,mhp:d.hp,pin:0,dir:null};
  st.foes.push(f);
  if(ev)st.ev.push({t:'spawn',foe:clone(f)});
  return f;
}
const foeAt=(st,c,r)=>st.foes.find(f=>f.c===c&&f.r===r);
const unitAt=(st,c,r)=>st.units.find(u=>!u.dead&&u.c===c&&u.r===r);
const foeById=(st,id)=>st.foes.find(f=>f.id===id);
const unitById=(st,id)=>st.units.find(u=>u.id===id);
function occAt(st,c,r){const f=foeAt(st,c,r);if(f)return{foe:f};const u=unitAt(st,c,r);if(u)return{unit:u};return null}

/* contactFace: which face of the foe takes the impact ('down' = its shield plate) */
function hurtFoe(st,f,amt,contactFace){
  if(f.k==='shield'&&contactFace==='down'){st.ev.push({t:'block',f:f.id,c:f.c,r:f.r});return}
  f.hp-=amt;
  st.ev.push({t:'hurtf',f:f.id,amt,hp:f.hp,c:f.c,r:f.r});
  if(f.hp<=0)killFoe(st,f,'hit');
}
function killFoe(st,f,cause){
  const c=f.c,r=f.r;
  st.foes=st.foes.filter(x=>x.id!==f.id);
  st.kills++;
  st.ev.push({t:'dief',f:f.id,c,r});
  if(f.k==='bomber'&&cause!=='fall')explode(st,c,r);
}
function hurtUnit(st,u,amt){
  u.hp-=amt;
  st.ev.push({t:'hurtu',u:u.id,amt,hp:u.hp,c:u.c,r:u.r});
  if(u.hp<=0&&!u.dead){u.dead=true;st.ev.push({t:'dieu',u:u.id,c:u.c,r:u.r})}
}
function explode(st,c,r){
  st.ev.push({t:'boom',c,r});
  const hits=[];
  for(const dk of DKEYS){const[dc,dr]=DIRS[dk],nc=c+dc,nr=r+dr;
    if(!inb(nc,nr))continue;
    const o=occAt(st,nc,nr);
    if(o)hits.push({o,dk});}
  for(const {o,dk} of hits){
    if(o.foe){const f=foeById(st,o.foe.id);if(!f)continue;
      hurtFoe(st,f,1,OPP[dk]);
      const f2=foeById(st,o.foe.id);
      if(f2)pushFoe(st,f2,dk,1);}
    else{const u=o.unit;if(u.dead)continue;
      hurtUnit(st,u,1);
      if(!u.dead)pushUnit(st,u,dk,1);}
  }
}
function pushFoe(st,f,dk,steps){
  const[dc,dr]=DIRS[dk];let moved=0;
  for(let i=0;i<steps;i++){
    const nc=f.c+dc,nr=f.r+dr;
    if(!inb(nc,nr)||st.ter[ti(nc,nr)]===1){ // edge/wall slam: contact face = movement dir
      st.ev.push({t:'slamf',f:f.id,c:f.c,r:f.r,dk});
      hurtFoe(st,f,1,dk);break;}
    if(st.ter[ti(nc,nr)]===2){
      st.ev.push({t:'fall',f:f.id,c:nc,r:nr});
      f.c=nc;f.r=nr;
      st.foes=st.foes.filter(x=>x.id!==f.id);st.kills++;
      moved++;break;}
    const o=occAt(st,nc,nr);
    if(o){ // bump: both take 1
      st.ev.push({t:'slamf',f:f.id,c:f.c,r:f.r,dk});
      hurtFoe(st,f,1,dk);
      if(o.foe){const g=foeById(st,o.foe.id);if(g)hurtFoe(st,g,1,OPP[dk]);}
      else hurtUnit(st,o.unit,1);
      break;}
    f.c=nc;f.r=nr;moved++;
    st.ev.push({t:'push',f:f.id,c:nc,r:nr});
    if(foeById(st,f.id)===undefined)break;
  }
  return moved;
}
function pushUnit(st,u,dk,steps){
  const[dc,dr]=DIRS[dk];
  for(let i=0;i<steps;i++){
    const nc=u.c+dc,nr=u.r+dr;
    if(!inb(nc,nr)||st.ter[ti(nc,nr)]===1){st.ev.push({t:'slamu',u:u.id,c:u.c,r:u.r});hurtUnit(st,u,1);break}
    if(st.ter[ti(nc,nr)]===2){st.ev.push({t:'fallu',u:u.id,c:nc,r:nr});u.c=nc;u.r=nr;u.hp=0;u.dead=true;st.ev.push({t:'dieu',u:u.id,c:nc,r:nr});break}
    const o=occAt(st,nc,nr);
    if(o){st.ev.push({t:'slamu',u:u.id,c:u.c,r:u.r});hurtUnit(st,u,1);
      if(o.foe){const g=foeById(st,o.foe.id);if(g)hurtFoe(st,g,1,OPP[dk]);}else hurtUnit(st,o.unit,1);
      break;}
    u.c=nc;u.r=nr;st.ev.push({t:'pushu',u:u.id,c:nc,r:nr});
  }
}

function moveTiles(st,u){
  const res=[],seen=new Set([ti(u.c,u.r)]),q=[[u.c,u.r,0]];
  while(q.length){
    const[c,r,d]=q.shift();
    if(d>=KITS[u.k].move)continue;
    for(const dk of DKEYS){const[dc,dr]=DIRS[dk],nc=c+dc,nr=r+dr,k2=ti(nc,nr);
      if(!inb(nc,nr)||seen.has(k2))continue;seen.add(k2);
      if(st.ter[k2]!==0||occAt(st,nc,nr))continue;
      res.push({c:nc,r:nr});q.push([nc,nr,d+1]);}
  }
  return res;
}
function dirBetween(a,b){
  for(const dk of DKEYS){const[dc,dr]=DIRS[dk];if(a.c+dc===b.c&&a.r+dr===b.r)return dk}
  return null;
}

/* ---- unit actions ---- */
function applyAct(st,uid,kind,args){
  const u=unitById(st,uid);if(!u||u.dead)return;
  if(kind==='punch'){
    const f=foeById(st,args.fid);if(!f)return;
    const d=dirBetween(u,f);if(!d)return;
    st.ev.push({t:'swingu',u:u.id,dk:d});
    hurtFoe(st,f,1,OPP[d]);
    const f2=foeById(st,args.fid);
    if(f2)pushFoe(st,f2,d,1);
  }else if(kind==='rush'){
    const dk=args.dk,[dc,dr]=DIRS[dk];
    for(let i=0;i<3;i++){
      const nc=u.c+dc,nr=u.r+dr;
      if(!inb(nc,nr)||st.ter[ti(nc,nr)]!==0)break;
      if(unitAt(st,nc,nr))break;
      const f=foeAt(st,nc,nr);
      if(f){
        hurtFoe(st,f,1,OPP[dk]);
        const f2=foeById(st,f.id);
        if(f2&&f2.c===nc&&f2.r===nr)pushFoe(st,f2,dk,1);
        if(occAt(st,nc,nr))break;
        if(st.ter[ti(nc,nr)]!==0)break;
      }
      if(u.dead)break; // bomber chain can kill mid-rush
      u.c=nc;u.r=nr;
      st.ev.push({t:'dash',u:u.id,c:nc,r:nr});
    }
  }else if(kind==='stab'){
    const dk=args.dk,[dc,dr]=DIRS[dk];
    const c1=u.c+dc,r1=u.r+dr,c2=u.c+2*dc,r2=u.r+2*dr;
    st.ev.push({t:'swingu',u:u.id,dk});
    const t1wall=!inb(c1,r1)||st.ter[ti(c1,r1)]===1;
    if(!t1wall&&!unitAt(st,c1,r1)&&inb(c2,r2)){
      const f2=foeAt(st,c2,r2);
      if(f2){hurtFoe(st,f2,1,OPP[dk]);const g=foeById(st,f2.id);if(g&&g.c===c2&&g.r===r2)pushFoe(st,g,dk,1);}
    }
    if(!t1wall){const f1=foeAt(st,c1,r1);if(f1)hurtFoe(st,f1,1,OPP[dk]);}
  }else if(kind==='skewer'){
    const f=foeById(st,args.fid);if(!f)return;
    const dk=args.dk;
    st.ev.push({t:'swingu',u:u.id,dk});
    hurtFoe(st,f,1,OPP[dk]);
    const f2=foeById(st,args.fid);
    if(f2){f2.pin=2;f2.dir=null;st.ev.push({t:'pin',f:f2.id,c:f2.c,r:f2.r})}
  }else if(kind==='shove'){
    const targets=[];
    for(const dk of DKEYS){const[dc,dr]=DIRS[dk];
      const f=foeAt(st,u.c+dc,u.r+dr);if(f)targets.push({id:f.id,dk});}
    st.ev.push({t:'gust',c:u.c,r:u.r});
    for(const tg of targets){const f=foeById(st,tg.id);if(f)pushFoe(st,f,tg.dk,1)}
  }else if(kind==='gust'){
    const row=args.row;
    const targets=st.foes.filter(f=>f.r===row).sort((a,b)=>a.c-b.c).map(f=>f.id);
    st.ev.push({t:'gustrow',row});
    for(const id of targets){const f=foeById(st,id);if(f)pushFoe(st,f,'up',2)}
  }
}

/* ---- enemy phase ---- */
function computeIntents(st){
  for(const f of st.foes){
    f.dir=null;
    if(f.pin>0)continue;
    if(f.k==='bomber')continue;
    if(f.k==='archer'){if(f.r>0)f.dir='down';continue}
    for(const dk of ['down','left','right','up']){
      const[dc,dr]=DIRS[dk];
      if(unitAt(st,f.c+dc,f.r+dr)){f.dir=dk;break}
    }
  }
}
function enemyPhase(st){
  // attacks
  const engaged=new Set();
  for(const f of st.foes.slice()){
    if(!foeById(st,f.id)||f.pin>0||!f.dir)continue;
    const d=FOES[f.k];
    if(f.k==='archer'){
      let hitR=-1,tgt=null;
      for(let r=f.r-1;r>=0;r--){const o=occAt(st,f.c,r);if(o){hitR=r;tgt=o;break}}
      st.ev.push({t:'shoot',c:f.c,r1:f.r,r2:hitR<0?0:hitR});
      if(tgt){
        if(tgt.unit){hurtUnit(st,tgt.unit,d.dmg);engaged.add(f.id)}
        else hurtFoe(st,tgt.foe,d.dmg,'up');
      }
    }else{
      const[dc,dr]=DIRS[f.dir],nc=f.c+dc,nr=f.r+dr;
      st.ev.push({t:'swingf',f:f.id,dk:f.dir,c:f.c,r:f.r});
      const o=occAt(st,nc,nr);
      if(o){if(o.unit){hurtUnit(st,o.unit,d.dmg);engaged.add(f.id)}else hurtFoe(st,o.foe,d.dmg,OPP[f.dir]);}
    }
  }
  // advance (bottom-most first); charge-zone foes march twice.
  // A blocked enemy that isn't busy hitting a unit flows sideways around the obstruction.
  const free=(c,r)=>inb(c,r)&&st.ter[ti(c,r)]===0&&!occAt(st,c,r);
  const order=st.foes.slice().sort((a,b)=>a.r-b.r||a.c-b.c);
  for(const f of order){
    if(!foeById(st,f.id)||f.pin>0)continue;
    const steps=(f.r>=ZONE)?2:1;
    for(let i=0;i<steps;i++){
      if(f.r===0){
        st.gate-=FOES[f.k].gate;
        st.foes=st.foes.filter(x=>x.id!==f.id);
        st.ev.push({t:'gate',f:f.id,amt:FOES[f.k].gate,hp:st.gate,c:f.c});
        break;
      }
      if(free(f.c,f.r-1)){
        f.r--;
        st.ev.push({t:'adv',f:f.id,c:f.c,r:f.r});
        continue;
      }
      if(engaged.has(f.id))break;
      const cands=[-1,1].map(s=>f.c+s).filter(nc=>free(nc,f.r));
      if(!cands.length)break;
      cands.sort((a,b)=>{
        const fa=free(a,f.r-1)?0:1,fb=free(b,f.r-1)?0:1;
        if(fa!==fb)return fa-fb;
        const da=Math.abs(a-2),db=Math.abs(b-2);
        if(da!==db)return da-db;
        return a-b;
      });
      f.c=cands[0];
      st.ev.push({t:'adv',f:f.id,c:f.c,r:f.r});
    }
  }
  for(const f of st.foes)if(f.pin>0)f.pin--;
  st.turn++;
}
function startTurnSim(st){
  const rest=[];
  for(const s of st.spawns){
    if(s.t<=st.turn){
      if(st.ter[ti(s.c,H-1)]===0&&!occAt(st,s.c,H-1))addFoe(st,s.k,s.c,H-1,true);
      else{s.t=st.turn+1;rest.push(s)}
    }else rest.push(s);
  }
  st.spawns=rest;
  computeIntents(st);
  for(const u of st.units)if(!u.dead){u.moved=false;u.acted=false}
}
function checkEnd(st){
  if(st.gate<=0)return 'lose';
  if(st.units.every(u=>u.dead))return 'rout';
  if(st.foes.length===0&&st.spawns.length===0)return 'win';
  if(st.turn>st.turns)return 'win';
  return null;
}

/* ---- targeting metadata for the UI ---- */
function targetsFor(st,u,arm){
  const out=[];
  if(u.acted)return out;
  if(arm==='basic'){
    if(u.k==='ram'){
      for(const dk of DKEYS){const[dc,dr]=DIRS[dk];const f=foeAt(st,u.c+dc,u.r+dr);
        if(f)out.push({c:f.c,r:f.r,kind:'punch',fid:f.id});}
    }else if(u.k==='lancer'){
      for(const dk of DKEYS){const[dc,dr]=DIRS[dk];
        const c1=u.c+dc,r1=u.r+dr;
        if(!inb(c1,r1)||st.ter[ti(c1,r1)]===1)continue;
        if(foeAt(st,c1,r1))out.push({c:c1,r:r1,kind:'stab',dk});
        const c2=u.c+2*dc,r2=u.r+2*dr;
        if(!unitAt(st,c1,r1)&&inb(c2,r2)&&foeAt(st,c2,r2))out.push({c:c2,r:r2,kind:'stab',dk});
      }
    }
    // gale basic is armed from the ability card
  }else{
    if(u.k==='ram'){
      for(const dk of DKEYS){const[dc,dr]=DIRS[dk],nc=u.c+dc,nr=u.r+dr;
        if(!inb(nc,nr)||st.ter[ti(nc,nr)]!==0||unitAt(st,nc,nr))continue;
        out.push({c:nc,r:nr,kind:'rush',dk});}
    }else if(u.k==='lancer'){
      for(const dk of DKEYS){const[dc,dr]=DIRS[dk];
        const c1=u.c+dc,r1=u.r+dr;
        if(!inb(c1,r1)||st.ter[ti(c1,r1)]===1)continue;
        const f1=foeAt(st,c1,r1);
        if(f1)out.push({c:c1,r:r1,kind:'skewer',fid:f1.id,dk});
        const c2=u.c+2*dc,r2=u.r+2*dr;
        if(!unitAt(st,c1,r1)&&inb(c2,r2)){const f2=foeAt(st,c2,r2);
          if(f2)out.push({c:c2,r:r2,kind:'skewer',fid:f2.id,dk});}
      }
    }else if(u.k==='gale'){
      const rows=new Set(st.foes.map(f=>f.r));
      for(const r of rows)for(let c=0;c<W;c++)out.push({c,r,kind:'gust',row:r});
    }
  }
  return out;
}
function hasAdjFoe(st,u){return DKEYS.some(dk=>{const[dc,dr]=DIRS[dk];return !!foeAt(st,u.c+dc,u.r+dr)})}

/* ============================== daily gen ============================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function genDaily(dateStr){
  const rng=mulberry32(hashStr('shove:'+dateStr));
  const pick=a=>a[Math.floor(rng()*a.length)];
  const defs=[];
  for(let i=0;i<3;i++){
    const turns=[6,7,7][i];
    const ter=new Array(W*H).fill(0);
    const rowLoad=new Array(H).fill(0);
    const blockers=2+Math.floor(rng()*2)+ (i>0?1:0);
    let placed=0,guard=0;
    while(placed<blockers&&guard++<60){
      const r=2+Math.floor(rng()*3),c=Math.floor(rng()*W);
      if(ter[ti(c,r)]!==0||rowLoad[r]>=2)continue;
      ter[ti(c,r)]=rng()<0.45?2:1;rowLoad[r]++;placed++;
    }
    const cost={grunt:1,archer:2,shield:2,bomber:2,brute:3};
    const pool=i===0?['grunt','grunt','archer','bomber']:['grunt','grunt','archer','shield','bomber','brute'];
    let pts=4+2*i;const foes=[];const used=new Set();
    guard=0;
    while(pts>0&&guard++<80){
      const k=pick(pool);if(cost[k]>pts)continue;
      const r=3+Math.floor(rng()*3),c=Math.floor(rng()*W);
      if(ter[ti(c,r)]!==0||used.has(ti(c,r)))continue;
      used.add(ti(c,r));foes.push({k,c,r});pts-=cost[k];
    }
    const spawns=[];
    for(let s=0;s<2+i;s++){
      const t=2+Math.floor(rng()*Math.max(1,turns-3));
      spawns.push({t,c:Math.floor(rng()*W),k:pick(i===0?['grunt','grunt','archer']:['grunt','grunt','archer','bomber','shield'])});
    }
    spawns.sort((a,b)=>a.t-b.t);
    defs.push({name:'Siege '+(i+1)+'/3',turns,tip:null,ter,foes,
      units:[{k:'ram',c:1,r:1},{k:'lancer',c:2,r:0},{k:'gale',c:3,r:1}],spawns});
  }
  return defs;
}

/* ============================== sound ============================== */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f0,f1,dur,type,vol){
  const a=ac();if(!a||SV.mute)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,fq){
  const a=ac();if(!a||SV.mute)return;
  const n=a.sampleRate*dur,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter(),t=a.currentTime;
  fl.type='lowpass';fl.frequency.value=fq||900;
  s.buffer=buf;g.gain.value=vol;
  s.connect(fl).connect(g).connect(a.destination);s.start(t);
}
const SFX={
  tap:()=>tone(620,660,0.05,'sine',0.05),
  step:()=>tone(240,180,0.06,'triangle',0.06),
  push:()=>tone(170,110,0.09,'triangle',0.12),
  slam:()=>{noise(0.09,0.2,700);tone(120,60,0.1,'square',0.09)},
  fall:()=>tone(420,60,0.35,'sine',0.14),
  die:()=>tone(160,55,0.18,'sawtooth',0.09),
  boom:()=>{noise(0.22,0.3,400);tone(90,40,0.3,'square',0.16)},
  shoot:()=>tone(1300,300,0.12,'sawtooth',0.05),
  hurt:()=>tone(300,140,0.12,'square',0.08),
  gate:()=>{noise(0.3,0.35,300);tone(70,35,0.5,'square',0.2)},
  pin:()=>tone(900,900,0.08,'square',0.06),
  win:()=>{tone(520,520,0.12,'sine',0.1);setTimeout(()=>tone(660,660,0.12,'sine',0.1),110);setTimeout(()=>tone(880,880,0.22,'sine',0.12),220)},
  perfect:()=>{SFX.win();setTimeout(()=>tone(1100,1100,0.3,'sine',0.12),380)},
  lose:()=>{tone(220,60,0.7,'sawtooth',0.12)},
};
function vib(ms){if(navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

const G={scr:'menu',st:null,nd:null,undo:[],sel:null,arm:'basic',pending:null,
  busy:false,mode:'campaign',fi:0,run:null,endConfirm:0};
let cast=null,pb=null,shakeT=0,floaters=[],parts=[];

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let L={ts:60,ox:0,oy:0,gh:30,w:0,h:0,dpr:1};

function layout(){
  const wrap=$('cvwrap'),w=wrap.clientWidth,h=wrap.clientHeight;
  L.dpr=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=w*L.dpr;cv.height=h*L.dpr;
  L.w=w;L.h=h;
  const gf=0.62; // gate bar as fraction of a tile
  L.ts=Math.floor(Math.min((w-14)/W,(h-18)/(H+gf)));
  L.gh=Math.floor(L.ts*gf);
  L.ox=Math.floor((w-W*L.ts)/2);
  L.oy=Math.floor((h-(H*L.ts+L.gh))/2);
}
window.addEventListener('resize',()=>{layout()});

/* ---- fight lifecycle ---- */
function startFight(nd,gate0,label){
  G.nd=nd;G.st=newFight(nd,gate0);G.undo=[];G.sel=null;G.arm='basic';G.pending=null;G.busy=false;

function startCampaign(i){G.mode='campaign';G.fi=i;startFight(parseDef(FIGHTS[i]),3,(i+1)+'. '+FIGHTS[i].name)}
function startDaily(){

  const date=todayStr();

}

/* ---- HUD / dock ---- */
function gateHearts(st){
  let s='';
  for(let i=0;i<st.gateStart;i++)s+=i<st.gate?'<span style="color:#f5b942">♥</span>':'<span style="color:#4a4458">♥</span>';
  return s;
}
function updateHUD(){
  const st=cast?cast:G.st;
  $('hTurn').textContent='Turn '+Math.min(G.st.turn,G.st.turns)+'/'+G.st.turns;
  $('hGate').innerHTML=gateHearts({gate:cast?cast.gate:G.st.gate,gateStart:G.st.gateStart});
}
function pips(n,max,fc,ec){let s='';for(let i=0;i<max;i++)s+=`<span style="color:${i<n?fc:'#4a4458'}">${i<n?'◆':'◇'}</span>`;return s}
function hearts(n,max){let s='';for(let i=0;i<max;i++)s+=i<n?'♥':'<span style="color:#4a4458">♥</span>';return s}
function updateDock(){
  const st=G.st;if(!st)return;
  const chips=$('chips');chips.innerHTML='';
  for(const u of st.units){
    const k=KITS[u.k];
    const b=document.createElement('button');
    b.className='chip'+(G.sel===u.id?' sel':'')+(u.dead?' dead':(u.acted?' done':''));
    b.style.setProperty('--cc',k.col);
    b.innerHTML=`<b>${k.name}</b><span class="hp">${u.dead?'':hearts(u.hp,u.mhp)}</span><span class="ch">${u.dead?'':pips(u.ch,k.chMax,'#f5b942')}</span>`;
    b.onclick=()=>{if(G.busy||u.dead)return;SFX.tap();selectUnit(u.id)};
    chips.appendChild(b);
  }
  const ab=$('abil');ab.innerHTML='';
  const u=G.sel?unitById(st,G.sel):null;
  if(G.pending){
    const bc=document.createElement('button');
    bc.className='ab armed';bc.innerHTML='<b>Confirm</b><span>do it</span>';
    bc.onclick=()=>{if(G.busy)return;commitPending()};
    const bx=document.createElement('button');
    bx.className='ab';bx.innerHTML='<b>Cancel</b><span>or tap another target</span>';
    bx.onclick=()=>{if(G.busy)return;SFX.tap();clearPending();updateDock();draw()};
    ab.appendChild(bc);ab.appendChild(bx);
  }else if(u&&!u.dead&&!u.acted){
    const k=KITS[u.k];
    const b1=document.createElement('button');
    b1.className='ab'+(G.arm==='basic'?' armed':'');
    b1.innerHTML=`<b>${k.basic.n}</b><span>${k.basic.d}</span>`;
    b1.onclick=()=>{if(G.busy)return;SFX.tap();G.arm='basic';clearPending();
      if(u.k==='gale'){
        if(hasAdjFoe(st,u))makePending('shove',{},'card');
        else toast('No adjacent enemies to shove');
      }
      updateDock();draw();};
    const b2=document.createElement('button');
    const full=u.ch>=k.chMax;
    b2.className='ab'+(G.arm==='charged'?' armed':'')+(full?' full':'');
    b2.disabled=!full;
    b2.innerHTML=`<b>${k.charged.n}</b><span>${full?k.charged.d:'charge '+u.ch+'/'+k.chMax+' · gain by shoving'}</span>`;
    b2.onclick=()=>{if(G.busy||!full)return;SFX.tap();G.arm=G.arm==='charged'?'basic':'charged';clearPending();updateDock();draw()};
    ab.appendChild(b1);ab.appendChild(b2);
  }else{
    const idle=st.units.filter(x=>!x.dead&&!x.acted).length;
    ab.innerHTML=`<div id="abhint">${u&&u.acted?KITS[u.k].name+' has acted.':(idle?'Tap a unit to command it. '+idle+' ready.':'All units done - End Turn.')}</div>`;
  }
  $('bUndo').disabled=G.undo.length===0||G.busy;
  const idle=st.units.filter(x=>!x.dead&&!x.acted).length;
  $('bEnd').classList.toggle('pulse',idle===0&&!G.busy);
  $('bEnd').textContent=G.endConfirm>Date.now()?'Sure? '+idle+' idle':'End Turn';
}
let tipTimer=null;
function showTip(html){
  const t=$('tip');
  if(!html){t.classList.add('hidden');return}
  t.innerHTML=html;t.classList.remove('hidden');
}
function toast(msg){
  const t=$('toast');t.textContent=msg;t.style.opacity=1;
  clearTimeout(tipTimer);tipTimer=setTimeout(()=>t.style.opacity=0,2000);
}

/* ---- selection / actions ---- */
function selectUnit(id){
  const u=unitById(G.st,id);
  if(!u||u.dead)return;
  G.sel=id;G.arm='basic';clearPending();
  updateDock();draw();
}
function clearPending(){G.pending=null}
function makePending(kind,args,key){
  const st2=clone(G.st);st2.ev=[];
  applyAct(st2,G.sel,kind,args);
  G.pending={kind,args,key,st2,ev:st2.ev};
  SFX.tap();
  updateDock();
}
function undoPush(){
  const s=clone(G.st);s.ev=[];
  G.undo.push(s);
  if(G.undo.length>40)G.undo.shift();
}
function doUndo(){
  if(!G.undo.length||G.busy)return;
  G.st=G.undo.pop();G.sel=null;clearPending();
  SFX.tap();updateHUD();updateDock();draw();
}
function chargeGain(pre,st){
  let n=0;
  for(const [id,p] of Object.entries(pre)){
    const f=foeById(st,+id);
    if(!f||f.hp!==p.hp||f.c!==p.c||f.r!==p.r||f.pin!==p.pin)n++;
  }
  return n;
}
function commitPending(){
  const p=G.pending;if(!p)return;
  const u=unitById(G.st,G.sel);
  undoPush();
  const pre={};for(const f of G.st.foes)pre[f.id]={hp:f.hp,c:f.c,r:f.r,pin:f.pin};
  castSnap();
  G.st.ev=[];
  const wasCharged=(p.kind==='rush'||p.kind==='skewer'||p.kind==='gust');
  applyAct(G.st,G.sel,p.kind,p.args);
  const gain=chargeGain(pre,G.st);
  if(wasCharged)u.ch=0;
  u.ch=Math.min(KITS[u.k].chMax,u.ch+gain);
  u.acted=true;u.moved=true;
  G.arm='basic';
  const evts=G.st.ev;G.st.ev=[];
  clearPending();G.sel=null;
  showTip(null);
  playback(evts,()=>{
    updateHUD();updateDock();
    const e=checkEnd(G.st);
    if(e)showOver(e);
  });
}
function doMove(c,r){
  const u=unitById(G.st,G.sel);
  undoPush();
  castSnap();
  G.st.ev=[{t:'step',u:u.id,c,r}];
  u.c=c;u.r=r;u.moved=true;
  const evts=G.st.ev;G.st.ev=[];
  showTip(null);
  playback(evts,()=>{updateDock();draw()});
}
function doEndTurn(){
  if(G.busy)return;
  const idle=G.st.units.filter(x=>!x.dead&&!x.acted).length;
  if(idle>0&&G.endConfirm<Date.now()){
    G.endConfirm=Date.now()+1800;updateDock();
    setTimeout(()=>{G.endConfirm=0;if(!G.busy)updateDock()},1900);
    return;
  }
  G.endConfirm=0;
  G.sel=null;clearPending();G.undo=[];showTip(null);
  castSnap();
  G.st.ev=[];
  enemyPhase(G.st);
  const end=checkEnd(G.st);
  if(!end)startTurnSim(G.st);
  const evts=G.st.ev;G.st.ev=[];
  playback(evts,()=>{
    updateHUD();updateDock();
    if(end)showOver(end);
  });
}

/* ---- tap handling ---- */
function tileFromEvent(e){
  const rect=cv.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  const c=Math.floor((x-L.ox)/L.ts),r=H-1-Math.floor((y-L.oy)/L.ts);
  if(!inb(c,r))return null;
  return {c,r};
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(G.scr!=='menu')ac();
  if(!G.st||G.busy||!$('over').classList.contains('hidden'))return;
  const t=tileFromEvent(e);
  if(!t){deselectAll();return}
  tapTile(t.c,t.r);
});
function deselectAll(){G.sel=null;clearPending();updateDock();draw()}
function tapTile(c,r){
  const st=G.st;
  // pending confirm / cancel
  if(G.pending){
    if(G.pending.key===c+','+r){commitPending();return}
    clearPending();updateDock();
    // fall through to re-evaluate the tap
  }
  const u=G.sel?unitById(st,G.sel):null;
  const tapU=unitAt(st,c,r);
  if(u&&!u.acted){
    // ability target?
    const tg=targetsFor(st,u,G.arm).find(t=>t.c===c&&t.r===r);
    if(tg){
      const args=tg.kind==='punch'?{fid:tg.fid}:tg.kind==='rush'?{dk:tg.dk}:
        tg.kind==='stab'?{dk:tg.dk}:tg.kind==='skewer'?{fid:tg.fid,dk:tg.dk}:{row:tg.row};
      makePending(tg.kind,args,c+','+r);
      draw();return;
    }
    // move?
    if(!u.moved&&G.arm==='basic'&&moveTiles(st,u).some(t=>t.c===c&&t.r===r)){
      SFX.step();doMove(c,r);return;
    }
  }
  if(tapU){SFX.tap();selectUnit(tapU.id);return}
  const f=foeAt(st,c,r);
  if(f){const d=FOES[f.k];toast(`${d.name} · ${f.hp}/${f.mhp}hp · ${d.dmg?('hits '+d.dmg):'no attack'} · gate ${d.gate} · ${d.info}`);draw();return}
  deselectAll();
}

/* ============================== playback / animation ============================== */
function castSnap(){
  cast={foes:{},units:{},gate:G.st.gate};
  for(const f of G.st.foes)cast.foes[f.id]=Object.assign({},f,{fade:1,scale:1,fx:0,fy:0});
  for(const u of G.st.units)if(!u.dead)cast.units[u.id]=Object.assign({},u,{fade:1,scale:1,fx:0,fy:0});
}
function playback(evts,done){
  if(!evts.length){cast=null;G.busy=false;done&&done();draw();return}
  // group consecutive 'adv' events so ranks march together
  const steps=[];
  let i=0;
  while(i<evts.length){
    if(evts[i].t==='adv'){
      const grp=[];while(i<evts.length&&evts[i].t==='adv')grp.push(evts[i++]);
      steps.push({t:'advgrp',grp});
    }else steps.push(evts[i++]);
  }
  G.busy=true;
  pb={steps,i:0,t:0,cur:null,done};
  updateDock();
}
const DUR={step:0.13,dash:0.09,push:0.11,adv:0.16,hurt:0.16,slam:0.12,fall:0.24,die:0.2,boom:0.24,shoot:0.2,gate:0.4,spawn:0.18,swing:0.1,pin:0.18,gust:0.12,block:0.16};
function startStep(s){
  const ent=k=>cast.foes[k]!==undefined?cast.foes[k]:null;
  switch(s.t){
    case 'step':{const u=cast.units[s.u];s.dur=DUR.step;s.from={c:u.c,r:u.r};u.tc=s.c;u.tr=s.r;SFX.step();break}
    case 'dash':{const u=cast.units[s.u];s.dur=DUR.dash;s.from={c:u.c,r:u.r};u.tc=s.c;u.tr=s.r;SFX.push();break}
    case 'pushu':{const u=cast.units[s.u];s.dur=DUR.push;s.from={c:u.c,r:u.r};u.tc=s.c;u.tr=s.r;SFX.push();break}
    case 'push':{const f=cast.foes[s.f];s.dur=DUR.push;if(f){s.from={c:f.c,r:f.r};f.tc=s.c;f.tr=s.r}SFX.push();break}
    case 'advgrp':{s.dur=DUR.adv;for(const e of s.grp){const f=cast.foes[e.f];if(f){e.from={c:f.c,r:f.r};f.tc=e.c;f.tr=e.r}}break}
    case 'hurtf':{const f=cast.foes[s.f];s.dur=DUR.hurt;if(f){f.hp=s.hp;f.flash=1}addFloat(s.c,s.r,'-'+s.amt,'#ff4d5e');SFX.hurt();break}
    case 'hurtu':{const u=cast.units[s.u];s.dur=DUR.hurt;if(u){u.hp=s.hp;u.flash=1}addFloat(s.c,s.r,'-'+s.amt,'#ff4d5e');SFX.hurt();vib(20);break}
    case 'block':{s.dur=DUR.block;addFloat(s.c,s.r,'BLOCKED','#cfc6b6');SFX.pin();break}
    case 'slamf':case 'slamu':{s.dur=DUR.slam;shakeT=0.15;SFX.slam();vib(15);break}
    case 'fall':{const f=cast.foes[s.f];s.dur=DUR.fall;if(f){f.tc=s.c;f.tr=s.r;s.from={c:f.c,r:f.r};f.falling=1}SFX.fall();break}
    case 'fallu':{const u=cast.units[s.u];s.dur=DUR.fall;if(u){u.tc=s.c;u.tr=s.r;s.from={c:u.c,r:u.r};u.falling=1}SFX.fall();break}
    case 'dief':{const f=cast.foes[s.f];s.dur=DUR.die;if(f)f.dying=1;SFX.die();break}
    case 'dieu':{const u=cast.units[s.u];s.dur=DUR.die;if(u)u.dying=1;SFX.die();vib(40);break}
    case 'boom':{s.dur=DUR.boom;parts.push({t:'ring',c:s.c,r:s.r,age:0,dur:0.35});shakeT=0.25;SFX.boom();vib(35);break}
    case 'shoot':{s.dur=DUR.shoot;parts.push({t:'arrow',c:s.c,r1:s.r1,r2:s.r2,age:0,dur:0.25});SFX.shoot();break}
    case 'swingf':case 'swingu':{s.dur=DUR.swing;break}
    case 'gate':{s.dur=DUR.gate;cast.gate=s.hp;delete cast.foes[s.f];shakeT=0.35;addFloat(s.c,0,'-'+s.amt+' GATE','#f5b942');SFX.gate();vib(80);updateHUD();break}
    case 'spawn':{s.dur=DUR.spawn;const f=Object.assign({},s.foe,{fade:0,scale:0.4,fx:0,fy:0});cast.foes[f.id]=f;f.spawning=1;break}
    case 'pin':{s.dur=DUR.pin;const f=cast.foes[s.f];if(f)f.pin=2;addFloat(s.c,s.r,'PINNED','#cfc6b6');SFX.pin();break}
    case 'gust':case 'gustrow':{s.dur=DUR.gust;break}
    default:s.dur=0.05;
  }
}
function endStep(s){
  const settle=e=>{if(e){e.c=e.tc;e.r=e.tr;e.tc=undefined;e.fx=0;e.fy=0}};
  switch(s.t){
    case 'step':case 'dash':case 'pushu':{settle(cast.units[s.u]);break}
    case 'push':{settle(cast.foes[s.f]);break}
    case 'advgrp':{for(const e of s.grp){const f=cast.foes[e.f];if(f){f.c=e.c;f.r=e.r;f.tc=undefined;f.fx=0;f.fy=0}}break}
    case 'fall':{delete cast.foes[s.f];break}
    case 'fallu':case 'dieu':{delete cast.units[s.u];break}
    case 'dief':{delete cast.foes[s.f];break}
    case 'spawn':{const f=cast.foes[s.foe.id];if(f){f.fade=1;f.scale=1;f.spawning=0}break}
  }
}
function tickPB(dt){
  if(!pb)return;
  if(!pb.cur){
    if(pb.i>=pb.steps.length){
      const done=pb.done;pb=null;cast=null;G.busy=false;
      updateDock();done&&done();return;
    }
    pb.cur=pb.steps[pb.i++];pb.t=0;startStep(pb.cur);
  }
  pb.t+=dt;
  const s=pb.cur,k=Math.min(1,pb.t/s.dur);
  // tween positions
  const lerpEnt=(e,from)=>{if(e&&e.tc!==undefined&&from){e.fx=(from.c+(e.tc-from.c)*k)-e.c;e.fy=(from.r+(e.tr-from.r)*k)-e.r}};
  if(s.t==='advgrp')for(const e of s.grp)lerpEnt(cast.foes[e.f],e.from);
  else if(s.t==='push')lerpEnt(cast.foes[s.f],s.from);
  else if(s.t==='step'||s.t==='dash'||s.t==='pushu')lerpEnt(cast.units[s.u],s.from);
  else if(s.t==='fall'){const f=cast.foes[s.f];if(f&&s.from){lerpEnt(f,s.from);f.scale=1-k*0.8;f.fade=1-k}}
  else if(s.t==='fallu'){const u=cast.units[s.u];if(u&&s.from){lerpEnt(u,s.from);u.scale=1-k*0.8;u.fade=1-k}}
  else if(s.t==='dief'){const f=cast.foes[s.f];if(f){f.fade=1-k;f.scale=1+k*0.25}}
  else if(s.t==='dieu'){const u=cast.units[s.u];if(u){u.fade=1-k;u.scale=1+k*0.25}}
  else if(s.t==='spawn'){const f=cast.foes[s.foe.id];if(f){f.fade=k;f.scale=0.4+0.6*k}}
  if(k>=1){endStep(s);pb.cur=null}
}
function addFloat(c,r,txt,col){floaters.push({x:px(c)+L.ts/2,y:py(r)+L.ts*0.3,txt,col,age:0})}

/* ============================== drawing ============================== */
function rr(x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath()}
function drawBoard(st){
  const ts=L.ts;
  // tiles
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const x=px(c),y=py(r);
    ctx.fillStyle=(c+r)%2?'#211d33':'#262142';
    rr(x+1.5,y+1.5,ts-3,ts-3,ts*0.14);ctx.fill();
    if(r>=ZONE){ctx.fillStyle='#ff4d5e12';rr(x+1.5,y+1.5,ts-3,ts-3,ts*0.14);ctx.fill()}
  }
  // charge-zone chevrons on side gutters
  ctx.fillStyle='#ff4d5e55';ctx.font='700 '+(ts*0.22)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=ZONE;r<H;r++){ctx.fillText('»',L.ox-ts*0.18,py(r)+ts/2);ctx.fillText('«',L.ox+W*ts+ts*0.18,py(r)+ts/2)}
  // terrain
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const t=st?G.st.ter[ti(c,r)]:0;const x=px(c),y=py(r);
    if(t===1){ // wall
      ctx.fillStyle='#3b3550';rr(x+3,y+3,ts-6,ts-6,ts*0.1);ctx.fill();
      ctx.fillStyle='#4d4668';rr(x+3,y+3,ts-6,(ts-6)*0.42,ts*0.1);ctx.fill();
      ctx.strokeStyle='#2a2540';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x+ts/2,y+6);ctx.lineTo(x+ts/2,y+ts-6);ctx.moveTo(x+6,y+ts/2);ctx.lineTo(x+ts-6,y+ts/2);ctx.stroke();
    }else if(t===2){ // pit
      ctx.fillStyle='#08070f';rr(x+4,y+4,ts-8,ts-8,ts*0.3);ctx.fill();
      ctx.strokeStyle='#4a3f6b';ctx.lineWidth=1.5;rr(x+4,y+4,ts-8,ts-8,ts*0.3);ctx.stroke();
      ctx.fillStyle='#141127';ctx.beginPath();ctx.ellipse(x+ts/2,y+ts*0.42,ts*0.24,ts*0.14,0,0,7);ctx.fill();
    }
  }
  // gate bar
  const gy=L.oy+H*L.ts+2,gw=W*ts;
  const grad=ctx.createLinearGradient(0,gy,0,gy+L.gh);
  const dmg=G.st?1-G.st.gate/G.st.gateStart:0;
  grad.addColorStop(0,dmg>0.5?'#a3502c':'#f5b942');grad.addColorStop(1,'#8a5a17');
  ctx.fillStyle=grad;rr(L.ox,gy,gw,L.gh-2,6);ctx.fill();
  ctx.fillStyle='#00000030';
  const cren=8;
  for(let i=0;i<cren;i++)if(i%2)ctx.fillRect(L.ox+i*gw/cren,gy,gw/cren,L.gh*0.3);
  ctx.fillStyle='#241205';ctx.font='800 '+(ts*0.26)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('G A T E',L.ox+gw/2,gy+L.gh*0.62);
}
function drawFoe(f,x,y,alpha,scale){
  const ts=L.ts,d=FOES[f.k];
  ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(x+ts/2,y+ts/2);ctx.scale(scale,scale);
  const s=ts*(f.k==='brute'?0.4:0.32);
  ctx.fillStyle=f.flash>0?'#ffffff':d.col;
  if(f.k==='grunt'){
    ctx.beginPath();ctx.moveTo(-s,-s*0.8);ctx.lineTo(s,-s*0.8);ctx.lineTo(0,s);ctx.closePath();ctx.fill();
  }else if(f.k==='archer'){
    ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*0.9,0);ctx.lineTo(0,s);ctx.lineTo(-s*0.9,0);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#7a5c1e';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-s*0.35,s*0.1);ctx.lineTo(0,s*0.55);ctx.lineTo(s*0.35,s*0.1);ctx.stroke();
  }else if(f.k==='shield'){
    rr(-s,-s,2*s,2*s,s*0.3);ctx.fill();
    ctx.fillStyle='#6f6555';rr(-s*1.1,s*0.45,2.2*s,s*0.55,s*0.2);ctx.fill();
    ctx.fillStyle='#8a7f6c';rr(-s*1.1,s*0.45,2.2*s,s*0.2,s*0.1);ctx.fill();
  }else if(f.k==='bomber'){
    ctx.beginPath();ctx.arc(0,s*0.1,s*0.95,0,7);ctx.fill();
    ctx.strokeStyle='#8d86a3';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,-s*0.8);ctx.quadraticCurveTo(s*0.5,-s*1.2,s*0.6,-s*0.7);ctx.stroke();
    ctx.fillStyle='#ffb054';ctx.beginPath();ctx.arc(s*0.6,-s*0.7,s*0.18,0,7);ctx.fill();
  }else{ // brute
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s)}
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#6b4a2e';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-s*0.5,-s*0.35);ctx.lineTo(-s*0.15,-s*0.15);ctx.moveTo(s*0.5,-s*0.35);ctx.lineTo(s*0.15,-s*0.15);ctx.stroke();
  }
  // eyes
  if(f.k!=='bomber'&&!(f.flash>0)){
    ctx.fillStyle='#221c30';
    const ey=f.k==='grunt'?-s*0.35:(f.k==='brute'?s*0.05:0);
    ctx.beginPath();ctx.arc(-s*0.28,ey,s*0.11,0,7);ctx.arc(s*0.28,ey,s*0.11,0,7);ctx.fill();
  }
  ctx.restore();
  ctx.save();ctx.globalAlpha=alpha;
  // hp pips
  const n=f.mhp,pw=Math.min(7,ts*0.11);
  for(let i=0;i<n;i++){
    ctx.fillStyle=i<f.hp?'#ff8a8a':'#413a52';
    ctx.fillRect(x+ts/2-(n*pw+(n-1)*2)/2+i*(pw+2),y+ts-8,pw,4);
  }
  // pin badge
  if(f.pin>0){
    ctx.fillStyle='#cfc6b6';ctx.beginPath();ctx.arc(x+ts-11,y+11,8,0,7);ctx.fill();
    ctx.fillStyle='#221c30';ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.pin,x+ts-11,y+11.5);
  }
  ctx.restore();
}
function drawUnit(u,x,y,alpha,scale){
  const ts=L.ts,k=KITS[u.k];
  ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(x+ts/2,y+ts/2);ctx.scale(scale,scale);
  const s=ts*0.32;
  // charge ring
  if(u.ch>0){
    ctx.strokeStyle='#f5b942';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,s*1.28,-Math.PI/2,-Math.PI/2+Math.PI*2*u.ch/k.chMax);ctx.stroke();
  }
  ctx.fillStyle=u.flash>0?'#ffffff':k.col;
  if(u.k==='ram'){
    ctx.beginPath();ctx.arc(0,0,s,0,7);ctx.fill();
    ctx.strokeStyle=u.flash>0?'#fff':'#c25a24';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(-s*0.7,-s*0.7,s*0.45,Math.PI*0.2,Math.PI*1.2);ctx.stroke();
    ctx.beginPath();ctx.arc(s*0.7,-s*0.7,s*0.45,Math.PI*1.8,Math.PI*0.8,true);ctx.stroke();
  }else if(u.k==='lancer'){
    ctx.beginPath();ctx.moveTo(0,-s*1.15);ctx.lineTo(s*0.7,0);ctx.lineTo(0,s*1.15);ctx.lineTo(-s*0.7,0);ctx.closePath();ctx.fill();
    ctx.strokeStyle=u.flash>0?'#fff':'#1f7fa3';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,-s*1.05);ctx.lineTo(0,s*1.05);ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(0,0,s,0,7);ctx.fill();
    ctx.strokeStyle=u.flash>0?'#fff':'#5f9440';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,s*0.55,0,Math.PI*1.4);ctx.stroke();
    ctx.beginPath();ctx.arc(s*0.2,-s*0.1,s*0.3,Math.PI,Math.PI*2.2);ctx.stroke();
  }
  // face dots
  if(!(u.flash>0)){
    ctx.fillStyle='#221c30';
    ctx.beginPath();ctx.arc(-s*0.25,-s*0.05,s*0.1,0,7);ctx.arc(s*0.25,-s*0.05,s*0.1,0,7);ctx.fill();
  }
  ctx.restore();
  ctx.save();ctx.globalAlpha=alpha;
  const n=u.mhp,pw=Math.min(7,ts*0.11);
  for(let i=0;i<n;i++){
    ctx.fillStyle=i<u.hp?'#79e07a':'#413a52';
    ctx.fillRect(x+ts/2-(n*pw+(n-1)*2)/2+i*(pw+2),y+ts-8,pw,4);
  }
  if(u.acted&&!cast){ctx.fillStyle='#00000055';ctx.beginPath();ctx.arc(x+ts/2,y+ts/2,ts*0.42,0,7);ctx.fill()}
  ctx.restore();
}
function arrow(x1,y1,x2,y2,col,w){
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  const a=Math.atan2(y2-y1,x2-x1),hl=w*3;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*hl*0.6,y2-Math.sin(a)*hl*0.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-Math.cos(a-0.5)*hl,y2-Math.sin(a-0.5)*hl);
  ctx.lineTo(x2-Math.cos(a+0.5)*hl,y2-Math.sin(a+0.5)*hl);
  ctx.closePath();ctx.fill();
}
function drawIntents(st){
  const ts=L.ts;
  for(const f of st.foes){
    if(!f.dir||f.pin>0)continue;
    if(f.k==='archer'){
      let hitR=0;
      for(let r=f.r-1;r>=0;r--){if(occAt(st,f.c,r)){hitR=r;break}}
      const x=px(f.c)+ts/2;
      ctx.strokeStyle='#ff4d5e66';ctx.lineWidth=2.5;ctx.setLineDash([5,6]);
      ctx.beginPath();ctx.moveTo(x,py(f.r)+ts*0.85);ctx.lineTo(x,py(hitR)+ts*0.5);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#ff4d5e22';rr(px(f.c)+2,py(hitR)+2,ts-4,ts-4,ts*0.14);ctx.fill();
      arrow(x,py(hitR)+ts*0.25,x,py(hitR)+ts*0.55,'#ff4d5ecc',3);
    }else{
      const[dc,dr]=DIRS[f.dir],tc=f.c+dc,tr=f.r+dr;
      if(!inb(tc,tr))continue;
      ctx.fillStyle='#ff4d5e22';rr(px(tc)+2,py(tr)+2,ts-4,ts-4,ts*0.14);ctx.fill();
      const x1=px(f.c)+ts/2+dc*ts*0.34,y1=py(f.r)+ts/2-dr*ts*0.34;
      arrow(x1,y1,x1+dc*ts*0.36,y1-dr*ts*0.36,'#ff4d5ecc',3.5);
    }
  }
}
function drawHighlights(st){
  if(cast||G.busy)return;
  const ts=L.ts;
  const u=G.sel?unitById(st,G.sel):null;
  if(!u||u.dead)return;
  // move tiles
  if(!u.moved&&!u.acted&&G.arm==='basic'){
    for(const t of moveTiles(st,u)){
      ctx.fillStyle='#58d5ff2a';rr(px(t.c)+4,py(t.r)+4,ts-8,ts-8,ts*0.16);ctx.fill();
      ctx.fillStyle='#58d5ff88';ctx.beginPath();ctx.arc(px(t.c)+ts/2,py(t.r)+ts/2,3.2,0,7);ctx.fill();
    }
  }
  // targets
  if(!u.acted){
    for(const t of targetsFor(st,u,G.arm)){
      if(t.kind==='gust'){
        ctx.fillStyle='#a8f06e1c';rr(px(t.c)+3,py(t.r)+3,ts-6,ts-6,ts*0.14);ctx.fill();
      }else if(t.kind==='rush'){
        const x=px(t.c)+ts/2,y=py(t.r)+ts/2;
        const[dc,dr]=DIRS[t.dk];
        arrow(x-dc*ts*0.2,y+dr*ts*0.2,x+dc*ts*0.22,y-dr*ts*0.22,'#ff8a4dcc',4);
      }else{
        ctx.strokeStyle='#ff4d5e';ctx.lineWidth=2.5;
        rr(px(t.c)+4,py(t.r)+4,ts-8,ts-8,ts*0.18);ctx.stroke();
      }
    }
  }
  // selection ring
  ctx.strokeStyle='#ffffffcc';ctx.lineWidth=2.5;
  rr(px(u.c)+2.5,py(u.r)+2.5,ts-5,ts-5,ts*0.16);ctx.stroke();
}
function drawPending(){
  if(!G.pending||cast)return;
  const ts=L.ts,st=G.st,st2=G.pending.st2;
  ctx.save();
  // ghosts of moved foes + arrows
  for(const f of st.foes){
    const g=foeById(st2,f.id);
    if(!g){ // died
      let dx=f.c,dy=f.r;
      for(const e of G.pending.ev)if((e.t==='fall'||e.t==='dief')&&e.f===f.id){dx=e.c;dy=e.r}
      ctx.fillStyle='#ff4d5e';ctx.font='800 '+(ts*0.5)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✕',px(dx)+ts/2,py(dy)+ts/2);
      if(dx!==f.c||dy!==f.r)arrow(px(f.c)+ts/2,py(f.r)+ts/2,px(dx)+ts/2,py(dy)+ts/2,'#ffffff88',3);
      continue;
    }
    if(g.c!==f.c||g.r!==f.r){
      arrow(px(f.c)+ts/2,py(f.r)+ts/2,px(g.c)+ts/2,py(g.r)+ts/2,'#ffffff88',3);
      drawFoe(Object.assign({},g,{flash:0}),px(g.c),py(g.r),0.5,1);
    }
    // damage labels
    let dmg=0,blocked=false;
    for(const e of G.pending.ev){if(e.t==='hurtf'&&e.f===f.id)dmg+=e.amt;if(e.t==='block'&&e.f===f.id)blocked=true}
    if(dmg>0){
      ctx.fillStyle='#ff4d5e';ctx.font='800 '+(ts*0.3)+'px system-ui';ctx.textAlign='center';
      ctx.fillText('-'+dmg,px(f.c)+ts/2,py(f.r)+2);
    }else if(blocked){
      ctx.fillStyle='#cfc6b6';ctx.font='800 '+(ts*0.2)+'px system-ui';ctx.textAlign='center';
      ctx.fillText('BLOCK',px(f.c)+ts/2,py(f.r)+2);
    }
    if(g.pin>0&&f.pin===0){
      ctx.fillStyle='#cfc6b6';ctx.font='800 '+(ts*0.2)+'px system-ui';ctx.textAlign='center';
      ctx.fillText('PIN',px(f.c)+ts/2,py(f.r)+2);
    }
  }
  // unit ghosts (rush) + unit damage
  for(const u of st.units){
    if(u.dead)continue;
    const g=unitById(st2,u.id);
    if(g&&!g.dead&&(g.c!==u.c||g.r!==u.r)){
      arrow(px(u.c)+ts/2,py(u.r)+ts/2,px(g.c)+ts/2,py(g.r)+ts/2,'#ffffff88',3);
      drawUnit(Object.assign({},g,{flash:0,acted:false}),px(g.c),py(g.r),0.5,1);
    }
    let dmg=0;
    for(const e of G.pending.ev)if(e.t==='hurtu'&&e.u===u.id)dmg+=e.amt;
    if(dmg>0){ctx.fillStyle='#ff4d5e';ctx.font='800 '+(ts*0.3)+'px system-ui';ctx.textAlign='center';
      ctx.fillText('-'+dmg,px(u.c)+ts/2,py(u.r)+2)}
    if(g&&g.dead&&!u.dead){ctx.fillStyle='#ff4d5e';ctx.font='800 '+(ts*0.5)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✕',px(g.c)+ts/2,py(g.r)+ts/2)}
  }
  // booms
  for(const e of G.pending.ev)if(e.t==='boom'){
    ctx.strokeStyle='#ffb05488';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(px(e.c)+ts/2,py(e.r)+ts/2,ts*0.9,0,7);ctx.stroke();
  }
  ctx.restore();
}
function drawSpawnTelegraphs(st,pulse){
  const ts=L.ts;
  for(const s of st.spawns){
    if(s.t!==st.turn+1)continue;
    const x=px(s.c),y=py(H-1);
    ctx.strokeStyle=`rgba(255,77,94,${0.4+0.4*pulse})`;ctx.lineWidth=2.5;ctx.setLineDash([6,5]);
    rr(x+4,y+4,ts-8,ts-8,ts*0.18);ctx.stroke();ctx.setLineDash([]);
    drawFoe({k:s.k,hp:0,mhp:0,pin:0,flash:0},x,y,0.35,0.8);
    ctx.fillStyle='#ff4d5e';ctx.font='800 '+(ts*0.22)+'px system-ui';ctx.textAlign='center';
    ctx.fillText('!',x+ts*0.82,y+ts*0.3);
  }
}
let lastT=0,pulseT=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-lastT)/1000)||0.016;lastT=t;pulseT+=dt;
  if(pb)tickPB(dt);
  if(shakeT>0)shakeT-=dt;
  for(const f of floaters)f.age+=dt;
  floaters=floaters.filter(f=>f.age<0.9);
  for(const p of parts)p.age+=dt;
  parts=parts.filter(p=>p.age<p.dur);
  // decay flashes
  const decay=e=>{if(e.flash>0)e.flash-=dt*6};
  if(cast){for(const k in cast.foes)decay(cast.foes[k]);for(const k in cast.units)decay(cast.units[k])}
  draw();
}
function draw(){
  if(!G.st){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);return}
  ctx.setTransform(L.dpr,0,0,L.dpr,0,0);
  ctx.clearRect(0,0,L.w,L.h);
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*7*shakeT*4,(Math.random()-0.5)*7*shakeT*4);
  drawBoard(true);
  const st=G.st;
  const pulse=(Math.sin(pulseT*4)+1)/2;
  drawSpawnTelegraphs(st,pulse);
  if(!cast)drawIntents(st);
  drawHighlights(st);
  const ts=L.ts;
  if(cast){
    for(const k in cast.foes){const f=cast.foes[k];
      drawFoe(f,px(f.c+(f.fx||0)),py(f.r+(f.fy||0)),f.fade,f.scale);}
    for(const k in cast.units){const u=cast.units[k];
      drawUnit(u,px(u.c+(u.fx||0)),py(u.r+(u.fy||0)),u.fade,u.scale);}
  }else{
    for(const f of st.foes)drawFoe(f,px(f.c),py(f.r),1,1);
    for(const u of st.units)if(!u.dead)drawUnit(u,px(u.c),py(u.r),1,1);
    drawPending();
  }
  // particles
  for(const p of parts){
    const k=p.age/p.dur;
    if(p.t==='ring'){
      ctx.strokeStyle=`rgba(255,176,84,${1-k})`;ctx.lineWidth=5*(1-k)+1;
      ctx.beginPath();ctx.arc(px(p.c)+ts/2,py(p.r)+ts/2,ts*(0.3+k*1.1),0,7);ctx.stroke();
    }else if(p.t==='arrow'){
      const x=px(p.c)+ts/2;
      ctx.strokeStyle=`rgba(255,220,120,${1-k})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x,py(p.r1)+ts*0.7);ctx.lineTo(x,py(p.r2)+ts*0.5);ctx.stroke();
    }
  }
  // floaters
  for(const f of floaters){
    const k=f.age/0.9;
    ctx.globalAlpha=1-k*k;
    ctx.fillStyle=f.col;ctx.font='800 '+(L.ts*0.3)+'px system-ui';ctx.textAlign='center';
    ctx.fillText(f.txt,f.x,f.y-k*L.ts*0.5);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* cast entity tween: fx/fy are fractional col/row offsets. fix draw calls above */
/* (positions handled via px(c+fx), py adjusted below) */

/* ============================== boot ============================== */
layout();
showMenu();
requestAnimationFrame(frame);
window.DBG={G,tap:tapTile,end:doEndTurn,select:selectUnit,start:startCampaign,daily:startDaily,
  st:()=>G.st,FIGHTS,parseDef,newFight,applyAct,enemyPhase,genDaily};
</script>
