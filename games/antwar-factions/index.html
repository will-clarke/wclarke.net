// T7b: a faction with an income hook owes the player its curve - the hook IS
// the economy. T31: there are two hooks now, so the readout follows the
// mechanism (FOUNDRY's multiplier, VEIL's pip count), never the mere presence
// of a hook.
function spinLabel(side) {
  const f = sim.faction(S, side);
  if (f.flywheel) {
    const gear = sim.gearOf(S, side);
    return '  flywheel ' + S.spin[side].toFixed(2) + 'x'
      + (gear ? ' ' + (gear === 'governor' ? 'GOV' : 'RED') : '');
  }
  if (!f.income) return '';
  const pips = sim.tithePips(S, side);
  return '  larvae ' + pips.toFixed(pips % 1 ? 1 : 0);
}
// T47: each faction names its own metronome - FOUNDRY pours on the shift
// whistle, VEIL's is a gestation cycle. The sandbox keeps the war drum.
const DRUM_WORDS = { foundry: 'shift', veil: 'brood' };
function drumWord(side) { return DRUM_WORDS[S.cfg.FACTION[side]] || 'war drum'; }

// what is waiting to march: a muster of ants, or a press full of mass
function armyLabel(side) {
  return sim.faction(S, side).stamp
    ? 'press ' + (S.press[side].m / CFG.STAMP.refMass).toFixed(1) + 'x'
    : 'muster ' + sim.musterCount(S, side);
}

function drawHUD(time) {
  ctx.textBaseline = 'middle';

  // enemy panel (full information)
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, W, 34);
  ctx.fillStyle = '#f0b0a0';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(opponentLabel(), 10, 11);
  hpBar(10, 20, 180, 9, Math.max(0, S.baseHP.e) / CFG.BASE_HP, '#c84632');
  ctx.fillStyle = '#ffe9b0';
  ctx.textAlign = 'right';
  ctx.font = '12px sans-serif';
  ctx.fillText('gold ' + goldLabel('e') + '  (+' + sim.income(S, 'e').toFixed(1) + '/s)' + spinLabel('e'), W - 10, 11);
  ctx.fillText('hp ' + Math.max(0, Math.ceil(S.baseHP.e)) + '   ' + armyLabel('e')
    + (sim.drumPeriod(S, 'e') === null ? '   no drum'
      : '   ' + drumWord('e') + ' ' + Math.max(0, S.nextBeat.e - S.t).toFixed(0) + 's'), W - 10, 24);

  // match clock
  const remain = Math.max(0, CFG.HARD_END - S.t);
  const mm = Math.floor(remain / 60), ss = Math.floor(remain % 60);
  ctx.fillStyle = S.decay ? '#ff6a4a' : 'rgba(255,255,240,0.85)';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(mm + ':' + String(ss).padStart(2, '0'), LANE_CX, 46);

  // bottom control panel
  ctx.fillStyle = '#33261a';
  ctx.fillRect(0, UI_TOP, W, H - UI_TOP);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(0, UI_TOP, W, 2);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#cfe8b0';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('YOUR COLONY', 12, UI_TOP + 16);
  hpBar(12, UI_TOP + 26, 200, 11, Math.max(0, S.baseHP.p) / CFG.BASE_HP, '#6aa84f');
  const full = fullFlash > 0.5;
  ctx.fillStyle = full && Math.sin(time * 6) > 0 ? '#ff9c50' : '#ffe9b0';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(goldLabel('p') + ' gold', W - 12, UI_TOP + 18);
  ctx.font = '12px sans-serif';
  ctx.fillText(
    full ? 'STORAGE FULL - income wasted!'
      : '+' + sim.income(S, 'p').toFixed(1) + '/s' + (S.frenzy ? '  FRENZY x2' : '') + spinLabel('p'),
    W - 12, UI_TOP + 36);

  // war drum countdown (fx0.2: each side beats alone - this bar is YOURS).
  // A drumless faction (SEEP) gets the strip as a standing readout instead:
  // there is no beat to count down to, so it shows the paint's reach.
  const periodP = sim.drumPeriod(S, 'p');
  const toBeat = Math.max(0, S.nextBeat.p - S.t);
  const frac = periodP === null ? 1 : Math.max(0, 1 - toBeat / periodP);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(12, UI_TOP + 62, W - 24, 30);
  ctx.fillStyle = periodP === null ? 'rgba(120,150,90,0.3)'
    : drumFlash > 0 ? 'rgba(255,216,112,' + (0.35 + drumFlash * 0.5) + ')' : 'rgba(200,160,96,0.35)';
  ctx.fillRect(13, UI_TOP + 63, (W - 26) * frac, 28);
  ctx.fillStyle = '#ffe9c0';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(
    periodP === null
      ? 'NO DRUM - it marches as it hatches   -   stain ' + sim.creepAdvance(S, 'p').toFixed(0) + 'px'
      : drumFlash > 0.3 ? 'THE MARCH IS ON!'
        : drumWord('p') + ' in ' + toBeat.toFixed(0) + 's'
          + (periodP !== CFG.WAR_DRUM ? ' (beat ' + periodP + 's)' : '')
          + '   -   your ' + armyLabel('p'),
    LANE_CX, UI_TOP + 77);

  ctx.fillStyle = '#d8c0a0';
  ctx.font = '11px sans-serif';
  ctx.fillText('tap a slot to build - tap an option to preview - tap again to confirm', LANE_CX, UI_TOP + 106);

  // banners
  let by = 200;
  for (const b of banners) {
    ctx.globalAlpha = Math.min(1, b.ttl);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.font = 'bold 17px sans-serif';
    const tw = ctx.measureText(b.text).width;
    ctx.fillRect(LANE_CX - tw / 2 - 12, by - 14, tw + 24, 28);
    ctx.fillStyle = '#ffd870';
    ctx.textAlign = 'center';
    ctx.fillText(b.text, LANE_CX, by);
    ctx.globalAlpha = 1;
    by += 34;
  }
}

function drawPopup() {
  if (openSlot === null) return;
  const slot = S.slots.p[openSlot];
  ctx.strokeStyle = '#ffe9b0';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(slot.x, slot.y, 24, 0, 7); ctx.stroke();
  // range ring + readout: the CANDIDATE's while previewing, else what's here
  const previewing = pendingType !== null;
  const ringType = previewing && pendingType !== 'lvl' && pendingType !== 'sell'
    ? pendingType : slot.type;
  const spec = CFG.TOWERS[ringType];
  if (spec && spec.range && spec.range < 500) {
    ctx.strokeStyle = previewing && pendingType !== 'sell'
      ? 'rgba(140,224,106,0.5)' : 'rgba(255,233,176,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(slot.x, slot.y, spec.range, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
  }
  const rects = popupRects(openSlot);
  const lines = previewing ? previewLines(openSlot, pendingType)
    : statsLines(slot).map(t => ({ text: t }));
  if (lines.length) {
    ctx.font = '10px sans-serif';
    const wMax = Math.max(...lines.map(l => ctx.measureText(l.text).width));
    const bw = wMax + 16, bh = lines.length * 13 + 9;
    const bx = Math.max(4, Math.min(W - bw - 4, slot.x - bw / 2));
    // above the TOP button row, which is two rows up on the wide trees
    const topY = Math.min(slot.y - 82, ...rects.filter(r => r.h >= 40).map(r => r.y));
    const by = topY - bh - 5;
    ctx.fillStyle = 'rgba(20,14,8,0.92)';
    ctx.strokeStyle = previewing ? '#8ee06a' : '#7a6448';
    ctx.lineWidth = 1;
    roundRect(bx, by, bw, bh, 5);
    ctx.fill(); ctx.stroke();
    ctx.textAlign = 'center';
    for (let i = 0; i < lines.length; i++) {
      ctx.fillStyle = lines[i].color || '#e8d8b8';
      ctx.fillText(lines[i].text, bx + bw / 2, by + 11 + i * 13);
    }
  }
  for (const r of rects) {
    const isSell = r.type === 'sell', isClean = r.type === 'cleanse';
    const afford = isSell || S.money.p >= r.cost;
    const pend = r.type === pendingType;
    ctx.fillStyle = 'rgba(20,14,8,0.92)';
    ctx.strokeStyle = pend ? '#8ee06a'
      : (isSell ? '#a05840' : isClean ? '#9a70c0' : (afford ? '#c8a060' : '#5a4a38'));
    ctx.lineWidth = pend ? 2 : 1;
    roundRect(r.x, r.y, r.w, r.h, 7);
    ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.globalAlpha = afford ? 1 : 0.45;
    ctx.fillStyle = pend ? '#8ee06a' : (isSell ? '#f0b0a0' : isClean ? '#c9a0e8' : '#ffe9c0');
    // wide trees wrap to two rows now, so a button is 66px wide again - the
    // small-label branch stays for the narrow mid-width rows (5 or 6 options)
    ctx.textAlign = 'center';
    const label = pend ? (isSell ? 'Sell?' : 'Confirm?') : r.label;
    // T47's names say the job out loud (Scattergun, Marrow Tap), and a name too
    // long for its button shrinks rather than spilling over the edge
    let fs = r.w < 52 ? 10 : 12;
    ctx.font = 'bold ' + fs + 'px sans-serif';
    while (fs > 8 && ctx.measureText(label).width > r.w - 6) {
      ctx.font = 'bold ' + (--fs) + 'px sans-serif';
    }
    if (r.h < 40) {                // the slim row: one line, label + gold
      ctx.fillText(label + (isSell ? '  +' + r.gain : '  -' + r.cost) + 'g', r.x + r.w / 2, r.y + 16);
    } else {
      ctx.fillText(label, r.x + r.w / 2, r.y + 16);
      ctx.fillStyle = '#ffd870';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText(r.cost + 'g', r.x + r.w / 2, r.y + 36);
    }
    ctx.globalAlpha = 1;
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawMatch(time) {
  drawGround();
  drawCreep(time);
  drawMound(CFG.ENEMY_BASE, '#9a4030', '#3a140c', hillFlash.e);
  drawMound(CFG.PLAYER_BASE, '#4a3826', '#160f08', hillFlash.p);
  drawHillPips(CFG.ENEMY_BASE, S.hillPips.e, time);
  drawHillPips(CFG.PLAYER_BASE, S.hillPips.p, time);
  for (let i = 0; i < S.slots.e.length; i++) drawSlot(S.slots.e[i], 'e', i, time);
  for (let i = 0; i < S.slots.p.length; i++) drawSlot(S.slots.p[i], 'p', i, time);
  for (const sh of S.shots) {
    if (sh.mortar) {
      // lobbed arc + impact ring, fading over the longer ttl
      const a = Math.max(0, sh.ttl / 0.5);
      ctx.strokeStyle = 'rgba(70,56,40,' + 0.6 * a + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(sh.x1, sh.y1);
      ctx.quadraticCurveTo((sh.x1 + sh.x2) / 2, Math.min(sh.y1, sh.y2) - 90, sh.x2, sh.y2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,150,70,' + a + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sh.x2, sh.y2, 5 + 16 * (1 - a), 0, 7); ctx.stroke();
      continue;
    }
    if (sh.arc) {
      // a coil hop: kinked bolt between two bodies, so a chain reads as a chain
      const mx = (sh.x1 + sh.x2) / 2, my = (sh.y1 + sh.y2) / 2;
      const nx = -(sh.y2 - sh.y1), ny = sh.x2 - sh.x1;
      const nl = Math.hypot(nx, ny) || 1, k = (Math.random() - 0.5) * 14;
      ctx.strokeStyle = 'rgba(190,240,255,' + (sh.ttl / 0.09) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sh.x1, sh.y1);
      ctx.lineTo(mx + nx / nl * k, my + ny / nl * k);
      ctx.lineTo(sh.x2, sh.y2);
      ctx.stroke();
      continue;
    }
    ctx.strokeStyle = 'rgba(255,240,180,' + (sh.ttl / 0.09) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sh.x1, sh.y1); ctx.lineTo(sh.x2, sh.y2); ctx.stroke();
    if (sh.splash) {
      ctx.strokeStyle = 'rgba(255,200,120,' + (sh.ttl / 0.09) * 0.6 + ')';
      ctx.beginPath(); ctx.arc(sh.x2, sh.y2, sh.splash, 0, 7); ctx.stroke();
    }
  }
  // converter channel beams: dashed violet thread + a ring closing around
  // the target as the charm completes (full information - both sides')
  for (const side of ['p', 'e']) {
    for (const slot of S.slots[side]) {
      if (slot.type !== 'conv' || !slot.chTgt || !(slot.chT > 0)) continue;
      const tgt = slot.chTgt;
      const frac = Math.min(1, slot.chT / (CFG.TOWERS.conv.channel / sim.lvlPower(S, slot)));
      ctx.strokeStyle = 'rgba(201,160,232,' + (0.35 + 0.45 * frac) + ')';
      ctx.lineWidth = 1.2 + frac * 1.8;
      ctx.setLineDash([3, 5]);
      ctx.beginPath(); ctx.moveTo(slot.x, slot.y - 8); ctx.lineTo(tgt.x, tgt.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(226,190,248,0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(tgt.x, tgt.y, 11 - frac * 4, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
      ctx.stroke();
    }
  }
  for (const u of S.units) drawAnt(u, time);
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.ttl * 2.5);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawHUD(time);
  drawPopup();
}

function drawStars(cx, cy, got, size) {
  ctx.font = 'bold ' + size + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < got ? '#ffd870' : 'rgba(0,0,0,0.35)';
    ctx.fillText('★', cx + (i - 1) * (size + 2), cy);
  }
}

function drawMenu() {
  drawGround();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd870';
  ctx.font = 'bold 40px sans-serif';
  ctx.fillText('ANT WAR', LANE_CX, 62);
  const total = pol.LEVELS.reduce((a, L) => a + (stars[L.key] || 0), 0);
  ctx.fillStyle = '#d8c0a0';
  ctx.font = '13px sans-serif';
  ctx.fillText('the campaign trail  -  ' + total + ' / ' + pol.LEVELS.length * 3 + ' ★', LANE_CX, 96);

  // the winding trail
  ctx.strokeStyle = 'rgba(255,233,176,0.35)';
  ctx.lineWidth = 3;
  ctx.setLineDash([2, 7]);
  ctx.beginPath();
  ctx.moveTo(LEVEL_NODES[0].x, LEVEL_NODES[0].y);
  for (let i = 1; i < LEVEL_NODES.length; i++) ctx.lineTo(LEVEL_NODES[i].x, LEVEL_NODES[i].y);
  ctx.stroke();
  ctx.setLineDash([]);

  for (let i = 0; i < LEVEL_NODES.length; i++) {
    const n = LEVEL_NODES[i], L = pol.LEVELS[i];
    const open = levelUnlocked(i);
    const got = stars[L.key] || 0;
    ctx.fillStyle = open ? '#3a2a1c' : 'rgba(30,22,14,0.9)';
    ctx.strokeStyle = open ? L.hue : '#55483a';
    ctx.lineWidth = got ? 4 : 2.5;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = open ? '#ffe9c0' : '#6a5c4a';
    ctx.font = 'bold ' + (i === LEVEL_NODES.length - 1 ? 15 : 16) + 'px sans-serif';
    ctx.fillText(i === LEVEL_NODES.length - 1 ? '☠' : String(i + 1), n.x, n.y + 1);
    if (open) {
      ctx.fillStyle = '#d8c0a0';
      ctx.font = 'bold 10px sans-serif';
      const side = n.x < LANE_CX ? 1 : -1;
      ctx.textAlign = side === 1 ? 'left' : 'right';
      ctx.fillText(L.name, n.x + side * (n.r + 10), n.y - 5);
      ctx.textAlign = 'center';
      if (got) drawStars(n.x + side * (n.r + 32), n.y + 9, got, 11);
    }
  }

  ctx.fillStyle = '#3a2a1c';
  ctx.strokeStyle = '#c8a060';
  ctx.lineWidth = 2;
  roundRect(SKIRMISH_BTN.x, SKIRMISH_BTN.y, SKIRMISH_BTN.w, SKIRMISH_BTN.h, 10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffe9c0';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('SKIRMISH', LANE_CX, SKIRMISH_BTN.y + 21);

  const nReplays = loadReplays().length;
  if (nReplays) {
    ctx.fillStyle = 'rgba(216,192,160,0.7)';
    ctx.font = '11px sans-serif';
    ctx.fillText('⬇ export ' + nReplays + ' replay' + (nReplays === 1 ? '' : 's'), LANE_CX, EXPORT_BTN.y + 13);
  }
}

function wrapText(text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const probe = line ? line + ' ' + w : w;
    if (ctx.measureText(probe).width > maxW && line) {
      ctx.fillText(line, x, y);
      y += lh;
      line = w;
    } else line = probe;
  }
  if (line) ctx.fillText(line, x, y);
  return y + lh;
}

  drawMenu();

  ctx.fillRect(0, 0, W, H);
  const L = pol.LEVELS[briefLevel];
  ctx.fillStyle = '#2a1e12';
  ctx.strokeStyle = L.hue;
  ctx.lineWidth = 3;
  roundRect(36, 240, W - 72, 310, 14);
  ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#d8c0a0';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('LEVEL ' + (briefLevel + 1), LANE_CX, 272);
  ctx.fillStyle = L.hue;
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(L.name, LANE_CX, 300);
  drawStars(LANE_CX, 330, stars[L.key] || 0, 16);
  ctx.fillStyle = '#e8d8b8';
  ctx.font = '14px sans-serif';
  let ty = wrapText(L.blurb, LANE_CX, 370, W - 120, 20);
  ctx.fillStyle = '#ffd870';
  ty = wrapText(L.twist, LANE_CX, ty + 8, W - 120, 20);
  if (L.reward && (stars[L.key] || 0) === 0) {
    ctx.fillStyle = '#8ee06a';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('VICTORY UNLOCKS: ' + L.reward.label, LANE_CX, ty + 12);
  }
  ctx.fillStyle = '#3a5c34';
  ctx.strokeStyle = '#8ee06a';
  ctx.lineWidth = 2;
  roundRect(BRIEF_START.x, BRIEF_START.y, BRIEF_START.w, BRIEF_START.h, 10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8ffdc';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('DIG IN', LANE_CX, BRIEF_START.y + 27);
}

function drawSkirmish() {
  drawGround();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd870';
  ctx.font = 'bold 44px sans-serif';
  ctx.fillText('SKIRMISH', LANE_CX, 130);
  ctx.fillStyle = '#e8d8b8';
  ctx.font = '14px sans-serif';
  const lines = [
    'Build your nest. Your ants fight for themselves.',
    'Tap a + slot to build; tap a building to specialise,',
    'then level to 3. Selling refunds 70%.',
    'Income doubles at 3:00 left; hills crumble at 1:30.',
  ];
  lines.forEach((l, i) => ctx.fillText(l, LANE_CX, 176 + i * 20));
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText('CHOOSE FACTIONS', LANE_CX, 280);
  for (let r = 0; r < FACTION_ROWS.length; r++) {
    const row = FACTION_ROWS[r];
    ctx.fillStyle = '#d8c0a0';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(r === 0 ? 'YOU' : 'FOE', 48, row[0].y + row[0].h / 2);
    ctx.textAlign = 'center';
    for (const c of row) {
      const on = factionSel[c.side] === c.key;
      ctx.fillStyle = on ? '#5a4020' : '#2a1f14';
      ctx.strokeStyle = on ? '#ffd870' : '#806040';
      ctx.lineWidth = on ? 2.5 : 1.5;
      roundRect(c.x, c.y, c.w, c.h, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = on ? '#ffd870' : '#c0a880';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(sim.FACTIONS[c.key].label, c.x + c.w / 2, c.y + c.h / 2);
    }
  }
  // the AI ladder row: a champion rung overrides the persona list below it
  ctx.textAlign = 'right';
  ctx.fillStyle = '#d8c0a0';
  ctx.font = 'bold 12px sans-serif';
  ctx.fillText('WITS', 48, RUNG_BTNS[0].y + 14);
  ctx.textAlign = 'center';
  for (const b of RUNG_BTNS) {
    const on = aiRung === b.key, ok = rungPlayable(b.key);
    ctx.fillStyle = on ? '#204a3a' : '#141f1a';
    ctx.strokeStyle = !ok ? '#4a4a4a' : on ? '#70e8b0' : '#40806a';
    ctx.lineWidth = on ? 2.5 : 1.5;
    roundRect(b.x, b.y, b.w, b.h, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = !ok ? '#606060' : on ? '#70e8b0' : '#88b8a4';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(RUNGS.find(r => r.key === b.key).label, b.x + b.w / 2, b.y + b.h / 2);
  }
  const rung = RUNGS.find(r => r.key === aiRung);
  const champOn = !!rungBrain(aiRung, factionSel.e);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px sans-serif';
  // a bank entry says so: the Queen swaps vectors on what your nest shows it
  // (T37), and that is worth knowing before the third rematch
  const banked = champOn && !!rungBrain(aiRung, factionSel.e).default;
  ctx.fillText(champOn ? rung.label + (banked ? ' COUNTER-PICKS' : ' CHAMPION') + ' PLAYS - TAP ANY TO START'
    : 'CHOOSE THE ENEMY BRAIN', LANE_CX, 408);
  if (!rungPlayable(aiRung)) {
    ctx.fillStyle = '#e88060';
    ctx.font = '10px sans-serif';
    ctx.fillText('no bred ' + rung.key + ' for ' + sim.FACTIONS[factionSel.e].label
      + ' - the persona plays', LANE_CX, 421);
  } else if (champOn && champsStale()) {
    ctx.fillStyle = '#e8c060';
    ctx.font = '10px sans-serif';
    ctx.fillText('STALE: bred on engine ' + CHAMPS.engine + ', the numbers have moved since',
      LANE_CX, 421);
  }
  for (let i = 0; i < PERSONA_BTNS.length; i++) {
    const b = PERSONA_BTNS[i], foe = SKIRMISH_FOES[i];
    ctx.fillStyle = '#3a2a1c';
    ctx.strokeStyle = champOn ? '#6a5030' : '#c8a060';
    ctx.lineWidth = 2;
    roundRect(b.x, b.y, b.w, b.h, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = champOn ? '#8a7850' : '#ffd870';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(foe.label, LANE_CX, b.y + 21);
    ctx.fillStyle = champOn ? '#6a5c48' : '#d8c0a0';
    ctx.font = '11px sans-serif';
    ctx.fillText(foe.intro, LANE_CX, b.y + 45);
  }
  ctx.fillStyle = '#d8c0a0';
  ctx.font = '12px sans-serif';
  ctx.fillText('tap anywhere else for the trail', LANE_CX, 754);
}

function drawEnd() {
  drawMatch(0);
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = matchResult === 'VICTORY' ? '#8ee06a' : (matchResult === 'DEFEAT' ? '#ff6a4a' : '#ffd870');
  ctx.font = 'bold 46px sans-serif';
  ctx.fillText(matchResult, LANE_CX, 300);
  if (mode === 'campaign' && matchResult === 'VICTORY') drawStars(LANE_CX, 352, earnedStars, 34);
  ctx.fillStyle = '#e8d8b8';
  ctx.font = '16px sans-serif';
  const mm = Math.floor(S.endT / 60), ss = Math.floor(S.endT % 60);
  ctx.fillText('vs ' + opponentLabel() + '  -  ' + mm + ':' + String(ss).padStart(2, '0'), LANE_CX, 400);
  if (earnedUnlock) {
    ctx.fillStyle = '#8ee06a';
    ctx.font = 'bold 17px sans-serif';
    ctx.fillText('NEW TECH: ' + earnedUnlock.label, LANE_CX, 520);
    ctx.fillStyle = '#cfe8b0';
    ctx.font = '13px sans-serif';
    ctx.fillText(earnedUnlock.desc, LANE_CX, 546);
  }
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px sans-serif';
  const hint = mode === 'skirmish' ? 'TAP FOR OPPONENT SELECT'
    : (matchResult === 'VICTORY' ? 'TAP FOR THE TRAIL' : 'TAP TO TRY AGAIN');
  ctx.fillText(hint, LANE_CX, 452);
}

// ------------------------------------------------------------------ loop ---
let last = performance.now();
function frame(now) {
  const dtReal = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (phase === 'play') {
    advance(dtReal);
    drawMatch(now / 1000);
  } else if (phase === 'menu') {
    drawMenu();
  } else if (phase === 'brief') {
    drawBrief();
  } else if (phase === 'skirmish') {
    drawSkirmish();
  } else {
    drawEnd();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
