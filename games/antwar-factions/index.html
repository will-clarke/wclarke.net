<style>
  html, body {

    background: #241a12;

<script>
'use strict';

// ---------------------------------------------------------------------------
// Ant War renderer (v0.9). All rules live in sim.js (shared with the Node
// tuning harness); strategies, personas and campaign levels live in
// policy.js. This file only draws, reads taps, and steps the sim at a fixed
// tick. There are no manual sends: every tap is a build, an upgrade or a
// sell. Persistent state (localStorage): campaign stars, plus a replay log
// of every finished match - the sim is deterministic, so (seed, setup,
// player actions) reconstructs a whole game. Export button on the menu.
// ---------------------------------------------------------------------------

const sim = AntWarSim;
const pol = AntWarPolicy;
const CFG = sim.CONFIG;

const W = CFG.W, H = CFG.H;
const LANE_CX = CFG.LANE_CX, LANE_HALF = CFG.LANE_HALF;
const UI_TOP = 648;

const LABELS = {
  farm: 'Farm', grove: 'Grove', plant: 'Plant.', mat: 'Wellspring',
  governor: 'Govern', redline: 'Redline', deep: 'Marrow Tap', relic: 'Clutch',
  tower: 'Turret', sharp: 'Longbore', spit: 'Scattergun', sap: 'Sap', guard: 'Polyp', mortar: 'Mortar', conv: 'Puppeteer',
  dynamo: 'Dynamo', coil: 'Coil', rampart: 'Rampart', bell: 'Bell', hall: 'Hivemind',
  thicket: 'Mire',
  hatch: 'Smelter', swarmb: 'Swarm', soldierb: 'Steel', majorb: 'Major', sapperb: 'Sapper', predatorb: 'Predator',
  hornb: 'Horn', fifeb: 'Whistle', oozeb: 'Ooze', grubb: 'Pig Iron', slitherb: 'Slither',
  carrierb: 'Cyst', kiss: 'Kiss',
};
// T47: the farm chain is the only type two carved factions SHARE, so it is the
// only label that needs a per-faction word - FOUNDRY mills its gold out of the
// ground, VEIL eats. Everything else is single-owner since T44.
const FACTION_LABELS = {
  foundry: { farm: 'Mine', grove: 'Mill', plant: 'Refinery' },
  veil: { farm: 'Feeder', grove: 'Gorger', plant: 'Glutton' },
};
function labelOf(type, side) {
  const over = FACTION_LABELS[S ? S.cfg.FACTION[side || 'p'] : 'sandbox'];
  return (over && over[type]) || LABELS[type];
}

// one-line "what is this" blurb, shown while previewing an option
const DESC = {
  farm: 'steady gold', grove: 'upgraded: more gold', plant: 'top tier: most gold',
  mat: 'pours the stain: paints ground, income by area',
  governor: 'gold + safe gear: losses never knock your flywheel, lower ceiling',
  redline: 'gold + greed gear: double spin-up, but every loss vents gold',
  deep: 'gold + marrow tap: the more you have infested, the harder you siphon',
  relic: 'gold + clutch: spends half the siphon to hold every seized ant longer',
  tower: 'all-rounder shooter', sharp: 'sniper: slow, huge hits',
  spit: 'splash: shreds swarms', sap: 'slows attackers, no damage',
  guard: 'buds defenders that block the lane',
  mortar: 'bombs enemy defences anywhere, never units',
  conv: 'seizes enemy ants and walks them for you (timed)',
  dynamo: 'spins up as it fires: slow cold, brutal once wound',
  coil: 'arc chains between clustered enemies, weaker each hop',
  rampart: 'no gun: shoves attackers back on every beat of YOUR drum',
  bell: 'no gun: freezes every attacker in range solid, in pulses',
  hall: 'a slower puppeteer whose hive mind holds EVERY seized ant twice as long',
  thicket: 'no gun: the stain at full thickness - everything hostile in it wades and blisters',
  hatch: 'casts workers', swarmb: 'cheap worker flood',
  soldierb: 'casts soldiers', majorb: 'breeds slow tanks',
  sapperb: 'breeds building-killers', predatorb: 'breeds midfield hunters',
  hornb: 'casts soldiers, +6s on YOUR drum (bigger waves)',
  fifeb: 'casts workers, -3s on YOUR drum (faster waves)',
  oozeb: 'oozes shamblers in blooms of 3 - clumps, not a drum; corpses feed the stain',
  grubb: 'cheap fat mass: lots of hp, almost no bite',
  slitherb: 'frail skirmishers: race across YOUR stain, crawl off it',
  carrierb: 'carriers: no damage at all - they touch a foe building and implant a larva',
  kiss: 'breeds nothing: larvae crawl from each infested building to its nearest neighbour',
  lvl: 'level up: more power, superlinear cost',
};

// skirmish opponents: the three personas plus the fx0.3 creep probe (an
// ARCHETYPE, not a persona - it lives outside the counter-triangle)
const SKIRMISH_FOES = ['bloom', 'tussock', 'rustle'].map(key => ({
  key, label: pol.PERSONAS[key].label, intro: pol.PERSONAS[key].intro,
  params: pol.PERSONAS[key].params,
})).concat([{
  key: 'creeper', label: 'THE WELLSPRING (Creeper)',
  intro: 'Its dead advance the stain. Rush it before the ground turns.',
  params: pol.ARCHETYPES.creeper,
}]);
const PERSONA_BTNS = SKIRMISH_FOES.map((f, i) => ({
  key: f.key, x: 24, y: 428 + i * 78, w: W - 48, h: 68,
}));
// playtest faction picker (temporary until T39): one chip row per side on the
// skirmish screen. Skirmish-only - campaign levels are authored vs the sandbox.
const FACTION_KEYS = ['sandbox', 'seep', 'foundry', 'veil'];
const FACTION_ROWS = ['p', 'e'].map((side, r) => FACTION_KEYS.map((key, i) => ({
  side, key, x: 56 + i * 90, y: 302 + r * 34, w: 84, h: 28,
})));

// T36 - the AI ladder: three bred brains per faction, each rung one step
// further through the coevolution arms race, thinking faster as it climbs. No
// gold, vision or rules cheats at any rung - the sim is full-information and
// the champion is simply better.
const CHAMPS = (typeof AntWarChampions !== 'undefined') ? AntWarChampions : null;
const RUNGS = [
  { key: 'grub', label: 'GRUB', thinkEvery: 1.6, brain: 'grub' },
  { key: 'soldier', label: 'SOLDIER', thinkEvery: 0.9, brain: 'soldier' },
  { key: 'queen', label: 'QUEEN', thinkEvery: 0.4, brain: 'queen' },
];
const RUNG_BTNS = RUNGS.map((r, i) => ({ key: r.key, x: 56 + i * 110, y: 368, w: 104, h: 28 }));
// A champion is only playable if the bank carries one for that faction. The
// SANDBOX at Grub is the deliberate exception: the personas below were written
// for that kit, so there they ARE the casual brain - while against a carved kit
// a persona is not casual but inert, bidding for types the faction cannot own
// until it has built farms and nothing else. Hence bred brains everywhere else.
function rungBrain(rungKey, faction) {
  const rung = RUNGS.find(r => r.key === rungKey);
  if (!rung.brain || !CHAMPS) return null;
  if (rung.key === 'grub' && faction === 'sandbox') return null;
  return CHAMPS[rung.brain][faction] || null;
}
function rungPlayable(rungKey) {
  const rung = RUNGS.find(r => r.key === rungKey);
  if (!rung.brain) return true;
  if (rung.key === 'grub' && factionSel.e === 'sandbox') return true;   // the personas play
  return !!rungBrain(rungKey, factionSel.e);
}
// the bank was bred against a CONFIG, a faction table and a vector shape; if
// any of those moved the vectors still play, they are just no longer the brains
// the tuner graded - say so rather than quietly serving a stale champion.
function champsStale() {
  return !!CHAMPS && CHAMPS.content !== pol.contentHash();
}

// campaign trail: a winding path up the screen, boss node centred on top
// (spacing scales off the level count - v0.9 grew the ladder to 12)
const LEVEL_NODES = pol.LEVELS.map((L, i) => ({
  x: i === pol.LEVELS.length - 1 ? 210 : (i % 2 === 0 ? 135 : 285),
  y: 645 - i * Math.floor(495 / (pol.LEVELS.length - 1)),
  r: i === pol.LEVELS.length - 1 ? 27 : 22,
}));
const SKIRMISH_BTN = { x: 110, y: 706, w: 200, h: 42 };
const BRIEF_START = { x: 90, y: 470, w: 240, h: 52 };
const EXPORT_BTN = { x: 110, y: 752, w: 200, h: 24 };

// KR-style stars, saved locally: 1 win, 2 hill >= 100hp, 3 hill >= 200hp.
// Tech unlocks derive from stars (policy.unlocksFrom) - beating a level
// loots its reward, in campaign AND skirmish alike.
let stars = {};
try { stars = JSON.parse(localStorage.getItem('antwar-stars') || '{}') || {}; } catch (e) {}
// SANDBOX RULE (antwar-factions fork): the whole kit is always open. This
// line playtests mechanics, not the loot curve; campaign enemies keep their
// authored kits, so early levels play easier here than in the main line.
const ALL_UNLOCKED = { types: Object.keys(CFG.COSTS), maxLvl: CFG.MAX_LVL };
let unlocks = ALL_UNLOCKED;
// ?spice=spawnRate:0.01,speed:1.5 - playtest a CONFIG.SPICE paint experiment
// in the browser, the same knobs tune.js takes as SPICE=... (all 0 by default).
const SPICE_OVERRIDE = (() => {
  const q = new URLSearchParams(location.search).get('spice');
  if (!q) return null;
  const sp = Object.assign({}, CFG.SPICE);
  for (const kv of q.split(',')) { const [k, v] = kv.split(':'); sp[k] = parseFloat(v); }
  return sp;
})();
// ?faction=seep plays SEEP against the sandbox kit; ?faction=seep:seep sets both
// sides (T7a). Unknown names are ignored rather than crashing the page.
const FACTION_OVERRIDE = (() => {
  const q = new URLSearchParams(location.search).get('faction');
  if (!q) return null;
  const [p, e] = q.split(':');
  const pick = (f, dflt) => (f && sim.FACTIONS[f] ? f : dflt);
  return { p: pick(p, 'sandbox'), e: pick(e, 'sandbox') };
})();
// the picker's live selection: the URL wins at load, else the remembered pick
let factionSel = Object.assign(
  { p: 'sandbox', e: 'sandbox' },
  (() => { try { return JSON.parse(localStorage.getItem('antwar-faction-pick') || 'null'); } catch (e) { return null; } })(),
  FACTION_OVERRIDE || {});
for (const s of ['p', 'e']) if (!sim.FACTIONS[factionSel[s]]) factionSel[s] = 'sandbox';
function saveFactionSel() {
  try { localStorage.setItem('antwar-faction-pick', JSON.stringify(factionSel)); } catch (e) {}
}
// ?ai=queen picks the rung for testing (with ?faction=veil:foundry, the whole
// matchup is one URL); the remembered pick is the fallback.
let aiRung = (() => {
  const q = new URLSearchParams(location.search).get('ai');
  let pick = null;
  try { pick = localStorage.getItem('antwar-ai-rung'); } catch (e) {}
  for (const k of [q, pick]) if (RUNGS.some(r => r.key === k)) return k;
  return 'grub';
})();
function setRung(key) {
  aiRung = key;
  try { localStorage.setItem('antwar-ai-rung', key); } catch (e) {}
}
function newState(extra) {
  const ov = Object.assign({}, extra);
  if (SPICE_OVERRIDE) ov.SPICE = SPICE_OVERRIDE;
  if (FACTION_OVERRIDE && !ov.FACTION) ov.FACTION = FACTION_OVERRIDE;
  return sim.createState((Math.random() * 2 ** 31) | 0, ov);
}
function saveStars() {
  try { localStorage.setItem('antwar-stars', JSON.stringify(stars)); } catch (e) {}
  unlocks = ALL_UNLOCKED;
}
function levelUnlocked(i) {
  return i === 0 || (stars[pol.LEVELS[i - 1].key] || 0) >= 1;
}
// the player's tappable build options for a slot, locked tech hidden
function allowedOptions(slotIdx) {
  const slot = S.slots.p[slotIdx];
  return sim.buildOptions(S, 'p', slotIdx).filter(t =>
    t === 'lvl' ? slot.lvl + 1 <= unlocks.maxLvl : unlocks.types.includes(t));
}

// ----------------------------------------------------------------- replays --
// every finished match is logged: the sim is deterministic, so seed + setup
// + opponent + timestamped player actions reconstruct the whole game later
// (replay viewer / ghost PvP / ML corpus - see README).
let replay = null;
function startReplay(opponent) {
  replay = {
    v: 'fx0.4', mode, opponent, seed: S.seed,
    faction: S.cfg.FACTION,      // both kits; without it a faction replay is unreconstructable
    // which brain actually played (T36): at a champion rung `opponent` is the
    // persona the player tapped and the champion is what they fought
    ai: mode === 'skirmish' ? { rung: aiRung, engine: CHAMPS ? CHAMPS.engine : null } : null,
    setup: S.cfg.SETUP || null,
    startedAt: new Date().toISOString(),
    actions: [],               // {tk: sim tick index, slot, type} ('sell' sells)
  };
}
function logAction(slot, type) {
  if (replay) replay.actions.push({ tk: Math.round(S.t / CFG.TICK), slot, type });
}
function loadReplays() {
  try { return JSON.parse(localStorage.getItem('antwar-replays') || '[]') || []; } catch (e) { return []; }
}
function finishReplay() {
  if (!replay) return;
  replay.result = matchResult;
  replay.endT = Math.round(S.endT * 10) / 10;
  replay.hpP = Math.round(S.baseHP.p);
  replay.hpE = Math.round(S.baseHP.e);
  try {
    const all = loadReplays();
    all.push(replay);
    while (all.length > 60) all.shift();   // keep the log bounded
    localStorage.setItem('antwar-replays', JSON.stringify(all));
  } catch (e) {}
  replay = null;
}
function exportReplays() {
  const all = loadReplays();
  if (!all.length) return;
  const blob = new Blob(
    [JSON.stringify({ game: 'antwar', exported: new Date().toISOString(), replays: all })],
    { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'antwar-replays.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let viewScale = 1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  viewScale = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.width = Math.round(W * viewScale * dpr);
  cv.height = Math.round(H * viewScale * dpr);
  cv.style.width = (W * viewScale) + 'px';
  cv.style.height = (H * viewScale) + 'px';
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ----------------------------------------------------------------- state ---
let phase = 'menu';              // menu | brief | skirmish | play | end
let mode = 'campaign';           // campaign | skirmish (what 'play' returns to)
let currentLevel = -1;
let briefLevel = -1;
let earnedStars = 0;
let earnedUnlock = null;         // reward looted on a first win, for the end screen
let S = null;
let enemyCtrl = null;
let personaKey = SKIRMISH_FOES[0].key;
let matchResult = '';
let banners = [];
let openSlot = null;
let pendingType = null;          // first tap previews, second tap on the same button buys
let acc = 0;
let fullFlash = 0;
let drumFlash = 0;
let pebbles = [];
let parts = [];                  // cosmetic particles (poofs, crumbles)
let stains = [];                 // cosmetic corpse-splat blotches on the mat
let wisps = [];                  // digested foe corpses drifting home to the nest
let hillFlash = { p: 0, e: 0 };  // hill-crack feedback while besieged
let prevHP = { p: 0, e: 0 };

// ------------------------------------------------------------- feel layer --
// tiny WebAudio blips; the context can only start on a user gesture
let AC = null;
function ensureAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function blip(freq, dur, type, vol, slideTo) {
  if (!AC || AC.state !== 'running') return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
const SFX = {
  drum()      { blip(85, 0.28, 'sine', 0.5, 42); blip(160, 0.1, 'triangle', 0.15, 70); },
  build()     { blip(520, 0.07, 'triangle', 0.18, 700); },
  sell()      { blip(620, 0.12, 'triangle', 0.18, 260); },
  towerfall() { blip(140, 0.45, 'sawtooth', 0.3, 40); blip(70, 0.5, 'square', 0.18, 35); },
  mortar()    { blip(110, 0.22, 'square', 0.16, 48); },
  convert()   { blip(420, 0.35, 'sine', 0.2, 1260); blip(630, 0.25, 'triangle', 0.1, 1680); },
  frenzy()    { blip(300, 0.35, 'triangle', 0.25, 900); },
  win()       { blip(440, 0.5, 'triangle', 0.3, 880); },
  lose()      { blip(220, 0.7, 'sawtooth', 0.22, 80); },
};
function buzz(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

function poof(x, y, color, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (0.3 + Math.random() * 0.7) * (spread || 40);
    parts.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 15,
      ttl: 0.35 + Math.random() * 0.35,
      r: 1.5 + Math.random() * 2.5,
      color,
    });
  }
}

// where a digested corpse gets sucked to: the paint owner's nearest standing
// building, or its hill if the nest has been levelled
function nearestNest(side, x, y) {
  let best = side === 'p' ? CFG.PLAYER_BASE : CFG.ENEMY_BASE, bd = Infinity;
  for (const s of S.slots[side]) {
    if (!s.type) continue;
    const d = (s.x - x) * (s.x - x) + (s.y - y) * (s.y - y);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}

for (let i = 0; i < 70; i++) {
  pebbles.push({
    x: Math.random() * W,
    y: 40 + Math.random() * (UI_TOP - 60),
    r: 1 + Math.random() * 2.5,
    a: 0.05 + Math.random() * 0.1,
  });
}

function resetMatchFx() {
  banners = [];
  openSlot = null;
  pendingType = null;
  acc = 0;
  fullFlash = 0;
  drumFlash = 0;
  parts = [];
  stains = [];
  wisps = [];
  hillFlash = { p: 0, e: 0 };
  prevHP = { p: S.baseHP.p, e: S.baseHP.e };
  phase = 'play';
}

function begin(key) {           // skirmish: pick a foe, symmetric start
  mode = 'skirmish';
  personaKey = key;
  S = newState({ FACTION: { p: factionSel.p, e: factionSel.e } });
  // the rung decides the brain: a champion for its faction if the bank has one,
  // else the persona the player tapped (which is the Grub rung outright)
  const rung = RUNGS.find(r => r.key === aiRung);
  const champ = rungBrain(aiRung, factionSel.e);
  // makeBrain: the Queen rung's entry is an adaptive BANK since T37 (it swaps
  // vectors on what the board shows), the others are single vectors
  enemyCtrl = pol.makeBrain(champ || SKIRMISH_FOES.find(f => f.key === key).params,
    { thinkEvery: rung.thinkEvery });
  startReplay(key);
  resetMatchFx();
}

function beginLevel(i) {        // campaign: level AI + level setup + kits
  mode = 'campaign';
  currentLevel = i;
  const L = pol.LEVELS[i];
  S = newState({ SETUP: L.setup || null });
  // the enemy escalates in step with the ladder: player-kit-so-far plus
  // this level's own loot (and any extraKit showcase)
  enemyCtrl = pol.makeController(L.ai.params, {
    thinkEvery: L.ai.thinkEvery, allowed: pol.enemyKitAt(i),
  });
  startReplay(L.key);
  resetMatchFx();
}

function opponentLabel() {
  if (mode === 'campaign') return pol.LEVELS[currentLevel].name;
  // a champion rung has replaced the persona, so naming the persona would lie
  const champ = rungBrain(aiRung, factionSel.e);
  const rung = RUNGS.find(r => r.key === aiRung);
  const base = champ ? rung.label + ' CHAMPION'
    : SKIRMISH_FOES.find(f => f.key === personaKey).label;
  const f = sim.faction(S, 'e');
  return f.label === 'SANDBOX' ? base : base + ' - ' + f.label;
}

// T31: a repeat REFRESHES rather than stacks. VEIL plants pips in a stream, so
// with it as an opponent two copies of 'Your HILL is corrupted!' sat on top of
// each other at different offsets - unreadable, and the same for any burst.
function banner(text) {
  const showing = banners.find(b => b.text === text);
  if (showing) showing.ttl = 2.4;
  else banners.push({ text, ttl: 2.4 });
}

// ------------------------------------------------------------------ input --
function popupRects(slotIdx) {
  const slot = S.slots.p[slotIdx];
  const entries = allowedOptions(slotIdx).map(type => ({
    type,
    label: type === 'lvl' ? 'Lvl ' + (slot.lvl + 1) : labelOf(type),
    cost: type === 'lvl' ? sim.lvlCost(S, slot) : sim.costOf(S, 'p', type),
  }));
  if (!entries.length && slot.type === null) return [];
  // shrink buttons when a tree offers all its specs, and WRAP once shrinking
  // would stop being tappable: the tower tree reached ten options at T25, which
  // is 37px stubs across 420px - narrower than the word 'Scattergun'
  const gap = 4;
  const n = Math.max(1, entries.length);
  const per = n > 6 ? Math.ceil(n / 2) : n;
  const rows = Math.ceil(n / per);
  const bw = Math.min(66, Math.floor((W - 12 - (per - 1) * gap) / per));
  const rowAt = r => {
    const cnt = Math.min(per, n - r * per);
    const total = cnt * bw + (cnt - 1) * gap;
    return { total, x0: Math.max(6, Math.min(W - total - 6, slot.x - total / 2)) };
  };
  const out = entries.map((en, i) => {
    const r = Math.floor(i / per), { x0 } = rowAt(r);
    return Object.assign(en, {
      x: x0 + (i % per) * (bw + gap), y: slot.y - 82 - (rows - 1 - r) * 58, w: bw, h: 52,
    });
  });
  // any occupied slot can be sold for a partial refund of its total spend;
  // sell sits on its own slim row so a stray tap can't hit it - and shares that
  // row with the cleanse (T33), the two ways to answer corruption: pay 30 to
  // scrub it, or take the refund and deny the corruptor the building entirely.
  // A slot that has TURNED offers neither: it is not yours to spend on any more.
  if (slot.type !== null && !slot.flipped) {
    const last = rowAt(rows - 1), cx = last.x0 + last.total / 2;
    const pair = slot.pips > 0;
    out.push({
      type: 'sell', label: 'Sell', gain: sim.sellRefund(S, slot),
      x: (pair ? cx - 78 : cx - 37), y: slot.y - 26, w: 74, h: 24,
    });
    if (pair) out.push({
      type: 'cleanse', label: 'Purge', cost: CFG.CORRUPT.cleanseCost,
      x: cx + 4, y: slot.y - 26, w: 74, h: 24,
    });
  }
  return out;
}

// a slot is worth opening if it offers anything - or if it has TURNED (T33),
// where the popup carries no buttons at all and exists to say why
function tappable(i) {
  return !!popupRects(i).length || S.slots.p[i].flipped;
}

function inRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

// tap-a-building stats: the numbers behind the piece, level power applied
// T30: corruption is state on the slot rather than on its type, so it rides
// ABOVE whatever the building itself has to say - and it is the same line
// whether the thing is a farm or a mortar.
function statsLines(slot) {
  if (!(slot.pips > 0)) return typeStats(slot);
  // T33: once it has turned there is nothing left to decide, so the line stops
  // offering the counterplay and says what happened instead
  if (slot.flipped) {
    return ['TAKEN AS A BROOD-HOST - it works for ' + sim.faction(S, 'e').label + ' now',
            'it cannot be sold, purged or rebuilt; only demolished'].concat(typeStats(slot));
  }
  return ['INFESTED: ' + (Math.round(slot.pips * 10) / 10) + ' of ' + CFG.CORRUPT.max
    + ' larvae - at ' + CFG.CORRUPT.max + ' it becomes their BROOD-HOST',
          'purge it for ' + CFG.CORRUPT.cleanseCost + 'g, or sell the building to deny them'].concat(typeStats(slot));
}

function typeStats(slot) {
  const t = slot.type;
  if (!t) return [];
  const k = sim.lvlPower(S, slot);
  if (slot.buildT > 0) {
    return ['UNDER CONSTRUCTION - ' + slot.buildT.toFixed(1) + 's left',
            'it earns nothing and does nothing until it is finished',
            'but it can already be killed - hp ' + Math.ceil(slot.hp),
            'your own ground under a slot builds faster, foe ground slower'];
  }
  if (t === 'mat') {
    const CR = CFG.CREEP;
    return ['the stain pours out: +' + CFG.INCOME_BY_TYPE.mat + ' gold/s, and the ground itself pays by area',
            'it spreads and seeps at the foe; in FULL stain they slow to '
              + Math.round(CR.slow * 100) + '% and take ' + CR.dot + ' dps, buildings ' + CR.corrode + ' dps',
            'it dissolves untended and foe guns burn it back',
            'hp ' + Math.ceil(slot.hp) + '/' + CFG.TOWER_HP + ' - mortars and a rival stain can kill it'];
  }
  const hpLine = 'hp ' + Math.ceil(slot.hp) + '/' + Math.round(CFG.TOWER_HP * k);
  if (t === 'governor' || t === 'redline') {
    const FL = CFG.FLYWHEEL, gov = t === 'governor';
    const out = ['+' + CFG.INCOME_BY_TYPE[t] + ' gold/s, and one gear on YOUR flywheel'];
    out.push(gov
      ? 'losing a building no longer knocks the flywheel (normally -' + FL.loss + 'x)'
      : 'winds up twice as fast: the ' + FL.max + 'x cap in ~'
        + Math.round((FL.max - FL.cold) / (FL.rate * FL.redMult)) + 's, not ~'
        + Math.round((FL.max - FL.cold) / FL.rate) + 's');
    out.push(gov
      ? 'the price is the ceiling: ' + FL.govMax + 'x instead of ' + FL.max + 'x, clamped the moment you fit it'
      : 'the price is the risk: -' + FL.vent + ' gold on TOP of the knock, every building you lose');
    if (!sim.faction(S, 'p').income) {
      out.push('YOUR faction has no flywheel, so this gear does nothing');
    } else if (!gov && sim.count(S, 'p', 'governor') > 0) {
      out.push('a Governor is standing, and it OVERRIDES this - sell one of them');
    }
    out.push('one gear per nest: a second buys nothing, and Governor beats Redline');
    out.push(hpLine);
    return out;
  }
  // T45: the tithe has no body language of its own (the playtest's first fun
  // risk), so both leaves print what they are worth AT THIS MOMENT
  if (t === 'deep' || t === 'relic') {
    const CR = CFG.CORRUPT, pips = sim.tithePips(S, 'p'), isDeep = t === 'deep';
    const out = ['+' + CFG.INCOME_BY_TYPE[t] + ' gold/s, and one leaf on YOUR siphon'];
    out.push(isDeep
      ? 'every larva you have planted siphons +' + Math.round(CR.deepGain * 100)
        + '% harder, up to ' + CR.deepMax + 'x'
      : 'spends ' + Math.round(CR.relicSkim * 100) + '% of the siphon to grip every seized ant +'
        + Math.round(CR.relicGain * 100) + '% longer per larva, up to ' + CR.relicMax + 'x');
    if (!sim.faction(S, 'p').tithe) {
      out.push('YOUR faction siphons nothing, so this leaf does nothing');
    } else if (pips > 0) {
      out.push(isDeep
        ? pips + ' larvae planted: ' + r1(sim.titheOf(S, 'p')) + ' gold/s siphoned right now'
        : pips + ' larvae planted: your grip holds x' + r1(sim.relicHold(S, 'p')) + ' right now');
    } else {
      out.push('nothing of theirs is infested yet, so it is doing nothing at all');
    }
    out.push('one per nest: a second buys nothing');
    out.push(hpLine);
    return out;
  }
  if (t === 'kiss') {
    const CR = CFG.CORRUPT;
    return ['no unit at all: every infested enemy building infects its nearest CLEANER neighbour',
            CR.spreadAmt + ' larva every ' + (CR.spreadEvery / k).toFixed(1) + 's per infested building - levels spread oftener',
            'only within ' + CR.spreadR + 'px, so a nest built spread OUT barely spreads at all',
            'it never touches a hill and it cannot start on its own - a carrier has to land the first larva',
            hpLine];
  }
  if (CFG.INCOME_BY_TYPE[t]) return ['+' + CFG.INCOME_BY_TYPE[t] + ' gold/s', hpLine];
  const tw = CFG.TOWERS[t];
  if (t === 'sap') {
    const slowPct = Math.round(CFG.TOWERS.sap.slow * Math.pow(0.78, slot.lvl - 1) * 100);
    return ['slows attackers to ' + slowPct + '% speed', 'range ' + tw.range + ' - ' + hpLine];
  }
  if (t === 'thicket') {
    const CR = CFG.CREEP;
    return ['no gun: the ground itself, the stain as thick as it ever gets',
            'attackers in it crawl at ' + Math.round((1 + (CR.slow - 1) * tw.dense) * 100)
              + '% speed and take ' + r1(CR.dot * tw.dense) + ' dps - on bare ground too, no mat needed',
            'it grows no stain of its own, so it pays nothing and nothing burns it back',
            'range ' + tw.range + ' - ' + hpLine];
  }
  if (t === 'mortar') {
    return [Math.round(tw.bomb * k) + ' dmg vs enemy defences, every ' + tw.cooldown + 's', 'unlimited range - ' + hpLine];
  }
  if (t === 'conv' || t === 'hall') {
    // T34: a hall sings over every charm on the side, its own included, so the
    // hold it quotes has to be the hold the player will actually see
    const choir = sim.count(S, 'p', 'hall') > 0 ? CFG.TOWERS.hall.choirCharm : 1;
    const dur = h => Math.round(Math.max(tw.charmMin, tw.charmHpSec / h) * k * choir);
    const out = ['seizes an ant in ' + (tw.channel / k).toFixed(1) + 's - range ' + tw.range,
                 'the grip holds ' + dur(CFG.UNITS.worker.hp) + 's (worker) to ' + dur(CFG.UNITS.major.hp) + 's (major) - ' + hpLine];
    if (t === 'hall') {
      out.splice(1, 0, 'while it stands, EVERY seized ant of yours holds x' + tw.choirCharm
        + ' as long and hits x' + tw.choirDps + ' harder');
      out.push('one hive mind per nest: a second is just another puppeteer');
    } else if (choir > 1) {
      out.splice(1, 0, 'your Hivemind is stretching this grip x' + CFG.TOWERS.hall.choirCharm);
    }
    return out;
  }
  if (t === 'bell') {
    return ['freezes EVERY attacker in range solid for ' + tw.freezeDur + 's, no damage',
            'rings every ' + (tw.cooldown / k).toFixed(1) + 's - levels ring oftener, never longer',
            'a frozen ant cannot move or bite, but it can still be shot and SEIZED',
            'heavy stamped bodies shrug off half of it, and a thawed ant resists for '
              + tw.immune + 's - so more bells is more GROUND, never a longer hold',
            'range ' + tw.range + ' - the same reach as a Puppeteer - ' + hpLine];
  }
  if (t === 'rampart') {
    const per = sim.drumPeriod(S, 'p');
    return ['shoves every attacker in range back ' + Math.round(tw.punch * k) + 'px, no damage',
            'staggered to ' + Math.round(tw.punchSlow * 100) + '% speed for ' + tw.punchStun + 's, and a siege has to re-form',
            per === null ? 'YOUR side has no drum, so it never punches'
              : 'once per beat of YOUR drum - every ' + per + 's, so a faster drum punches more',
            'range ' + tw.range + ' - ' + hpLine];
  }
  if (t === 'dynamo') {
    const dmg = Math.round(tw.dmg * k * 10) / 10, spun = slot.spun || 1;
    return [dmg + ' dmg every ' + (tw.cooldown / spun).toFixed(2) + 's - spun x' + spun.toFixed(2)
              + ' of ' + tw.spinMax.toFixed(1),
            'every shot winds it: ' + r1(dmg * spun / tw.cooldown) + ' dps now, '
              + r1(dmg * tw.spinMax / tw.cooldown) + ' dps fully wound',
            'the spin never cools - only losing the slot resets it',
            'range ' + tw.range + ' - ' + hpLine + ' - burns back the stain'];
  }
  if (t === 'coil') {
    const dmg = Math.round(tw.dmg * k * 10) / 10;
    const chain = [];
    for (let h = 0, d = dmg; h < tw.hops; h++, d *= tw.falloff) chain.push(r1(d));
    const full = chain.reduce((a, b) => a + b, 0);
    return ['arcs to ' + tw.hops + ' enemies, ' + chain.join(' then ') + ' dmg, every ' + tw.cooldown + 's',
            r1(dmg / tw.cooldown) + ' dps on a lone target, ' + r1(full / tw.cooldown) + ' dps on a full chain',
            'each hop jumps up to ' + tw.chainR + 'px from the LAST body hit',
            'range ' + tw.range + ' - ' + hpLine + ' - burns back the stain'];
  }
  if (tw && tw.dmg) {
    const dmg = Math.round(tw.dmg * k * 10) / 10;
    return [dmg + ' dmg every ' + tw.cooldown + 's (' + (dmg / tw.cooldown).toFixed(1) + ' dps)' + (tw.splash ? ' - splash ' + tw.splash : ''),
            'range ' + tw.range + ' - ' + hpLine + ' - burns back the stain'];
  }
  if (t === 'guard') {
    const g = CFG.UNITS.guard;
    return ['buds ' + CFG.GUARD.count + ' guards: ' + Math.round(g.hp * k) + 'hp, ' + (Math.round(g.dps * k * 10) / 10) + ' dps each',
            'respawn ' + CFG.GUARD.respawn + 's - ' + hpLine];
  }
  const prod = CFG.PRODUCTION[t];
  if (prod) {
    const u = CFG.UNITS[prod.unit];
    // a stamping faction never breeds this: the same building is an assembly
    // line pouring into the press, so the numbers have to be press numbers
    if (sim.faction(S, 'p').stamp) {
      const per = prod.interval / k, e = CFG.STAMP.eff, d = CFG.DRUM_DELTA[t];
      const out = [r1(u.hp / per * e) + ' mass/s + ' + r1(u.dps / per * e) + ' dps/s to the press',
                   'the shift stamps the press into one Juggernaut',
                   'gold overcharges each stamp'];
      if (d) out.push((d > 0 ? '+' : '') + d + 's on YOUR ' + drumWord('p') + ' (per building)');
      out.push(hpLine);
      return out;
    }
    const per = prod.interval * (prod.bloom || 1) / k;
    const out = [prod.bloom
      ? prod.bloom + ' ' + prod.unit + 's at once every ' + per.toFixed(1) + 's (a bloom)'
      : '1 ' + prod.unit + ' every ' + per.toFixed(1) + 's'];
    out.push(u.hp + 'hp - ' + u.dps + ' dps - speed ' + u.spd + (u.vsTower ? ' - ' + u.vsTower + ' dps vs towers' : ''));
    // the delta lines can't carry this - a stat absent on the other side of the
    // compare prints nothing, and no other brood has it
    if (u.paintSpeed) out.push('up to x' + u.paintSpeed + ' speed on YOUR stain, sluggish off it');
    // dps 0 prints as a stat and reads like a typo, so the trade has to be
    // spelled out: what it delivers is the pip, and it dies delivering it
    if (u.implant) {
      out.push('NO damage: it walks to a foe building, implants ' + u.implant
        + ' larva and dies');
      out.push(CFG.CORRUPT.max + ' larvae saturate a building; with none left to infest it implants in the HILL,'
        + ' where each larva gnaws ' + CFG.CORRUPT.hillDot + ' hp/s (max ' + CFG.CORRUPT.hillMax + ')');
    }
    if (CFG.DRUM_DELTA[t]) {
      const d = CFG.DRUM_DELTA[t];
      out.push((d > 0 ? '+' : '') + d + 's on YOUR ' + drumWord('p') + ' (per building)');
    }
    if (CFG.UNITS[prod.unit].trickle) {
      out.push('no muster: marches at hatch; each corpse bursts into stain where it falls');
    }
    out.push(hpLine);
    return out;
  }
  return [];
}

// --- preview (two-tap confirm): what a tap WOULD build, and how it compares
const STAT_LABELS = {
  income: ['income', 'g/s'], dmg: ['dmg', ''], dps: ['dps', ''],
  range: ['range', ''], bomb: ['bomb', ''], charm: ['seizes in', 's'],
  punch: ['shove', 'px'], hold: ['grip holds', 'x'],
  every: ['breeds every', 's'], unitHp: ['unit hp', ''], unitDps: ['unit dps', ''],
  massRate: ['mass/s', ''], dmgRate: ['press dps/s', ''],
  guardHp: ['guard hp', ''], guardDps: ['guard dps', ''], hp: ['hp', ''],
};
const LOWER_BETTER = ['charm', 'every'];
const r1 = n => Math.round(n * 10) / 10;

// the comparable numbers for a (type, level); a key is absent when the type
// has no such stat, and absent on either side means no delta line
function keyStats(type, lvl) {
  const k = Math.pow(CFG.LVL_POWER, lvl - 1);
  const o = {};
  const tw = CFG.TOWERS[type], prod = CFG.PRODUCTION[type];
  if (CFG.INCOME_BY_TYPE[type]) o.income = CFG.INCOME_BY_TYPE[type];
  if (tw) {
    if (tw.dmg) { o.dmg = r1(tw.dmg * k); o.dps = r1(tw.dmg * k / tw.cooldown); }
    if (tw.bomb) o.bomb = Math.round(tw.bomb * k);
    // T34: the hall's headline pair - it channels SLOWER and holds LONGER, and
    // the delta line is the only place that trade is visible before you buy it
    if (tw.channel) { o.charm = r1(tw.channel / k); o.hold = tw.choirCharm || 1; }
    if (tw.punch) o.punch = Math.round(tw.punch * k);
    // the bell's headline pair: a level moves `rings`, never `freeze`
    if (tw.freezeDur) { o.freeze = tw.freezeDur; o.rings = r1(tw.cooldown / k); }
    // T44: a patch sells wading, so its headline is the stain curve it floors
    if (tw.dense) {
      o.crawl = Math.round((1 + (CFG.CREEP.slow - 1) * tw.dense) * 100);
      o.dps = r1(CFG.CREEP.dot * tw.dense);
    }
    if (tw.range < 500) o.range = tw.range;
  }
  if (prod) {
    const u = CFG.UNITS[prod.unit], per = prod.interval / k;
    // a stamping faction has no "breeds every": the comparable numbers are
    // what the assembly line pours into the press
    if (sim.faction(S, 'p').stamp) {
      o.massRate = r1(u.hp / per * CFG.STAMP.eff);
      o.dmgRate = r1(u.dps / per * CFG.STAMP.eff);
    } else {
      o.every = r1(per);
      o.unitHp = u.hp;
      o.unitDps = u.dps;
    }
  }
  if (type === 'guard') {
    o.guardHp = Math.round(CFG.UNITS.guard.hp * k);
    o.guardDps = r1(CFG.UNITS.guard.dps * k);
  }
  if (sim.demolishable(type)) o.hp = Math.round(CFG.TOWER_HP * k);
  return o;
}

function previewLines(slotIdx, type) {
  const slot = S.slots.p[slotIdx];
  if (type === 'cleanse') {
    return [{ text: 'purge all ' + (Math.round(slot.pips * 10) / 10) + ' larvae off it for '
      + CFG.CORRUPT.cleanseCost + ' gold', color: '#c9a0e8' }]
      .concat(statsLines(slot).map(t => ({ text: t })));
  }
  if (type === 'sell') {
    return [{ text: 'sell for +' + sim.sellRefund(S, slot) + ' gold', color: '#f0b0a0' }]
      .concat(statsLines(slot).map(t => ({ text: t })));
  }
  const cand = {
    type: type === 'lvl' ? slot.type : type,
    lvl: type === 'lvl' ? slot.lvl + 1 : 1,
    hp: 0, x: slot.x, y: slot.y,
  };
  cand.hp = CFG.TOWER_HP * sim.lvlPower(S, cand);
  const blurb = sim.faction(S, 'p').stamp && CFG.PRODUCTION[type]
    ? 'assembly line: pours mass into the press, never breeds' : DESC[type];
  const out = [{ text: blurb }].concat(statsLines(cand).map(t => ({ text: t })));
  if (slot.type) {
    const now = keyStats(slot.type, slot.lvl), next = keyStats(cand.type, cand.lvl);
    for (const key of Object.keys(STAT_LABELS)) {
      if (now[key] === undefined || next[key] === undefined || now[key] === next[key]) continue;
      const better = LOWER_BETTER.includes(key) ? next[key] < now[key] : next[key] > now[key];
      const [name, unit] = STAT_LABELS[key];
      out.push({
        text: name + ' ' + now[key] + unit + ' -> ' + next[key] + unit,
        color: better ? '#8ee06a' : '#e0a05a',
      });
    }
  }
  return out;
}

cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  ensureAudio();
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) / viewScale;
  const y = (e.clientY - rect.top) / viewScale;

  if (phase === 'menu') {
    if (inRect(x, y, SKIRMISH_BTN)) { phase = 'skirmish'; return; }
    if (inRect(x, y, EXPORT_BTN)) { exportReplays(); return; }
    for (let i = 0; i < LEVEL_NODES.length; i++) {
      const n = LEVEL_NODES[i];
      if (Math.hypot(x - n.x, y - n.y) < n.r + 8 && levelUnlocked(i)) {
        briefLevel = i;
        phase = 'brief';
        return;
      }
    }
    return;
  }
  if (phase === 'brief') {
    if (inRect(x, y, BRIEF_START)) { beginLevel(briefLevel); return; }
    phase = 'menu';
    return;
  }
  if (phase === 'skirmish') {
    for (const row of FACTION_ROWS) for (const c of row) {
      if (inRect(x, y, c)) { factionSel[c.side] = c.key; saveFactionSel(); return; }
    }
    for (const b of RUNG_BTNS) {
      if (inRect(x, y, b)) { setRung(b.key); return; }
    }
    for (const b of PERSONA_BTNS) {
      if (inRect(x, y, b)) { begin(b.key); return; }
    }
    phase = 'menu';              // tap anywhere else: back to the trail
    return;
  }
  if (phase === 'end') {
    if (mode === 'skirmish') { phase = 'skirmish'; return; }
    if (matchResult === 'VICTORY') { phase = 'menu'; }
    else { briefLevel = currentLevel; phase = 'brief'; }   // straight to retry
    return;
  }

  // build/upgrade/sell popup gets first claim on the tap. Nothing is ever
  // bought on a first tap: tap once to preview, tap the same button to commit.
  if (openSlot !== null) {
    for (const r of popupRects(openSlot)) {
      if (inRect(x, y, r)) {
        if (r.type !== pendingType) {
          pendingType = r.type;   // preview only
          blip(340, 0.04, 'triangle', 0.1);
          return;
        }
        const action = r.type === 'sell' || r.type === 'cleanse'
          ? { kind: r.type, slot: openSlot }
          : { kind: 'build', slot: openSlot, type: r.type };
        if (!sim.applyAction(S, 'p', action)) return;   // can't afford: stay open
        (r.type === 'sell' ? SFX.sell : r.type === 'cleanse' ? SFX.convert : SFX.build)();
        logAction(openSlot, r.type);
        openSlot = null;
        pendingType = null;
        return;
      }
    }
    // tapping another of your slots browses on; anything else closes
    for (let i = 0; i < S.slots.p.length; i++) {
      const s = S.slots.p[i];
      if (i !== openSlot && Math.hypot(x - s.x, y - s.y) < 30 && tappable(i)) {
        openSlot = i;
        pendingType = null;
        return;
      }
    }
    openSlot = null;
    pendingType = null;
    return;
  }

  for (let i = 0; i < S.slots.p.length; i++) {
    const s = S.slots.p[i];
    if (Math.hypot(x - s.x, y - s.y) < 30 && tappable(i)) {
      openSlot = i;
      pendingType = null;
      return;
    }
  }
});

// ------------------------------------------------------------- sim driver --
function advance(dtReal) {
  acc += dtReal;
  let guard = 8;                 // don't spiral after a background tab
  while (acc >= CFG.TICK && guard-- > 0 && !S.over) {
    const acts = enemyCtrl(S, 'e');
    if (acts) for (const a of acts) sim.applyAction(S, 'e', a);
    sim.step(S);
    acc -= CFG.TICK;
  }
  if (guard <= 0) acc = 0;

  for (const ev of S.events) {
    if (ev.type === 'frenzy') { banner('FRENZY! Income doubled'); SFX.frenzy(); }
    if (ev.type === 'decay') banner('SUDDEN DEATH! Hills are crumbling');
    if (ev.type === 'march' && ev.side === 'p') { drumFlash = 1; SFX.drum(); buzz(30); }
    if (ev.type === 'death') {
      poof(ev.x, ev.y, ev.side === 'p' ? '#4a3826' : '#b04a30', ev.big ? 14 : 5, ev.big ? 60 : 35);
    }
    if (ev.type === 'sell') poof(ev.x, ev.y, '#c8a060', 8, 40);
    if (ev.type === 'splat') {
      poof(ev.x, ev.y, ev.side === 'p' ? '#7a9458' : '#9a5878', 6, 28);
      stains.push({ x: ev.x, y: ev.y, r: 5 + Math.random() * 4, side: ev.side, a: 0.5 });
      if (stains.length > 90) stains.shift();
    }
    if (ev.type === 'digest') {
      const t = nearestNest(ev.side, ev.x, ev.y);
      for (let i = 0; i < 3; i++) {
        wisps.push({
          x: ev.x + (Math.random() - 0.5) * 8, y: ev.y + (Math.random() - 0.5) * 8,
          tx: t.x, ty: t.y, side: ev.side, t: 0, life: 1.1 + Math.random() * 0.5,
        });
      }
      if (wisps.length > 120) wisps.splice(0, wisps.length - 120);
    }
    if (ev.type === 'birth') poof(ev.x, ev.y, ev.side === 'p' ? '#9ec878' : '#c878a8', 8, 34);
    if (ev.type === 'stamp') {
      poof(ev.x, ev.y, '#c8d8e0', Math.min(20, 4 + ev.w * 2), 30 + ev.w * 4);
      if (ev.side === 'p' && ev.w >= CFG.STAMP.smashAt) banner('JUGGERNAUT stamped: ' + ev.w.toFixed(1) + 'x');
    }
    if (ev.type === 'punch') poof(ev.x, ev.y, '#d8dce8', 5, 26);
    if (ev.type === 'mortar') { poof(ev.x, ev.y, '#8a8274', 6, 30); SFX.mortar(); }
    if (ev.type === 'convert') {
      poof(ev.x, ev.y, '#c9a0e8', 10, 45);
      banner(ev.side === 'p' ? 'Enemy ant SEIZED!' : 'Your ant defected!');
      SFX.convert();
    }
    if (ev.type === 'implant') {
      poof(ev.x, ev.y, '#c9a0e8', 7, 26);
      // only the player's OWN nest gets a banner: their corruption is legible
      // from the violet crowns on the enemy slots, but a pip landing on their
      // side is the thing they can still act on
      if (ev.side === 'e') banner(ev.hill ? 'Your HILL is infested!' : 'A building of yours is INFESTED');
    }
    // T33: the flip's own moment. `side` is the nest that LOST the building, the
    // towerfall convention - a takeover reads as a loss from one side and a gift
    // from the other, and both are worth saying out loud.
    if (ev.type === 'flip') {
      poof(ev.x, ev.y, '#c9a0e8', 16, 55);
      poof(ev.x, ev.y, '#7a50a0', 9, 30);
      const what = (labelOf(ev.what, ev.side) || 'building').toLowerCase();
      banner(ev.side === 'p' ? 'Your ' + what + ' is a BROOD-HOST now!' : 'Enemy ' + what + ' is YOURS!');
      SFX.convert();
      if (ev.side === 'p') buzz([50, 40, 50]);
    }
    if (ev.type === 'revert') {
      poof(ev.x, ev.y, '#8a7a9a', 6, 30);
      banner(ev.side === 'p' ? 'Your ant shook off the grip!' : 'Enemy ant broke free!');
    }
    if (ev.type === 'towerfall') {
      poof(ev.x, ev.y, '#8a8274', 18, 70);
      poof(ev.x, ev.y, '#5d4630', 10, 45);
      const what = (labelOf(ev.what, ev.side) || 'building').toLowerCase();
      banner(ev.side === 'p' ? 'Your ' + what + ' is down!' : 'Enemy ' + what + ' DEMOLISHED!');
      SFX.towerfall();
      buzz(ev.side === 'p' ? [40, 40, 40] : 60);
    }
  }
  S.events.length = 0;

  // hill-crack feedback: flash when a hill is being chewed (beyond decay)
  const decayLoss = S.decay ? CFG.DECAY_RATE * dtReal : 0;
  for (const side of ['p', 'e']) {
    const chew = prevHP[side] - S.baseHP[side] - decayLoss;
    if (chew > 0.005) hillFlash[side] = Math.min(1, hillFlash[side] + chew * 0.25 + 0.15);
    hillFlash[side] = Math.max(0, hillFlash[side] - dtReal * 1.6);
    prevHP[side] = S.baseHP[side];
  }

  for (const p of parts) {
    p.x += p.vx * dtReal;
    p.y += p.vy * dtReal;
    p.vy += 60 * dtReal;
    p.ttl -= dtReal;
  }
  parts = parts.filter(p => p.ttl > 0);

  for (const w of wisps) w.t += dtReal / w.life;
  wisps = wisps.filter(w => w.t < 1);

  for (const b of banners) b.ttl -= dtReal;
  banners = banners.filter(b => b.ttl > 0);
  drumFlash = Math.max(0, drumFlash - dtReal * 1.5);

  const atCap = S.money.p >= CFG.GOLD_CAP - 0.5;
  fullFlash = Math.max(0, Math.min(2, fullFlash + (atCap ? 2 : -2) * dtReal));

  if (S.over) {
    matchResult = S.result === 'p' ? 'VICTORY' : (S.result === 'e' ? 'DEFEAT' : 'DRAW');
    if (matchResult === 'VICTORY') SFX.win(); else SFX.lose();
    earnedStars = 0;
    earnedUnlock = null;
    if (mode === 'campaign' && matchResult === 'VICTORY') {
      earnedStars = S.baseHP.p >= 200 ? 3 : (S.baseHP.p >= 100 ? 2 : 1);
      const L = pol.LEVELS[currentLevel];
      if ((stars[L.key] || 0) === 0 && L.reward) earnedUnlock = L.reward;
      if (earnedStars > (stars[L.key] || 0)) { stars[L.key] = earnedStars; saveStars(); }
    }
    finishReplay();
    phase = 'end';
  }
}

// ------------------------------------------------------------------ draw ---
function drawGround() {
  ctx.fillStyle = '#7a5c3e';
  ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(LANE_CX - LANE_HALF - 14, 0, LANE_CX + LANE_HALF + 14, 0);
  g.addColorStop(0, '#7a5c3e');
  g.addColorStop(0.2, '#96754f');
  g.addColorStop(0.8, '#96754f');
  g.addColorStop(1, '#7a5c3e');
  ctx.fillStyle = g;
  ctx.fillRect(LANE_CX - LANE_HALF - 14, 0, (LANE_HALF + 14) * 2, UI_TOP);
  ctx.fillStyle = 'rgba(0,0,0,1)';
  for (const p of pebbles) {
    ctx.globalAlpha = p.a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// the paint field: each side's intensity grid painted one canvas PIXEL per
// cell, then blown up with smoothing on - the browser's bilinear filter is a
// free metaball, so a 21x29 grid reads as spreading slime, not tiles.
const FLD = CFG.FIELD;
const fieldCv = document.createElement('canvas');
fieldCv.width = FLD.cols; fieldCv.height = FLD.rows;
const fieldCtx = fieldCv.getContext('2d');
const fieldImg = fieldCtx.createImageData(FLD.cols, FLD.rows);
const PAINT_RGB = { p: [104, 138, 72], e: [138, 62, 104] };
const LANE_C = sim.fieldCol({ cfg: CFG }, CFG.LANE_CX);
const rowWob = new Float64Array(FLD.rows);

// T13's pulse: the wave travels OUT of the fountain rows, foe-ward in front
// and home-ward behind, which is the transport the sim now runs. Amplitude
// swells in the lane columns so the eye is dragged down the road rather than
// reading the field as flat ms-paint colouring.
function paintWobble(side, time) {
  let mr = 0, n = 0;
  for (const s of S.slots[side]) {
    if (s.type === 'mat') { mr += sim.fieldRow(S, s.y); n++; }
  }
  const src = n ? mr / n : sim.fieldRow(S, sim.creepHome(S, side));
  for (let r = 0; r < FLD.rows; r++) {
    rowWob[r] = Math.sin(Math.abs(r - src) * 0.7 - time * 2.4);
  }
}

function drawCreep(time) {
  const x0 = FLD.cx0 - FLD.cellW / 2, y0 = FLD.cy0 - FLD.cellH / 2;
  const w = FLD.cols * FLD.cellW, h = FLD.rows * FLD.cellH;
  ctx.imageSmoothingEnabled = true;
  for (const side of ['p', 'e']) {
    if (S.fieldSum[side] <= 0) continue;
    paintWobble(side, time);
    const g = S.field[side], rgb = PAINT_RGB[side], d = fieldImg.data;
    for (let i = 0; i < g.length; i++) {
      const k = g[i];
      d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2];
      const amp = Math.abs((i % FLD.cols) - LANE_C) <= 1 ? 0.3 : 0.1;
      // gamma < 1 keeps a wispy edge without a floor: a trace cell is a
      // faint stain, deep paint is a solid murky core you can read at a
      // glance (a linear ramp made the whole field one flat haze)
      d[i * 4 + 3] = k <= 0 ? 0
        : 225 * Math.pow(k, 0.7) * (0.86 + rowWob[(i / FLD.cols) | 0] * amp);
    }
    fieldCtx.putImageData(fieldImg, 0, 0);
    ctx.drawImage(fieldCv, x0, y0, w, h);
  }
  for (const st of stains) {
    ctx.fillStyle = (st.side === 'p' ? 'rgba(110,140,80,' : 'rgba(150,70,110,') + st.a + ')';
    ctx.beginPath(); ctx.ellipse(st.x, st.y, st.r, st.r * 0.7, 0, 0, 7); ctx.fill();
  }
  // digested corpses: a bright bead of slime is dragged home, sagging on the
  // way. It carries a pale core because the same green on green paint was
  // invisible - this is the only tell that the digest happened at all.
  for (const w of wisps) {
    const at = f => {
      const e = f * f * (3 - 2 * f);
      return [w.x + (w.tx - w.x) * e, w.y + (w.ty - w.y) * e + Math.sin(f * Math.PI) * 9];
    };
    const [x, y] = at(w.t);
    const [px, py] = at(Math.max(0, w.t - 0.12));
    const a = 0.9 * (1 - w.t * w.t), r = 4.2 - 1.8 * w.t;
    ctx.strokeStyle = (w.side === 'p' ? 'rgba(120,180,70,' : 'rgba(180,70,120,') + a * 0.55 + ')';
    ctx.lineWidth = r * 0.9;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = (w.side === 'p' ? 'rgba(232,255,196,' : 'rgba(255,196,232,') + a + ')';
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.75, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(28,34,18,' + a * 0.7 + ')';    // rim: the bead has to read on its own paint too
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawMound(b, color, hole, flash) {
  const g = ctx.createRadialGradient(b.x, b.y - 8, 4, b.x, b.y, b.r);
  g.addColorStop(0, color);
  g.addColorStop(1, '#5d4630');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r, b.r * 0.72, 0, 0, 7); ctx.fill();
  if (flash > 0.02) {
    // cracks spider out while the hill is being chewed
    ctx.strokeStyle = 'rgba(255,90,50,' + (0.35 + 0.5 * flash) + ')';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 5; i++) {
      const a = i * 1.26 + 0.4;
      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(a) * b.r * 0.25, b.y + Math.sin(a) * b.r * 0.18);
      ctx.lineTo(b.x + Math.cos(a + 0.3) * b.r * 0.6, b.y + Math.sin(a + 0.3) * b.r * 0.45);
      ctx.lineTo(b.x + Math.cos(a + 0.1) * b.r * 0.95, b.y + Math.sin(a + 0.1) * b.r * 0.68);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,120,70,' + 0.16 * flash + ')';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r, b.r * 0.72, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = hole;
  ctx.beginPath(); ctx.ellipse(b.x, b.y - 6, b.r * 0.3, b.r * 0.2, 0, 0, 7); ctx.fill();
}

function drawAnt(u, time) {
  const body = u.side === 'p' ? '#1d150c' : '#a8321e';
  const dir = u.side === 'p' ? -1 : 1;
  const mustering = u.state === 'muster';
  ctx.save();
  // musters mill about a little so the gathering army looks alive
  const mx = mustering ? Math.sin(time * 1.7 + u.seed * 3) * 3 : 0;
  const my = mustering ? Math.cos(time * 1.3 + u.seed * 2) * 2 : 0;
  ctx.translate(u.x + mx, u.y + my);
  ctx.strokeStyle = body;
  ctx.lineWidth = 1;
  const biting = u.state === 'siege' || u.state === 'hunt';
  const wig = Math.sin(time * (biting ? 26 : mustering ? 8 : 18) + u.seed) * 2;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(-u.r - 2, i * u.r * 0.8 + wig * i);
    ctx.lineTo(u.r + 2, i * u.r * 0.8 - wig * i);
    ctx.stroke();
  }
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, dir * u.r * 1.2, u.r * 0.9, u.r * 1.1, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, u.r * 0.8, u.r * 0.9, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -dir * u.r * 1.5, u.r * 1.1, u.r * 1.4, 0, 0, 7); ctx.fill();
  if (u.typeKey === 'guard') {
    // gold thorax band: defenders read differently from attackers
    ctx.fillStyle = '#ffd870';
    ctx.beginPath(); ctx.arc(0, 0, u.r * 0.45, 0, 7); ctx.fill();
  } else if (u.typeKey === 'sapper') {
    // pale mandibles: the demolition crew
    ctx.strokeStyle = '#ffe9b0';
    ctx.lineWidth = 1.5;
    const hy = -dir * u.r * 2.3;
    ctx.beginPath();
    ctx.moveTo(-u.r * 0.7, hy + dir * u.r * 0.8); ctx.lineTo(0, hy);
    ctx.lineTo(u.r * 0.7, hy + dir * u.r * 0.8);
    ctx.stroke();
  } else if (u.typeKey === 'shambler') {
    // mossy back-spots: the creep's shambling drip
    ctx.fillStyle = u.side === 'p' ? '#8aa858' : '#c878a0';
    ctx.beginPath(); ctx.arc(0, dir * u.r * 1.2, u.r * 0.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -dir * u.r * 0.2, u.r * 0.4, 0, 7); ctx.fill();
  } else if (u.typeKey === 'slither') {
    // a long tapered body, and a WAKE behind it whose length is the haste it
    // is actually getting - the speed has to be visible or the building's
    // whole product is invisible
    ctx.fillStyle = u.side === 'p' ? '#a8c860' : '#e090b8';
    ctx.beginPath(); ctx.ellipse(0, dir * u.r * 0.6, u.r * 0.35, u.r * 1.9, 0, 0, 7); ctx.fill();
    const wake = (u.hasted || 1) - 1;
    if (wake > 0.02) {
      ctx.strokeStyle = u.side === 'p' ? 'rgba(168,200,96,0.5)' : 'rgba(224,144,184,0.5)';
      ctx.lineWidth = 1.4;
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * u.r * 0.5, dir * u.r * 2);
        ctx.lineTo(s * u.r * 1.3, dir * u.r * (2 + 9 * wake));
        ctx.stroke();
      }
    }
  } else if (u.typeKey === 'carrier') {
    // half-there: a violet cargo bead riding the thorax and a faint aura, and
    // NO mandible mark of any kind - the tell has to be "this one is not here
    // to fight", because a player who screens it like an attacker has wasted
    // the shots that were the actual counterplay
    const glow = 0.3 + 0.2 * Math.sin(time * 3 + u.seed);
    ctx.strokeStyle = 'rgba(186,140,232,' + glow + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, u.r * 2.4, 0, 7); ctx.stroke();
    ctx.fillStyle = u.side === 'p' ? '#c9a0e8' : '#e8a0d0';
    ctx.beginPath(); ctx.arc(0, 0, u.r * 0.6, 0, 7); ctx.fill();
  } else if (u.typeKey === 'grub') {
    // pale segment bands and no mandible mark: a sack that trundles
    ctx.strokeStyle = u.side === 'p' ? 'rgba(240,232,208,0.7)' : 'rgba(248,216,208,0.7)';
    ctx.lineWidth = 1.2;
    for (const i of [-0.6, 0.4, 1.4]) {
      ctx.beginPath();
      ctx.ellipse(0, dir * u.r * i, u.r * 0.7, u.r * 0.35, 0, 0, 7);
      ctx.stroke();
    }
  } else if (u.typeKey === 'product') {
    // riveted plates: FOUNDRY's product is stamped, not born, and a heavy one
    // reads as a juggernaut because its whole body scales with the press
    ctx.strokeStyle = u.side === 'p' ? '#b8c8d0' : '#e0b0a0';
    ctx.lineWidth = 1.2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-u.r * 0.7, i * u.r * 0.7); ctx.lineTo(u.r * 0.7, i * u.r * 0.7);
      ctx.stroke();
    }
    if (u.w >= CFG.STAMP.smashAt) {
      // the crush halo: this one walks through walls
      ctx.strokeStyle = 'rgba(255,180,90,0.35)';
      ctx.beginPath(); ctx.arc(0, 0, CFG.STAMP.smashR * 0.5, 0, 7); ctx.stroke();
    }
  } else if (u.typeKey === 'predator') {
    // rust pincers: the hunter
    ctx.strokeStyle = '#ff9068';
    ctx.lineWidth = 1.5;
    const hy = -dir * u.r * 2.5;
    ctx.beginPath();
    ctx.moveTo(-u.r * 0.9, hy + dir * u.r); ctx.quadraticCurveTo(-u.r * 0.5, hy - dir * u.r * 0.4, 0, hy);
    ctx.moveTo(u.r * 0.9, hy + dir * u.r); ctx.quadraticCurveTo(u.r * 0.5, hy - dir * u.r * 0.4, 0, hy);
    ctx.stroke();
  }
  if (u.charmT > 0) {
    // violet halo: a charmed ant reads as converted at a glance; the halo
    // thins as the charm wears off, so a fading grip is visible too
    ctx.strokeStyle = 'rgba(201,160,232,' + (0.35 + 0.5 * Math.min(1, u.charmT / 6)) + ')';
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.arc(0, 0, u.r * 2.1, 0, 7); ctx.stroke();
  }
  if (u.slowed) {
    ctx.strokeStyle = 'rgba(140,220,120,0.7)';
    ctx.beginPath(); ctx.arc(0, 0, u.r * 2.6, 0, 7); ctx.stroke();
  }
  if (u.frozen > 0) {
    // a frost shell, not a halo: a held ant must read as STOPPED rather than
    // as debuffed, since it looks identical to a live one otherwise
    ctx.fillStyle = 'rgba(200,225,255,0.32)';
    ctx.beginPath(); ctx.arc(0, 0, u.r * 1.9, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(226,240,255,0.85)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let s = 0; s < 3; s++) {
      const a = (s / 3) * Math.PI + 0.4;
      ctx.moveTo(-Math.cos(a) * u.r * 2, -Math.sin(a) * u.r * 2);
      ctx.lineTo(Math.cos(a) * u.r * 2, Math.sin(a) * u.r * 2);
    }
    ctx.stroke();
  }
  const t = CFG.UNITS[u.typeKey];
  const maxHp = u.maxHp || t.hp;
  if (maxHp > 20 && u.hp < maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(-9, -u.r * 3 - 4, 18, 3);
    ctx.fillStyle = '#7ec850';
    ctx.fillRect(-9, -u.r * 3 - 4, 18 * (u.hp / maxHp), 3);
  }
  ctx.restore();
}

function drawMushrooms(slot, side, spots) {
  for (const [dx, dy, r] of spots) {
    ctx.fillStyle = '#d8c9a3';
    ctx.fillRect(slot.x + dx - 2, slot.y + dy - 2, 4, 8);
    ctx.fillStyle = side === 'p' ? '#c07840' : '#b05868';
    ctx.beginPath(); ctx.ellipse(slot.x + dx, slot.y + dy - 4, r, r * 0.65, 0, 0, 7); ctx.fill();
  }
}

function drawEggs(slot, spots, eggColor) {
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  for (const [dx, dy, r] of spots) {
    ctx.fillStyle = eggColor;
    ctx.beginPath(); ctx.ellipse(slot.x + dx, slot.y + dy, r * 0.8, r, 0, 0, 7); ctx.fill();
    ctx.stroke();
  }
}

function drawSlot(slot, side, idx, time) {
  if (slot.type === null) {
    if (side === 'p') {
      ctx.strokeStyle = 'rgba(255,255,220,0.45)';
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, 20, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,220,0.55)';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+', slot.x, slot.y + 1);
    }
    return;
  }

  if (slot.type === 'farm') {
    drawMushrooms(slot, side, [[-8, 4, 7], [7, 6, 6], [0, -6, 8]]);
  } else if (slot.type === 'grove') {
    drawMushrooms(slot, side, [[-10, 5, 7], [9, 6, 7], [0, -7, 9], [-2, 9, 5]]);
  } else if (slot.type === 'plant') {
    drawMushrooms(slot, side, [[-12, 6, 7], [11, 7, 7], [-6, -8, 8], [7, -6, 8], [0, 10, 6]]);
    ctx.fillStyle = '#d8c9a3';
    ctx.fillRect(slot.x - 2, slot.y - 24, 4, 14);
    ctx.fillStyle = side === 'p' ? '#c07840' : '#b05868';
    ctx.beginPath(); ctx.ellipse(slot.x, slot.y - 26, 10, 6, 0, 0, 7); ctx.fill();
  } else if (slot.type === 'governor' || slot.type === 'redline') {
    // a farm with a brass gear bolted to it - the safe gear turns slowly and
    // steadily, the greedy one races and glows hot
    const red = slot.type === 'redline';
    drawMushrooms(slot, side, [[-9, 6, 6], [8, 7, 6]]);
    const spin = time * (red ? 2.6 : 0.8) * (side === 'p' ? 1 : -1);
    ctx.strokeStyle = red ? '#e08850' : '#c8b070';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(slot.x, slot.y - 9, 7, 0, 7); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = spin + i * Math.PI / 3;
      ctx.moveTo(slot.x + Math.cos(a) * 6, slot.y - 9 + Math.sin(a) * 6);
      ctx.lineTo(slot.x + Math.cos(a) * 11, slot.y - 9 + Math.sin(a) * 11);
    }
    ctx.stroke();
    if (red) {
      ctx.fillStyle = 'rgba(240,140,80,' + (0.25 + 0.2 * Math.sin(time * 5)) + ')';
      ctx.beginPath(); ctx.arc(slot.x, slot.y - 9, 5, 0, 7); ctx.fill();
    }
  } else if (slot.type === 'deep' || slot.type === 'relic') {
    // T45: a farm with the corruption drinking out of it. The violet fills with
    // what the tithe is worth right now, so the parasite economy has a face -
    // a chalice for the Deep Tithe, a reliquary crystal for the Reliquary.
    drawMushrooms(slot, side, [[-9, 6, 6], [8, 7, 6]]);
    const k = Math.min(1, sim.tithePips(S, side) / (CFG.CORRUPT.max * 4));
    ctx.strokeStyle = 'rgba(180,130,225,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(slot.x, slot.y - 9, 7, 0, 7); ctx.stroke();
    if (slot.type === 'deep') {
      ctx.fillStyle = 'rgba(160,90,210,' + (0.2 + 0.55 * k) + ')';
      ctx.beginPath(); ctx.arc(slot.x, slot.y - 9, 5.5, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(205,165,245,' + (0.3 + 0.5 * k) + ')';
      ctx.beginPath();
      ctx.moveTo(slot.x, slot.y - 16); ctx.lineTo(slot.x + 5, slot.y - 9);
      ctx.lineTo(slot.x, slot.y - 2); ctx.lineTo(slot.x - 5, slot.y - 9);
      ctx.closePath(); ctx.fill();
    }
  } else if (slot.type === 'mat') {
    // creep fountain: a mossy blob that visibly breathes as the mat grows
    const col = side === 'p' ? '110,140,80' : '150,70,110';
    const pulse = 1 + 0.08 * Math.sin(time * 2.4 + slot.x);
    ctx.fillStyle = 'rgba(' + col + ',0.35)';
    ctx.beginPath(); ctx.ellipse(slot.x, slot.y, 22 * pulse, 16 * pulse, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(' + col + ',0.85)';
    ctx.beginPath(); ctx.ellipse(slot.x, slot.y, 13, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(230,240,200,0.75)';
    for (const [dx, dy] of [[-5, -2], [4, 3], [1, -5], [-2, 4], [7, -3]]) {
      ctx.beginPath(); ctx.arc(slot.x + dx, slot.y + dy, 1.6, 0, 7); ctx.fill();
    }
  } else if (slot.type === 'hatch') {
    drawEggs(slot, [[-7, 3, 6], [7, 4, 6], [0, -5, 7]], '#e8e0cc');
  } else if (slot.type === 'swarmb') {
    drawEggs(slot, [[-10, 3, 4], [-3, 6, 4], [4, 2, 4], [10, 6, 4], [0, -5, 4], [-7, -4, 4], [7, -6, 4]], '#e8d8a8');
  } else if (slot.type === 'soldierb') {
    drawEggs(slot, [[-8, 4, 7], [8, 4, 7], [0, -6, 7]], '#d8c090');
  } else if (slot.type === 'majorb') {
    drawEggs(slot, [[0, 0, 13]], '#c8a878');
  } else if (slot.type === 'grubb') {
    // bloated pale eggs, packed in: this pit ships weight and nothing else
    drawEggs(slot, [[-9, 3, 8], [9, 3, 8], [0, -6, 8]], '#f0e8d0');
  } else if (slot.type === 'sapperb') {
    drawEggs(slot, [[-8, 4, 6], [8, 4, 6], [0, -5, 6]], '#e0c8a0');
    // pick-axe mandible mark on the brood
    ctx.strokeStyle = '#6a4a20';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(slot.x - 5, slot.y - 12); ctx.lineTo(slot.x, slot.y - 17); ctx.lineTo(slot.x + 5, slot.y - 12);
    ctx.stroke();
  } else if (slot.type === 'predatorb') {
    drawEggs(slot, [[-8, 4, 6], [8, 4, 6], [0, -5, 6]], '#e0b8a8');
    // paired fang mark: the hunter brood
    ctx.strokeStyle = '#a03828';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(slot.x - 6, slot.y - 17); ctx.lineTo(slot.x - 3, slot.y - 11);
    ctx.moveTo(slot.x + 6, slot.y - 17); ctx.lineTo(slot.x + 3, slot.y - 11);
    ctx.stroke();
  } else if (slot.type === 'hornb') {
    drawEggs(slot, [[-8, 4, 6], [8, 4, 6], [0, -5, 6]], '#d8c090');
    // curled war horn: this brood slows YOUR drum for heavier waves
    ctx.strokeStyle = '#8a6a30';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(slot.x, slot.y - 14, 6, Math.PI * 0.2, Math.PI * 1.4); ctx.stroke();
  } else if (slot.type === 'fifeb') {
    drawEggs(slot, [[-8, 4, 6], [8, 4, 6], [0, -5, 6]], '#c8d8c0');
    // triple quick-strokes: this brood quickens YOUR drum
    ctx.strokeStyle = '#5a7a50';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const dx of [-6, 0, 6]) { ctx.moveTo(slot.x + dx, slot.y - 18); ctx.lineTo(slot.x + dx + 3, slot.y - 10); }
    ctx.stroke();
  } else if (slot.type === 'oozeb') {
    drawEggs(slot, [[-8, 4, 6], [8, 4, 6], [0, -5, 6]], '#b8c8a0');
    // hanging drips: the den oozes shamblers with no drum
    ctx.strokeStyle = '#6a8a48';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const dx of [-5, 1, 6]) {
      ctx.moveTo(slot.x + dx, slot.y - 16);
      ctx.lineTo(slot.x + dx, slot.y - 10 + ((dx + 7) % 3));
    }
    ctx.stroke();
  } else if (slot.type === 'carrierb') {
    // one swollen violet sac: a cyst grows cargo, not soldiers
    drawEggs(slot, [[0, 2, 11]], '#c9a0e8');
    ctx.strokeStyle = 'rgba(201,160,232,' + (0.3 + 0.2 * Math.sin(time * 2)) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(slot.x, slot.y - 2, 15 + Math.sin(time * 2) * 2, 0, 7); ctx.stroke();
  } else if (slot.type === 'kiss') {
    // a violet bloom that OPENS on the pulse. Deliberately no reach ring: the
    // radius is measured between the FOE's slots, not from this building, so a
    // circle here would be a lie about where the plague can jump
    const per = CFG.CORRUPT.spreadEvery / sim.lvlPower(S, slot);
    const open = Math.max(0, 1 - (per - slot.cd) / 0.8);
    ctx.fillStyle = 'rgba(60,20,80,0.5)';
    ctx.beginPath(); ctx.ellipse(slot.x, slot.y, 17, 12, 0, 0, 7); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const a = time * 0.4 + i * Math.PI * 0.4;
      const len = 11 + 4 * open;
      ctx.fillStyle = 'rgba(201,160,232,' + (0.5 + 0.35 * open) + ')';
      ctx.beginPath();
      ctx.ellipse(slot.x + Math.cos(a) * len, slot.y - 3 + Math.sin(a) * len * 0.7,
        6.5, 3.4, a, 0, 7);
      ctx.fill();
    }
    ctx.fillStyle = '#f0d8ff';
    ctx.beginPath(); ctx.arc(slot.x, slot.y - 3, 4 + 1.5 * open, 0, 7); ctx.fill();
    // spores drift off on the pulse - the only cue that a spread just happened
    if (open > 0) {
      ctx.fillStyle = 'rgba(230,200,255,' + (0.6 * open) + ')';
      for (const [dx, dy] of [[-12, -10], [11, -12], [0, -16]]) {
        ctx.beginPath(); ctx.arc(slot.x + dx * (1.4 - open), slot.y + dy * (1.4 - open), 1.8, 0, 7); ctx.fill();
      }
    }
  } else if (slot.type === 'slitherb') {
    drawEggs(slot, [[-9, 4, 5], [0, 4, 5], [9, 4, 5]], '#a8c860');
    // three speed-streaks: this den ships tempo, not mass
    ctx.strokeStyle = '#7aa838';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const dy of [-18, -13, -8]) { ctx.moveTo(slot.x - 8, slot.y + dy); ctx.lineTo(slot.x + 8, slot.y + dy - 2); }
    ctx.stroke();
  } else {
    // tower family: stone mound base
    const g = ctx.createRadialGradient(slot.x, slot.y - 8, 3, slot.x, slot.y, 20);
    const top = { tower: '#b8b0a0', sharp: '#c8bca8', spit: '#b0a890', sap: '#9cc088', guard: '#c8b478', mortar: '#a89078', conv: '#b08cc8', dynamo: '#d0b070', coil: '#7ec4dc', rampart: '#a8a8b8', bell: '#c8a8e0', hall: '#9c78c0', thicket: '#84b258' }[slot.type];
    g.addColorStop(0, top);
    g.addColorStop(1, '#6e685c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(slot.x, slot.y, 19, 15, 0, 0, 7); ctx.fill();
    if (slot.type === 'tower') {
      ctx.fillStyle = '#2c2820';
      ctx.beginPath(); ctx.arc(slot.x, slot.y - 8, 4.5, 0, 7); ctx.fill();
    } else if (slot.type === 'sharp') {
      ctx.strokeStyle = '#3a342a';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(slot.x, slot.y - 4); ctx.lineTo(slot.x, slot.y - 26); ctx.stroke();
      ctx.fillStyle = '#2c2820';
      ctx.beginPath(); ctx.arc(slot.x, slot.y - 26, 3.5, 0, 7); ctx.fill();
    } else if (slot.type === 'spit') {
      ctx.fillStyle = '#2c2820';
      for (const dx of [-8, 0, 8]) {
        ctx.beginPath(); ctx.arc(slot.x + dx, slot.y - 6, 3.2, 0, 7); ctx.fill();
      }
    } else if (slot.type === 'sap') {
      ctx.strokeStyle = 'rgba(140,220,120,' + (0.25 + 0.15 * Math.sin(time * 3)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, CFG.TOWERS.sap.range * (0.9 + 0.06 * Math.sin(time * 3)), 0, 7); ctx.stroke();
      ctx.fillStyle = '#3a5c34';
      ctx.beginPath(); ctx.arc(slot.x, slot.y - 8, 4.5, 0, 7); ctx.fill();
    } else if (slot.type === 'thicket') {
      // the patch is the building: a soft disc of standing creep, then fronds.
      // Its whole product is GROUND, so the reach has to be the loud part.
      const R = CFG.TOWERS.thicket.range;
      const g2 = ctx.createRadialGradient(slot.x, slot.y, 8, slot.x, slot.y, R);
      g2.addColorStop(0, 'rgba(96,176,72,0.20)');
      g2.addColorStop(0.7, 'rgba(72,144,56,0.10)');
      g2.addColorStop(1, 'rgba(60,120,48,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, R, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(150,230,120,' + (0.22 + 0.10 * Math.sin(time * 1.6)) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, R * (0.97 + 0.02 * Math.sin(time * 1.6)), 0, 7); ctx.stroke();
      ctx.strokeStyle = '#3f6b2e';
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + (i - 2) * 0.42 + 0.08 * Math.sin(time * 2 + i);
        ctx.beginPath();
        ctx.moveTo(slot.x, slot.y - 2);
        ctx.lineTo(slot.x + Math.cos(a) * 16, slot.y - 2 + Math.sin(a) * 16);
        ctx.stroke();
      }
    } else if (slot.type === 'guard') {
      // banner pole marks the mustering point of the lane guards
      ctx.strokeStyle = '#6a5030';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(slot.x, slot.y - 2); ctx.lineTo(slot.x, slot.y - 24); ctx.stroke();
      ctx.fillStyle = '#ffd870';
      ctx.beginPath();
      ctx.moveTo(slot.x, slot.y - 24); ctx.lineTo(slot.x + 12, slot.y - 20); ctx.lineTo(slot.x, slot.y - 16);
      ctx.closePath(); ctx.fill();
    } else if (slot.type === 'mortar') {
      // fat barrel tilted toward the enemy
      const dir = side === 'p' ? -1 : 1;
      ctx.strokeStyle = '#2c2820';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(slot.x - 4, slot.y - 2);
      ctx.lineTo(slot.x + 5, slot.y - 2 + dir * 16);
      ctx.stroke();
      ctx.fillStyle = '#1c1814';
      ctx.beginPath(); ctx.arc(slot.x + 5, slot.y - 2 + dir * 16, 4.2, 0, 7); ctx.fill();
    } else if (slot.type === 'conv') {
      // hypnotic eye + faint reach ring: the charm zone stays readable
      ctx.strokeStyle = 'rgba(201,160,232,' + (0.14 + 0.08 * Math.sin(time * 2.2)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, CFG.TOWERS.conv.range, 0, 7); ctx.stroke();
      ctx.strokeStyle = '#ecdcf8';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(slot.x, slot.y - 8, 7.5, 4.5, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = '#7a4a9c';
      ctx.beginPath(); ctx.arc(slot.x, slot.y - 8, 2.8, 0, 7); ctx.fill();
    } else if (slot.type === 'dynamo') {
      // brass rotor: it literally spins faster the more it has wound up, so
      // the tell is the mechanism rather than a number floating over it
      const D = CFG.TOWERS.dynamo, spun = slot.spun || 1;
      const wound = (spun - 1) / (D.spinMax - 1), a = time * 2.4 * spun;
      ctx.strokeStyle = 'rgba(255,206,120,' + (0.3 + 0.55 * wound) + ')';
      ctx.lineWidth = 2.5;
      for (const off of [0, Math.PI]) {
        ctx.beginPath(); ctx.arc(slot.x, slot.y - 8, 7.5, a + off, a + off + 2.2); ctx.stroke();
      }
      ctx.fillStyle = '#2c2820';
      ctx.beginPath(); ctx.arc(slot.x, slot.y - 8, 3, 0, 7); ctx.fill();
    } else if (slot.type === 'coil') {
      // two electrode horns with a spark crawling between them: idle, it reads
      // as the thing that will jump - which is the whole shape of the mechanic
      ctx.strokeStyle = '#8ad4e8';
      ctx.lineWidth = 2;
      for (const dx of [-5, 5]) {
        ctx.beginPath();
        ctx.moveTo(slot.x + dx, slot.y - 2);
        ctx.lineTo(slot.x + dx * 1.3, slot.y - 12);
        ctx.stroke();
      }
      const j = Math.sin(time * 9) * 3;
      ctx.strokeStyle = 'rgba(190,240,255,' + (0.35 + 0.4 * Math.abs(Math.sin(time * 4.5))) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(slot.x - 6.5, slot.y - 12);
      ctx.lineTo(slot.x + j * 0.5, slot.y - 9 + j * 0.4);
      ctx.lineTo(slot.x + 6.5, slot.y - 12);
      ctx.stroke();
    } else if (slot.type === 'rampart') {
      // a ram head on a piston shaft, extended toward the foe on the beat: the
      // punch is invisible otherwise, and its reach ring says who is in trouble
      // the stroke is read straight off the drum phase, so it needs no state
      // and the player watches the ram wind back as the next beat approaches
      const rPer = sim.drumPeriod(S, side);
      const since = rPer === null ? 9 : rPer - (S.nextBeat[side] - S.t);
      const fx = Math.max(0, 1 - since / 0.45);
      const dir = side === 'p' ? -1 : 1, out = 6 + 8 * fx;
      ctx.strokeStyle = 'rgba(200,204,220,' + (0.1 + 0.3 * fx) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, CFG.TOWERS.rampart.range, 0, 7); ctx.stroke();
      ctx.strokeStyle = '#6a6a78';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(slot.x, slot.y - 4);
      ctx.lineTo(slot.x, slot.y - 4 + dir * out);
      ctx.stroke();
      ctx.fillStyle = '#d8dce8';
      ctx.beginPath(); ctx.ellipse(slot.x, slot.y - 4 + dir * out, 6, 3.5, 0, 0, 7); ctx.fill();
    } else if (slot.type === 'hall') {
      // a charmer's eye under three rising song-arcs. The arcs travel outward
      // slowly and never stop, because the choir is a standing state and not a
      // pulse - nothing about this building has a cooldown to read
      ctx.strokeStyle = 'rgba(201,160,232,' + (0.14 + 0.08 * Math.sin(time * 1.6)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, CFG.TOWERS.hall.range, 0, 7); ctx.stroke();
      for (let i = 0; i < 3; i++) {
        const ph = (time * 0.5 + i / 3) % 1;
        ctx.strokeStyle = 'rgba(246,232,255,' + (0.85 * (1 - ph)) + ')';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(slot.x, slot.y - 4, 9 + 13 * ph, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
      }
      ctx.strokeStyle = '#ecdcf8';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(slot.x, slot.y - 6, 7.5, 4.5, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = '#5c2c7c';
      ctx.beginPath(); ctx.arc(slot.x, slot.y - 6, 3.2, 0, 7); ctx.fill();
    } else if (slot.type === 'bell') {
      // a hanging bell whose ring expands outward on the pulse. `cd` counts
      // DOWN from the cooldown, so the phase is readable with no extra state -
      // and the expanding circle is the only cue that a freeze just landed
      const bSpec = CFG.TOWERS.bell;
      const since = bSpec.cooldown / sim.lvlPower(S, slot) - slot.cd;
      const fx = Math.max(0, 1 - since / 0.7);
      if (fx > 0) {
        ctx.strokeStyle = 'rgba(206,168,255,' + (0.55 * fx) + ')';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(slot.x, slot.y, bSpec.range * (1 - fx), 0, 7); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(176,140,200,0.16)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, bSpec.range, 0, 7); ctx.stroke();
      ctx.fillStyle = '#c8a8e0';
      ctx.beginPath();
      ctx.moveTo(slot.x - 6, slot.y - 3);
      ctx.quadraticCurveTo(slot.x, slot.y - 17, slot.x + 6, slot.y - 3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#6a4c86';
      ctx.beginPath(); ctx.arc(slot.x + Math.sin(time * 3) * 3, slot.y - 1.5, 1.8, 0, 7); ctx.fill();
    }
  }

  // T28 (SPICE.buildGate only): scaffolding. The building is drawn already, so
  // a scrim over it plus the countdown says "there but not working yet" without
  // a second art pass - and it stays visibly killable underneath.
  if (slot.buildT > 0) {
    ctx.fillStyle = 'rgba(10,12,16,0.55)';
    ctx.beginPath(); ctx.arc(slot.x, slot.y, 21, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,120,0.7)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(slot.x, slot.y, 21, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffdc78';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(slot.buildT.toFixed(1) + 's', slot.x, slot.y + 1);
  }

  // every building shows damage once chewed
  if (sim.demolishable(slot.type)) {
    const maxHp = CFG.TOWER_HP * Math.pow(CFG.LVL_POWER, slot.lvl - 1);
    if (slot.hp < maxHp - 0.5) {
      hpBar(slot.x - 14, slot.y + 12, 28, 4, Math.max(0, slot.hp) / maxHp, '#e0a040');
    }
  }

  // T30: corruption. Pips are the only state on a building that nothing on the
  // building itself shows, so they get their own violet crown above it - a
  // filled bead per pip against CORRUPT.max, because saturation is the number
  // that matters (T33 flips the slot at it).
  if (slot.pips > 0) {
    const max = CFG.CORRUPT.max, full = slot.pips >= max;
    ctx.strokeStyle = 'rgba(186,140,232,' + (full ? 0.85 : 0.45) + ')';
    ctx.lineWidth = full ? 2 : 1.2;
    ctx.beginPath(); ctx.arc(slot.x, slot.y, 23, 0, 7); ctx.stroke();
    for (let i = 0; i < max; i++) {
      const a = -Math.PI / 2 + (i - (max - 1) / 2) * 0.34;
      const px = slot.x + Math.cos(a) * 23, py = slot.y + Math.sin(a) * 23;
      ctx.fillStyle = i < slot.pips ? '#c9a0e8' : 'rgba(120,90,150,0.4)';
      ctx.beginPath(); ctx.arc(px, py, 2.4, 0, 7); ctx.fill();
    }
  }

  // T33: a building that has TURNED. The whole design is "the enemy nest goes
  // violet one building at a time", so this is a wash over the piece itself plus
  // a slow orbit - it has to read as ownership from across the board, not as one
  // more status pip on the crown.
  if (slot.flipped) {
    ctx.fillStyle = 'rgba(150,100,210,' + (0.24 + 0.08 * Math.sin(time * 2.2)) + ')';
    ctx.beginPath(); ctx.arc(slot.x, slot.y, 21, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(201,160,232,0.9)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.lineDashOffset = -time * 12;
    ctx.beginPath(); ctx.arc(slot.x, slot.y, 26, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
    ctx.fillStyle = '#e0c8f8';
    ctx.font = 'bold 9px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TURNED', slot.x, slot.y - 33);
  }

  // level pips
  if (slot.lvl > 1) {
    ctx.fillStyle = '#ffd870';
    for (let i = 0; i < slot.lvl; i++) {
      ctx.beginPath(); ctx.arc(slot.x - 8 + i * 8, slot.y + 20, 2.5, 0, 7); ctx.fill();
    }
  }

  // upgrade affordance for the player: any legal option they can pay for
  if (side === 'p' && S) {
    const opts = allowedOptions(idx);
    if (opts.length) {
      const cheapest = Math.min(...opts.map(t =>
        t === 'lvl' ? sim.lvlCost(S, slot) : sim.costOf(S, 'p', t)));
      if (S.money.p >= cheapest) {
        ctx.fillStyle = 'rgba(255,220,120,' + (0.5 + 0.3 * Math.sin(time * 4)) + ')';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('▲', slot.x, slot.y - 26);
      }
    }
  }
}

// T30: corruption in the mound. This is the one pip that eats hp on its own, so
// it gets a ring that tightens as the hill fills up - a hill losing 1.2 hp/s per
// pip with nothing visibly attacking it would otherwise be a mystery.
function drawHillPips(nest, pips, time) {
  if (!(pips > 0)) return;
  const k = Math.min(1, pips / CFG.CORRUPT.hillMax);
  ctx.strokeStyle = 'rgba(186,140,232,' + (0.3 + 0.45 * k) + ')';
  ctx.lineWidth = 1 + 2 * k;
  ctx.beginPath(); ctx.arc(nest.x, nest.y, nest.r + 6 - 4 * k + Math.sin(time * 2.5) * 1.5, 0, 7); ctx.stroke();
  const n = Math.ceil(pips);
  ctx.fillStyle = '#c9a0e8';
  for (let i = 0; i < n; i++) {
    const a = time * 0.4 + i * (Math.PI * 2 / n);
    ctx.beginPath();
    ctx.arc(nest.x + Math.cos(a) * (nest.r - 10), nest.y + Math.sin(a) * (nest.r - 10) * 0.8, 2.2, 0, 7);
    ctx.fill();
  }
}

function hpBar(x, y, w, h, frac, fg) {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fg;
  ctx.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * frac), h - 2);
}

function goldLabel(side) {
  return Math.floor(S.money[side]) + '/' + CFG.GOLD_CAP;
}
