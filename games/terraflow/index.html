<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1218">
  <title>Terraflow</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="map"></canvas>

    <div id="strip">
      <span id="strip-currency">⬢ 0</span>
      <span id="strip-rate">▲ 0/s</span>
    </div>

    <div id="hint"></div>
    <div id="popup"></div>

    <div id="sheet">
      <div id="sheet-handle">
        <span class="bar"></span>
        <span class="label">Upgrades</span>
      </div>
      <div id="upgrades"></div>
      <div id="sheet-footer">
        <button id="btn-reset">Reset save</button>
      </div>
    </div>

    <div id="endcard">
      <div class="end-box">
        <h2>Outpost stabilized</h2>
        <div class="sub">The flow hums on without you.</div>
        <div id="end-stats"></div>
        <div class="end-btns">
          <button id="btn-continue">Keep flowing</button>
          <button id="btn-restart">Restart</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/save.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
