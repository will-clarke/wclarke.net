<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a9c485">
<title>allotmatic</title>
<style>
:root {
  --bg: #9cba78;
  --panel: #f6edd8;
  --panel2: #ece0c4;
  --line: #d4c39e;
  --ink: #3a2a18;
  --dim: #7a6a50;
  --gold: #a6741a;
  --water: #2f7fc0;
  --green: #3e8e4f;
  --err: #b5443a;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; overflow: hidden; }
body {
  background: radial-gradient(120% 90% at 50% 0%, #b3cc8e 0%, var(--bg) 60%);
  color: var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  touch-action: none;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.dim { color: var(--dim); }

/* ---- top bar ---- */
#top {
  height: 46px; flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 14px; z-index: 6;
}
#coins { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 17px; }
#cart {
  font-size: 12px; color: var(--gold); font-variant-numeric: tabular-nums;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 9px; white-space: nowrap;
}
#selftending { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 15px; margin-right: auto; }
#gear { width: 40px; height: 40px; border-radius: 12px; font-size: 19px; color: var(--dim); display: grid; place-items: center; }
#gear:active { background: var(--panel); }

/* ---- board ---- */
#board { flex: 1; position: relative; min-height: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

/* ✓ / ✕ / ⟳ pills riding a parked ghost */
#ghostpills {
  position: absolute; display: none; gap: 8px; z-index: 7;
  transform: translate(-50%, -100%); pointer-events: auto;
}
#ghostpills.on { display: flex; }
#ghostpills button {
  width: 44px; height: 44px; border-radius: 50%; font-size: 19px;
  background: var(--panel); border: 1px solid var(--line);
  display: grid; place-items: center;
  box-shadow: 0 4px 14px rgba(80,60,30,0.28);
}
#confirm { border-color: var(--green); color: var(--green); }
#confirm:disabled { border-color: var(--line); color: var(--dim); opacity: 0.55; }
#cancel { color: var(--err); }
#rotate { border-color: var(--water); color: var(--water); }

/* toast */
#toast {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  max-width: 86vw; background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px;
  font-size: 13px; color: var(--ink); text-align: center; pointer-events: none;
  opacity: 0; transition: opacity 0.25s; z-index: 8;
}
#toast.on { opacity: 1; }

/* inspect tooltip */
#tip {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
  width: min(300px, 88vw); background: color-mix(in srgb, var(--panel) 95%, transparent);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; z-index: 5;
  display: none; box-shadow: 0 6px 24px rgba(80,60,30,0.32);
}
#tip.on { display: block; }
.tipname { font-weight: 700; font-size: 15px; }
.tipstage { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
.tipchecks { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
.chk { font-size: 12.5px; }
.chk.ok { color: var(--green); }
.chk.no { color: var(--err); }
.tiphint { color: var(--gold); font-size: 11px; margin-top: 8px; letter-spacing: 0.03em; }
.tipbtns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.tipbtn {
  flex: 1; min-width: 72px; padding: 9px 10px; border-radius: 10px; font-size: 12.5px;
  background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
}
.tipbtn:active { background: var(--line); }
.tipbtn.sell { border-color: var(--gold); color: var(--gold); }

/* ---- yard bar: pinned infrastructure chips under the top bar ---- */
#yardbar {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 0 12px 4px; z-index: 6;
}
.chip {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 10px; font-size: 12px; color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip:active { background: var(--panel2); }
.chip.full { border-color: var(--gold); color: var(--gold); }
#wellchip { touch-action: none; border-color: var(--water); color: var(--water); }

/* ---- tray: seed shelf + build/research ---- */
#tray {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  z-index: 6;
}
#shelf {
  flex: 1; display: flex; gap: 6px; overflow-x: auto; touch-action: pan-x;
  scrollbar-width: none; align-items: stretch; min-width: 0;
}
#shelf::-webkit-scrollbar { display: none; }
.packet {
  flex: none; width: 52px; min-height: 54px; border-radius: 12px; position: relative;
  background: var(--panel); border: 1px solid var(--line); touch-action: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: transform 0.08s, opacity 0.15s;
}
.packet:active { transform: scale(0.94); }
.packet.empty { opacity: 0.45; }
.packet .pname { font-size: 9px; letter-spacing: 0.02em; margin-top: 1px; }
.packet[data-n]::after {
  content: attr(data-n); position: absolute; top: 2px; right: 5px;
  font-size: 10px; color: var(--ink); font-variant-numeric: tabular-nums;
}
.tool {
  flex: none; width: 56px; height: 58px; border-radius: 16px; background: var(--panel);
  border: 1px solid var(--line); position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: transform 0.08s, border-color 0.08s;
}
.tool:active { transform: scale(0.92); }
.tool .tg { font-size: 20px; line-height: 1; }
.tool .tl { font-size: 9.5px; color: var(--dim); letter-spacing: 0.04em; }
.sparkle { animation: sparkle 0.9s ease; }
@keyframes sparkle { 0%,100% { box-shadow: 0 0 0 rgba(217,161,14,0); } 50% { box-shadow: 0 0 18px rgba(217,161,14,0.6); } }

/* seed packet popover (buy seeds) */
#pkpop {
  position: absolute; bottom: 8px; width: max-content; max-width: 86vw;
  background: color-mix(in srgb, var(--panel) 96%, transparent);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  display: none; z-index: 7; box-shadow: 0 5px 18px rgba(80,60,30,0.28);
}
#pkpop.on { display: block; }
.ppname { font-weight: 700; font-size: 13px; }
.ppinfo { font-size: 11px; color: var(--dim); margin-top: 3px; }
.ppbtns { display: flex; gap: 6px; margin-top: 8px; }
.ppbtns button {
  padding: 7px 10px; border-radius: 9px; font-size: 11.5px;
  background: var(--panel2); border: 1px solid var(--green); color: var(--ink);
}
.ppbtns button.no { border-color: var(--line); color: var(--dim); }
.ppbtns button.err { border-color: var(--err); }
.shape { display: grid; gap: 1px; justify-content: center; margin: 5px auto; }
.shape i { width: 5px; height: 5px; border-radius: 1px; display: block; }
.packet .shape { margin: 2px auto; }
.packet .shape i { width: 6px; height: 6px; }

/* ---- shop sheet ---- */
#scrim { position: absolute; inset: 0; background: rgba(70,55,30,0.45); z-index: 9; display: none; }
#scrim.on { display: block; }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 62%;
  background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 18px 18px 0 0; z-index: 10; transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.22,1,0.36,1); display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
#sheet.on { transform: translateY(0); }
#sheet.collapsed { transform: translateY(calc(100% - 44px)); }
#sheethead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
.tab { padding: 6px 12px; border-radius: 10px; color: var(--dim); font-size: 13px; }
.tab.sel { background: var(--panel2); color: var(--ink); }
#sheetclose { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; color: var(--dim); font-size: 18px; }
#sheetscroll { overflow-y: auto; padding: 0 14px 14px; }

/* tech tree: one row per branch, horizontal scroll of nodes */
#techpanel { display: flex; flex-direction: column; gap: 10px; padding: 8px 0; }
.branch { }
.brlabel { font-size: 12px; font-weight: 650; color: var(--dim); letter-spacing: 0.05em; margin-bottom: 6px; }
.brdone { color: var(--green); font-weight: 500; margin-left: 4px; }
.technode.branchdone { opacity: 0.5; width: 100px; display: grid; place-items: center; padding: 8px; }
.brrow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.brrow::-webkit-scrollbar { display: none; }
.technode {
  flex: none; width: 128px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 8px; text-align: center; position: relative;
}
.technode.own { opacity: 0.45; width: 86px; }
.technode.buy { border-color: var(--green); }
.technode.buy.bought { animation: bought 0.4s ease; }
@keyframes bought { 50% { box-shadow: 0 0 24px rgba(62,142,79,0.45); } }
.technode.next { opacity: 0.55; width: 104px; }
.technode.locked { opacity: 0.35; width: 70px; display: grid; place-items: center; }
.tnsil { display: grid; place-items: center; min-height: 34px; margin-bottom: 4px; font-size: 20px; }
.tnsil.dimsil { filter: grayscale(0.8); opacity: 0.6; }
.tnname { font-weight: 650; font-size: 12px; }
.tnowned { position: absolute; top: 6px; right: 8px; color: var(--green); font-size: 11px; }
.tnblurb { color: var(--dim); font-size: 10.5px; line-height: 1.35; margin: 4px 0 8px; min-height: 28px; }
.tnneeds { color: var(--dim); font-size: 10px; margin-top: 4px; font-style: italic; }
.tnbuy { width: 100%; padding: 8px; border-radius: 10px; background: color-mix(in srgb, var(--green) 16%, var(--panel2)); border: 1px solid var(--green); font-weight: 650; font-size: 12px; color: var(--ink); }
.tnbuy.no { background: var(--panel2); border-color: var(--line); color: var(--err); }
.bedsize { font-size: 10px; color: var(--dim); margin-left: 4px; }
.buildnote { grid-column: 1 / -1; font-size: 11px; text-align: center; padding: 2px 0 6px; }
.trackdone { padding: 20px; text-align: center; color: var(--gold); }

#buildpanel { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding: 8px 0; }
.buildcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; touch-action: none; }
.buildcard.broke { opacity: 0.5; }
.buildcard.info { border-color: var(--gold); }
.bcinfo { font-size: 10.5px; line-height: 1.35; margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
.bcinfo .dim { margin-top: 4px; font-size: 10px; }
.bcaura { min-height: 40px; display: grid; place-items: center; margin-bottom: 4px; }
.bcname { font-size: 12px; font-weight: 620; }
.bcown { font-size: 10px; color: var(--dim); }
.bcprice { font-size: 12px; margin-top: 3px; }
.bcprice.no { color: var(--err); }
.bglyph { font-size: 24px; }

.stock { grid-column: 1 / -1; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.stockhead { font-weight: 650; font-size: 13px; margin-bottom: 8px; }
.caps { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.cap { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.capl { width: 56px; color: var(--dim); }
.capbar { flex: 1; height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
.capfill { height: 100%; background: var(--water); }
.capfill.full { background: var(--gold); }
.capn { width: 54px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }

/* ---- settings ---- */
#settings {
  position: absolute; top: 46px; right: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; padding: 8px; z-index: 11;
  display: none; flex-direction: column; gap: 4px; min-width: 160px;
}
#settings.on { display: flex; }
#settings button { padding: 10px 12px; border-radius: 10px; text-align: left; font-size: 13px; }
#settings button:active { background: var(--panel2); }
#reset { color: var(--err); }

/* ---- offline sheet ---- */
#offline { position: absolute; inset: 0; background: rgba(70,55,30,0.65); z-index: 20; display: none; place-items: center; }
#offline.on { display: grid; }
#offcard { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 28px 26px; width: min(320px, 88vw); text-align: center; }
#offlinetime { font-size: 22px; font-weight: 700; }
#offlinebody { margin: 16px 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
#collect { width: 100%; padding: 14px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 20%, var(--panel2)); border: 1px solid var(--gold); font-weight: 700; font-size: 16px; }

/* ---- finale ---- */
body.finale #top, body.finale #yardbar, body.finale #tray, body.finale #lens, body.finale #tip { opacity: 0; transition: opacity 2s; pointer-events: none; }
#finale { position: absolute; inset: 0; z-index: 21; display: none; place-items: center; background: rgba(255,246,220,0.45); }
#finale.on { display: grid; animation: fadein 2s ease; }
@keyframes fadein { from { opacity: 0; } }
#finalecard { text-align: center; }
#finalecard h1 { font-size: 26px; font-weight: 300; letter-spacing: 0.12em; color: var(--gold); filter: drop-shadow(0 0 18px rgba(217,161,14,0.45)); }
#finalecard p { color: var(--dim); margin-top: 14px; font-size: 13px; }

@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; } }
</style>
</head>
<body>
  <div id="top">
    <span id="coins">🪙 0</span>
    <span id="cart" style="display:none"></span>
    <span id="selftending">✨ 0/0</span>
    <button id="gear" aria-label="settings">⚙</button>
  </div>

  <div id="yardbar">
    <button id="wellchip" class="chip">💧 well</button>
    <button id="barrowchip" class="chip">🛒 0/0</button>
    <button id="presschip" class="chip" style="display:none">⚙ press</button>
    <button id="compostchip" class="chip" style="display:none">🍂 0/0</button>
  </div>

  <div id="board">
    <canvas id="c"></canvas>
    <div id="toast"></div>
    <div id="tip"></div>
    <div id="ghostpills">
      <button id="rotate" aria-label="rotate">⟳</button>
      <button id="confirm" aria-label="confirm">✓</button>
      <button id="cancel" aria-label="cancel">✕</button>
    </div>
    <div id="pkpop"></div>
  </div>

  <div id="tray">
    <div id="shelf"></div>
    <button class="tool" id="t-build"><span class="tg">🔨</span><span class="tl">build</span></button>
    <button class="tool" id="t-research"><span class="tg">📜</span><span class="tl">research</span></button>
  </div>

  <div id="settings">
    <button id="sfx">Sound: on</button>
    <button id="music">Music: on</button>
    <button id="haptics">Haptics: on</button>
    <button id="reset">Reset save</button>
  </div>

  <div id="scrim"></div>
  <div id="sheet">
    <div id="sheethead">
      <button class="tab sel" data-tab="tech">Research</button>
      <button class="tab" data-tab="build">Build</button>
      <button id="sheetclose" aria-label="close">✕</button>
    </div>
    <div id="sheetscroll">
      <div id="techpanel"></div>
      <div id="buildpanel" style="display:none"></div>
    </div>
  </div>

  <div id="offline">
    <div id="offcard">
      <div id="offlinetime">Away</div>
      <div id="offlinebody"></div>
      <button id="collect">Collect</button>
    </div>
  </div>

  <div id="finale">
    <div id="finalecard">
      <h1>the allotment tends itself</h1>
      <p>tap to keep tending</p>
    </div>
  </div>
