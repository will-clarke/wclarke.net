<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#171420">
<title>voicebox</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overscroll-behavior:none; }
  body {
    background:#171420; color:#f2ead9;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center;
  }
  .screen { width:100%; max-width:520px; min-height:100dvh; padding:max(14px, env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
  [hidden] { display:none !important; }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  /* ---- menu ---- */
  #menu h1 { font-size:34px; letter-spacing:0.28em; font-weight:800; margin-top:22px; text-align:center; }
  #menu h1 span { color:#ffb648; }
  #menu .tag { text-align:center; color:#8f87a3; margin:10px 0 6px; font-size:14px; }
  #menu .chap { text-align:center; color:#5f5876; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; margin-bottom:18px; }
  #grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sect { grid-column:1/-1; color:#5f5876; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; text-align:center; margin:8px 0 0; }
  .card { background:#221e30; border:1px solid #2f2942; border-radius:14px; padding:12px 12px 10px; text-align:left; min-height:86px; display:flex; flex-direction:column; gap:3px; }
  .card:active { background:#2a2540; }
  .card .num { color:#5f5876; font-size:11px; letter-spacing:0.15em; }
  .card .nm { font-weight:700; font-size:15px; }
  .card .pg { color:#8f87a3; font-size:12px; }
  .card .bs { font-size:12px; margin-top:auto; color:#8f87a3; }
  .card .bs.perfect { color:#ffd97a; font-weight:700; }
  .card .bs.done { color:#3ec9b8; }
  .card.locked { opacity:0.38; }
  #menu .foot { text-align:center; color:#5f5876; font-size:12px; margin-top:auto; padding-top:22px; }

  /* ---- play ---- */
  #top { display:flex; align-items:center; gap:8px; }
  #top .icon { width:42px; height:42px; border-radius:12px; background:#221e30; border:1px solid #2f2942; font-size:19px; color:#c9c2d8; display:flex; align-items:center; justify-content:center; }
  #top .icon:active { background:#2a2540; }
  #ltitle { flex:1; text-align:left; padding-left:4px; }
  #ltitle .n { color:#5f5876; font-size:11px; letter-spacing:0.15em; }
  #ltitle .t { font-weight:700; font-size:16px; }

  #strip { display:flex; justify-content:center; align-items:center; gap:5px; margin:16px 0 4px; flex-wrap:wrap; }
  .chip { background:#221e30; border:1px solid #2f2942; border-radius:10px; padding:6px 9px; font-size:13px; font-weight:700; color:#5f5876; transition:all .2s; }
  .chip.locked { color:#f2ead9; border-color:#3a3355; }
  .chip.cur { color:#ffb648; border-color:#ffb648; box-shadow:0 0 12px #ffb64833; }
  .arrow { color:#4a4362; font-size:12px; }

  #hud { text-align:center; color:#8f87a3; font-size:13px; height:20px; margin-bottom:2px; }
  #hud b { color:#f2ead9; font-weight:700; }

  #targ { text-align:center; margin:10px 0 14px; min-height:96px; }
  #targ .lead { color:#5f5876; font-size:11px; letter-spacing:0.24em; text-transform:uppercase; }
  #targ .sym { font-size:58px; font-weight:800; line-height:1.15; }
  #targ .sym.gold { color:#ffd97a; }
  #targ .lets { color:#8f87a3; font-size:16px; letter-spacing:0.1em; }
  #targ .cap { color:#ffb648; font-size:13px; height:18px; }

  /* ---- codex ---- */
  #codexbtn { display:block; margin:16px auto 0; padding:11px 20px; border-radius:12px;
    background:#221e30; border:1px solid #3a3355; font-weight:700; font-size:14px; color:#ffb648; }
  #codexbtn:active { background:#2a2540; }
  #codex .icon { width:42px; height:42px; border-radius:12px; background:#221e30; border:1px solid #2f2942; font-size:19px; color:#c9c2d8; display:flex; align-items:center; justify-content:center; }
  .cxhint { text-align:center; color:#5f5876; font-size:12px; margin:12px 0 4px; }
  .ptext { color:#c9c2d8; font-size:13px; line-height:1.55; }
  .ptext p { margin:0 0 9px; }
  .ptext b { color:#ffb648; font-weight:700; }
  .dgl2 { color:#8f87a3; font-size:11px; margin:1px 0 5px; }
  .dgl2 b { color:#f2ead9; }
  .mini + .mini { margin-top:8px; }
  #cards { display:flex; flex-direction:column; gap:12px; margin-top:8px; padding-bottom:20px; }
  .ccard { background:#221e30; border:1px solid #2f2942; border-radius:16px; padding:14px; }
  .ccard.dim { opacity:0.35; }
  .ccard .hd { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  .ccard .hd .s { font-size:26px; font-weight:800; }
  .ccard .hd .l { color:#8f87a3; font-size:13px; }
  .ccard .hd .n { margin-left:auto; color:#5f5876; font-size:12px; letter-spacing:0.08em; }
  .ccard .row { display:flex; gap:10px; align-items:stretch; }
  .ccard svg { display:block; }
  .ccard .dg { background:#1a1626; border-radius:10px; padding:6px; }
  .ccard .dg:active { background:#241f36; }
  .ccard .dgl { text-align:center; color:#5f5876; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; margin-top:2px; }

  #kbwrap { position:relative; }
  #kb { width:100%; display:block; border-radius:14px; touch-action:none; }
  #playhint { text-align:center; color:#4a4362; font-size:12px; margin-top:12px; }
</style>
</head>
<body>

<div id="menu" class="screen">
  <h1>VOICE<span>BOX</span></h1>
  <div class="tag">spell the chord. move your fingers as little as you can.</div>
  <div id="grid"></div>
  <button id="codexbtn"></button>
  <div class="foot">sound on 🔊 · inversions are the cheap answer</div>
</div>

<div id="codex" class="screen" hidden>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="icon" id="cxback">‹</button>
    <div style="flex:1;padding-left:4px;">
      <div style="color:#5f5876;font-size:11px;letter-spacing:0.15em;">CHORD CODEX</div>
      <div style="font-weight:700;font-size:16px;">every chord, three ways</div>
    </div>
  </div>
  <div class="cxhint">tap any diagram to hear it</div>
  <div id="cards"></div>
</div>

<div id="play" class="screen" hidden>
  <div id="top">
    <button class="icon" id="back">‹</button>
    <div id="ltitle"><div class="n"></div><div class="t"></div></div>
    <button class="icon" id="help">?</button>
    <button class="icon" id="undo">↶</button>
    <button class="icon" id="reset">⟳</button>
  </div>
  <div id="strip"></div>
  <div id="hud"></div>
  <div id="targ">
    <div class="lead">spell</div>
    <div class="sym"></div>
    <div class="lets"></div>
    <div class="cap"></div>
  </div>
  <div id="kbwrap"><canvas id="kb"></canvas></div>
  <div id="playhint">drag a dot to a key · or tap a dot, then a key</div>
</div>

<script>
'use strict';
/* ================= data ================= */
const NOTE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const CHORDS = {
  C:  { root:0, pcs:[0,4,7],  long:'C major' },
  F:  { root:5, pcs:[5,9,0],  long:'F major' },
  G:  { root:7, pcs:[7,11,2], long:'G major' },
  Am: { root:9, pcs:[9,0,4],  long:'A minor' },
  Em: { root:4, pcs:[4,7,11], long:'E minor' },
  Cmaj7: { root:0, pcs:[0,4,7,11],  long:'C major seventh' },
  Dm7:   { root:2, pcs:[2,5,9,0],   long:'D minor seventh' },
  Em7:   { root:4, pcs:[4,7,11,2],  long:'E minor seventh' },
  Fmaj7: { root:5, pcs:[5,9,0,4],   long:'F major seventh' },
  G7:    { root:7, pcs:[7,11,2,5],  long:'G dominant seventh' },
  Am7:   { root:9, pcs:[9,0,4,7],   long:'A minor seventh' },
  E7:    { root:4, pcs:[4,8,11,2],  long:'E dominant seventh' },
};
const RANGE = [59, 76]; // B3..E5 (levels may override)
// a target may pin the bass: 'G/B'; 'X/rootOfX' displays plain but locks the bass
function parseTarget(t) {
  const [s, b] = t.split('/');
  return { sym:s, pcs:CHORDS[s].pcs, root:CHORDS[s].root, bass: b != null ? NOTE.indexOf(b) : null };
}
function dispTarget(t) {
  const p = parseTarget(t);
  return (p.bass == null || p.bass === p.root) ? p.sym : p.sym + '/' + NOTE[p.bass];
}
// pars verified by lab/solve.mjs - the harness is ground truth
const LEVELS = [
  { name:'first shape', prog:['C'],                  scatter:[62,66,71], hint:true,
    blurb:'cover all three letters' },
  { name:'two shapes',  prog:['F','G'],              scatter:[60,68,73],
    blurb:'no ghost lights this time' },
  { name:'the pivot',   prog:['C','G'],              start:[60,64,67], par:3 },
  { name:'lean',        prog:['C','F'],              start:[60,64,67], par:3 },
  { name:'the twin',    prog:['C','Am'],             start:[60,64,67], par:2 },
  { name:'round trip',  prog:['C','F','G','C'],      start:[60,64,67], par:12 },
  { name:'the fifties', prog:['C','Am','F','G'],     start:[60,64,67], par:9 },
  { name:'homeward',    prog:['C','G','Am','F','C'], start:[60,64,67], par:12 },
  // ---- chapter two: name the shapes ----
  { name:'three doors', prog:['C/C','C/E','C/G'],    start:[60,64,67], par:24 },
  { name:'the shadow',  prog:['C','Em','Am','F'],    start:[60,64,67], par:5 },
  { name:'the walkdown',prog:['C/C','G/B','Am/A','C/G','F/F'], start:[60,64,67], par:19,
    range:[53,76] },
  { name:'canon',       prog:['C/C','G/B','Am/A','Em/G','F/F','G/G'], start:[60,64,67], par:27,
    range:[53,76] },
  // ---- chapter three: four fingers ----
  { name:'the seventh', prog:['Cmaj7','G7'],  scatter:[61,63,68,74], hint:true,
    blurb:'four fingers now - one more third on top' },
  { name:'two and five',prog:['Cmaj7','Dm7','G7'],          start:[60,64,67,71], par:9,  range:[59,76] },
  { name:'the collapse',prog:['Cmaj7','G7','Cmaj7'],        start:[60,64,67,71], par:6,  range:[59,76] },
  { name:'two five one',prog:['Cmaj7','Dm7','G7','Cmaj7'],  start:[60,64,67,71], par:12, range:[60,72] },
  { name:'the circle',  prog:['Cmaj7','Em7','Am7','Dm7','G7','Cmaj7'], start:[60,64,67,71], par:20, range:[60,74] },
  { name:'royal road',  prog:['Cmaj7','Fmaj7','G7','Em7','Am7'], start:[60,64,67,71], par:16, range:[60,74] },
  { name:'the borrowed note', prog:['Am7','Dm7','E7','Am7'], start:[57,60,64,67], par:12, range:[55,76] },
];
const CHAPTERS = [
  { at:0, label:'chapter one · triads' },
  { at:8, label:'chapter two · name the shapes' },
  { at:12, label:'chapter three · four fingers' },
];
const FCOL = ['#ff6b5e', '#3ec9b8', '#ffb648', '#b48cff']; // finger dot colours

/* ================= persistence ================= */
const SKEY = 'voicebox-v1';
let save = { best:{} };
try { const s = JSON.parse(localStorage.getItem(SKEY)); if (s && s.best) save = s; } catch (e) {}
// migrate index-keyed saves (pre-ch3) to name keys, so inserting levels never shifts progress
if (Object.keys(save.best).some((k) => /^\d+$/.test(k))) {
  const nb = {};
  for (const [k, v] of Object.entries(save.best)) {
    if (/^\d+$/.test(k)) { if (LEVELS[+k]) nb[LEVELS[+k].name] = v; }
    else nb[k] = v;
  }
  save.best = nb;
  persist();
}
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(save)); } catch (e) {} }
const best = (i) => save.best[LEVELS[i].name];
const unlocked = (i) => i === 0 || !!best(i - 1) || !!best(i);

/* ================= music helpers ================= */
function perms(n) {
  if (n === 1) return [[0]];
  const out = [];
  for (const p of perms(n - 1))
    for (let i = 0; i < n; i++) out.push([...p.slice(0, i), n - 1, ...p.slice(i)]);
  return out;
}
const PERMS = { 3: perms(3), 4: perms(4) };
function matchCost(a, b) { // returns {cost, map} map[i]=index in a matched to b[i]
  let best = Infinity, map = null;
  for (const p of PERMS[a.length]) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += Math.abs(a[p[i]] - b[i]);
    if (s < best) { best = s; map = p; }
  }
  return { cost: best, map };
}
function invName(sym, v) {
  const low = Math.min(...v) % 12;
  return low === CHORDS[sym].root ? sym : sym + '/' + NOTE[low];
}
function invCaption(sym, v) {
  const { pcs } = CHORDS[sym];
  const low = Math.min(...v) % 12;
  return ['root position', 'first inversion', 'second inversion', 'third inversion'][pcs.indexOf(low)];
}
const fq = (m) => 440 * Math.pow(2, (m - 69) / 12);

/* ================= audio (bop recipes) ================= */
let AC = null, master = null, noiseBuf = null;
function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});
function audition(m) {
  const ac = audio(), t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = fq(m);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.15, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.45);
}
function pad(m, t, dur, peak, dest) {
  const ac = AC;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.4;
  lp.frequency.setValueAtTime(2200, t);
  lp.frequency.exponentialRampToValueAtTime(900, t + Math.max(dur, 0.3));
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.05);
  g.gain.setTargetAtTime(peak * 0.75, t + 0.06, 0.4);
  g.gain.setTargetAtTime(0.0001, t + dur, 0.22);
  lp.connect(g); g.connect(dest || master);
  for (const d of [-7, 7]) {
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.value = fq(m); o.detune.value = d;
    o.connect(lp); o.start(t); o.stop(t + dur + 1.4);
  }
}
function strum(v) {
  const ac = audio(), t = ac.currentTime;
  v.slice().sort((a, b) => a - b).forEach((m, i) => pad(m, t + i * 0.05, 1.25, 0.1));
}
function bassNote(m, t, dur, dest) {
  const ac = AC;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.2, t + 0.02);
  g.gain.setTargetAtTime(0.0001, t + dur * 0.7, 0.12);
  g.connect(dest || master);
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = fq(m);
  o.connect(g); o.start(t); o.stop(t + dur + 0.5);
  const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = fq(m + 12);
  const g2 = ac.createGain(); g2.gain.value = 0.3;
  o2.connect(g2); g2.connect(g); o2.start(t); o2.stop(t + dur + 0.5);
}
function kick(t, dest) {
  const ac = AC;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + 0.35);
}
function hat(t, dest, vol) {
  const ac = AC;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  s.connect(hp); hp.connect(g); g.connect(dest || master); s.start(t); s.stop(t + 0.08);
}

/* ================= keyboard geometry ================= */
const cv = document.getElementById('kb');
const ctx = cv.getContext('2d');
let KB = null; // {W,H,keys:[{m,black,x,w,y,h}],byMidi:{}}
const isBlack = (m) => NOTE[m % 12].includes('#');
function layoutKB() {
  const cssW = cv.clientWidth;
  const cssH = Math.min(260, Math.max(190, Math.round(window.innerHeight * 0.32)));
  const dpr = window.devicePixelRatio || 1;
  cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const R = (G && G.lv.range) || RANGE;
  const whites = [];
  for (let m = R[0]; m <= R[1]; m++) if (!isBlack(m)) whites.push(m);
  const ww = cssW / whites.length, bw = ww * 0.6, bh = cssH * 0.58;
  const keys = [], byMidi = {};
  whites.forEach((m, i) => {
    const k = { m, black:false, x:i * ww, w:ww, y:0, h:cssH };
    keys.push(k); byMidi[m] = k;
  });
  for (let m = R[0]; m <= R[1]; m++) if (isBlack(m)) {
    const li = whites.indexOf(m - 1);
    const k = { m, black:true, x:(li + 1) * ww - bw / 2, w:bw, y:0, h:bh };
    keys.push(k); byMidi[m] = k;
  }
  KB = { W:cssW, H:cssH, keys, byMidi, bh };
}
function hitKey(x, y) {
  for (const k of KB.keys) if (k.black && y < k.h && x >= k.x && x < k.x + k.w) return k.m;
  for (const k of KB.keys) if (!k.black && x >= k.x && x < k.x + k.w) return k.m;
  return null;
}
function keyCenter(m) {
  const k = KB.byMidi[m];
  return k.black ? { x:k.x + k.w / 2, y:k.h * 0.62 } : { x:k.x + k.w / 2, y:KB.H * 0.8 };
}

/* ================= game state ================= */
let G = null;
const $ = (s) => document.querySelector(s);
const menuEl = $('#menu'), playEl = $('#play'), codexEl = $('#codex');

function startLevel(li) {
  const lv = LEVELS[li];
  G = {
    li, lv,
    fingers: (lv.scatter || lv.start).slice(),
    locked: lv.par != null ? [lv.start.slice()] : [],
    costs: [],
    busy: false, done: false, sel: null, drag: null,
    effects: [], flash: {}, playback: null,
  };
  menuEl.hidden = true; codexEl.hidden = true; playEl.hidden = false;
  restoreHint();
  layoutKB();
  $('#ltitle .n').textContent = 'LEVEL ' + (li + 1);
  $('#ltitle .t').textContent = lv.name;
  renderStrip(); renderTarget();
}
const curTarget = () => G.lv.prog[G.locked.length];

function renderStrip() {
  const el = $('#strip'); el.innerHTML = '';
  G.lv.prog.forEach((t, i) => {
    if (i) { const a = document.createElement('span'); a.className = 'arrow'; a.textContent = '→'; el.appendChild(a); }
    const c = document.createElement('span'); c.className = 'chip';
    if (i < G.locked.length) { c.classList.add('locked'); c.textContent = invName(parseTarget(t).sym, G.locked[i]); }
    else if (i === G.locked.length && !G.done) { c.classList.add('cur'); c.textContent = dispTarget(t); }
    else c.textContent = dispTarget(t);
    el.appendChild(c);
  });
  const hud = $('#hud');
  if (G.lv.par != null) {
    const total = G.costs.reduce((a, b) => a + b, 0);
    hud.innerHTML = 'cost <b>' + total + '</b> · par ' + G.lv.par;
  } else hud.textContent = G.lv.blurb || '';
}
function renderTarget() {
  const tg = curTarget();
  const t = $('#targ');
  if (!tg) return;
  const p = parseTarget(tg);
  t.querySelector('.lead').textContent = 'spell';
  const se = t.querySelector('.sym'); se.textContent = dispTarget(tg); se.classList.remove('gold');
  t.querySelector('.lets').textContent = p.pcs.map((pc) => NOTE[pc]).join(' · ');
  t.querySelector('.cap').textContent = p.bass != null ? NOTE[p.bass] + ' in the bass' : '';
}
function showLockedTarget(sym, v) {
  const t = $('#targ');
  t.querySelector('.lead').textContent = 'locked';
  const se = t.querySelector('.sym'); se.textContent = invName(sym, v); se.classList.add('gold');
  t.querySelector('.lets').textContent = v.slice().sort((a, b) => a - b)
    .map((m) => NOTE[m % 12] + (Math.floor(m / 12) - 1)).join(' · ');
  t.querySelector('.cap').textContent = invCaption(sym, v);
}

/* ================= spelling & locking ================= */
function spelled() {
  const t = curTarget(); if (!t) return false;
  const p = parseTarget(t);
  if (G.fingers.length !== p.pcs.length) return false;
  const have = G.fingers.map((m) => m % 12).sort((a, b) => a - b).join(',');
  const want = p.pcs.slice().sort((a, b) => a - b).join(',');
  if (have !== want || new Set(G.fingers).size !== G.fingers.length) return false;
  return p.bass == null || Math.min(...G.fingers) % 12 === p.bass;
}
function checkSpell() {
  if (!G || G.busy || G.done || G.playback) return;
  if (spelled()) lock();
}
function lock() {
  const sym = parseTarget(curTarget()).sym;
  const v = G.fingers.slice().sort((a, b) => a - b);
  const prev = G.locked[G.locked.length - 1];
  G.busy = true; G.sel = null;
  if (prev) {
    const { cost, map } = matchCost(prev, v);
    G.costs.push(cost);
    const now = performance.now();
    v.forEach((m, i) => {
      const d = Math.abs(m - prev[map[i]]);
      if (d === 0) G.flash[m] = { t0: now, col: '#ffd97a' };
      else {
        const c = keyCenter(m);
        G.effects.push({ x: c.x, y: c.y - 28, txt: '+' + d, t0: now });
        G.flash[m] = { t0: now, col: '#ffffff' };
      }
    });
  } else {
    const now = performance.now();
    v.forEach((m) => { G.flash[m] = { t0: now, col: '#ffd97a' }; });
  }
  strum(v);
  G.locked.push(v);
  renderStrip(); showLockedTarget(sym, v);
  setTimeout(() => {
    G.busy = false;
    if (G.locked.length >= G.lv.prog.length) complete();
    else renderTarget();
  }, 900);
}
function undo() {
  if (!G || G.busy || G.done || G.playback) return;
  const floor = G.lv.par != null ? 1 : 0;
  if (G.locked.length <= floor) return;
  G.locked.pop(); G.costs.pop(); G.sel = null;
  renderStrip(); renderTarget();
}
function resetLevel() {
  if (!G || G.playback) return;
  startLevel(G.li);
}

/* ================= completion & playback ================= */
function complete() {
  G.done = true;
  const total = G.costs.reduce((a, b) => a + b, 0);
  const lv = G.lv;
  if (lv.par != null) {
    const prev = save.best[lv.name];
    if (!prev || total < prev.cost) save.best[lv.name] = { cost: total, perfect: total === lv.par };
  } else save.best[lv.name] = { done: 1 };
  persist();
  renderStrip();
  playbackUI();
  startPlayback();
}
function playbackUI() {
  const t = $('#targ');
  t.querySelector('.lead').textContent = 'your take · tap the keys to skip';
  const se = t.querySelector('.sym'); se.textContent = '♪'; se.classList.add('gold');
  t.querySelector('.lets').textContent = '';
  t.querySelector('.cap').textContent = '';
}
function stripPlayhead(i) {
  $('#strip').querySelectorAll('.chip').forEach((c, j) => c.classList.toggle('cur', j === i));
}
function startPlayback() {
  const ac = audio();
  const pb = ac.createGain(); pb.gain.value = 1; pb.connect(master);
  const beat = 60 / 88, bar = 4 * beat;
  const t0 = ac.currentTime + 0.2;
  const seq = G.locked;
  let prevBass = null;
  seq.forEach((v, i) => {
    const bt = t0 + i * bar;
    v.forEach((m, j) => pad(m, bt + j * 0.03, bar * 0.92, 0.09, pb));
    // bass follows the voicing's own bottom note, staying near the last bass
    const pc = Math.min(...v) % 12;
    let bm;
    if (prevBass == null) { bm = pc + 48; if (bm > 55) bm -= 12; }
    else bm = [pc + 36, pc + 48, pc + 60]
      .reduce((a, b) => Math.abs(b - prevBass) < Math.abs(a - prevBass) ? b : a);
    prevBass = bm;
    bassNote(bm, bt, beat * 1.7, pb);
    bassNote(bm, bt + 2 * beat, beat * 1.7, pb);
    kick(bt, pb); kick(bt + 2 * beat, pb);
    for (let k = 0; k < 8; k++) hat(bt + k * beat / 2, pb, k % 2 ? 0.02 : 0.045);
  });
  const ringT = t0 + seq.length * bar;
  seq[seq.length - 1].forEach((m, j) => pad(m, ringT + j * 0.04, 2.1, 0.1, pb));
  kick(ringT, pb);
  G.playback = { t0, bar, n: seq.length, pb, ui: -1,
    timer: setTimeout(showResult, (seq.length * bar + 2.8) * 1000) };
}
function skipPlayback() {
  const p = G && G.playback; if (!p) return;
  clearTimeout(p.timer);
  p.pb.gain.setTargetAtTime(0.0001, AC.currentTime, 0.05);
  G.playback = null;
  showResult();
}
function showResult() {
  G.playback = null;
  stripPlayhead(-1);
  const lv = G.lv, total = G.costs.reduce((a, b) => a + b, 0);
  const t = $('#targ');
  const perfect = lv.par != null && total === lv.par;
  t.querySelector('.lead').textContent = perfect ? '★ ★ ★' : 'solved';
  const se = t.querySelector('.sym');
  se.textContent = perfect ? 'PERFECT' : (lv.par != null ? 'cost ' + total : 'nice');
  se.classList.toggle('gold', perfect);
  t.querySelector('.lets').textContent =
    lv.par != null ? (perfect ? 'not a semitone wasted' : 'par is ' + lv.par + ' - undo-proof it or ⟳') : 'shape learned';
  t.querySelector('.cap').textContent = '';
  const hint = $('#playhint');
  hint.innerHTML = '';
  const mk = (txt, fn) => {
    const b = document.createElement('button'); b.textContent = txt; b.onclick = fn;
    b.style.cssText = 'margin:0 7px;padding:10px 16px;border-radius:12px;background:#221e30;border:1px solid #3a3355;font-weight:700;font-size:14px;color:#f2ead9;';
    hint.appendChild(b);
  };
  mk('▶ hear it', () => { hint.innerHTML = ''; playbackUI(); startPlayback(); });
  mk('⟳ again', () => { restoreHint(); resetLevel(); });
  if (G.li + 1 < LEVELS.length) mk('next ›', () => { restoreHint(); startLevel(G.li + 1); });
  mk('menu', () => { restoreHint(); showMenu(); });
}
function restoreHint() {
  $('#playhint').textContent = 'drag a dot to a key · or tap a dot, then a key';
}

/* ================= drawing ================= */
function draw() {
  requestAnimationFrame(draw);
  if (playEl.hidden || !KB) return;
  const now = performance.now();
  const { W, H, keys } = KB;
  ctx.clearRect(0, 0, W, H);
  // playback lighting + live now-playing readout
  let lit = null;
  if (G && G.playback && AC) {
    const p = G.playback;
    const ci = Math.max(0, Math.min(Math.floor((AC.currentTime - p.t0) / p.bar), p.n - 1));
    lit = new Set(G.locked[ci]);
    if (p.ui !== ci) {
      p.ui = ci;
      const sym = parseTarget(G.lv.prog[ci]).sym, v = G.locked[ci];
      const t = $('#targ');
      const se = t.querySelector('.sym'); se.textContent = invName(sym, v); se.classList.add('gold');
      t.querySelector('.lets').textContent = v.map((m) => NOTE[m % 12] + (Math.floor(m / 12) - 1)).join(' · ');
      t.querySelector('.cap').textContent = invCaption(sym, v);
      stripPlayhead(ci);
    }
  }
  // ghost hints (level 1 only)
  let ghost = null;
  if (G && G.lv.hint && !G.done) {
    const t = curTarget();
    if (t) ghost = new Set(parseTarget(t).pcs);
  }
  const paint = (k) => {
    const r = 6;
    ctx.beginPath();
    ctx.roundRect(k.x + 1, k.y, k.w - 2, k.h - 2, k.black ? [0, 0, r, r] : [0, 0, r, r]);
    ctx.fillStyle = k.black ? '#241f2e' : '#f5efe2';
    ctx.fill();
    if (k.black) { ctx.strokeStyle = '#3a3355'; ctx.lineWidth = 1; ctx.stroke(); }
    const fl = G && G.flash[k.m];
    if (fl) {
      const a = 1 - (now - fl.t0) / 700;
      if (a <= 0) delete G.flash[k.m];
      else { ctx.fillStyle = fl.col; ctx.globalAlpha = a * 0.55; ctx.fill(); ctx.globalAlpha = 1; }
    }
    if (lit && lit.has(k.m)) { ctx.fillStyle = '#ffb648'; ctx.globalAlpha = 0.45; ctx.fill(); ctx.globalAlpha = 1; }
    if (ghost && ghost.has(k.m % 12)) { ctx.fillStyle = '#ffb648'; ctx.globalAlpha = 0.32; ctx.fill(); ctx.globalAlpha = 1; }
  };
  keys.filter((k) => !k.black).forEach(paint);
  keys.filter((k) => k.black).forEach(paint);
  // C landmarks
  ctx.fillStyle = '#8f87a3'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  for (const k of keys) if (!k.black && k.m % 12 === 0)
    ctx.fillText('C' + (Math.floor(k.m / 12) - 1), k.x + k.w / 2, H - 6);
  if (!G) return;
  // fingers
  G.fingers.forEach((m, fi) => {
    let p = keyCenter(m), r = 14;
    if (G.drag && G.drag.fi === fi && G.drag.moved) { p = { x: G.drag.px, y: G.drag.py }; r = 18; }
    // nudge overlapping dots apart
    G.fingers.forEach((m2, fj) => { if (fj < fi && m2 === m) p = { x: p.x, y: p.y - 26 }; });
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
    ctx.fillStyle = FCOL[fi]; ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = G.sel === fi ? '#f2ead9' : 'rgba(23,20,32,0.55)';
    ctx.stroke();
  });
  // floating +n tags
  G.effects = G.effects.filter((e) => now - e.t0 < 900);
  for (const e of G.effects) {
    const a = 1 - (now - e.t0) / 900;
    ctx.globalAlpha = a; ctx.fillStyle = '#171420';
    ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(e.txt, e.x, e.y - (1 - a) * 22);
    ctx.globalAlpha = 1;
  }
}
requestAnimationFrame(draw);

/* ================= input ================= */
cv.addEventListener('pointerdown', (ev) => {
  ev.preventDefault(); audio();
  if (!G) return;
  if (G.playback) { skipPlayback(); return; }
  if (G.busy || G.done) return;
  const rect = cv.getBoundingClientRect();
  const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  // nearest finger within reach
  let bi = -1, bd = 40;
  G.fingers.forEach((m, fi) => {
    const c = keyCenter(m);
    const d = Math.hypot(c.x - x, c.y - y);
    if (d < bd) { bd = d; bi = fi; }
  });
  // an armed finger takes priority: any tap off its own key places it there
  if (G.sel != null) {
    const k = hitKey(x, y);
    if (k != null && k !== G.fingers[G.sel]) {
      G.fingers[G.sel] = k; G.sel = null; audition(k); checkSpell();
      return;
    }
  }
  if (bi >= 0) {
    G.drag = { fi: bi, sx: x, sy: y, px: x, py: y, moved: false };
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    return;
  }
  const k = hitKey(x, y);
  if (k == null) return;
  audition(k);
});
cv.addEventListener('pointermove', (ev) => {
  if (!G || !G.drag) return;
  const rect = cv.getBoundingClientRect();
  const x = Math.max(0, Math.min(KB.W - 1, ev.clientX - rect.left));
  const y = Math.max(0, Math.min(KB.H - 1, ev.clientY - rect.top));
  const d = G.drag;
  d.px = x; d.py = y;
  if (!d.moved && Math.hypot(x - d.sx, y - d.sy) > 7) d.moved = true;
  if (d.moved) {
    const k = hitKey(x, y);
    if (k != null && k !== G.fingers[d.fi]) { G.fingers[d.fi] = k; audition(k); }
  }
});
cv.addEventListener('pointerup', (ev) => {
  if (!G || !G.drag) return;
  const d = G.drag; G.drag = null;
  if (!d.moved) G.sel = (G.sel === d.fi) ? null : d.fi;
  else { G.sel = null; checkSpell(); }
});
cv.addEventListener('pointercancel', () => { if (G) G.drag = null; });

/* ================= chord codex ================= */
const CODEX = ['C', 'F', 'G', 'Am', 'Em', 'Cmaj7', 'Dm7', 'Em7', 'Fmaj7', 'G7', 'Am7', 'E7'];
const CARDV = {
  C:[60,64,67], F:[65,69,72], G:[67,71,74], Am:[69,72,76], Em:[64,67,71],
  Cmaj7:[60,64,67,71], Dm7:[62,65,69,72], Em7:[64,67,71,74], Fmaj7:[65,69,72,76],
  G7:[67,71,74,77], Am7:[69,72,76,79], E7:[64,68,71,74],
};
const GUITAR = {
  C: { f:'x32010' }, F: { f:'133211', barre:1 }, G: { f:'320003' },
  Am: { f:'x02210' }, Em: { f:'022000' },
  Cmaj7: { f:'x32000' }, Dm7: { f:'xx0211' }, Em7: { f:'020000' },
  Fmaj7: { f:'xx3210' }, G7: { f:'320001' }, Am7: { f:'x02010' }, E7: { f:'020100' },
};
const GSTR = [40, 45, 50, 55, 59, 64]; // EADGBE

function seenChords() {
  const s = new Set();
  LEVELS.forEach((lv) => {
    if (save.best[lv.name]) lv.prog.forEach((t) => s.add(parseTarget(t).sym));
  });
  return s;
}
// diatonic step index for staff placement (naturals only in this chapter)
const diat = (m) => Math.floor(m / 12) * 7 + [0,0,1,1,2,3,3,4,4,5,5,6][m % 12];

function pianoSVG(v) {
  const set = new Set(v);
  let s = '<svg viewBox="0 0 288 64" width="100%" height="58">';
  const whites = [];
  for (let m = 60; m <= 79; m++) if (!isBlack(m)) whites.push(m);
  whites.forEach((m, i) => {
    s += `<rect x="${i * 24 + 0.5}" y="0" width="23" height="63" rx="3" fill="#f5efe2"/>`;
    if (set.has(m)) s += `<circle cx="${i * 24 + 12}" cy="50" r="7" fill="#ffb648" stroke="#1a1626" stroke-width="2"/>`;
  });
  for (let m = 60; m <= 79; m++) if (isBlack(m)) {
    const li = whites.indexOf(m - 1);
    s += `<rect x="${(li + 1) * 24 - 7}" y="0" width="14" height="38" rx="2" fill="#241f2e" stroke="#3a3355"/>`;
    if (set.has(m)) s += `<circle cx="${(li + 1) * 24}" cy="28" r="6" fill="#ffb648" stroke="#1a1626" stroke-width="2"/>`;
  }
  return s + '</svg>';
}
function staffSVG(v) {
  let s = '<svg viewBox="0 0 150 96" width="100%" height="86">';
  for (let i = 0; i < 5; i++)
    s += `<line x1="8" y1="${24 + i * 10}" x2="142" y2="${24 + i * 10}" stroke="#8f87a3" stroke-width="1"/>`;
  s += '<text x="10" y="67" font-size="56" fill="#f2ead9">\u{1D11E}</text>';
  for (const m of v) {
    const y = 64 - (diat(m) - 37) * 5;
    if (diat(m) <= 35) s += `<line x1="93" y1="${64 - (35 - 37) * 5}" x2="117" y2="${64 - (35 - 37) * 5}" stroke="#8f87a3" stroke-width="1"/>`;
    if (isBlack(m)) s += `<text x="88" y="${y + 4.5}" font-size="13" fill="#f2ead9" text-anchor="middle">♯</text>`;
    s += `<ellipse cx="105" cy="${y}" rx="7.5" ry="5.5" fill="#f2ead9" transform="rotate(-12 105 ${y})"/>`;
  }
  return s + '</svg>';
}
function guitarSVG(sym) {
  const { f, barre } = GUITAR[sym];
  let s = '<svg viewBox="0 0 104 132" width="100%" height="110">';
  for (let i = 0; i < 6; i++)
    s += `<line x1="${17 + i * 14}" y1="26" x2="${17 + i * 14}" y2="122" stroke="#8f87a3" stroke-width="1"/>`;
  s += '<line x1="16" y1="26" x2="88" y2="26" stroke="#f2ead9" stroke-width="4"/>';
  for (let r = 1; r <= 4; r++)
    s += `<line x1="17" y1="${26 + r * 24}" x2="87" y2="${26 + r * 24}" stroke="#8f87a3" stroke-width="1"/>`;
  if (barre) s += '<rect x="11" y="31" width="82" height="14" rx="7" fill="#ffb648"/>';
  f.split('').forEach((c, i) => {
    const x = 17 + i * 14;
    if (c === 'x') s += `<text x="${x}" y="18" font-size="12" fill="#8f87a3" text-anchor="middle">×</text>`;
    else if (c === '0') s += `<circle cx="${x}" cy="13" r="4.5" fill="none" stroke="#8f87a3" stroke-width="1.5"/>`;
    else if (!(barre && c === '1'))
      s += `<circle cx="${x}" cy="${26 + (+c - 0.5) * 24}" r="6.5" fill="#ffb648"/>`;
  });
  return s + '</svg>';
}
function pluck(m, t, dest) {
  const ac = AC;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.6;
  lp.frequency.setValueAtTime(2600, t);
  lp.frequency.exponentialRampToValueAtTime(500, t + 0.5);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.13, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  lp.connect(g); g.connect(dest || master);
  const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fq(m);
  o.connect(lp); o.start(t); o.stop(t + 1);
}
function strumGuitar(sym) {

}

  const grid = $('#grid'); grid.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const ch = CHAPTERS.find((c) => c.at === i);
    if (ch) {
      const h = document.createElement('div'); h.className = 'sect';
      h.textContent = ch.label; grid.appendChild(h);
    }
    const b = document.createElement('button');
    b.className = 'card' + (unlocked(i) ? '' : ' locked');
    const b0 = save.best[lv.name];
    let bs = '—', cls = '';
    if (b0) {
      if (lv.par == null) { bs = 'done ✓'; cls = 'done'; }
      else if (b0.perfect) { bs = 'PERFECT ★'; cls = 'perfect'; }
      else { bs = 'best ' + b0.cost + ' · par ' + lv.par; cls = 'done'; }
    } else if (lv.par != null) bs = 'par ' + lv.par;
    b.innerHTML = '<div class="num">' + (i + 1) + (unlocked(i) ? '' : ' 🔒') + '</div>' +
      '<div class="nm">' + lv.name + '</div>' +
      '<div class="pg">' + lv.prog.map(dispTarget).join(' → ') + '</div>' +
      '<div class="bs ' + cls + '">' + bs + '</div>';
    b.onclick = () => { if (unlocked(i)) { audio(); startLevel(i); } };
    grid.appendChild(b);
  });
  const seen = seenChords();
  $('#codexbtn').textContent = '◈ codex & cheat sheet · ' + seen.size + '/' + CODEX.length;
}
window.addEventListener('resize', () => { if (!playEl.hidden) layoutKB(); });
showMenu();

/* debug hook for headless verification */
window.__vb = {
  start: startLevel,
  set: (a) => { G.fingers = a.slice(); checkSpell(); },
  skip: skipPlayback,
  state: () => G && {
    li: G.li, locked: G.locked.map((v) => v.slice()), fingers: G.fingers.slice(),
    costs: G.costs.slice(), busy: G.busy, done: G.done, playback: !!G.playback,
  },
  save: () => save,
};
</script>
</body>
</html>
