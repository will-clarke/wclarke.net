<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e16">
<title>hydra</title>
<style>
:root {
  --bg: #0a0e16;
  --panel: #101828;
  --floor: #131b2c;
  --wall: #232e44;
  --ink: #e8f0ff;
  --dim: #8fa3bf;
  --gold: #ffd166;
  --pellet: #ffe27a;
  --boxc: #8fa3bf;
  --hue0: #59f2a6;
  --hue1: #ff7ad9;
  --hue2: #62d9ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* ---- screens ---- */
.screen { position: absolute; inset: 0; display: none; flex-direction: column; }
.screen.on { display: flex; }

/* ---- level select ---- */
#select { align-items: center; overflow-y: auto; padding: 12vh 20px 40px; }
#select h1 {
  font-size: 56px; font-weight: 800; letter-spacing: 0.14em;
  background: linear-gradient(100deg, var(--hue0), var(--hue2) 70%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(89, 242, 166, 0.35));
}
#select .sub { color: var(--dim); margin: 6px 0 34px; letter-spacing: 0.08em; }
#cards { display: grid; grid-template-columns: repeat(2, minmax(140px, 168px)); gap: 12px; width: 100%; max-width: 360px; }
.card {
  background: var(--panel); border: 1px solid #1d2940; border-radius: 14px;
  padding: 14px 14px 12px; text-align: left; transition: transform 0.1s;
}
.card:active { transform: scale(0.96); }
.card .num { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; }
.card .name { font-weight: 650; margin-top: 2px; }
.card .best { color: var(--dim); font-size: 12px; margin-top: 6px; min-height: 15px; font-variant-numeric: tabular-nums; }
.card.done { border-color: color-mix(in srgb, var(--hue0) 45%, #1d2940); }
.card.done .best { color: var(--hue0); }
.card.next { animation: cardpulse 1.8s ease-in-out infinite; }
.card .best .star { color: var(--gold); }
@keyframes cardpulse { 50% { border-color: var(--hue0); box-shadow: 0 0 14px rgba(89, 242, 166, 0.18); } }

/* ---- game screen ---- */
#game { touch-action: none; }
#topbar {
  height: 48px; flex: none; display: flex; align-items: center; gap: 4px;
  padding: 0 8px 0 16px;
}
#lvlname { font-weight: 650; letter-spacing: 0.04em; margin-right: auto; }
#moves { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 10px; }
#scissors { color: var(--hue1); letter-spacing: 2px; margin-right: 6px; font-size: 15px; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 12px; font-size: 20px; color: var(--dim);
  display: grid; place-items: center;
}
.iconbtn:active { background: var(--panel); color: var(--ink); }
#toast {
  position: absolute; top: calc(48px + env(safe-area-inset-top) + 8px); left: 50%;
  transform: translateX(-50%); max-width: min(86vw, 420px);
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid #223050;
  border-radius: 12px; padding: 9px 14px; font-size: 13.5px; color: var(--dim);
  text-align: center; pointer-events: none; transition: opacity 0.3s; z-index: 3;
}
#toast.hide { opacity: 0; }
#boardwrap { flex: 1; display: grid; place-items: center; min-height: 0; }
#board { touch-action: none; }
#controls {
  flex: none; display: flex; justify-content: center; gap: 14px;
  padding: 10px 0 calc(16px + env(safe-area-inset-bottom));
}
.cmd {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--panel); border: 1px solid #223050;
  font-size: 22px; color: var(--ink);
  display: grid; place-items: center;
  transition: transform 0.06s, border-color 0.06s;
}
.cmd:active, .cmd.held { transform: scale(0.93); border-color: var(--hue0); }

/* ---- win overlay ---- */
#winov {
  position: absolute; inset: 0; display: none; place-items: center;
  background: rgba(5, 8, 14, 0.6); z-index: 5;
}
#winov.on { display: grid; }
#wincard {
  background: var(--panel); border: 1px solid #223050; border-radius: 18px;
  padding: 28px 30px; text-align: center; min-width: 240px;
  animation: winin 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes winin { from { transform: translateY(24px); opacity: 0; } }
#wincard h2 { letter-spacing: 0.2em; font-size: 20px; color: var(--hue0); }
#winmoves { color: var(--dim); margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
#perfect { color: var(--gold); font-weight: 700; letter-spacing: 0.12em; font-size: 13px; min-height: 18px; }
#winbtns { display: flex; gap: 10px; margin-top: 18px; }
#winbtns button {
  flex: 1; padding: 11px 14px; border-radius: 12px; background: #182236;
  border: 1px solid #223050; font-size: 14px;
}
#winbtns button.primary { background: color-mix(in srgb, var(--hue0) 18%, #182236); border-color: var(--hue0); }

/* full-clear flourish: subtle celebratory shimmer + sparkle on the wordmark */
#select.allclear h1 {
  animation: shimmer 3.2s ease-in-out infinite;
}
#select.allclear .sub::after { content: ' ✦'; color: var(--gold); }
@keyframes shimmer {
  0%, 100% { filter: drop-shadow(0 0 18px rgba(89, 242, 166, 0.35)); }
  50% { filter: drop-shadow(0 0 30px rgba(98, 217, 255, 0.6)); }
}

@media (prefers-reduced-motion: reduce) {
  .card.next { animation: none; }
  #wincard { animation: none; }
  #select.allclear h1 { animation: none; }
}
</style>
</head>
<body>
  <div id="select" class="screen on">
    <h1>HYDRA</h1>
    <div class="sub">cut it, get two</div>
    <div id="cards"></div>
  </div>

  <div id="game" class="screen">
    <div id="topbar">
      <span id="lvlname"></span>
      <span id="moves"></span>
      <span id="scissors"></span>
      <button class="iconbtn" id="undo" aria-label="undo">⟲</button>
      <button class="iconbtn" id="restart" aria-label="restart">↺</button>
      <button class="iconbtn" id="menu" aria-label="levels">≡</button>
    </div>
    <div id="toast" class="hide"></div>
    <div id="boardwrap"><canvas id="board"></canvas></div>
    <div id="controls">
      <button class="cmd" data-cmd="L" aria-label="step left">◀</button>
      <button class="cmd" data-cmd="F" aria-label="forward">▲</button>
      <button class="cmd" data-cmd="B" aria-label="backward">▼</button>
      <button class="cmd" data-cmd="R" aria-label="step right">▶</button>
    </div>
    <div id="winov">
      <div id="wincard">
        <h2>COMPLETE</h2>
        <div id="winmoves"></div>
        <div id="perfect"></div>
        <div id="winbtns">
          <button id="again">again</button>
          <button id="tolevels">levels</button>
          <button id="next" class="primary">next</button>
        </div>
      </div>
    </div>
  </div>
