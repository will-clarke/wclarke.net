    sum:"He walks into the station with the ledger as dowry and trades himself for Danny before lunch. The Chairman's firm comes down around the trial like scaffolding in a gale. Twenty-two years: Danny visits every month with Mum's parkin and increasingly good chess, and never once asks why, because he worked it out on the first drive home, and had to park twice to see the road."},
  knife_vineyard:{t:"THE VINEYARD", e:"HE DRANK HIS OWN LABEL.", s:[1,0,5],
    sum:"Danny serves nine years quietly, the way he does everything. The vineyard wins modest awards; the new name fits like good shoes; Mum dies believing her younger son travels for work. The only post he keeps is the card that comes the week Danny gets out: I KNOW. MUM DOESN'T. LEAVE IT THAT WAY. He is buried under the bought name, between strangers, in soil he owned and never once trusted."},
  knife_heir:{t:"THE QUIET CHAIRMAN", e:"EVERYTHING ABOVE BOARD, EVENTUALLY.", s:[2,2,5],
    sum:"He inherits the firm and spends twenty years winding it legitimate so slowly that nobody can name the year it happened: taxis, storage, actual laundry. Half the old faces despise him and none can say why out loud, which he counts as a management technique. He dies a legitimate businessman with a clean tax history, which was, he reflected near the end, the longest con either of them ever ran."},
  knife_walk:{t:"THE SEA WALL", e:"HE WALKED BACK ALONG THE BEACH.", s:[3,1,0],
    sum:"He takes the beach. Fifty-five, no pension, no firm, no enemies worth the petrol - a van-driving job, an allotment, a rented room that holds everything he owns with space left over. He sleeps like a child for the first time since he was one. Sometimes a long car slows beside him on the front, respectfully, and moves on. He has stopped noticing, which is the whole of what he won."},
  knife_witness:{t:"MR SOMEBODY ELSE", e:"HE MISSED EVERYONE, ALWAYS.", s:[2,4,1],
    sum:"His evidence takes the Chairman and eleven others, and takes his own name with them. Thirty years as a mild man with a shallow past in a far town: quiz nights, a bowls club, a story that is two sentences deep. He watches Mum's funeral from a car across the cemetery, with a handler passing tissues. The town he saved never learns his name, which was, on the bad nights, the entire point."},
  knife_chances:{t:"LOCAL BUSINESSMAN, 61", e:"NOBODY SAW ANYTHING.", s:[1,1,2],
    sum:"He withdraws the statement and gets fifteen good years for it: a chip shop with Danny, cricket teas, a van at the harbour. Then one ordinary Thursday morning the long car finally stops. The town gives evidence with one voice: nobody saw anything, nobody knows anything - which is not fear, Alice understands, reading the transcripts. It is the town closing around one of its own, too late."},
  knife_green:{t:"GOOD SIGHTLINES", e:"GOOD SIGHTLINES, AT LAST.", s:[3,2,1],
    sum:"Somewhere green, with a long drive and a hedge maze he plants half for fun and half from professional habit. He grows plums, wins a village show, and is adored by neighbours who believe he was in haulage, which is, he points out to himself, technically true. Alice visits once a year, retired now, for chess and news of the old faces, and they never once say any of it out loud."},
  knife_rank:{t:"FIRST ON THE RANK", e:"EVERYONE KNEW HIS CAB.", s:[3,4,0],
    sum:"He stays visible on purpose: first taxi on the rank for twenty more years, nurses ride free on nights, and every fare gets there by the route the meter likes least. The new firms never touch him - too many people watching, and all of them watching deliberately. His funeral cortege is a procession of taxis a mile long, meters off, and the rank stands empty for one hour, by agreement."},
  knife_rebuild:{t:"NEUTRAL GROUND", e:"NEUTRAL GROUND.", s:[3,3,1],
    sum:"He rebuilds the rank in brick, with a kettle, and runs it for twenty years as the one square of the town where everything gets left outside. Coppers and old faces queue for the same cabs, in the same rain, under a sign he paints himself: EVERYBODY RIDES. When he dies, both trades attend the funeral in shifts they negotiate without being asked to, which is his actual monument."},
  knife_spare:{t:"DANNY'S SPARE ROOM", e:"COMPLETELY FORGOTTEN, THANK GOD.", s:[3,2,0],
    sum:"He lets it all go at seventy: Danny's spare room, the big chair by the window, the school run for Danny's grandchildren twice a week in a car nobody would look at twice. The trade forgets him completely within five years, which he discovers, to his enormous surprise, is the prize. His last decade contains crosswords, gravy, arguments about the bypass, and nothing else at all."},
  knife_burn:{t:"THE FIRE AT THE ALLOTMENT", e:"HE KNEW WHICH HE WAS.", s:[4,3,0],
    sum:"He burns it in the allotment brazier on a wet Sunday: forty careers of leverage, page by page, turning first-growth councillors and terrified magistrates into smoke over the runner beans. He tells nobody, ever, so nobody ever learns how briefly unsafe they all were. The widow sends him the Chairman's watch by registered post. It keeps perfect time and he wears it to funerals only."},
  knife_use:{t:"THE LEDGER YEARS", e:"EVERYONE PAID ON TIME.", s:[2,1,4],
    sum:"He never commits another crime; he simply invoices. A quiet word here, a pension contribution there, and the trade pays him a courteous percentage for thirty years to keep the ledger asleep. He calls it his annuity and gives half away anonymously, and the arithmetic never balances no matter how carefully he gives, and he knows exactly why, and keeps invoicing anyway."},
  knife_prodigal:{t:"THE VAN COMES BACK", e:"RETURNED IN FULL, MINUS PETROL.", s:[3,2,0],
    sum:"Four years of magnificent misery - it turns out he cannot enjoyably spend a stolen penny, which is a terrible thing to learn about yourself in a villa. He drives it all back, every bond, and the widow counts it twice, says nothing, and hires him as her driver, which is both the punchline and the mercy. He drives her to bingo every Thursday for fifteen years, and she never once tips."},
  knife_watched:{t:"NOTHING OWING", e:"HAPPY CHRISTMAS. NOTHING OWING.", s:[2,0,5],
    sum:"He keeps it, and the cards keep coming, one a year, always knowing slightly too much: the new car, the operation, the name of the dog. He never determines whether it is mercy or a leash, which is of course the design. He lives magnificently and sleeps in instalments, and is buried under the bought name with, per his will, a headstone facing the road, so he can see who's coming."},
  knife_alldays:{t:"EVERY DAY OF IT", e:"EVERY DAY OF IT.", s:[3,4,0],
    sum:"He walks in the next morning and pleads guilty to all of it, refusing every deal his silence could buy, naming no one but himself. Twenty-six years, served in full, out at eighty-one. He teaches reading inside for two decades. In year twenty, Perry's son - grown, married, needing it - visits to ask why, and the answer takes four hours, and the young man leaves lighter than he came."},
});

/* ---- THE KITCHEN: the shop, the brothers, Thursdays, the rule ---- */

Object.assign(NODES, {
  kt33:{age:33, text:"Two doors from Mum, three kids in four years, and Dad's old shop half his, half Danny's - the arrangement Dad thought would keep them close. Danny wants to borrow big: a second premises, his name over both doors. The books say maybe. His gut says no.",
    choices:[{l:"Back Danny's expansion", to:"kt42expand"},{l:"Vote no, with the books", to:"kt42no"}]},
  kt42expand:{age:42, text:"The expansion works for six giddy years, then eats itself: two shops, four staff, and the brothers not speaking over whose signature is on the second lease. At home, Alice has stopped asking about the shop, and the wedding photographer - who never really left town, or her orbit - develops her film for free now.",
    choices:[{l:"Shut the second shop. Go home", to:"kt55home"},{l:"Fight Danny for the business", to:"kt55war"}]},
  kt55home:{age:55, text:"The second shop goes, the debt stays, and the marriage - repaired slowly, at kitchen-table interest rates - holds. Then Danny's shop fails too, and at Mum's seventieth, in front of the trifle, he asks for the money the family has saved.",
    choices:[{l:"Lend it, again", to:"kt68again"},{l:"No - and the whole why, at the table", to:"kt68table"}]},
  kt68again:{age:68, text:"The loan vanishes the way the others did, and Danny with it: twenty years of silence with two streets between them, Mum carrying Sunday plates from one house to the other like a ceasefire. Then Danny calls. First time in twenty years. It rings and rings.",
    choices:[{l:"Answer", to:"kitchen_answer"},{l:"Let it ring", to:"kitchen_ring"},
      {l:"Go round instead. Knock", to:"kitchen_brothers", gate:{d:"heart", r:2}}]},
  kt68table:{age:68, text:"The no stands for thirty years: Danny calls it war, Mum takes sides by refusing to, and the trifle is never spoken of. But the savings held - kids launched, roof sound, Venice at fifty as promised. Now Danny's daughter is at the door: her wedding needs its family whole, once.",
    choices:[{l:"Go, and mend it there", to:"kitchen_wedding"},{l:"Send a gift and his regrets", to:"kitchen_regrets"}]},
  kt55war:{age:55, text:"He wins the shops and loses the rest: Danny emigrates with a one-way ticket and a speech nobody films, Alice and the photographer are a town fact by Easter, and the divorce papers list, under irreconcilable, the single word: shops.",
    choices:[{l:"The club. The chair. Company", to:"kt68drink"},{l:"Build the empire alone", to:"kt68empire"}]},
  kt68drink:{age:68, text:"The club knows his chair. Somewhere between the third and the fourth he is charming; after the sixth, the kids stop bringing the grandchildren, and tell him why, kindly, twice a year, for a decade.",
    choices:[{l:"The morning he pours it away", to:"kitchen_chip"},{l:"The chair keeps him", to:"kitchen_chair"}]},
  kt68empire:{age:68, text:"Four shops become fourteen become a name on delivery vans. He owns half the streets Danny and Alice walked away from, and eats standing up in a show kitchen nobody cooks in. Now the photographer's retrospective opens in town: forty years of everyone's weddings. Including, famously, his.",
    choices:[{l:"Go to the exhibition", to:"kitchen_photo"},{l:"Buy the building. Cancel it", to:"kitchen_cancel"}]},
  kt42no:{age:42, text:"The no keeps the shop small and the brothers workable, and it is his own head that wanders: the new pharmacist does the crossword the same wrong way he does, and Thursdays have started mattering.",
    choices:[{l:"Thursdays stop. Tell Alice everything", to:"kt55confess"},{l:"Thursdays continue", to:"kt55affair"}]},
  kt55confess:{age:55, text:"The confession - of a thing that never quite happened, the hardest kind - bought a month of solo crosswords, then the rule that saved them: nothing unsaid at the table, ever. Thirteen years of the rule, and now Alice says her own unsaid thing: she never once liked this town, and there is a cottage by the sea in a savings book he has never seen.",
    choices:[{l:"Sell up. The sea", to:"kt68seaside"},{l:"Not yet. The shop needs a year", to:"kt68wait"}]},
  kt68seaside:{age:68, text:"A cottage with a ludicrous view; the shop sold to a man who repaints it wrong. The savings book's first entry turns out to be the week they married. And there is a second page: a list, in her hand, titled BEFORE WE GO - forty years of small wishes, numbered.",
    choices:[{l:"Do the list, in order", to:"kitchen_list"},{l:"Burn the list. Just live", to:"kitchen_gulls"}]},
  kt68wait:{age:68, text:"One more year turns out to be a coin with only one side: the shop needs him, then the daughter does, then his knees do. Alice turns seventy-five with the book unspent, and puts one last thing on the table, per the rule: she is going to the sea - with him, or first.",
    choices:[{l:"Go now, mid-sentence", to:"kitchen_midsentence"},{l:"The year wins again", to:"kitchen_lastyear"}]},
  kt55affair:{age:55, text:"Thursdays continue for three years, then surface the way these things do: a crossword in the wrong handwriting, folded into a coat pocket, found by Alice, in front of Mum.",
    choices:[{l:"Beg to stay", to:"kt68beg"},{l:"Go to the pharmacist", to:"kt68go"}]},
  kt68beg:{age:68, text:"She lets him stay, which is not the same as forgiveness: separate sides of everything for a decade, then a slow, unglamorous re-courtship conducted mostly through the washing-up rota. Now the ruby wedding looms, and the kids want to throw the works.",
    choices:[{l:"The big party, and the speech he owes", to:"kitchen_ruby"},{l:"Renew the vows quietly, just them", to:"kitchen_vows"}]},
  kt68go:{age:68, text:"He goes, and it is real - awkward, midlife, real - and costs the full town rate: the kids take years to visit, Mum sets his Sunday place anyway for the rest of her life, and Alice, at the one wedding they both attend, wishes him well and means it, which is worse.",
    choices:[{l:"Build the second life properly", to:"kitchen_second"},{l:"It doesn't take. Go back and ask", to:"kitchen_back"}]},
});

Object.assign(ENDINGS, {
  kitchen_answer:{t:"THE PHONE AT NINE O'CLOCK", e:"HE ANSWERED.", s:[4,4,0],
    sum:"Danny, from a hospital corridor, frightened and sorry in no particular order. Three years is what they get, and they spend it like men who know the exchange rate: fishing badly, arguing about the bypass, repainting the shop sign with both names on it for no commercial reason whatsoever. At the funeral he tells the trifle story, and the whole church laughs, and Mum's photo on the coffin seems pleased."},
  kitchen_ring:{t:"IT RANG AND RANG", e:"ONE MISSED CALL.", s:[1,2,1],
    sum:"He lets it ring, on principle, and the principle keeps him company for six weeks, which is how long Danny had left. There is a voicemail. He never plays it. He keeps the phone in the dresser drawer, charged, for twenty years - through three house moves and two new phones of his own - and tells nobody why, and everybody knows why, and nobody in the family ever lets a phone ring out again."},
  kitchen_brothers:{t:"BROTHERS", e:"TWO DOORS DOWN, IN THE END.", s:[5,4,0],
    sum:"He puts the ringing phone in his pocket and walks the two streets, and Danny opens the door still holding his, mid-ring, and neither of them ever finds out what the call was going to say instead. Hospital, then remission, then eleven years neither brother was owed: fences fixed at midnight, one shared allotment, two old men outside the shop arguing about whose name goes first. Mum's plates stay home. Everyone comes to her."},
  kitchen_wedding:{t:"THE TABLE PLAN", e:"SEATED TOGETHER, ON PURPOSE.", s:[4,3,1],
    sum:"The niece's table plan is a declaration of war disguised as stationery: the two old men, side by side, no exits. Soup is silent. The main course produces one sentence each. Then somebody's toddler detonates the profiterole tower over Danny's suit, and both brothers are suddenly laughing the exact same laugh, and thirty years fall off the pair of them between dessert and the band. They dance, separately, badly, at the same wedding, which is everything the bride wanted."},
  kitchen_regrets:{t:"THE GIFT TABLE", e:"HE SENT SOMETHING LOVELY.", s:[2,2,2],
    sum:"The gift is generous and the absence is total, and both are noted. He watches the photos arrive on a phone screen at his own kitchen table while Alice is at the dancing. The niece names her first boy Daniel; the second, two years later, gets his name - an open door he somehow never walks through, though he learns the bus route to their town by heart, in case."},
  kitchen_chip:{t:"ONE DAY AT A TIME", e:"ONE DAY AT A TIME.", s:[3,3,0],
    sum:"The morning it goes down the sink is unremarkable, which is how the real ones happen. Meetings above the bookies, tea-urn duty, five years of Tuesdays; the amends list is long and he does it in person, in order, including Danny, by airmail, twice. He attends one graduation sober and cries from the second row, and the grandchild in the gown waves at HIM, specifically, which is the whole of what the last five years were for."},
  kitchen_chair:{t:"LAST ORDERS", e:"LAST ORDERS.", s:[1,1,0],
    sum:"The chair keeps him, as chairs do: same view of the fruit machine, same barmaid half-mothering him for twenty years, same joke at the same time every night, word for word. The kids ring on birthdays; the club is patient. He dies at seventy-one between the fifth and the sixth, and the club keeps the chair empty for a month, which is the only eulogy, and more than most get in there."},
  kitchen_photo:{t:"THE EXHIBITION", e:"HE BOUGHT ONE PRINT.", s:[2,2,4],
    sum:"He goes on the quiet Tuesday, and there they all are on the walls: the town's weddings, forty years of them, his own included - Alice laughing, Danny best-manning, himself twenty-four and sure. The photographer, old now, shakes his hand without malice and says she was happiest in the contact sheets nobody printed. He buys one print - not of her; of Danny and him, mid-toast - and hangs it in shop number one, where the tills can see it."},
  kitchen_cancel:{t:"SOLD OUT", e:"NO PHOTOGRAPHS EXIST.", s:[1,0,5],
    sum:"He buys the building, cancels the show, and locks forty years of the town's weddings - everyone's, not just his - in a warehouse with his name on the deed. The town works out what happened within a fortnight and never forgives it: his vans get keyed for a decade, and three generations of brides learn his name as a curse. He dies the richest man on fourteen high streets, and no recent photograph of him exists for the paper to print."},
  kitchen_list:{t:"BEFORE WE GO", e:"ITEM 61: DONE.", s:[5,3,1],
    sum:"Sixty wishes, done in order, no skipping: dawn at the stones, a hot-air balloon (she screams, delighted, the entire time), item 34 just says CHIPS, TWICE and they honour it weekly. They see a whale that is probably a dolphin, and vote, two to nothing, whale. At the bottom, in newer ink and his handwriting, item 61: OUTLIVE THE LIST. They do. By years. It is framed in the kitchen where the rule was made."},
  kitchen_gulls:{t:"JUST THE VIEW, THANKS", e:"NO PLANS SURVIVED.", s:[4,2,1],
    sum:"She burns it herself, in the end, on the beach, laughing - forty years of wishes surrendered to the actual sea. What replaces the list is nothing: unscheduled years of gulls, naps, chips when they feel like it, and the particular luxury of a Tuesday with no number on it. The kids find the ashes story baffling until they visit, stand at the window for a minute, and stop asking."},
  kitchen_midsentence:{t:"GONE BY FRIDAY", e:"GONE BY FRIDAY.", s:[4,2,1],
    sum:"He stands up mid-sentence - his own sentence, about stock-taking - and rings the estate agent from the hall while Alice listens at the kitchen door with her hand over her mouth. Gone by Friday, scandalising everyone. Six years by the sea is what they get, which is fewer than the book had paid for, and neither of them ever counts it that way. The shop's new owner keeps finding lists everywhere."},
  kitchen_lastyear:{t:"ONE MORE YEAR", e:"THERE WAS ALWAYS ONE MORE YEAR.", s:[1,2,2],
    sum:"The year wins again, and then wins nine more times, the way years do when they're allowed. She dies at seventy-five with the savings book unspent in the dresser, and the rule of the table dies with her, because the last unsaid thing was his. He moves to the cottage alone that winter, finally, and keeps two chairs at the window, and is seen there every evening at the hour the tide turns, apologising to the view."},
  kitchen_ruby:{t:"THE SPEECH", e:"HE SAID IT IN FRONT OF EVERYONE.", s:[4,3,1],
    sum:"The works: a marquee, a band, four kinds of trifle by unspoken family law. The speech he owes her is honest in front of a hundred and forty people - Thursdays included, named as what they were - and you can hear the marquee decide, collectively, to breathe again when Alice stands up, crosses the floor, and finishes his last sentence for him, correctly. Mum, ninety-six, starts the applause with her stick."},
  kitchen_vows:{t:"TWO WITNESSES", e:"MARRIED TWICE. SAME WOMAN.", s:[4,2,0],
    sum:"A registry office on a wet Thursday - Thursdays owed them one - with two witnesses recruited off the street: a traffic warden on her break and a bride from the eleven-thirty slot, still in her dress, delighted. Chips on the sea wall after, out of the paper, no speech. The kids find the certificate years later, sorting the house, dated forty years after the first one, and sit down on the stairs with it."},
  kitchen_second:{t:"HAPPY, ELSEWHERE", e:"HAPPY, ELSEWHERE.", s:[3,2,2],
    sum:"The second life takes: a smaller town, a chemist's above the shop, crosswords done the same wrong way for thirty years. It is real happiness with one asterisk that never comes off - the Sunday place at Mum's table, set for him weekly until she dies, never filled and never cleared. He is a good husband the second time in all the ways he wasn't the first, and only ever says so to the dog."},
  kitchen_back:{t:"THE KNOCK", e:"SHE SAID NO, KINDLY.", s:[1,2,1],
    sum:"The second life doesn't take - some things are ballast, it turns out, not cargo - and at seventy he walks the old street and knocks. Alice answers, makes tea, hears him out, and says no: kindly, completely, with a hand on his shoulder at the door. He lodges over the shop he once half-owned and is, the neighbours agree, no trouble at all. Both marriages sit behind him like rooms he can hear but not enter."},
});

/* ---- THE GREEN: the band, the works, the sweet pea, the bells ---- */

Object.assign(NODES, {
  gr33:{age:33, text:"The works takes him on like it took his dad, and the colliery band, one cornet short since Whitsun, has heard he owns a trumpet. He is good. Not brilliant. Good.",
    choices:[{l:"Practise until it stops being fun", to:"gr42band"},{l:"Keep it Sunday-sized", to:"gr42town"}]},
  gr42band:{age:42, text:"Nine years of Tuesday practice and Whit marches, and the band is a second family with better arguments. Now the Nationals: the band has qualified for the Albert Hall, the same week Alice is due with their fourth.",
    choices:[{l:"The Albert Hall", to:"gr55hall"},{l:"The maternity ward", to:"gr55ward"}]},
  gr55hall:{age:55, text:"Third in the nation, and local radio still plays the recording every Whitsun. The fourth child, born while the cornets tuned, is thirteen now and cool about it in a way that costs him. This Friday brings two letters: the band needs a conductor, and the works needs a foreman.",
    choices:[{l:"Conduct", to:"gr68conduct"},{l:"The foreman's job", to:"gr68foreman"}]},
  gr68conduct:{age:68, text:"Twenty years on the rostrum: three more Nationals, a generation taught to read music in a hut with a paraffin heater. Now the works is closing, and the band - the town's heart in a uniform - is offered survival money to become the COLLIERY HERITAGE EXPERIENCE BRASS: sponsored, relocated, sanitised.",
    choices:[{l:"Take the sponsor's money", to:"green_heritage"},{l:"Stay a town band, broke", to:"green_townband"}]},
  gr68foreman:{age:68, text:"Foreman through the hard years, and now the buyout: it would set the grandkids up forever, and it would close the floor he has swept since he was nineteen.",
    choices:[{l:"Sign", to:"green_sign"},{l:"Tear it up", to:"green_tear"}]},
  gr55ward:{age:55, text:"He misses the Albert Hall for the maternity ward and hears the result on a corridor radio, holding his daughter, both of them crying for different reasons. Years on, the cornet mostly sleeps in its case - until the music teacher quits, and the school's brass programme, forty kids and no budget, lands on whoever will have it.",
    choices:[{l:"Take the forty kids", to:"gr68kids"},{l:"His own four first", to:"gr68own"}]},
  gr68kids:{age:68, text:"Thirty years of forty kids at a time: every child in town who wanted an instrument got one, out of skips and rummage sales and his own pocket. Three went professional; one conducts in Vienna; all of them come back for the Whit march. Now the council wants to give him the freedom of the town, with a ceremony.",
    choices:[{l:"Accept the ceremony", to:"green_freedom"},{l:"Dodge it. There's a lesson at four", to:"green_lesson"}]},
  gr68own:{age:68, text:"The programme dies, and the four kids get the cornet years instead: kitchen concerts, terrible trios, and one daughter who is - there is no other word for it - brilliant. At sixteen she wins a conservatoire audition, and the fees are the car plus the greenhouse plus everything.",
    choices:[{l:"Sell it all. Send her", to:"green_send"},{l:"Stay solvent. She'll find a way", to:"green_solvent"}]},
  gr42town:{age:42, text:"The trumpet stays fun, the works stays steady, and the green stays the green: cricket teas, the allotment, the bells learned out of curiosity one wet autumn. Then the flood year: one March night the river takes the bottom pitch, the allotments, and the bell-tower fund.",
    choices:[{l:"Rebuild the allotments", to:"gr55allot"},{l:"Restore the bells", to:"gr55bells"},
      {l:"Hold the riverbank. Himself. All night", to:"green_localman", gate:{d:"grit", r:2}}]},
  gr55allot:{age:55, text:"Three years of barrowing silt and the allotments come back better: forty plots, a pump, a shed empire. Then the county show notices his soil, and so does Pearson the seed merchant, whose chequebook wants the one thing that grows there and nowhere else: the yellow sweet pea that turned up by itself the year after the flood.",
    choices:[{l:"Sell Pearson the sweet pea", to:"gr68pea"},{l:"Give the seed to anyone who asks", to:"gr68free"}]},
  gr68pea:{age:68, text:"Pearson's catalogue calls it GOLDEN WONDER and the cheque is the largest thing that has ever happened to the kitchen table. The question is what the money is for.",
    choices:[{l:"Endow the allotments forever", to:"green_endow"},{l:"The world cruise Alice deserves", to:"green_cruise"}]},
  gr68free:{age:68, text:"He gives the seed to anyone who asks, which by year ten is everyone: the yellow pea climbs every fence in three counties, unpatented, unowned, and Pearson's lawyers have confirmed, with audible pain, that nothing can be done. Now the horticultural society wants to give it a proper name.",
    choices:[{l:"Let them name it after him", to:"green_named"},{l:"It's Alice's name or nothing", to:"green_alicename"}]},
  gr55bells:{age:55, text:"The bells come back one by one, recast from the flood-cracked originals, and he learns the numbers: a change-ringer's mind under a foreman's cap. Now the tower captain is retiring, and the band of ringers - average age seventy-one - will fold without new blood nobody has found.",
    choices:[{l:"Captain the tower. Recruit or die", to:"gr68tower"},{l:"Let the bells sleep after one last ring", to:"gr68last"}]},
  gr68tower:{age:68, text:"Fifteen years' captain: he recruits from the skate park with chips and open tower nights, and the average age drops forty years while the noise complaints stay exactly the same. The young band is good now - good enough for the full peal, three hours and eighteen minutes, unrung since the flood.",
    choices:[{l:"Ring the peal himself, at eighty", to:"green_peal"},{l:"Call it from the bench. Let them ring", to:"green_bench"}]},
  gr68last:{age:68, text:"The bells will sleep, then - but not before one full evening: every ringer the tower ever had, back for a final ring, the whole green standing out in the dusk to hear it. Afterwards, the question of the keys.",
    choices:[{l:"Keep the keys", to:"green_keys"},{l:"Give them up. Let the tower go", to:"green_swifts"}]},
});

Object.assign(ENDINGS, {
  green_heritage:{t:"THE HERITAGE EXPERIENCE", e:"NOTE-PERFECT, TWICE DAILY.", s:[2,2,3],
    sum:"The sponsor's money saves every job in the band and costs everything the band was for: coach parties, twice-daily sets, a gift shop selling the Whit march on CD. The playing is note-perfect and embalmed, and he conducts it to the end, in the sponsored uniform, knowing the exact price of survival because he signed the receipt. On the last page of his score, in pencil, in his hand: WE USED TO PLAY THIS OUTSIDE."},
  green_townband:{t:"SCRAP BRASS", e:"THE BAND PLAYED ON, UNPAID.", s:[4,4,0],
    sum:"Broke and alive: instruments patched with plumbing solder, subs waived forever, uniforms from three different decades on any given Sunday. They play the works' closing day in the rain, and every strike, wedding and funeral after, free, by principle. The band outlives the works by forty years and counting. The paraffin hut is still there. So is the arguing, which was always half the music."},
  green_sign:{t:"THE SIGNATURE", e:"IT WOULD HAVE CLOSED ANYWAY.", s:[2,1,4],
    sum:"He signs, and the money does everything promised: four grandchildren launched, mortgage-free, into lives the town can no longer offer, because the town half-empties within five years of the gates shutting. He tells himself the closing was coming regardless, which may even be true, and mows the verge outside the empty works every fortnight, unpaid, unasked, for the rest of his life. Nobody ever mentions it to him. Everybody sees."},
  green_tear:{t:"NINE MORE YEARS", e:"NINE MORE YEARS.", s:[3,4,0],
    sum:"He tears it up at the table, in front of the lawyers, slowly, so it can't be mistaken for temper. The works limps on nine more years - long enough for a generation of kids to finish school, for the retraining scheme, for the town to land soft instead of hard. It closes anyway; everything does. But everyone over fifty in that town can tell you exactly what nine years cost him, and exactly whose retirement bought it."},
  green_freedom:{t:"FREEDOM OF THE TOWN", e:"EVERY CHILD GOT AN INSTRUMENT.", s:[4,5,0],
    sum:"He accepts, under protest, in his good suit. What he doesn't know is the second half: the one who conducts in Vienna has flown home quietly and assembled, outside the town hall, three hundred former pupils with three hundred instruments, massed and tuned. They play the Whit march. He makes it eight bars before the cornet has to come down so he can see. The freedom of the town turns out to mean the town, freely, all at once."},
  green_lesson:{t:"THE FOUR O'CLOCK LESSON", e:"HE HAD A LESSON AT FOUR.", s:[3,5,0],
    sum:"He dodges his own ceremony because Tuesday is beginners' day, and the beginner in question is seven and finally nearly has B flat. The council awards the freedom of the town in absentia, to the biggest laugh the chamber has ever recorded. The kid at the four o'clock lesson grows up telling the story - the mayor waiting, the scroll on the table, and the old man at the school saying: posture first, honours after."},
  green_send:{t:"THE AUDITION", e:"PRINCIPAL TRUMPET'S DAD.", s:[4,3,0],
    sum:"The car goes, the greenhouse goes, the cornet - his own - goes last and hurts most. She goes. Principal trumpet by thirty, and every programme biography ever printed says taught by her father, because she writes it in herself and refuses all edits. He attends in the seats she buys, still growing tomatoes in buckets where the greenhouse was, and tells the neighbours it was a fair trade. It was. Everyone knows it was."},
  green_solvent:{t:"SECOND-HAND VALVES", e:"SHE FOUND A WAY.", s:[2,2,1],
    sum:"She finds a way, because that kind does: seven extra years of it, night shifts and borrowed instruments and a scholarship on the third try. She makes it anyway, at thirty, and something guarded has entered her playing and her Christmases both. At the debut she thanks everyone who believed it was possible, and the pause before everyone is very small, and he hears all of it, from row K, in his good suit."},

  green_swifts:{t:"THE SWIFTS GOT THE TOWER", e:"THE SWIFTS GOT THE TOWER.", s:[2,3,1],

const DEATH_BY_ID = Object.fromEntries(DEATHS.map(d=>[d.id,d]));

const DISPS = {
  luck:{name:"LUCK", max:3, blurb:"The universe owes him one.",
    ranks:["Fate rolls against him every decade.","Fate rolls half as hard.",
      "Half as hard, and one dodge per life.","Fate gives up entirely."]},
  heart:{name:"HEART", max:2, blurb:"He says the thing.",
    ranks:["Some doors stay quiet.","Hidden HEART doors show their words.","And they open."]},
  grit:{name:"GRIT", max:2, blurb:"He keeps going.",
    ranks:["Some doors stay shut.","Hidden GRIT doors show their words.","And they open."]},
  wonder:{name:"WONDER", max:2, blurb:"He sees the strange thing.",
    ranks:["The strange thing goes unseen.","Hidden WONDER doors show their words.","And they open."]},
  calm:{name:"CALM", max:3, blurb:"He can wait.",
    ranks:["He fidgets.","He can wait a while.","The CALM door shows its words.","And it opens."]},
};

/* CONTENT-END */

/* ================= STATE ================= */

const KEY = "threescore-v2";
let save = loadSave();
let life = null;

function loadSave(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.found && s.deaths && s.spend) return s;
  }catch(e){}
  return {found:{}, deaths:{}, lives:0, spend:{luck:0, heart:0, grit:0, wonder:0, calm:0}};
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }

function points(){ return Object.keys(save.found).length + Object.keys(save.deaths).length; }
function spent(){ return Object.values(save.spend).reduce((a,b)=>a+b,0); }
function totalStones(){ return Object.keys(ENDINGS).length + DEATHS.length; }
function stonesFound(){ return points(); }
function contOf(id){
  const us = id.indexOf("_");
  if(us > 0 && CONTS.some(c=>c.k===id.slice(0,us))) return id.slice(0,us);
  return NODE_CONT[id.slice(0,2)] || null;
}
function contOrder(k){ return Object.keys(ENDINGS).filter(id=>id.startsWith(k+"_")); }

const subtreeMemo = {};
function subtree(id){
  if(subtreeMemo[id]) return subtreeMemo[id];
  let out;
  if(ENDINGS[id]) out = [id];
  else out = NODES[id].choices.flatMap(c=>subtree(c.to));
  subtreeMemo[id] = out;
  return out;
}

/* ================= ENGINE ================= */

const app = document.getElementById("app");
function render(html){ app.innerHTML = '<div class="fade">'+html+'</div>'; window.scrollTo(0,0); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function statRow(glyph, n, lbl){
  let h = '<div class="srow">';
  for(let i=0;i<5;i++) h += '<span class="'+(i<n?"":"off")+'">'+glyph+'</span>';
  return h+'<span class="lbl">'+lbl+'</span></div>';
}
function statsHTML(s){
  return '<div class="stats">'+statRow("♥",s[0],"JOY")+statRow("✦",s[1],"WORTH")
    +statRow("£",s[2],"GOLD")+'</div>';
}
function gyLink(){
  return '<button class="quiet" onclick="showGraveyard()">the graveyard &middot; '
    +stonesFound()+' of '+totalStones()+' stones</button>';
}

function showTitle(){
  render(
    '<div style="margin-top:14dvh; text-align:center;">'+
    '<h1>threescore</h1>'+
    '<p class="tagline" style="text-align:center;">a life in seven choices</p>'+
    '<p class="tagline" style="text-align:center;">He gets seventy years, give or take.<br>He remembers none of it. You remember all of it.</p>'+
    '<button class="bigbtn primary" onclick="startBirth()">LIVE</button>'+
    gyLink()+
    '</div>');
}

function startBirth(){
  if(points()===0){ startLife(); return; }
  renderBirth();
}

function renderBirth(){
  const rem = points() - spent();
  let h = '<div class="age">BETWEEN LIVES</div>'+
    '<p class="tagline">The man forgets. The soul keeps what it has learned, and chooses what he will be able to see this time round.</p>'+
    '<button class="bigbtn primary" onclick="startLife()">AGAIN</button>'+
    '<div class="pts">'+rem+' STONE'+(rem===1?"":"S")+' UNSPENT &middot; RESPEC IS FREE</div>';
  for(const k of Object.keys(DISPS)){
    const d = DISPS[k], v = save.spend[k];
    let pips = "";
    for(let i=0;i<d.max;i++) pips += '<span class="'+(i<v?"":"off")+'">●</span>';
    h += '<div class="disp"><div class="row">'+
      '<span class="name">'+d.name+'</span>'+
      '<span class="pips">'+pips+'</span>'+
      '<span class="adj">'+
      '<button onclick="adj(\''+k+'\',-1)">−</button>'+
      '<button onclick="adj(\''+k+'\',1)">+</button>'+
      '</span></div>'+
      '<div class="desc"><i>'+d.blurb+'</i><br>'+esc(d.ranks[v])+'</div></div>';
  }
  h += '<button class="bigbtn" onclick="startLife()">AGAIN</button>'+
       '<button class="quiet" onclick="showTitle()">back</button>';
  render(h);
}

function adj(k, delta){
  const d = DISPS[k];
  const v = save.spend[k] + delta;
  if(v<0 || v>d.max) return;
  if(delta>0 && spent() >= points()) return;
  save.spend[k] = v;
  persist();
  renderBirth();
}

function startLife(){
  save.lives++; persist();
  life = {node:"r7", dodged:false};
  for(const k of Object.keys(DISPS)) life[k] = save.spend[k];
  renderNode();
}

function renderNode(){
  const n = NODES[life.node];
  let h = (n.slip ? '<div class="slip">'+esc(n.slip)+'</div>' : '')+
    '<div class="age">─&nbsp; '+(n.ageLabel||n.age)+' &nbsp;─</div>'+
    '<p class="situation">'+esc(n.text)+'</p>';
  n.choices.forEach((c,i)=>{
    if(c.gate){
      const have = life[c.gate.d];
      if(have < c.gate.r){
        const label = (have >= c.gate.r-1) ? esc(c.l) : "? ? ?";
        h += '<button class="choice locked">'+label+
          ' &nbsp;<span class="req">takes '+DISPS[c.gate.d].name+' '+c.gate.r+'</span></button>';
        return;
      }
    }
    const st = subtree(c.to);
    const f = st.filter(id=>save.found[id]).length;
    const chip = (f===st.length) ? "✓ "+f+"/"+st.length : f+"/"+st.length;
    const done = st.every(id=>save.found[id]);
    h += '<button class="choice'+(done?" done":"")+'" onclick="choose('+i+')">'+
      '<span class="chip">'+chip+'</span>'+esc(c.l)+'</button>';
  });
  render(h);
}

function choose(i){
  const n = NODES[life.node];
  const c = n.choices[i];
  if(c.gate && life[c.gate.d] < c.gate.r) return;
  const rate = [0.12, 0.06, 0.06, 0][life.luck];
  if(Math.random() < rate){
    const v = pickDeath(n.age, contOf(life.node));
    if(v){
      if(life.luck===2 && !life.dodged){
        life.dodged = true;
        return showDodge(v, c.to);
      }
      return showDeath(v, n.age);
    }
  }
  advance(c.to);
}

function advance(to){
  if(ENDINGS[to]) return showEnding(to);
  life.node = to;
  renderNode();
}

function pickDeath(age, cont){
  const pool = DEATHS.filter(d=>age>=d.min && age<=d.max && (!d.cont || d.cont===cont));
  if(!pool.length) return null;
  const fresh = pool.filter(d=>!save.deaths[d.id]);
  const from = fresh.length ? fresh : pool;
  return from[Math.floor(Math.random()*from.length)];
}

function showDodge(v, to){
  render('<div class="dodge" onclick="advance(\''+to+'\')">'+esc(v.dodge)+
    '<br><br><span style="font-size:.8rem; color:var(--dim); letter-spacing:.2em;">TAP</span></div>');
  setTimeout(()=>{ if(life) advance(to); }, 2200);
}

function cardHTML(kind, o, opts){
  opts = opts||{};
  return '<div class="stone'+(kind==="death"?" death":"")+'">'+
    '<div class="kicker">'+(kind==="death" ? "SUDDEN &middot; AGED "+opts.age : "HERE LIES A LIFE")+'</div>'+
    '<h2>'+esc(o.t)+'</h2>'+
    '<div class="epitaph">&ldquo;'+esc(o.e)+'&rdquo;</div>'+
    statsHTML(o.s)+
    '<div class="summary">'+esc(o.sum)+'</div>'+
    '</div>';
}

function endScreen(card, isNew){
  render(card+
    (isNew ? '<div class="newstone">✚ A NEW STONE IN THE GRAVEYARD</div>' : '')+
    '<button class="bigbtn primary" onclick="startBirth()">AGAIN</button>'+
    gyLink());
}

function showEnding(id){
  const isNew = !save.found[id];
  if(isNew){ save.found[id]=true; persist(); }
  life = null;
  endScreen(cardHTML("ending", ENDINGS[id]), isNew);
}

function showDeath(v, nodeAge){
  const age = nodeAge + 1 + Math.floor(Math.random()*8);
  const isNew = !save.deaths[v.id];
  if(isNew){ save.deaths[v.id]=true; persist(); }
  life = null;
  endScreen(cardHTML("death", v, {age:Math.min(age, 76)}), isNew);
}

function showGraveyard(){
  let h = '<h1 style="font-size:1.4rem; text-align:center; letter-spacing:.3em; margin-top:1rem;">THE GRAVEYARD</h1>'+
    '<div class="count">'+stonesFound()+' OF '+totalStones()+' STONES &middot; '+save.lives+' LIVES</div>'+
    '<div class="gy">';
  CONTS.forEach(c=>{
    const order = contOrder(c.k);
    const f = order.filter(id=>save.found[id]).length;
    h += '<h2>'+c.name+' &middot; '+f+'/'+order.length+'</h2><div class="grid">';
    order.forEach(id=>{
      if(save.found[id]) h += '<button class="tile" onclick="peek(\'e:'+id+'\')">'+esc(ENDINGS[id].t)+'</button>';
      else h += '<div class="tile unfound">?</div>';
    });
    h += '</div>';
  });
  h += '<h2>SUDDEN &middot; '+Object.keys(save.deaths).length+'/'+DEATHS.length+'</h2><div class="grid">';
  DEATHS.forEach(d=>{
    if(save.deaths[d.id]) h += '<button class="tile death" onclick="peek(\'d:'+d.id+'\')">'+esc(d.t)+'</button>';
    else h += '<div class="tile death unfound">?</div>';
  });
  h += '</div></div><button class="bigbtn primary" style="margin-top:2rem;" onclick="startBirth()">AGAIN</button>'+
    '<button class="quiet" onclick="showTitle()">title</button>'+
    '<div class="foot"><button onclick="wipe()">erase everything</button></div>';
  render(h);
}

function peek(ref){
  const kind = ref[0]==="d" ? "death" : "ending";
  const id = ref.slice(2);
  const o = kind==="death" ? DEATH_BY_ID[id] : ENDINGS[id];
  const div = document.createElement("div");
  div.className = "overlay";
  div.innerHTML = '<div class="inner">'+cardHTML(kind, o, {age:"?"})+'</div>';
  div.onclick = ()=>div.remove();
  document.body.appendChild(div);
}

function wipe(){
  if(!confirm("Erase the whole graveyard? Every stone, every life.")) return;
  localStorage.removeItem(KEY);
  save = loadSave();
  showTitle();
}

showTitle();
</script>
