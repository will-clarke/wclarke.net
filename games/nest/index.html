<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1e2433">
<title>NEST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e2433'/%3E%3Crect x='5.5' y='5.5' width='21' height='21' rx='2' fill='none' stroke='%233f9bf4' stroke-width='2.5'/%3E%3Crect x='11.5' y='11.5' width='9' height='9' rx='1.5' fill='none' stroke='%23a78bfa' stroke-width='2'/%3E%3Crect x='15' y='15' width='2' height='2' fill='%23ffc233'/%3E%3C/svg%3E">
<style>
  :root {
    --ground: #1e2433;
    --line: #3c4a6e;
    --ink: #e9edf7;
    --dim: #93a0bd;
    --blue: #3f9bf4;
    --violet: #a78bfa;
    --amber: #ffc233;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--ground);
    color: var(--ink);
    font: 500 15px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #hud {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 13px;
  }
  #levelName { color: var(--ink); }
  #selves { color: var(--blue); }
  #moves { margin-left: auto; color: var(--dim); }
  [hidden] { display: none !important; }
  #stage {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    touch-action: none;
  }
  /* The parent world sits behind the board, so the board needs a position too
     or the absolute canvas would paint over it. width/height must be spelled
     out: a canvas is a replaced element, so inset:0 alone would lay it out at
     its intrinsic (device-pixel) size. */
  #world { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #board { display: block; position: relative; }
  #toast, #coach {
    position: absolute;
    bottom: 8px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(30, 36, 51, 0.92);
    color: var(--ink);
    font-size: 13px;
    letter-spacing: 0.06em;
  }
  #coach {
    color: var(--dim);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  #bar {
    display: flex;
    gap: 10px;
    padding: 10px 16px 16px;
  }
  button {
    flex: 1;
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #2a3450;
    color: var(--ink);
    font: inherit;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    touch-action: manipulation;
  }
  button svg {
    display: block;
    margin: 0 auto;
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #undo { flex: 2; min-width: 96px; }
  /* The two audio toggles live in the HUD, so they must shed every bit of the
     chunky footer-button styling. */
  .icon {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    min-height: 0;
    padding: 0;
    border-color: transparent;
    background: none;
    color: var(--blue);
  }
  .icon:active { background: none; }
  .icon svg { width: 19px; height: 19px; }
  .icon.off { color: var(--dim); opacity: 0.6; }
  .icon .slash { display: none; }
  .icon.off .slash { display: inline; }
  button:active { background: #354162; }
  #undo.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(63, 155, 244, 0); }
    50% { box-shadow: 0 0 14px rgba(63, 155, 244, 0.55); }
  }
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(6, 9, 15, 0.72);
    padding: 24px;
  }
  .card {
    width: min(340px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: 22px 20px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #242c42;
    text-align: center;
  }
  .cardTitle {
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue);
  }
  #cardBody { margin: 10px 0 18px; color: var(--dim); }
  #cardRow { display: flex; gap: 10px; }
  #grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
  }
  .lv {
    display: block;
    min-height: 60px;
    padding: 8px 6px;
    text-align: left;
    letter-spacing: 0.02em;
    text-transform: none;
  }
  .lv b { display: block; color: var(--blue); font-size: 12px; letter-spacing: 0.1em; }
  .lv small { color: var(--dim); font-size: 11px; }
  .lv.locked { color: var(--dim); opacity: 0.5; }
  .lv.locked b { color: var(--dim); }
  .lv.here { border-color: var(--blue); }
  #pickerClose { width: 100%; }
  .lv .del { float: right; padding: 0 6px; color: var(--dim); font-size: 15px; }

  /* --- Editor: a full screen of its own, under the scrims. -------------- */
  #editor {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--ground);
    padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);
  }
  #edHead { display: flex; align-items: center; gap: 8px; }
  #edName {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #242c42;
    color: var(--ink);
    font: inherit;
  }
  /* min-height:0 or the flex child refuses to shrink below the canvas. */
  #edWrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #edCanvas { touch-action: none; border-radius: 4px; }
  #edBanner {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #242c42;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.03em;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  #edBanner.bad { color: #ffa0a0; border-color: #64394a; }
  #edBanner.good { color: #8fe0a3; border-color: #35604a; }
  #edPal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #edPal button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-height: 46px;
    padding: 2px;
    font-size: 9px;
    letter-spacing: 0.04em;
  }
  #edPal b { font-size: 15px; color: var(--dim); letter-spacing: 0; }
  #edPal button.on { border-color: var(--blue); background: #33406a; }
  #edPal button.on b { color: var(--blue); }
  .edRow { display: flex; gap: 8px; }
  .edRow button { min-height: 46px; font-size: 12px; }
  .edStep { flex: 0 0 46px; font-size: 19px; letter-spacing: 0; }
  #edSize {
    align-self: center;
    flex: 0 0 auto;
    min-width: 48px;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.08em;
  }
  #edCode { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #edCode textarea {
    flex: 1;
    min-height: 116px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #1a2032;
    color: var(--ink);
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: none;
  }
  /* In a column flex box the shared button{flex:1} grows HEIGHT, which would
     make Import as tall as the box it reads from. */
  #edImport { flex: 0 0 auto; }
</style>

    </button>

<script>
// ===NEST-ENGINE-START===
// Pure engine: no DOM, no window, no Date, no Math.random below this line.
// solve.mjs extracts this block verbatim and runs it headless.

const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };

// Direction of travel -> the door you arrive inside when entering a block,
// and the door you leave through when walking outward.
const FACE = { R: 'W', L: 'E', D: 'N', U: 'S' };
// Inward normal of each door side.
const INWARD = { N: [0, 1], S: [0, -1], W: [1, 0], E: [-1, 0] };

const LEVELS = [
  { name: 'First Steps', par: 2, stretch: false, requires: ['push'], rows: [
    '#####',
    '#.*.#',
    '#.$.#',
    '#@..#',
    '#####',
  ]},
  { name: 'Corners', par: 7, stretch: false, requires: ['push'], rows: [
    '######',
    '#....#',
    '#.$*.#',
    '#.$.*#',
    '#@...#',
    '######',
  ]},
  { name: 'Through the Looking Glass', par: 5, stretch: false, requires: ['enter'], rows: [
    '#######',
    '#..#..#',
    '-N@#$.-',
    '#..#..#',
    '#..#*.#',
    '#..#..#',
    '#######',
  ]},
  // T15 re-bake: par 9 -> 8, the optimal now follows the posted box through.
  { name: 'Special Delivery', par: 8, stretch: false, requires: ['boxin', 'enter'], rows: [
    '#####-##',
    '#@.#..*#',
    '#$.#...#',
    '#N.#...-',
    '#..#...#',
    '#..#...#',
    '#..#...#',
    '########',
  ]},
  { name: 'Out the Back', par: 8, stretch: false, requires: ['exit'], rows: [
    '########',
    '#..#...#',
    '-.@#...#',
    '#..#.N.#',
    '#..#*$.#',
    '#..#...#',
    '#..#...#',
    '########',
  ]},
  { name: 'Ashes', par: 11, stretch: false, requires: ['sink'], rows: [
    '#######',
    '#@....#',
    '#.$~*.#',
    '#.$~..#',
    '#..~..#',
    '#.....#',
    '#######',
  ]},
  // T15 tweak: (5,2) walled so the posted box cannot be chain-pushed off the
  // N arrival - without it this level's optimal collapsed into Special
  // Delivery's follow-through line and the choose-your-face TEACH died.
  { name: 'The Moat', par: 14, stretch: false, requires: ['boxin', 'enter'], rows: [
    '#####-##',
    '#..~..*#',
    '#$.~.#.#',
    '#N.~...-',
    '#@.~~~~#',
    '#......#',
    '#......#',
    '########',
  ]},
  { name: 'Twins', par: 4, stretch: true, requires: ['exit', 'spawn'], rows: [
    '#######',
    '-..N..#',
    '#@.$*.#',
    '#######',
    '#..N..#',
    '#..$*.#',
    '#######',
  ]},
  { name: 'Sidestep', par: 5, stretch: true, requires: ['exit', 'spawn'], rows: [
    '#######',
    '-..N..#',
    '#@.$*##',
    '#######',
    '#..N..#',
    '#..$.*#',
    '#######',
  ]},
  // T13 rebuild of Reunion: walk-merge is gone, so the herding dance IS the
  // level. The spare is held against the (4,3) wall while the leader works;
  // the (5,2) hostage punishes a careless final U, the (3,3) hostage
  // punishes tailgating deeper than one cell.
  { name: 'Hold Still', par: 7, stretch: true, requires: ['spawn'], rows: [
    '########',
    '#####.##',
    '##*..B##',
    '##$B#.N#',
    '##....N#',
    '-.######',
    '#@######',
    '########',
  ]},
  { name: 'Loaves', par: 9, stretch: true, requires: ['boxout', 'spawn'], rows: [
    '#######',
    '#..@..#',
    '#.N.N.#',
    '#*...*#',
    '#..$..#',
    '#.....#',
    '###-###',
  ]},
  // T14 re-tag: with bodies filling pits, the optimal line burns a spawned
  // self into the (6,2) pit instead of sacrificing a box - mint, spend, burn,
  // now literal. Box-sink stays taught (and required) in Ashes.
  { name: 'Nest', par: 14, stretch: true, requires: ['exit', 'spawn', 'fill', 'boxout'], rows: [
    '######-###',
    '###*##.#*#',
    '###N##~#N#',
    '###......#',
    '###B#.$#.#',
    '###~#....#',
    '#####.$###',
    '#@###..###',
    '#.########',
    '#-########',
  ]},
];

// Interior cell just inside a door threshold; null if that side has no door.
function arrivalCell(layout, side) {
  const t = layout.doors[side];
  if (t === null) return null;
  const [dx, dy] = INWARD[side];
  return t + dy * layout.w + dx;
}

function parseLevel(def) {
  const fail = (msg) => { throw new Error(def.name + ': ' + msg); };
  const rows = def.rows;
  const h = rows.length;
  const w = rows[0].length;
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) fail('row ' + y + ' is ' + rows[y].length + ' wide, expected ' + w);
  }

  const walls = new Set(), targets = new Set(), lava = new Set();
  const blocks = [], clones = [], boxes = [];
  const doors = { N: null, S: null, W: null, E: null };

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      const i = y * w + x;
      const at = ' at (' + x + ',' + y + ')';
      const onRing = x === 0 || y === 0 || x === w - 1 || y === h - 1;
      if (onRing && ch !== '#' && ch !== '-') fail('boundary must be # or -, found ' + ch + at);
      if (ch === '-' && !onRing) fail('door is not on the boundary ring' + at);

      switch (ch) {
        case '#': walls.add(i); break;
        case '.': break;
        case '*': targets.add(i); break;
        case '~': lava.add(i); break;
        case 'N': blocks.push(i); break;
        case '@': clones.push(i); break;
        case '$': boxes.push(i); break;
        case 'B': boxes.push(i); targets.add(i); break;
        case 'P': clones.push(i); targets.add(i); break;
        case '-': {
          const vertical = y === 0 || y === h - 1;
          const horizontal = x === 0 || x === w - 1;
          if (vertical && horizontal) fail('door in a corner' + at);
          const side = y === 0 ? 'N' : y === h - 1 ? 'S' : x === 0 ? 'W' : 'E';
          if (doors[side] !== null) fail('more than one ' + side + ' door');
          doors[side] = i;
          break;
        }
        default: fail('unknown glyph ' + ch + at);
      }
    }
  }

  if (clones.length === 0) fail('no clone start (@)');
  if (!def.stretch && blocks.length > 1) fail('non-stretch level has ' + blocks.length + ' nest blocks');

  const layout = {
    w, h, walls, targets, lava,
    blocks: blocks.sort((a, b) => a - b),
    doors,
  };

  for (const side of ['N', 'S', 'W', 'E']) {
    const a = arrivalCell(layout, side);
    if (a !== null && walls.has(a)) fail(side + ' door opens onto a wall');
  }

  const state = {
    clones: clones.sort((a, b) => a - b),
    boxes: boxes.sort((a, b) => a - b),
    filled: [],
  };
  return { layout, state };
}

function isWin(layout, state) {
  const boxSet = new Set(state.boxes);
  for (const t of layout.targets) if (!boxSet.has(t)) return false;
  return true;
}

// One tick. Pure: inputs are never mutated. Phase A resolves grid moves in
// sweep order; Phase B resolves portal transfers against the settled board.
function step(layout, state, dir) {
  const [dx, dy] = DIRS[dir];
  const w = layout.w;
  const delta = dy * w + dx;

  const filled = new Set(state.filled);
  const thresholds = new Set();
  for (const side of ['N', 'S', 'W', 'E']) {
    if (layout.doors[side] !== null) thresholds.add(layout.doors[side]);
  }
  const lavaOpen = (i) => layout.lava.has(i) && !filled.has(i);

  // occ: idx -> 'wall' | 'block' | 'box' | clone id (number). Live-updated.
  const occ = new Map();
  for (const i of layout.walls) occ.set(i, 'wall');
  for (const i of layout.blocks) occ.set(i, 'block');
  for (const i of state.boxes) occ.set(i, 'box');
  const clones = state.clones.map((pos, id) => ({ id, pos, alive: true }));
  let nextId = clones.length;
  for (const c of clones) occ.set(c.pos, c.id);

  const events = [];
  const moveClone = (c, to) => {
    events.push({ t: 'step', from: c.pos, to });
    occ.delete(c.pos);
    occ.set(to, c.id);
    c.pos = to;
  };
  // A box landing on unfilled lava (portal arrival or mouth) sinks like a push.
  const settleBox = (to) => {
    if (lavaOpen(to)) {
      filled.add(to);
      events.push({ t: 'sink', at: to });
    } else {
      occ.set(to, 'box');
    }
  };

  // Sweep: furthest along dir first, ties by idx ascending.
  const along = (pos) =>
    dir === 'R' ? -(pos % w) :
    dir === 'L' ? pos % w :
    dir === 'D' ? -Math.floor(pos / w) :
    Math.floor(pos / w);
  const order = clones.slice().sort((a, b) => along(a.pos) - along(b.pos) || a.pos - b.pos);

  const pendingEnter = [];
  const pendingExit = [];
  const pendingFollow = [];
  const pending = new Set(); // ids of clones whose move resolves in Phase B

  // PHASE A - grid moves.
  for (const c of order) {
    const dest = c.pos + delta;
    if (thresholds.has(dest)) { pendingExit.push(c); pending.add(c.id); continue; }
    const o = occ.get(dest);
    if (o === 'wall') continue;
    if (o === 'block') { pendingEnter.push(c); pending.add(c.id); continue; }
    if (o === 'box') {
      const bdest = dest + delta;
      if (thresholds.has(bdest)) {
        // Box pushed out through a door: fires at every free block mouth.
        const fired = [];
        for (const b of layout.blocks) {
          const m = b + delta;
          if (thresholds.has(m) || occ.get(m) !== undefined) continue;
          fired.push(m);
        }
        if (fired.length === 0) continue; // blocked
        occ.delete(dest);
        fired.forEach((m, k) => {
          events.push({ t: 'boxout', from: dest, to: m, spawned: k > 0 });
          settleBox(m);
        });
        moveClone(c, dest);
        continue;
      }
      const ob = occ.get(bdest);
      if (ob === 'block') {
        const arr = arrivalCell(layout, FACE[dir]);
        if (arr === null || occ.has(arr)) continue; // no matching door, or arrival taken
        occ.delete(dest);
        events.push({ t: 'boxin', from: dest, block: bdest, to: arr });
        settleBox(arr);
        moveClone(c, dest);
        continue;
      }
      if (ob !== undefined) continue; // wall, box or clone: blocked, no multi-push
      if (lavaOpen(bdest)) {
        occ.delete(dest);
        filled.add(bdest);
        events.push({ t: 'sink', at: bdest });
        moveClone(c, dest);
        continue;
      }
      occ.delete(dest);
      occ.set(bdest, 'box');
      events.push({ t: 'push', from: dest, to: bdest });
      moveClone(c, dest);
      continue;
    }
    if (typeof o === 'number') {
      // Walking into a self never merges (merge is portal-only). If the
      // occupant is itself waiting on a portal transfer, follow it in
      // Phase B once it has actually vacated; a blocked self is a wall.
      if (pending.has(o)) { pendingFollow.push(c); pending.add(c.id); }
      continue;
    }
    if (lavaOpen(dest)) {
      // T14: the body fills the pit - cell becomes floor for everyone after.
      events.push({ t: 'step', from: c.pos, to: dest });
      events.push({ t: 'die', at: dest });
      events.push({ t: 'fill', at: dest });
      filled.add(dest);
      occ.delete(c.pos);
      c.alive = false;
      continue;
    }
    moveClone(c, dest);
  }

  // PHASE B - portal transfers, against post-Phase-A occupancy.
  const enterArr = arrivalCell(layout, FACE[dir]);
  const pushedTo = new Set(); // boxes already shoved once this phase stay put
  for (const c of pendingEnter) {
    if (!c.alive) continue;
    if (enterArr === null) continue; // no door on that side: stays put
    const block = c.pos + delta;
    const o = occ.get(enterArr);
    if (o === c.id) {
      // Self-arrival: legal, ends where it started.
      events.push({ t: 'enter', from: c.pos, block, to: enterArr });
      continue;
    }
    if (o === 'box') {
      // T15: the door is just floor - coming through it shoves the arrival
      // box one cell onward (same direction: the entry face's inward normal
      // IS the direction of travel). Shoving it into another block or out a
      // door would move one box through two portals in a tick: blocked,
      // recorded as an open question rather than improvised.
      const bdest = enterArr + delta;
      if (thresholds.has(bdest) || occ.has(bdest)) continue; // stays put
      occ.delete(enterArr);
      if (lavaOpen(bdest)) {
        filled.add(bdest);
        events.push({ t: 'sink', at: bdest });
      } else {
        occ.set(bdest, 'box');
        pushedTo.add(bdest);
        events.push({ t: 'push', from: enterArr, to: bdest });
      }
      events.push({ t: 'enter', from: c.pos, block, to: enterArr });
      occ.delete(c.pos);
      occ.set(enterArr, c.id);
      c.pos = enterArr;
      continue;
    }
    if (o === 'wall' || o === 'block') continue; // stays put
    if (typeof o === 'number') {
      events.push({ t: 'merge', at: enterArr, from: c.pos });
      occ.delete(c.pos);
      c.alive = false;
      continue;
    }
    events.push({ t: 'enter', from: c.pos, block, to: enterArr });
    occ.delete(c.pos);
    if (lavaOpen(enterArr)) {
      events.push({ t: 'die', at: enterArr });
      events.push({ t: 'fill', at: enterArr });
      filled.add(enterArr);
      c.alive = false;
      continue;
    }
    occ.set(enterArr, c.id);
    c.pos = enterArr;
  }

  for (const c of pendingExit) {
    if (!c.alive) continue;
    const from = c.pos;
    const fired = [];
    for (const b of layout.blocks) {
      const m = b + delta;
      if (thresholds.has(m)) continue;
      const om = occ.get(m);
      if (om === 'wall' || om === 'block') continue; // does not fire
      if (om === 'box') {
        // T15: the exiting body pushes the mouth box one cell onward; if
        // the box cannot move (or was already shoved this phase), the
        // mouth does not fire. Into a block/threshold = two portals in one
        // tick: blocked, open question. Fan-out mouths stay independent.
        const bd = m + delta;
        if (pushedTo.has(m) || thresholds.has(bd) || occ.has(bd)) continue;
        occ.delete(m);
        if (lavaOpen(bd)) {
          filled.add(bd);
          events.push({ t: 'sink', at: bd });
        } else {
          occ.set(bd, 'box');
          pushedTo.add(bd);
          events.push({ t: 'push', from: m, to: bd });
        }
        fired.push({ m, kind: 'free' });
        continue;
      }
      if (typeof om === 'number' && om !== c.id) fired.push({ m, kind: 'merge' });
      else if (lavaOpen(m)) fired.push({ m, kind: 'die' });
      else fired.push({ m, kind: 'free' }); // om === c.id: occ ignores c itself
    }
    if (fired.length === 0) continue; // stays put
    occ.delete(from);
    c.alive = false;
    fired.forEach((f, k) => {
      if (f.kind === 'merge') {
        events.push({ t: 'merge', at: f.m, from });
        return;
      }
      events.push({ t: 'exit', from, to: f.m, spawned: k > 0 });
      if (f.kind === 'die') {
        events.push({ t: 'die', at: f.m });
        events.push({ t: 'fill', at: f.m });
        filled.add(f.m);
        return;
      }
      if (!c.alive) {
        c.alive = true;
        c.pos = f.m;
        occ.set(f.m, c.id);
      } else {
        const n = { id: nextId++, pos: f.m, alive: true };
        clones.push(n);
        occ.set(f.m, n.id);
      }
    });
  }

  // Followers: clones that walked into a portal-pending self. Sweep order put
  // each one after its leader, so chains march in a train. If the leader's
  // transfer failed (or self-arrived), its cell is still taken: stay put.
  for (const c of pendingFollow) {
    if (!c.alive) continue;
    const dest = c.pos + delta;
    if (occ.has(dest)) continue;
    moveClone(c, dest);
  }

  const outBoxes = [];
  for (const [i, v] of occ) if (v === 'box') outBoxes.push(i);
  const outState = {
    clones: clones.filter(c => c.alive).map(c => c.pos).sort((a, b) => a - b),
    boxes: outBoxes.sort((a, b) => a - b),
    filled: Array.from(filled).sort((a, b) => a - b),
  };
  return { state: outState, events, changed: events.length > 0, win: isWin(layout, outState) };
}
// ===NEST-ENGINE-END===


// --- Game shell -------------------------------------------------------------

const $ = (id) => document.getElementById(id);
const stage = $('stage');
const board = $('board');
const ctx = board.getContext('2d');
const world = $('world');
const wctx = world.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

const TWEEN = 100;   // ms per tick of animation
const PORTAL = 180;  // ...but going through a door is worth watching
const FLASH = 260;   // ms for merge rings and death flares
const BLOOM = 800;   // ms for the win cascade
const DEPTH = 3;     // feedback passes on top of the flat pass
const BLOCK_INSET = 0.07;  // bezel around the little world, in cells
const OUTER_DIM = 0.24;    // how loud the parent world is allowed to be
const OUTER_RES = 0.5;     // ...and it gets blown up ~10x, so half-res is plenty

let levelIndex = 0;  // index into LEVELS, or -1 while playtesting a draft
let levelDef = null; // the live definition: a LEVELS entry, or an editor draft
let layout = null, state = null;
let history = [], moves = 0, won = false;
let sprites = [];
let anim = null;     // { t0, p, flashes: [{at, kind}] }
let bloom = null;    // { t0, p }
let bonkAt = null, bonkVec = [0, 0];
let CELL = 24;
let dirty = true;

// Offscreen ping-pong buffers for the feedback recursion.
const bufA = document.createElement('canvas');
const bufB = document.createElement('canvas');
let ctxA = bufA.getContext('2d');
let ctxB = bufB.getContext('2d');
let curBuf = bufA, altBuf = bufB;

// One more buffer for the world OUTSIDE the board: the same level again, blown
// up so our board lands exactly in one of its nest-block cells.
const bufC = document.createElement('canvas');
const ctxC = bufC.getContext('2d');
let outer = null;    // { x, y, w, h } placement of that giant copy, or null

// --- Persistence ------------------------------------------------------------

const SAVE_KEY = 'nest-v3'; // v2 bests predate the T13-T15 rule campaign
let progress = { best: {}, unlocked: 1, coached: {} };

function loadProgress() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw && typeof raw === 'object') {
      progress.best = raw.best || {};
      progress.unlocked = Math.min(LEVELS.length, Math.max(1, raw.unlocked | 0 || 1));
      progress.coached = raw.coached || {};
      if (raw.audio) audio = { sfx: raw.audio.sfx ? 1 : 0, music: raw.audio.music ? 1 : 0 };
    }
  } catch (e) { /* private mode or a corrupt blob: start fresh */ }
}
function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {}
}

function xOf(i) { return i % layout.w; }
function yOf(i) { return Math.floor(i / layout.w); }
function lerp(a, b, t) { return a + (b - a) * t; }

function loadLevel(i) { levelIndex = i; startLevel(LEVELS[i]); }

// An editor draft rides the same path but owns no slot in LEVELS, so
// levelIndex goes to -1 and every progress write is gated on it.
function playDraft(def) { levelIndex = -1; startLevel(def); }

function startLevel(def) {
  levelDef = def;
  const parsed = parseLevel(def);
  layout = parsed.layout;
  state = parsed.state;
  history = [];
  moves = 0;
  won = false;
  anim = null;
  bloom = null;
  closeOverlays();
  hideToast();
  showCoach(levelIndex);
  $('levels').textContent = levelIndex < 0 ? 'Editor' : 'Levels';
  resize();
  settle();
}

// --- Overlays and coach marks -----------------------------------------------

const COACH = {
  0: 'Swipe to move',
  2: 'That little world is this one',
  4: 'Doors go both ways',
};

function overlayOpen() {
  return !$('overlay').hidden || !$('picker').hidden || !$('editor').hidden;
}
function closeOverlays() {
  $('overlay').hidden = true; $('picker').hidden = true; $('editor').hidden = true;
}

function showCoach(i) {
  const msg = COACH[i];
  $('coach').hidden = !msg || !!progress.coached[i];
  if (msg) $('coach').textContent = msg;
}
function dismissCoach() {
  if ($('coach').hidden) return;
  $('coach').hidden = true;
  progress.coached[levelIndex] = 1;
  saveProgress();
}

// One tile-maker for both lists: the level picker and the editor's drafts.
function tile(num, title, note, onPick) {
  const b = document.createElement('button');
  b.className = 'lv';
  b.innerHTML = '<b>' + num + '</b>';
  b.appendChild(document.createTextNode(title));
  b.appendChild(document.createElement('br'));
  const small = document.createElement('small');
  small.textContent = note;
  b.appendChild(small);
  if (onPick) b.addEventListener('click', onPick);
  $('grid').appendChild(b);
  return b;
}

function openPicker() {
  const grid = $('grid');
  $('pickerTitle').textContent = 'Levels';
  grid.textContent = '';
  LEVELS.forEach((def, i) => {
    const locked = i >= progress.unlocked;
    const best = progress.best[i];
    const note = locked ? '\u{1F512}' : best !== undefined ? 'best ' + best : 'unsolved';
    const b = tile(i + 1, def.name, note,
      locked ? null : () => { play('ui'); loadLevel(i); });
    if (locked) b.classList.add('locked');
    if (i === levelIndex) b.classList.add('here');
  });
  tile('+', 'New level', 'editor', () => { play('ui'); openEditor(); });
  $('overlay').hidden = true;
  $('picker').hidden = false;
}

// Drop any animation and show the current state exactly.
function settle() {
  anim = null;
  sprites = buildSprites();
  syncHud();
}

function syncHud() {
  const def = levelDef;
  $('levelName').textContent = def.name;
  $('moves').textContent = def.par ? moves + '/' + def.par : String(moves);
  const chip = $('selves');
  chip.hidden = state.clones.length < 2;
  chip.textContent = '@ x' + state.clones.length;
  if (!won && state.clones.length === 0) showToast('No one left.');
  else hideToast();
  dirty = true;
}

function buildSprites() {
  const list = [];
  for (const i of state.clones) list.push({ kind: 'clone', a: i, b: i, fate: null, birth: null });
  for (const i of state.boxes) list.push({ kind: 'box', a: i, b: i, fate: null, birth: null });
  return list;
}

function showToast(msg) {
  $('toast').textContent = msg;
  $('toast').hidden = false;
  $('undo').classList.add('pulse');
}
function hideToast() {
  $('toast').hidden = true;
  $('undo').classList.remove('pulse');
}

function buzz(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// Which face of a block a body pinches into, and which it grows back out of,
// for a given direction of travel. Both are the door of the same name.
const IN_FACE = { R: 'W', L: 'E', D: 'N', U: 'S' };
const OUT_FACE = { R: 'E', L: 'W', D: 'S', U: 'N' };

// Turn one tick's events into sprites that carry their own animation.
// Sprites are tracked by the cell they currently occupy, so a chain like
// step -> die or enter -> die lands on the same sprite.
function compileAnim(prev, events, dir) {
  const [dx, dy] = DIRS[dir];
  const delta = dy * layout.w + dx;
  const list = [];
  for (const i of prev.clones) list.push({ kind: 'clone', a: i, b: i, fate: null, birth: null, live: true });
  for (const i of prev.boxes) list.push({ kind: 'box', a: i, b: i, fate: null, birth: null, live: true });
  const flashes = [];
  const sank = [];
  const at = (kind, idx) => list.find(s => s.live && s.kind === kind && s.b === idx);
  // Portal sprites squash and stretch along the direction they travelled.
  const axis = (s) => { s.axis = dx !== 0 ? 'x' : 'y'; return s; };

  for (const ev of events) {
    switch (ev.t) {
      case 'step': case 'push': {
        const s = at(ev.t === 'step' ? 'clone' : 'box', ev.from);
        if (s) s.b = ev.to;
        break;
      }
      case 'enter': case 'boxin': {
        const kind = ev.t === 'enter' ? 'clone' : 'box';
        const s = at(kind, ev.from);
        // Pinch into the door mouth on the face we entered by, not the middle
        // of the block: that mouth is where the little world's door is drawn.
        if (s) {
          s.b = ev.block; s.bxy = mouthXY(ev.block, IN_FACE[dir]);
          s.fate = 'squeeze'; s.live = false; axis(s);
        }
        // The copy threads in through the door face while the original
        // squeezes into the block - both halves of the same body.
        list.push(axis({
          kind, a: ev.to, b: ev.to, fate: null, birth: 'pop', live: true,
          axy: [xOf(ev.to) - dx * 0.5, yOf(ev.to) - dy * 0.5],
        }));
        flashes.push({ at: ev.block, kind: 'in' });
        break;
      }
      case 'exit': case 'boxout': {
        const kind = ev.t === 'exit' ? 'clone' : 'box';
        if (!ev.spawned) {
          const s = at(kind, ev.from);
          // Walking off the edge: step past it in grid COORDS, since from+delta
          // wraps onto the next row.
          if (s) {
            s.fate = 'squeeze'; s.live = false;
            s.bxy = [xOf(ev.from) + dx, yOf(ev.from) + dy];
            axis(s);
          }
        }
        // ...and grow back out of the mouth on the far face.
        list.push(axis({
          kind, a: ev.to - delta, b: ev.to, fate: null, birth: 'pop', live: true,
          axy: mouthXY(ev.to - delta, OUT_FACE[dir]),
        }));
        flashes.push({ at: ev.to, kind: 'out' });
        break;
      }
      case 'merge': {
        const s = at('clone', ev.from);
        if (s) { s.b = ev.at; s.fate = 'merge'; s.live = false; }
        flashes.push({ at: ev.at, kind: 'merge' });
        break;
      }
      case 'die': {
        const s = at('clone', ev.at);
        if (s) { s.fate = 'die'; s.live = false; }
        flashes.push({ at: ev.at, kind: 'die' });
        break;
      }
      case 'sink': {
        const s = at('box', ev.at) || at('box', ev.at - delta);
        if (s) { s.b = ev.at; s.fate = 'sink'; s.live = false; }
        sank.push(ev.at);
        break;
      }
      case 'fill': {
        // A body filled the pit: the die case already animates the fall,
        // this just cools the cell over the same tween.
        sank.push(ev.at);
        break;
      }
    }
  }
  return { list, flashes, sank };
}

function applyMove(dir) {
  if (won || overlayOpen()) return;
  dismissCoach();
  const r = step(layout, state, dir);
  if (!r.changed) {
    bonkAt = performance.now();
    bonkVec = DIRS[dir];
    buzz(20);
    play('bonk');
    return;
  }
  history.push(state);
  if (history.length > 1000) history.shift();
  const prev = state;
  state = r.state;
  moves++;
  won = r.win;

  const kinds = new Set(r.events.map(e => e.t));
  if (reducedMotion.matches) {
    settle();
  } else {
    const { list, flashes, sank } = compileAnim(prev, r.events, dir);
    const portal = ['enter', 'exit', 'boxin', 'boxout'].some(t => kinds.has(t));
    sprites = list;
    anim = { t0: performance.now(), p: 0, dur: portal ? PORTAL : TWEEN, flashes, sank };
    syncHud();
  }

  if (won) buzz([30, 50, 30]);
  else if (kinds.has('die') || kinds.has('merge')) buzz(40);
  else buzz(10);
  moveSfx(r.events, kinds, won);

  if (won) {
    bloom = reducedMotion.matches ? null : { t0: performance.now(), p: 0 };
    const at = levelIndex;
    setTimeout(() => { if (won && levelIndex === at) showWin(); },
      reducedMotion.matches ? 0 : BLOOM * 0.55);
  }
}

function undo() {
  if (!history.length) return;
  play('undo');
  state = history.pop();
  moves = Math.max(0, moves - 1);
  won = false;
  bloom = null;
  closeOverlays();
  settle();
}

function reset() {
  play('reset');
  if (history.length) state = history[0];
  history = [];
  moves = 0;
  won = false;
  bloom = null;
  closeOverlays();
  settle();
}

function showWin() {
  hideToast();
  const def = levelDef;
  const draft = levelIndex < 0;
  if (!draft) {
    const prevBest = progress.best[levelIndex];
    if (prevBest === undefined || moves < prevBest) progress.best[levelIndex] = moves;
    progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, levelIndex + 2));
    saveProgress();
  }

  $('cardTitle').textContent = 'Solved';
  let body = 'in ' + moves + ' moves' + (def.par ? ' (par ' + def.par + ')' : '');
  if (draft) body += ' · draft';
  else if (progress.best[levelIndex] < moves) body += ' · best ' + progress.best[levelIndex];
  $('cardBody').textContent = body;
  $('next').hidden = draft || levelIndex >= LEVELS.length - 1;
  $('toLevels').textContent = draft ? 'Editor' : 'Levels';
  $('overlay').hidden = false;
}

// --- Renderer ---------------------------------------------------------------

function resize() {
  const availW = stage.clientWidth;
  const availH = stage.clientHeight;
  CELL = Math.max(10, Math.floor(Math.min(availW / layout.w, availH / layout.h)));
  const cssW = layout.w * CELL, cssH = layout.h * CELL;
  board.style.width = cssW + 'px';
  board.style.height = cssH + 'px';
  for (const cv of [board, bufA, bufB]) {
    cv.width = Math.round(cssW * DPR);
    cv.height = Math.round(cssH * DPR);
  }
  bufC.width = Math.max(1, Math.round(cssW * DPR * OUTER_RES));
  bufC.height = Math.max(1, Math.round(cssH * DPR * OUTER_RES));
  world.width = Math.round(availW * DPR);
  world.height = Math.round(availH * DPR);
  placeOuter();
  dirty = true;
}

// Where to put the giant copy of this level so that our board lands exactly in
// one of its nest-block cells. The scale falls out of drawBlock's own fit: if a
// block cell shows the world at k, the parent showing US must be 1/k bigger.
// With several blocks we live in the first one - a fixed choice, so the
// backdrop does not swim about as clones come and go.
function placeOuter() {
  const b = layout.blocks[0];
  if (b === undefined) { outer = null; return; }
  const m = miniGeom();
  const s = 1 / m.k;
  const dx = (xOf(b) + m.ox) * CELL, dy = (yOf(b) + m.oy) * CELL;
  outer = {
    x: board.offsetLeft - dx * s, y: board.offsetTop - dy * s,
    w: layout.w * CELL * s, h: layout.h * CELL * s,
  };
}

// Where the little world sits inside a nest-block cell, as fractions of the
// cell (CELL cancels out, so this is resolution independent). Mini-cell
// (mx, my) centres at ox + k * (mx + 0.5) along the cell.
function miniGeom() {
  const fit = 1 - BLOCK_INSET * 2;
  const k = Math.min(fit / layout.w, fit / layout.h);
  return {
    k,
    ox: BLOCK_INSET + (fit - layout.w * k) / 2,
    oy: BLOCK_INSET + (fit - layout.h * k) / 2,
  };
}

// How far along a block face (0..1) that side's door shows in the little world.
// The frame gap, the door glow inside and the squeeze anchor all read this, so
// by construction they land on the same point.
function doorFrac(side) {
  const d = layout.doors[side];
  if (d === null) return 0.5;
  const m = miniGeom();
  return side === 'N' || side === 'S'
    ? m.ox + m.k * (xOf(d) + 0.5)
    : m.oy + m.k * (yOf(d) + 0.5);
}

// The door mouth on one face of a block cell, in sprite grid coords: the point
// a body pinches into, and the point its copy grows out of.
function mouthXY(block, side) {
  const f = doorFrac(side), bx = xOf(block), by = yOf(block);
  if (side === 'N') return [bx - 0.5 + f, by - 0.5];
  if (side === 'S') return [bx - 0.5 + f, by + 0.5];
  if (side === 'W') return [bx - 0.5, by - 0.5 + f];
  return [bx + 0.5, by - 0.5 + f];
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// T14: pits are chilled holes, not fire - a body or a box fills one into
// floor. Static (no time pulse), so idle frames can skip repainting.
function drawPit(c, x, y) {
  const inset = CELL * 0.09;
  const s = CELL - inset * 2;
  const r = Math.max(2, CELL * 0.2);
  roundRect(c, x + inset, y + inset, s, s, r);
  c.fillStyle = '#0b0f1a';
  c.fill();
  // Inner shadow: deepest under the top lip, as if lit from above.
  const g = c.createLinearGradient(0, y + inset, 0, y + inset + s);
  g.addColorStop(0, 'rgba(0,0,0,0.8)');
  g.addColorStop(0.55, 'rgba(0,0,0,0)');
  c.fillStyle = g;
  roundRect(c, x + inset, y + inset, s, s, r);
  c.fill();
  // The far lip catches a sliver of light.
  c.strokeStyle = 'rgba(147,160,189,0.16)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(x + inset + r, y + inset + s - 0.5);
  c.lineTo(x + inset + s - r, y + inset + s - 0.5);
  c.stroke();
}

// A filled pit: flat slab, walkable, visibly once-a-hole.
function drawSlab(c, x, y) {
  c.fillStyle = '#2e3752';
  c.fillRect(x, y, CELL, CELL);
  const inset = CELL * 0.09;
  c.strokeStyle = 'rgba(11,15,26,0.55)';
  c.lineWidth = 1;
  roundRect(c, x + inset, y + inset, CELL - inset * 2, CELL - inset * 2, Math.max(2, CELL * 0.2));
  c.stroke();
}

function drawTiles(c, time) {
  const { w, h } = layout;
  const filled = new Set(state.filled);
  const doorSet = new Set(Object.values(layout.doors).filter(v => v !== null));
  c.fillStyle = '#1e2433';
  c.fillRect(0, 0, w * CELL, h * CELL);
  for (let i = 0; i < w * h; i++) {
    const x = xOf(i) * CELL, y = yOf(i) * CELL;
    if (layout.walls.has(i)) {
      c.fillStyle = '#38466a';
      c.fillRect(x, y, CELL, CELL);
      c.fillStyle = 'rgba(255,255,255,0.13)';
      c.fillRect(x, y, CELL, Math.max(1, CELL * 0.14));
      c.strokeStyle = 'rgba(0,0,0,0.28)';
      c.lineWidth = 1;
      c.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
      continue;
    }
    c.fillStyle = '#232b40';
    c.fillRect(x, y, CELL, CELL);
    c.strokeStyle = 'rgba(255,255,255,0.035)';
    c.lineWidth = 1;
    c.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);

    if (layout.lava.has(i)) {
      // A pit filled this tick fades to slab over the tween instead of snapping.
      const cooling = filled.has(i) && anim && anim.sank.indexOf(i) >= 0 ? anim.p : null;
      if (!filled.has(i) || cooling !== null) drawPit(c, x, y);
      if (filled.has(i)) {
        c.save();
        if (cooling !== null) c.globalAlpha = cooling;
        drawSlab(c, x, y);
        c.restore();
      }
    }

    if (doorSet.has(i)) {
      const k = 0.42 + 0.12 * Math.sin(time / 520 + i);
      const g = c.createRadialGradient(
        x + CELL / 2, y + CELL / 2, 0, x + CELL / 2, y + CELL / 2, CELL * 0.9);
      g.addColorStop(0, 'rgba(167,139,250,' + k.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(167,139,250,0)');
      c.fillStyle = g;
      c.fillRect(x - CELL / 2, y - CELL / 2, CELL * 2, CELL * 2);
    }

    if (layout.targets.has(i)) {
      c.save();
      c.translate(x + CELL / 2, y + CELL / 2);
      c.rotate(Math.PI / 4);
      const s = CELL * 0.34;
      c.strokeStyle = 'rgba(233,237,247,0.55)';
      c.lineWidth = Math.max(1, CELL * 0.055);
      c.strokeRect(-s / 2, -s / 2, s, s);
      c.restore();
    }
  }
}

// Frame edges break open on sides where the level has a door, so the block
// itself shows which faces can be walked (or have a box pushed) into.
function drawBlockFrame(c, x, y) {
  const lw = Math.max(1, CELL * 0.06);
  // The gap IS the door cell at miniature scale, sat at the same fraction along
  // the face as the door glow inside it.
  const gap = Math.max(miniGeom().k * CELL, 3);
  const x0 = x + lw / 2, y0 = y + lw / 2;
  const x1 = x + CELL - lw / 2, y1 = y + CELL - lw / 2;
  c.save();
  c.strokeStyle = 'rgba(167,139,250,0.95)';
  c.shadowColor = 'rgba(167,139,250,0.5)';
  c.shadowBlur = CELL * 0.22;
  c.lineWidth = lw;
  c.lineCap = 'round';
  // Every edge is passed low-to-high along its one varying axis.
  const edge = (ax, ay, bx, by, side) => {
    c.beginPath();
    if (layout.doors[side] === null) {
      c.moveTo(ax, ay); c.lineTo(bx, by);
    } else {
      const horiz = ay === by;
      const lo = horiz ? ax : ay, hi = horiz ? bx : by;
      const at = (horiz ? x : y) + doorFrac(side) * CELL;
      const g0 = Math.max(lo, at - gap / 2), g1 = Math.min(hi, at + gap / 2);
      if (g0 > lo) { c.moveTo(ax, ay); horiz ? c.lineTo(g0, ay) : c.lineTo(ax, g0); }
      if (g1 < hi) { horiz ? c.moveTo(g1, ay) : c.moveTo(ax, g1); c.lineTo(bx, by); }
    }
    c.stroke();
  };
  edge(x0, y0, x1, y0, 'N');
  edge(x1, y0, x1, y1, 'E');
  edge(x0, y1, x1, y1, 'S');
  edge(x0, y0, x0, y1, 'W');
  c.restore();
}

// inner = the previous pass's board, blitted in as the little world.
function drawBlock(c, i, inner) {
  const x = xOf(i) * CELL, y = yOf(i) * CELL;
  if (!inner) {
    const g = c.createLinearGradient(x, y, x, y + CELL);
    g.addColorStop(0, '#4c3b8a');
    g.addColorStop(1, '#2c2357');
    c.fillStyle = g;
    c.fillRect(x, y, CELL, CELL);
  } else {
    // Bezel first, then the whole little world (square, exact fit) inside it.
    const g = c.createLinearGradient(x, y, x, y + CELL);
    g.addColorStop(0, '#3a2d6e');
    g.addColorStop(1, '#241b4a');
    c.fillStyle = g;
    c.fillRect(x, y, CELL, CELL);
    const m = miniGeom();
    const dx = x + m.ox * CELL, dy = y + m.oy * CELL;
    const dw = layout.w * m.k * CELL, dh = layout.h * m.k * CELL;
    c.drawImage(inner, dx, dy, dw, dh);
    c.strokeStyle = 'rgba(167,139,250,0.4)';
    c.lineWidth = 1;
    c.strokeRect(dx - 0.5, dy - 0.5, dw + 1, dh + 1);
  }
  drawBlockFrame(c, x, y);
}

// The two halves of a pass-through share one tick: the body pinches away over
// the front of it and the copy grows over the back, overlapping just enough to
// read as one continuous motion rather than two things happening at once.
const SQUEEZE_WIN = [0, 0.62];
const POP_WIN = [0.45, 1];

function drawSprite(c, s, p) {
  const win = s.fate === 'squeeze' ? SQUEEZE_WIN
    : s.birth === 'pop' && !s.fate ? POP_WIN : null;
  if (win) p = Math.max(0, Math.min(1, (p - win[0]) / (win[1] - win[0])));
  const e = 1 - Math.pow(1 - p, 3);
  // Back-in for the pinch: a short brace away from the door, then a rush into
  // it. Everything else eases out.
  const eb = p * p * (3 * p - 2);
  const ax = s.axy ? s.axy[0] : xOf(s.a), ay = s.axy ? s.axy[1] : yOf(s.a);
  const bx = s.bxy ? s.bxy[0] : xOf(s.b), by = s.bxy ? s.bxy[1] : yOf(s.b);
  // The brace is mostly squash: pulling the whole body back would slide it into
  // whatever just shoved it, so damp the backwards part of the curve.
  const ep = s.fate === 'squeeze' ? (eb < 0 ? eb * 0.45 : eb) : e;
  let x = lerp(ax, bx, ep);
  let y = lerp(ay, by, ep);
  let scale = 1, alpha = 1;
  // Extra scale along / across the direction of travel: bodies go through a
  // door long and thin, and come out the far side stretched.
  let along = 1, across = 1;
  if (s.birth === 'pop') {
    scale = 0.34 + 0.66 * e;
    alpha = Math.min(1, e * 2.4);
    const st = Math.max(0, 1 - e * 1.45);                           // needle, gone by ~0.7
    const sq = Math.max(0, Math.sin((e - 0.55) / 0.45 * Math.PI));  // squash on the tail
    along = 1 + 0.85 * st - 0.16 * sq;
    across = 1 - 0.6 * st + 0.16 * sq;
  }
  if (s.fate === 'squeeze') {
    // brace = the anticipation part of the back-in curve: squash across the
    // door before the needle. Gone by the time the pinch proper starts.
    const pinch = Math.max(0, eb), brace = Math.max(0, -eb);
    scale *= 1 - 0.6 * pinch;
    alpha *= Math.max(0, 1 - 1.08 * pinch);
    along *= 1 + pinch - 1.1 * brace;
    across *= 1 - 0.65 * pinch + 1.5 * brace;
  }
  else if (s.fate === 'merge') { alpha *= 1 - Math.max(0, (e - 0.6) / 0.4); }
  else if (s.fate === 'die') { y += 0.3 * e; scale *= 1 - 0.8 * e; alpha *= 1 - e; }
  else if (s.fate === 'sink') { scale *= 1 - 0.7 * e; alpha *= 1 - 0.75 * e; }
  if (alpha <= 0.01) return;

  const pad = CELL * 0.15;
  const base = CELL - pad * 2;
  const horiz = s.axis === 'x';
  const sw = base * scale * (horiz ? along : across);
  const sh = base * scale * (horiz ? across : along);
  const cx = x * CELL + CELL / 2;
  const cy = y * CELL + CELL / 2;
  const r = Math.max(2, Math.min(sw, sh) * 0.26);
  c.save();
  c.globalAlpha = alpha;
  if (s.kind === 'clone') {
    c.shadowColor = 'rgba(63,155,244,0.5)';
    c.shadowBlur = CELL * 0.25;
    c.fillStyle = '#3f9bf4';
    roundRect(c, cx - sw / 2, cy - sh / 2, sw, sh, r);
    c.fill();
    c.shadowBlur = 0;
    c.fillStyle = 'rgba(255,255,255,0.6)';
    roundRect(c, cx - sw * 0.22, cy - sh * 0.3, sw * 0.44, sh * 0.2, Math.min(sw, sh) * 0.09);
    c.fill();
  } else {
    const onTarget = layout.targets.has(Math.round(y) * layout.w + Math.round(x));
    c.shadowColor = onTarget ? 'rgba(87,194,107,0.4)' : 'rgba(255,194,51,0.35)';
    c.shadowBlur = CELL * 0.2;
    c.fillStyle = onTarget ? '#57c26b' : '#ffc233';
    roundRect(c, cx - sw / 2, cy - sh / 2, sw, sh, r);
    c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = onTarget ? 'rgba(20,90,40,0.65)' : 'rgba(92,60,0,0.6)';
    c.lineWidth = Math.max(1, Math.min(sw, sh) * 0.08);
    roundRect(c, cx - sw / 2, cy - sh / 2, sw, sh, r);
    c.stroke();
  }
  c.restore();
}

function drawFlashes(c, time) {
  if (!anim) return;
  const p = Math.min(1, (time - anim.t0) / FLASH);
  if (p >= 1) return;
  for (const f of anim.flashes) {
    const cx = xOf(f.at) * CELL + CELL / 2;
    const cy = yOf(f.at) * CELL + CELL / 2;
    // Portal rings collapse inward where a body went in and bloom outward
    // where one came out; merge/death rings just expand.
    const portal = f.kind === 'in' || f.kind === 'out';
    const rad = f.kind === 'in' ? CELL * (0.74 - 0.42 * p) : CELL * (0.22 + 0.7 * p);
    c.save();
    c.globalAlpha = (1 - p) * (portal ? 0.55 : 1);
    c.strokeStyle = portal ? 'rgba(167,139,250,0.95)'
      : f.kind === 'merge' ? 'rgba(255,255,255,0.95)' : 'rgba(147,160,189,0.95)';
    c.shadowColor = c.strokeStyle;
    c.shadowBlur = CELL * 0.3;
    c.lineWidth = Math.max(1, CELL * (portal ? 0.05 : 0.09));
    c.beginPath();
    c.arc(cx, cy, rad, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }
}

// The win bloom is drawn inside every pass, so it cascades down the depths.
function drawBloom(c) {
  if (!bloom) return;
  const W = layout.w * CELL, H = layout.h * CELL;
  const g = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2,
    Math.max(W, H) * (0.15 + 0.85 * bloom.p));
  const a = (1 - bloom.p) * 0.5;
  g.addColorStop(0, 'rgba(120,225,150,' + a.toFixed(3) + ')');
  g.addColorStop(0.6, 'rgba(63,155,244,' + (a * 0.5).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(63,155,244,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
}

// bg = the parent pass: same world, but flashes and the win bloom stay home so
// the backdrop never strobes.
function drawScene(c, time, inner, bg, dpr) {
  c.setTransform(dpr || DPR, 0, 0, dpr || DPR, 0, 0);
  drawTiles(c, time);
  for (const b of layout.blocks) drawBlock(c, b, inner);
  const p = anim ? anim.p : 1;
  for (const s of sprites) drawSprite(c, s, p);
  if (bg) return;
  drawFlashes(c, time);
  drawBloom(c);
}

// One pass up instead of down: the same level again, huge and dim, with the
// finished board blitted back into it - so it goes on forever both ways.
function drawOuter(time) {
  wctx.setTransform(1, 0, 0, 1, 0, 0);
  wctx.clearRect(0, 0, world.width, world.height);
  if (!outer) return;
  drawScene(ctxC, time, curBuf, true, DPR * OUTER_RES);
  const cssW = world.width / DPR, cssH = world.height / DPR;
  wctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  wctx.globalAlpha = OUTER_DIM;
  wctx.drawImage(bufC, outer.x, outer.y, outer.w, outer.h);
  wctx.globalAlpha = 1;
  // Erase the far field so only the cell we live in reads as a shape.
  const cx = board.offsetLeft + layout.w * CELL / 2;
  const cy = board.offsetTop + layout.h * CELL / 2;
  const g = wctx.createRadialGradient(cx, cy, layout.w * CELL * 0.6,
    cx, cy, Math.max(cssW, cssH) * 0.8);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,1)');
  wctx.globalCompositeOperation = 'destination-out';
  wctx.fillStyle = g;
  wctx.fillRect(0, 0, cssW, cssH);
  wctx.globalCompositeOperation = 'source-over';
}

function render(time) {
  // Pass 0 flat, then DEPTH feedback passes: each one blits the previous
  // board into every nest block, so the picture nests into itself.
  drawScene(ctxA, time, null);
  for (let i = 0; i < DEPTH; i++) {
    drawScene(ctxB, time, curBuf);
    [curBuf, altBuf] = [altBuf, curBuf];
    [ctxA, ctxB] = [ctxB, ctxA];
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, board.width, board.height);
  ctx.drawImage(curBuf, 0, 0);
  drawOuter(time);
}

function frame(ts) {
  requestAnimationFrame(frame);
  let motion = false;
  if (anim) {
    anim.p = Math.min(1, (ts - anim.t0) / anim.dur);
    const flashing = ts - anim.t0 < FLASH;
    if (anim.p >= 1 && !flashing) sprites = buildSprites();
    if (anim.p >= 1 && !flashing) anim = null;
    motion = true;
  }
  if (bloom) {
    bloom.p = Math.min(1, (ts - bloom.t0) / BLOOM);
    if (bloom.p >= 1) bloom = null;
    motion = true;
  }
  if (bonkAt !== null) {
    const p = (ts - bonkAt) / 220;
    if (p >= 1) { bonkAt = null; board.style.transform = ''; }
    else {
      const k = Math.sin(p * Math.PI * 3) * (1 - p) * CELL * 0.22;
      board.style.transform =
        'translate(' + (k * bonkVec[0]).toFixed(2) + 'px,' + (k * bonkVec[1]).toFixed(2) + 'px)';
    }
  }
  // Pits are static now (T14 killed the ember flicker), so an idle board
  // never needs repainting.
  if (!motion && !dirty) return;
  render(ts);
  dirty = false;
}

// --- Audio ------------------------------------------------------------------
// Everything here is synthesized on the spot: no assets, no fetch, file:// safe.
// One context, built lazily on the first gesture because autoplay policy will
// not let us make a sound before that. Two buses (sfx / music) share one small
// synthetic room, so the squishy noises and the pad sound like they are in the
// same place.

const AC = window.AudioContext || window.webkitAudioContext;
const ROOT = 146.83;                    // D3, and everything hangs off it
const SCALE = [0, 3, 5, 7, 10];         // minor pentatonic: no wrong notes
const CHORDS = [[0, 3, 7, 14], [-4, 0, 3, 7], [3, 7, 10, 14], [-5, 2, 5, 10]];
const BASS = [-12, -4, -9, -5];
const STEP = 30 / 68;                   // one eighth note at 68bpm, seconds
const SFX_LEVEL = 0.5;
const MUSIC_LEVEL = 0.17;               // well under the sfx, as specified

// deg counts pentatonic steps from D3 and rolls over into the next octave.
function scaleHz(deg) {
  const o = Math.floor(deg / 5);
  return ROOT * Math.pow(2, (SCALE[deg - o * 5] + 12 * o) / 12);
}
function semi(n) { return ROOT * Math.pow(2, n / 12); }

let ac = null, acDead = false;
let sfxBus, sfxWet, musicBus, musicWet, verb, noiseBuf, delay, padFilter;
let audio = { sfx: 1, music: 1 };
let musicTimer = null, musicStep = 0, musicNext = 0, lastPluck = -9;
let stepDeg = 8;

// A short synthetic room: exponentially decaying noise. Enough to make a plop
// sound wet without smearing the pad.
function roomIR(secs) {
  const len = Math.floor(ac.sampleRate * secs);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.4) * Math.min(1, i / 240);
    }
  }
  return buf;
}

function ensureAudio() {
  if (acDead || !AC) return false;
  if (!ac) {
    try { ac = new AC(); } catch (e) { acDead = true; return false; }

    const out = ac.createDynamicsCompressor();
    out.threshold.value = -12; out.knee.value = 18; out.ratio.value = 5;
    out.attack.value = 0.005; out.release.value = 0.25;
    out.connect(ac.destination);

    verb = ac.createConvolver();
    verb.buffer = roomIR(1.9);
    const verbOut = ac.createGain();
    verbOut.gain.value = 0.7;
    verb.connect(verbOut); verbOut.connect(out);

    // Each bus has a dry leg and its own send, so muting a bus mutes its tail
    // too (the sends are fed by the voices, not by the bus).
    sfxBus = ac.createGain(); sfxWet = ac.createGain();
    musicBus = ac.createGain(); musicWet = ac.createGain();
    sfxBus.connect(out); sfxWet.connect(verb);
    musicBus.connect(out); musicWet.connect(verb);
    sfxBus.gain.value = audio.sfx ? SFX_LEVEL : 0;
    sfxWet.gain.value = audio.sfx ? 0.9 : 0;
    musicBus.gain.value = 0.0001;   // faded in by startMusic
    musicWet.gain.value = 0.9;

    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 2), ac.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    // Plucks echo into a dotted-ish delay - most of the "chilled" is here.
    delay = ac.createDelay(1);
    delay.delayTime.value = STEP * 3;
    const fb = ac.createGain(); fb.gain.value = 0.36;
    const dlp = ac.createBiquadFilter();
    dlp.type = 'lowpass'; dlp.frequency.value = 1600;
    delay.connect(dlp); dlp.connect(fb); fb.connect(delay);
    const dOut = ac.createGain(); dOut.gain.value = 0.5;
    delay.connect(dOut); dOut.connect(musicBus); dOut.connect(musicWet);

    // The pad breathes through one slow filter sweep, ~22s a cycle.
    padFilter = ac.createBiquadFilter();
    padFilter.type = 'lowpass'; padFilter.Q.value = 1.6;
    padFilter.frequency.value = 620;
    padFilter.connect(musicBus); padFilter.connect(musicWet);
    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.045;
    const lfoAmt = ac.createGain(); lfoAmt.gain.value = 360;
    lfo.connect(lfoAmt); lfoAmt.connect(padFilter.frequency);
    lfo.start();
  }
  if (ac.state === 'suspended') ac.resume();
  return true;
}

// --- Voices -----------------------------------------------------------------

function env(g, t, a, d, peak) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function route(node, wetAmt) {
  node.connect(sfxBus);
  const w = ac.createGain();
  w.gain.value = wetAmt;
  node.connect(w); w.connect(sfxWet);
}

// THE squish: a body tone whose pitch falls (or rises) fast through a resonant
// lowpass, with a whisper of noise for wetness. Every tactile sound in this
// game is a variation on this one.
function squish(t, f0, f1, dur, gain, q, wet) {
  const o = ac.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.8);
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = q;
  lp.frequency.setValueAtTime(f0 * 4, t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(140, f1 * 2), t + dur);
  const g = ac.createGain();
  env(g, t, 0.006, dur, gain);
  o.connect(lp); lp.connect(g); route(g, wet);
  o.start(t); o.stop(t + dur + 0.1);
}

function noise(t, dur, type, f0, f1, q, gain, wet) {
  const s = ac.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = type; bp.Q.value = q;
  bp.frequency.setValueAtTime(f0, t);
  bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain();
  env(g, t, 0.008, dur, gain);
  s.connect(bp); bp.connect(g); route(g, wet);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.15);
}

// A bubble surfacing: the pitch snaps up in 20ms and settles.
function pop(t, f, gain) {
  const o = ac.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(f * 0.45, t);
  o.frequency.exponentialRampToValueAtTime(f, t + 0.022);
  o.frequency.exponentialRampToValueAtTime(f * 0.82, t + 0.13);
  const g = ac.createGain();
  env(g, t, 0.004, 0.13, gain);
  o.connect(g); route(g, 0.35);
  o.start(t); o.stop(t + 0.22);
}

function bell(t, f, gain, dur, wet) {
  const o = ac.createOscillator(); o.type = 'sine';
  const o2 = ac.createOscillator(); o2.type = 'triangle';
  o.frequency.value = f; o2.frequency.value = f * 2.005;
  const g2 = ac.createGain(); g2.gain.value = 0.18;
  const g = ac.createGain();
  env(g, t, 0.01, dur, gain);
  o.connect(g); o2.connect(g2); g2.connect(g); route(g, wet);
  o.start(t); o2.start(t); o.stop(t + dur + 0.2); o2.stop(t + dur + 0.2);
}

const SFX = {
  // The walk wanders up and down the pentatonic, so a long drag-to-walk reads
  // as a phrase rather than a typewriter.
  step(t) {
    stepDeg += (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.25 ? 2 : 1);
    stepDeg = Math.max(5, Math.min(12, stepDeg));
    const f = scaleHz(stepDeg);
    squish(t, f * 1.3, f, 0.1, 0.15, 6, 0.14);
    noise(t, 0.045, 'bandpass', 2600, 1100, 1.4, 0.018, 0.12);
  },
  push(t) {
    squish(t, 210, 112, 0.18, 0.22, 7, 0.18);
    noise(t, 0.15, 'lowpass', 1300, 320, 1, 0.05, 0.14);   // the scrape
  },
  bonk(t) {
    squish(t, 150, 60, 0.24, 0.3, 10, 0.22);               // rubbery, not a knock
    noise(t, 0.055, 'lowpass', 700, 180, 0.8, 0.06, 0.1);
  },
  // Being pulled through the little world's door: pitch and filter both climb.
  portalIn(t) {
    squish(t, 190, 640, 0.17, 0.17, 9, 0.32);
    noise(t, 0.19, 'bandpass', 480, 3200, 2.2, 0.05, 0.32);
  },
  // ...and coming back out of the far mouth, which is that in reverse plus the
  // pop of a body reinflating.
  portalOut(t) {
    noise(t, 0.13, 'bandpass', 3000, 700, 2.2, 0.045, 0.32);
    pop(t + 0.05, 660, 0.2);
  },
  // A pit swallowing a box: the pitch falls off a cliff, then a wet gulp.
  sink(t) {
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(560, t);
    o.frequency.exponentialRampToValueAtTime(78, t + 0.09);
    const g = ac.createGain();
    env(g, t, 0.005, 0.16, 0.34);
    o.connect(g); route(g, 0.4);
    o.start(t); o.stop(t + 0.3);
    noise(t + 0.02, 0.13, 'lowpass', 900, 200, 1.2, 0.05, 0.4);
  },
  die(t) {
    squish(t, 300, 92, 0.5, 0.18, 5, 0.6);
    noise(t, 0.35, 'lowpass', 1400, 260, 0.9, 0.035, 0.5);
  },
  // Two selves becoming one: a fifth apart, sliding into unison.
  merge(t) {
    for (const r of [1, 1.5]) {
      const o = ac.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(scaleHz(9) * r, t);
      o.frequency.exponentialRampToValueAtTime(scaleHz(9) * 1.25, t + 0.26);
      const g = ac.createGain();
      env(g, t, 0.01, 0.3, 0.11);
      o.connect(g); route(g, 0.45);
      o.start(t); o.stop(t + 0.45);
    }
    pop(t + 0.26, 520, 0.14);
  },
  spawn(t) { pop(t, 590, 0.18); pop(t + 0.085, 880, 0.16); },
  win(t) {
    [7, 9, 11, 12, 14].forEach((deg, i) => {
      bell(t + i * 0.11, scaleHz(deg), 0.16, 1.1 + i * 0.25, 0.7);
    });
    const o = ac.createOscillator();
    o.type = 'sine'; o.frequency.value = semi(-12);
    const g = ac.createGain();
    env(g, t, 0.25, 1.9, 0.14);
    o.connect(g); route(g, 0.5);
    o.start(t); o.stop(t + 2.4);
  },
  undo(t) {
    noise(t, 0.16, 'bandpass', 320, 1500, 2.4, 0.035, 0.25);   // sucked backwards
    squish(t + 0.05, 160, 250, 0.12, 0.13, 8, 0.2);
  },
  reset(t) {
    noise(t, 0.24, 'bandpass', 1800, 320, 2, 0.04, 0.3);
    squish(t + 0.1, 260, 120, 0.18, 0.14, 6, 0.25);
  },
  ui(t) { squish(t, 520, 430, 0.06, 0.1, 4, 0.15); },
};

function play(name, off) {
  if (!ac || !audio.sfx || ac.state !== 'running') return;
  try { SFX[name](ac.currentTime + (off || 0)); } catch (e) { /* never block a move */ }
}

// One move can fire a whole cascade of events; these offsets stack them into a
// little gesture instead of one mush at t=0, roughly tracking the animation.
function moveSfx(events, kinds, win) {
  if (!ac || !audio.sfx) return;
  const portalIn = kinds.has('enter') || kinds.has('boxin');
  const portalOut = kinds.has('exit') || kinds.has('boxout');
  if (portalIn) play('portalIn');
  if (portalOut) play('portalOut', portalIn ? 0.08 : 0);
  if (!portalIn && !portalOut) play(kinds.has('push') ? 'push' : 'step');
  if (kinds.has('merge')) play('merge', 0.03);
  if (kinds.has('die')) play('die', 0.05);
  if (kinds.has('sink')) play('sink', 0.06);
  if (events.some(e => e.spawned)) play('spawn', 0.12);
  if (win) play('win', 0.22);
}

// --- Music ------------------------------------------------------------------

function padVoice(f, t, dur, gain) {
  const o = ac.createOscillator(); o.type = 'sawtooth';
  const o2 = ac.createOscillator(); o2.type = 'triangle';
  o.frequency.value = f; o2.frequency.value = f * 1.005;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 2.2);
  g.gain.setValueAtTime(gain, t + dur - 2.2);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); o2.connect(g); g.connect(padFilter);
  o.start(t); o2.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  o2.onended = () => g.disconnect();
}

function pluckVoice(f, t, gain) {
  const o = ac.createOscillator();
  o.type = 'triangle';
  o.frequency.setValueAtTime(f * 1.012, t);
  o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = 0.8;
  lp.frequency.setValueAtTime(f * 6, t);
  lp.frequency.exponentialRampToValueAtTime(f * 1.4, t + 0.7);
  const g = ac.createGain();
  env(g, t, 0.008, 1.1, gain);
  o.connect(lp); lp.connect(g);
  g.connect(musicBus); g.connect(musicWet);
  const d = ac.createGain(); d.gain.value = 0.5;
  g.connect(d); d.connect(delay);
  o.start(t); o.stop(t + 1.4);
  o.onended = () => g.disconnect();
}

// A breath of filtered air under the chord change. Barely audible on purpose.
function washVoice(t, dur) {
  const s = ac.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 2.4;
  bp.frequency.setValueAtTime(420, t);
  bp.frequency.exponentialRampToValueAtTime(1500, t + dur * 0.6);
  bp.frequency.exponentialRampToValueAtTime(480, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.03, t + dur * 0.45);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(bp); bp.connect(g); g.connect(musicBus); g.connect(musicWet);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.1);
  s.onended = () => g.disconnect();
}

function scheduleStep(i, t) {
  const bar = Math.floor(i / 16);
  if (i % 16 === 0) {
    const c = CHORDS[bar % CHORDS.length];
    for (const n of c) padVoice(semi(n), t, STEP * 16 + 1.4, 0.055);
    const b = ac.createOscillator();
    b.type = 'sine'; b.frequency.value = semi(BASS[bar % BASS.length]);
    const bg = ac.createGain();
    env(bg, t, 0.35, 3.2, 0.1);
    b.connect(bg); bg.connect(musicBus);
    b.start(t); b.stop(t + 4);
    b.onended = () => bg.disconnect();
    if (bar % 2 === 0) washVoice(t, STEP * 16);
  }
  // Sparse pentatonic pluck: leans onto the beat, never doubles up.
  if (i - lastPluck >= 2 && Math.random() < (i % 2 === 0 ? 0.22 : 0.1)) {
    lastPluck = i;
    pluckVoice(scaleHz(7 + Math.floor(Math.random() * 8)), t, 0.07);
  }
}

function musicPump() {
  if (!ac || ac.state !== 'running') return;
  // After a suspend the clock has moved on without us; do not burst-schedule
  // the backlog, just pick up from now.
  if (musicNext < ac.currentTime) musicNext = ac.currentTime + 0.05;
  while (musicNext < ac.currentTime + 0.4) {
    scheduleStep(musicStep++, musicNext);
    musicNext += STEP;
  }
}

// Both fades read the gain BEFORE cancelling: cancelScheduledValues can snap
// back past a ramp that is mid-flight, and toggling off then straight on again
// is exactly when that would click.
function startMusic() {
  if (!ac || musicTimer) return;
  const t = ac.currentTime;
  const now = Math.max(0.0001, musicBus.gain.value);
  musicBus.gain.cancelScheduledValues(t);
  musicBus.gain.setValueAtTime(now, t);
  musicBus.gain.exponentialRampToValueAtTime(MUSIC_LEVEL, t + 3);
  // Come back in on a chord, not halfway through one.
  musicStep = Math.ceil(musicStep / 16) * 16;
  musicNext = t + 0.12;
  musicTimer = setInterval(musicPump, 90);
  musicPump();
}

function stopMusic() {
  if (!musicTimer) return;
  clearInterval(musicTimer);
  musicTimer = null;
  const t = ac.currentTime;
  const now = Math.max(0.0001, musicBus.gain.value);
  musicBus.gain.cancelScheduledValues(t);
  musicBus.gain.setValueAtTime(now, t);
  musicBus.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
}

// --- Audio wiring -----------------------------------------------------------

function syncAudioBtns() {
  $('sfxBtn').classList.toggle('off', !audio.sfx);
  $('musicBtn').classList.toggle('off', !audio.music);
}

function setAudio(which, on) {
  audio[which] = on ? 1 : 0;
  progress.audio = { sfx: audio.sfx, music: audio.music };
  saveProgress();
  syncAudioBtns();
  if (!ensureAudio()) return;
  if (which === 'sfx') {
    const t = ac.currentTime;
    sfxBus.gain.setTargetAtTime(on ? SFX_LEVEL : 0, t, 0.02);
    sfxWet.gain.setTargetAtTime(on ? 0.9 : 0, t, 0.02);
    if (on) setTimeout(() => play('ui'), 60);
  } else if (on) startMusic();
  else stopMusic();
}

$('sfxBtn').addEventListener('click', () => setAudio('sfx', !audio.sfx));
$('musicBtn').addEventListener('click', () => setAudio('music', !audio.music));

// Nothing may make a sound before the first gesture, and trying to is what
// throws in Safari. So: arm on the first one, whatever it was.
let armed = false;
function armAudio() {
  if (armed) return;
  armed = true;
  if (!ensureAudio()) return;
  if (audio.music) startMusic();
}
window.addEventListener('pointerdown', armAudio);
window.addEventListener('keydown', armAudio);

document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden) ac.suspend();
  else if (audio.sfx || audio.music) ac.resume();
});

// --- Editor -----------------------------------------------------------------
// Sketch a level, check it, play it, paste it out. Drafts are plain
// { name, rows } - the same shape LEVELS wants, minus the meta the game fills
// in - so nothing has to be translated on the way to parseLevel or out to the
// clipboard.

const DRAFT_KEY = 'nest-drafts';
const ED_CAP = 200000;   // BFS states before we call it DNF
const ED_MIN = 5, ED_MAX = 12;
const PAL = [
  ['#', 'wall'], ['.', 'floor'], ['*', 'target'], ['~', 'pit'], ['N', 'block'],
  ['@', 'self'], ['$', 'box'], ['B', 'box+tgt'], ['-', 'door'],
];

const edCv = $('edCanvas');
const edCtx = edCv.getContext('2d');
let drafts = [], draftIx = 0;
let edTool = '#', edCell = 24, edStroke = false, edNote = '', edSaveTimer = null;
let edSearch = 0;   // token: bumped whenever a running solve is made stale
let preEdit = 0;    // the LEVELS index to drop back onto when the editor closes

const ed = () => drafts[draftIx];

function blankDraft(n) {
  const rows = [];
  for (let y = 0; y < n; y++) {
    let r = '';
    for (let x = 0; x < n; x++) r += (x === 0 || y === 0 || x === n - 1 || y === n - 1) ? '#' : '.';
    rows.push(r);
  }
  return { name: '', rows };
}

// A draft only ever holds strings, so a corrupt blob is easy to spot and drop.
function loadDrafts() {
  try {
    const raw = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (Array.isArray(raw)) {
      drafts = raw.filter(d => d && Array.isArray(d.rows) && d.rows.length >= ED_MIN)
        .map(d => ({ name: String(d.name || ''), rows: d.rows.map(String) }));
    }
  } catch (e) { /* start fresh */ }
  if (!drafts.length) drafts = [blankDraft(7)];
}
function saveDrafts() {
  clearTimeout(edSaveTimer);
  edSaveTimer = setTimeout(() => {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts)); } catch (e) {}
  }, 350);
}

// The one place a draft becomes a level def. stretch:true because an editor
// has no business refusing a multi-block sketch.
const draftDef = (d) => ({ name: d.name || 'Draft', par: 0, stretch: true, rows: d.rows });

function edCheck() {
  try {
    const p = parseLevel(draftDef({ name: 'Draft', rows: ed().rows }));
    return { ok: true, layout: p.layout, state: p.state };
  } catch (e) {
    return { ok: false, msg: String(e.message).replace(/^Draft: /, '') };
  }
}

function edBanner(text, cls) {
  const b = $('edBanner');
  b.textContent = text;
  b.className = cls || '';
}

// Live validity: the parser's own throw message IS the error text, so the
// editor can never disagree with the game about what a level is. Every route
// that changes the subject comes through here, which is why the search token
// is bumped here too - a stale solve must never win the banner back.
function edValidate() {
  edSearch++;
  if (edNote) { edBanner(edNote, 'bad'); return; }
  const v = edCheck();
  if (!v.ok) { edBanner(v.msg, 'bad'); return; }
  const n = ed().rows.length;
  const boxes = v.state.boxes.length, targets = v.layout.targets.size;
  let msg = n + '×' + n + ' · ' + v.state.clones.length + ' self · ' +
    boxes + ' box / ' + targets + ' target';
  if (boxes < targets) msg += ' · needs more boxes';
  edBanner(msg, boxes >= targets && targets > 0 ? 'good' : '');
}

function edTouch() {
  saveDrafts();
  edValidate();
  edPaint();
}

// --- Editor painting --------------------------------------------------------

function edResize() {
  const wrap = $('edWrap'), n = ed().rows.length;
  const avail = Math.min(wrap.clientWidth, wrap.clientHeight);
  edCell = Math.max(12, Math.floor(avail / n));
  const px = edCell * n;
  edCv.style.width = px + 'px';
  edCv.style.height = px + 'px';
  edCv.width = Math.round(px * DPR);
  edCv.height = Math.round(px * DPR);
  edPaint();
}

// Flat, static, glyph-by-glyph - the game renderer needs a parsed layout and
// half the point of an editor is drawing one that does not parse yet. Colours
// are the game's, so a sketch reads as the thing it will become. drawPit is
// borrowed by lending it CELL for the duration.
function edPaint() {
  const rows = ed().rows, n = rows.length, C = edCell, c = edCtx;
  const savedCell = CELL;
  CELL = C;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = '#1e2433';
  c.fillRect(0, 0, n * C, n * C);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const ch = rows[y][x], px = x * C, py = y * C;
    if (ch === '#') {
      c.fillStyle = '#38466a';
      c.fillRect(px, py, C, C);
      c.fillStyle = 'rgba(255,255,255,0.13)';
      c.fillRect(px, py, C, Math.max(1, C * 0.14));
      c.strokeStyle = 'rgba(0,0,0,0.28)';
      c.lineWidth = 1;
      c.strokeRect(px + 0.5, py + 0.5, C - 1, C - 1);
      continue;
    }
    c.fillStyle = '#232b40';
    c.fillRect(px, py, C, C);
    c.strokeStyle = 'rgba(255,255,255,0.035)';
    c.lineWidth = 1;
    c.strokeRect(px + 0.5, py + 0.5, C - 1, C - 1);

    if (ch === '~') drawPit(c, px, py);
    if (ch === '-') {
      const g = c.createRadialGradient(px + C / 2, py + C / 2, 0, px + C / 2, py + C / 2, C * 0.9);
      g.addColorStop(0, 'rgba(167,139,250,0.5)');
      g.addColorStop(1, 'rgba(167,139,250,0)');
      c.fillStyle = g;
      c.fillRect(px - C / 2, py - C / 2, C * 2, C * 2);
    }
    if (ch === '*' || ch === 'B') {
      c.save();
      c.translate(px + C / 2, py + C / 2);
      c.rotate(Math.PI / 4);
      const s = C * 0.34;
      c.strokeStyle = 'rgba(233,237,247,0.55)';
      c.lineWidth = Math.max(1, C * 0.055);
      c.strokeRect(-s / 2, -s / 2, s, s);
      c.restore();
    }
    if (ch === 'N') {
      const g = c.createLinearGradient(px, py, px, py + C);
      g.addColorStop(0, '#4c3b8a');
      g.addColorStop(1, '#2c2357');
      c.fillStyle = g;
      c.fillRect(px, py, C, C);
      c.strokeStyle = 'rgba(167,139,250,0.95)';
      c.lineWidth = Math.max(1, C * 0.06);
      c.strokeRect(px + C * 0.05, py + C * 0.05, C * 0.9, C * 0.9);
    }
    if (ch === '@' || ch === '$' || ch === 'B') {
      const pad = C * 0.15, s = C - pad * 2, r = Math.max(2, s * 0.26);
      const clone = ch === '@';
      c.fillStyle = clone ? '#3f9bf4' : ch === 'B' ? '#57c26b' : '#ffc233';
      roundRect(c, px + pad, py + pad, s, s, r);
      c.fill();
      if (clone) {
        c.fillStyle = 'rgba(255,255,255,0.6)';
        roundRect(c, px + C / 2 - s * 0.22, py + C / 2 - s * 0.3, s * 0.44, s * 0.2, s * 0.09);
        c.fill();
      } else {
        c.strokeStyle = ch === 'B' ? 'rgba(20,90,40,0.65)' : 'rgba(92,60,0,0.6)';
        c.lineWidth = Math.max(1, s * 0.08);
        roundRect(c, px + pad, py + pad, s, s, r);
        c.stroke();
      }
    }
  }
  CELL = savedCell;
}

// --- Editor painting (the verb) ---------------------------------------------

function edSet(x, y) {
  const d = ed(), n = d.rows.length;
  const ring = x === 0 || y === 0 || x === n - 1 || y === n - 1;
  const g = edTool;
  // The boundary ring is the level's shell: only wall or door live there, and
  // a door has to sit on a face, not a corner. Refusing here (rather than
  // letting the parser throw later) keeps the sketch always-parseable-ish.
  if (ring && g !== '#' && g !== '-') { edNote = 'The edge is the shell: wall or door only'; edTouch(); return; }
  if (!ring && g === '-') { edNote = 'Doors sit on the boundary ring'; edTouch(); return; }
  if (g === '-' && (x === 0 || x === n - 1) && (y === 0 || y === n - 1)) {
    edNote = 'No doors in the corners'; edTouch(); return;
  }
  edNote = '';
  if (d.rows[y][x] === g) return;
  const put = (px, py, ch) => {
    d.rows[py] = d.rows[py].slice(0, px) + ch + d.rows[py].slice(px + 1);
  };
  // One door a side: painting a new one closes the old, which beats throwing
  // "more than one N door" at someone who is clearly moving it.
  if (g === '-') {
    const side = y === 0 ? 'N' : y === n - 1 ? 'S' : x === 0 ? 'W' : 'E';
    for (let k = 1; k < n - 1; k++) {
      const [ox, oy] = side === 'N' ? [k, 0] : side === 'S' ? [k, n - 1]
        : side === 'W' ? [0, k] : [n - 1, k];
      if (d.rows[oy][ox] === '-') put(ox, oy, '#');
    }
  }
  put(x, y, g);
  edTouch();
}

function edAt(e) {
  const r = edCv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / edCell);
  const y = Math.floor((e.clientY - r.top) / edCell);
  const n = ed().rows.length;
  if (x >= 0 && y >= 0 && x < n && y < n) edSet(x, y);
}

edCv.addEventListener('pointerdown', (e) => {
  edStroke = true;
  edCv.setPointerCapture(e.pointerId);
  edAt(e);
});
edCv.addEventListener('pointermove', (e) => { if (edStroke) edAt(e); });
const edUp = () => { edStroke = false; };
edCv.addEventListener('pointerup', edUp);
edCv.addEventListener('pointercancel', edUp);

// --- Size -------------------------------------------------------------------

// Interior content survives a resize, and each door keeps its offset along its
// own face (clamped inside the new ring) rather than being silently dropped.
function edSetSize(n) {
  const d = ed(), old = d.rows, m = old.length;
  if (n < ED_MIN || n > ED_MAX || n === m) return;
  const fresh = blankDraft(n).rows;
  const lim = Math.min(m, n) - 1;
  for (let y = 1; y < lim; y++) {
    for (let x = 1; x < lim; x++) {
      fresh[y] = fresh[y].slice(0, x) + old[y][x] + fresh[y].slice(x + 1);
    }
  }
  for (const side of ['N', 'S', 'W', 'E']) {
    for (let k = 1; k < m - 1; k++) {
      const [ox, oy] = side === 'N' ? [k, 0] : side === 'S' ? [k, m - 1]
        : side === 'W' ? [0, k] : [m - 1, k];
      if (old[oy][ox] !== '-') continue;
      const j = Math.min(n - 2, k);
      const [nx, ny] = side === 'N' ? [j, 0] : side === 'S' ? [j, n - 1]
        : side === 'W' ? [0, j] : [n - 1, j];
      fresh[ny] = fresh[ny].slice(0, nx) + '-' + fresh[ny].slice(nx + 1);
    }
  }
  d.rows = fresh;
  edNote = '';
  $('edSize').textContent = n + '×' + n;
  edResize();
  edTouch();
}

// --- Solve ------------------------------------------------------------------

// solve.mjs's BFS, minus the fixtures and the reporting. Sliced into ~50ms
// chunks rather than run flat out: a real level lands in the first chunk, and
// a degenerate sketch that walks the whole cap counts up in the banner instead
// of freezing the phone for ten seconds.
function edSolve() {
  const v = edCheck();
  if (!v.ok) { edValidate(); return; }
  const token = ++edSearch;
  const { layout, state } = v;
  const hash = (s) => s.clones.join(',') + '|' + s.boxes.join(',') + '|' + s.filled.join(',');
  if (isWin(layout, state)) { edBanner('par 0 · already solved', 'good'); return; }
  const seen = new Map([[hash(state), null]]);
  const queue = [state];
  let head = 0;
  const path = (hn) => {
    let p = '';
    for (let cur = hn; seen.get(cur) !== null; ) {
      const e = seen.get(cur);
      p = e.mv + p;
      cur = e.prev;
    }
    return p;
  };

  const pump = () => {
    if (token !== edSearch) return;
    const until = performance.now() + 50;
