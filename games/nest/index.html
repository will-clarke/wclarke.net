<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3ecdf">
<title>Mini Levels</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f3ecdf'/%3E%3Crect x='5.5' y='5.5' width='21' height='21' rx='2' fill='none' stroke='%235f95c9' stroke-width='2.5'/%3E%3Crect x='11.5' y='11.5' width='9' height='9' rx='1.5' fill='none' stroke='%239a86cb' stroke-width='2'/%3E%3Crect x='15' y='15' width='2' height='2' fill='%23d9a94e'/%3E%3C/svg%3E">
<style>
  /* T22 pastel pass: warm linen ground, dusty pastels, soft everything. */
  :root {
    --ground: #f3ecdf;
    --line: #d9cdb6;
    --ink: #4a4336;
    --dim: #99907c;
    --blue: #5f95c9;
    --violet: #9a86cb;
    --amber: #d9a94e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--ground);
    color: var(--ink);
    font: 500 15px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #hud {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 13px;
  }
  #levelName { color: var(--ink); }
  #selves { color: var(--blue); }
  #moves { margin-left: auto; color: var(--dim); }
  [hidden] { display: none !important; }
  #stage {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    touch-action: none;
  }
  /* The parent world sits behind the board, so the board needs a position too
     or the absolute canvas would paint over it. width/height must be spelled
     out: a canvas is a replaced element, so inset:0 alone would lay it out at
     its intrinsic (device-pixel) size. */
  #world { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #board { display: block; position: relative; }
  #toast, #coach {
    position: absolute;
    bottom: 8px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(250, 246, 238, 0.92);
    color: var(--ink);
    font-size: 13px;
    letter-spacing: 0.06em;
  }
  #coach {
    color: var(--dim);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
  #bar {
    display: flex;
    gap: 10px;
    padding: 10px 16px 16px;
  }
  button {
    flex: 1;
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #eae1cf;
    color: var(--ink);
    font: inherit;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    touch-action: manipulation;
  }
  button svg {
    display: block;
    margin: 0 auto;
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  #undo { flex: 2; min-width: 96px; }
  /* The two audio toggles live in the HUD, so they must shed every bit of the
     chunky footer-button styling. */
  .icon {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    min-height: 0;
    padding: 0;
    border-color: transparent;
    background: none;
    color: var(--blue);
  }
  .icon:active { background: none; }
  .icon svg { width: 19px; height: 19px; }
  .icon.off { color: var(--dim); opacity: 0.6; }
  .icon .slash { display: none; }
  .icon.off .slash { display: inline; }
  button:active { background: #dfd4bd; }
  /* The one forward action on a card sits rightmost and reads loudest. */
  .primary { border-color: var(--blue); background: var(--blue); color: #fbf8f1; }
  .primary:active { background: #4d82b6; }
  #undo.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(95, 149, 201, 0); }
    50% { box-shadow: 0 0 14px rgba(95, 149, 201, 0.45); }
  }
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(84, 73, 56, 0.45);
    padding: 24px;
  }
  .card {
    width: min(340px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: 22px 20px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #f8f3e8;
    text-align: center;
  }
  .cardTitle {
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue);
  }
  #cardBody { margin: 10px 0 18px; color: var(--dim); }
  #cardRow { display: flex; gap: 10px; }
  #grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 16px 0;
  }
  .lv {
    display: block;
    min-height: 60px;
    padding: 8px 6px;
    text-align: left;
    letter-spacing: 0.02em;
    text-transform: none;
  }
  .lv b { display: block; color: var(--blue); font-size: 12px; letter-spacing: 0.1em; }
  .lv small { color: var(--dim); font-size: 11px; }
  .lv.here { border-color: var(--blue); }
  .trackHead {
    grid-column: 1 / -1;
    margin-top: 8px;
    text-align: left;
    color: var(--violet);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .trackHead:first-child { margin-top: 0; }
  .trackHead small { color: var(--dim); letter-spacing: 0.04em; text-transform: none; }
  #pickerClose { width: 100%; }
  .lv .del { float: right; padding: 0 6px; color: var(--dim); font-size: 15px; }

  /* --- Editor: a full screen of its own, under the scrims. -------------- */
  #editor {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--ground);
    padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);
  }
  #edHead { display: flex; align-items: center; gap: 8px; }
  #edName {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #f8f3e8;
    color: var(--ink);
    font: inherit;
  }
  /* min-height:0 or the flex child refuses to shrink below the canvas. */
  #edWrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #edCanvas { touch-action: none; border-radius: 4px; }
  #edBanner {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #f8f3e8;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.03em;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  #edBanner.bad { color: #b0574f; border-color: #dcaaa2; }
  #edBanner.good { color: #47825a; border-color: #a9cdb2; }
  #edPal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #edPal button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-height: 46px;
    padding: 2px;
    font-size: 9px;
    letter-spacing: 0.04em;
  }
  #edPal b { font-size: 15px; color: var(--dim); letter-spacing: 0; }
  #edPal button.on { border-color: var(--blue); background: #dfe9f4; }
  #edPal button.on b { color: var(--blue); }
  .edRow { display: flex; gap: 8px; }
  .edRow button { min-height: 46px; font-size: 12px; }
  .edStep { flex: 0 0 46px; font-size: 19px; letter-spacing: 0; }
  #edSize {
    align-self: center;
    flex: 0 0 auto;
    min-width: 48px;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.08em;
  }
  #edCode { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #edCode textarea {
    flex: 1;
    min-height: 116px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #f8f3e8;
    color: var(--ink);
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: none;
  }
  /* In a column flex box the shared button{flex:1} grows HEIGHT, which would
     make Import as tall as the box it reads from. */
  #edImport { flex: 0 0 auto; }
</style>

    </button>
    <button id="musicBtn" class="icon" aria-label="Music">
      <svg viewBox="0 0 24 24"><path d="M9 17.5V5.5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/><path class="slash" d="M3.5 3.5l17 17"/></svg>
    </button>
  </header>
  <main id="stage">
    <canvas id="world"></canvas>
    <canvas id="board"></canvas>
    <div id="coach" hidden></div>

  <footer id="bar">
    <button id="undo" aria-label="Undo">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="reset" aria-label="Restart level">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.8-6.5L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button id="levels">Levels</button>
  </footer>
</div>

<div id="overlay" class="scrim" hidden>
  <div class="card">
    <h2 id="cardTitle" class="cardTitle">Solved</h2>
    <p id="cardBody"></p>
    <div id="cardRow">
      <button id="replay">Replay</button>
      <button id="toLevels">Levels</button>
      <button id="next" class="primary">Next</button>
    </div>
  </div>
</div>

<div id="picker" class="scrim" hidden>
  <div class="card">
    <h2 id="pickerTitle" class="cardTitle">Levels</h2>
    <div id="grid"></div>
    <button id="pickerClose">Close</button>
  </div>
</div>

<div id="editor" hidden>
  <div id="edHead">
    <input id="edName" maxlength="28" placeholder="Untitled" aria-label="Level name">
    <button id="edDrafts" class="edStep" aria-label="Drafts">&#9776;</button>
  </div>
  <div id="edWrap"><canvas id="edCanvas"></canvas></div>
  <div id="edCode" hidden>
    <textarea id="edText" spellcheck="false" aria-label="Level code"></textarea>
    <button id="edImport">Import from box</button>
  </div>
  <div id="edBanner"></div>
  <div id="edPal"></div>
  <div class="edRow">
    <button id="edMinus" class="edStep" aria-label="Smaller">&minus;</button>
    <span id="edSize">7&times;7</span>
    <button id="edPlus" class="edStep" aria-label="Bigger">+</button>
    <button id="edSolve">Solve</button>
    <button id="edWatch" hidden>Watch</button>
    <button id="edPlay">Play</button>
  </div>
  <div class="edRow">
    <button id="edCodeBtn">Code</button>
    <button id="edClose">Close</button>
  </div>
</div>

<script>
// ===NEST-ENGINE-START===
// Pure engine: no DOM, no window, no Date, no Math.random below this line.
// solve.mjs extracts this block verbatim and runs it headless.

const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };

// Direction of travel -> the door you arrive inside when entering a block,
// and the door you leave through when walking outward.
const FACE = { R: 'W', L: 'E', D: 'N', U: 'S' };
// ...and the door on a moving block's LEADING face: what it advances over
// crosses the window's boundary there (relative motion is the opposite dir).
const LEAD = { R: 'E', L: 'W', D: 'S', U: 'N' };
// Inward normal of each door side.
const INWARD = { N: [0, 1], S: [0, -1], W: [1, 0], E: [-1, 0] };

// T35: levels live in TRACKS now - the campaign keeps its teaching arc, and
// guest/generated levels get shelves of their own instead of crowding it.
// Progress is per track (ids are the save keys: do not reuse or rename them).
// T20 recut: every campaign level re-verified under pushable blocks (T10),
// compressed where the old cut had dead space, pars re-baked by BFS. Blocks
// that must be entered (not pushed) are pinned by walls - push beats enter.
const CAMPAIGN = [
  { name: 'First Steps', par: 2, stretch: false, requires: ['push'], rows: [
    '#####',
    '#.*.#',
    '#.$.#',
    '#@..#',
    '#####',
  ]},
  // 6x6 -> 5x5: same lesson (corners eat boxes, undo is your friend), no air.
  { name: 'Corners', par: 9, stretch: false, requires: ['push'], rows: [
    '#####',
    '#*.@#',
    '#.$.#',
    '#.$*#',
    '#####',
  ]},
  // Recut for T10: the old W door sat behind the block, so the natural walk-in
  // now pushed the world out of itself on the very level that teaches enter.
  // The block is walled U/D/L - the only way in is to press it and squeeze.
  { name: 'Through the Looking Glass', par: 8, stretch: false, requires: ['enter'], rows: [
    '#######',
    '##@####',
    '#N.#*.-',
    '####..#',
    '####$.#',
    '####..#',
    '#######',
  ]},
  // 8x8 -> 7x7: shaft, wall, chamber. The block is pinned by the boundary so
  // the box posts through it instead of scooting it.
  { name: 'Special Delivery', par: 9, stretch: false, requires: ['boxin', 'enter'], rows: [
    '####-##',
    '#@#...#',
    '#.#...#',
    '#$#...#',
    '#N#...#',
    '###..*#',
    '#######',
  ]},
  // 8x8 -> 7x7: the clone's only legal first move is out the door.
  { name: 'Out the Back', par: 7, stretch: false, requires: ['exit'], rows: [
    '#######',
    '###...#',
    '-@#...#',
    '###.N.#',
    '###*$.#',
    '###...#',
    '#######',
  ]},
  // 7x7 -> 6x6, same par: sink one box to bridge, walk the second across.
  // The lower pit stays as the trap that punishes pushing box two right.
  { name: 'Ashes', par: 11, stretch: false, requires: ['sink'], rows: [
    '######',
    '#@...#',
    '#.$~*#',
    '#.$~.#',
    '#....#',
    '######',
  ]},
  // NEW (T10): the world itself is a pushable. It plugs the only corridor;
  // shove it into the pit and walk across its roof. Plain sokoban after -
  // sinking the last window just closes the doors.
  { name: 'Doorstop', par: 7, stretch: false, requires: ['blocksink'], rows: [
    '######',
    '#@N~.#',
    '####.#',
    '#*$..#',
    '#....#',
    '######',
  ]},
  // T10 pin: (1,4) walled so the block cannot be scooted or shoved off the
  // boxin line - the choose-your-face dance survives pushable blocks.
  { name: 'The Moat', par: 15, stretch: false, requires: ['boxin', 'enter'], rows: [
    '#####-##',
    '#..~..*#',
    '#$.~.#.#',
    '#N.~...-',
    '##.~~~~#',
    '#@.....#',
    '#......#',
    '########',
  ]},
  { name: 'Twins', par: 4, stretch: true, requires: ['exit', 'spawn'], rows: [
    '#######',
    '-..N..#',
    '#@.$*.#',
    '#######',
    '#..N..#',
    '#..$*.#',
    '#######',
  ]},
  { name: 'Sidestep', par: 5, stretch: true, requires: ['exit', 'spawn'], rows: [
    '#######',
    '-..N..#',
    '#@.$*##',
    '#######',
    '#..N..#',
    '#..$.*#',
    '#######',
  ]},
  // NEW (T10): blockout. Push the right window out the door and it re-emerges
  // from the left one (2 -> 2) - parked exactly where the box lane needs a
  // door. Post the box, follow it through, walk it home.
  // T24 re-bake: par 11 -> 12 (the old optimal leaned on the removed A5 scoot).
  { name: 'Removals', par: 12, stretch: true, requires: ['blockout', 'boxin'], rows: [
    '#-#####',
    '#.##..#',
    '#.##$.#',
    '#*#N..#',
    '#####.#',
    '#@..N.-',
    '#######',
  ]},
  // T13 rebuild of Reunion; T20 re-pocket: the clone starts beside the door
  // with walls on every other side, so the shell can never be pressed and the
  // blocks can never be scooted (A5) - the herding dance survives.
  { name: 'Hold Still', par: 6, stretch: true, requires: ['spawn'], rows: [
    '########',
    '#####.##',
    '##*..B##',
    '##$B#.N#',
    '##....N#',
    '-@######',
    '########',
    '########',
  ]},
  // T20 re-bake: par 9 -> 8; the optimal now folds one block push into the
  // loaves-and-fishes line. boxout + spawn still carry the level.
  { name: 'Loaves', par: 8, stretch: true, requires: ['boxout', 'spawn'], rows: [
    '#######',
    '#..@..#',
    '#.N.N.#',
    '#*...*#',
    '#..$..#',
    '#.....#',
    '###-###',
  ]},
  // T14 re-tag + T20 re-bake (14 -> 15 under pushable blocks): mint, spend,
  // burn - the optimal still buys a body with a body.
  { name: 'Nest', par: 15, stretch: true, requires: ['exit', 'spawn', 'fill', 'boxout'], rows: [
    '######-###',
    '###*##.#*#',
    '###N##~#N#',
    '###......#',
    '###B#.$#.#',
    '###~#....#',
    '#####.$###',
    '#@###..###',
    '#.########',
    '#-########',
  ]},
  // --- Guest levels ----------------------------------------------------------
  // Will's editor draft (2026-08-09), promoted as-is: two sealed storeys, one
  // box, two targets - the doors and windows are the only way anything moves
  // between floors. Par baked under the T24 engine.
  { name: 'Duplex', par: 15, stretch: true, requires: ['boxout', 'blockout'], rows: [
    '#######',
    '-.@N..#',
    '#..$..-',
    '#######',
    '#*.N.*#',
    '#.....#',
    '#######',
  ]},
];

// Will's editor levels (2026-08-10 batch), pars baked under the T32 engine,
// ordered easy-ish to hard-ish by par (search size breaks ties). No teaching
// contract - these are puzzles, not lessons. Names are placeholders Will can
// rename at will.
const WORKSHOP = [

    '#@.$-',

  { name: 'Crossing', par: 9, stretch: true, requires: [], rows: [

  { name: 'Keyhole', par: 10, stretch: true, requires: [], rows: [

  { name: 'Wings', par: 13, stretch: true, requires: [], rows: [

  { name: 'Milk Run', par: 15, stretch: true, requires: [], rows: [

    '#@$.~.#',
    '#####$#',
    '#~$*#.#',
    '#$###~#',

  ]},
  { name: 'Pinwheel', par: 15, stretch: true, requires: [], rows: [

    '#.*..#',

  { name: 'Causeway', par: 16, stretch: true, requires: [], rows: [

  { name: 'Spiral', par: 17, stretch: true, requires: [], rows: [

    '-*#..*#',

  { name: 'Backdoor', par: 18, stretch: true, requires: [], rows: [
    '######',
    '#.*..#',
    '#...$#',

const TRACKS = [
  { id: 'c', name: 'Campaign', levels: CAMPAIGN },
  { id: 'w', name: 'Workshop', levels: WORKSHOP },
  { id: 'g', name: 'Generated', levels: GENERATED },
];
// The flat list survives for the dev harnesses (solve.mjs indexes into it).
const LEVELS = TRACKS.flatMap(t => t.levels);

// Interior cell just inside a door threshold; null if that side has no door.
function arrivalCell(layout, side) {
  const t = layout.doors[side];
  if (t === null) return null;
  const [dx, dy] = INWARD[side];
  return t + dy * layout.w + dx;
}

function parseLevel(def) {
  const fail = (msg) => { throw new Error(def.name + ': ' + msg); };
  const rows = def.rows;
  const h = rows.length;
  const w = rows[0].length;
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) fail('row ' + y + ' is ' + rows[y].length + ' wide, expected ' + w);
  }

  const walls = new Set(), targets = new Set(), lava = new Set();
  const blocks = [], clones = [], boxes = [];
  const doors = { N: null, S: null, W: null, E: null };

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      const i = y * w + x;
      const at = ' at (' + x + ',' + y + ')';
      const onRing = x === 0 || y === 0 || x === w - 1 || y === h - 1;
      if (onRing && ch !== '#' && ch !== '-') fail('boundary must be # or -, found ' + ch + at);
      if (ch === '-' && !onRing) fail('door is not on the boundary ring' + at);

      switch (ch) {
        case '#': walls.add(i); break;
        case '.': break;
        case '*': targets.add(i); break;
        case '~': lava.add(i); break;
        case 'N': blocks.push(i); break;
        case '@': clones.push(i); break;
        case '$': boxes.push(i); break;
        case 'B': boxes.push(i); targets.add(i); break;
        case 'P': clones.push(i); targets.add(i); break;
        case '-': {
          const vertical = y === 0 || y === h - 1;
          const horizontal = x === 0 || x === w - 1;
          if (vertical && horizontal) fail('door in a corner' + at);
          const side = y === 0 ? 'N' : y === h - 1 ? 'S' : x === 0 ? 'W' : 'E';
          if (doors[side] !== null) fail('more than one ' + side + ' door');
          doors[side] = i;
          break;
        }
        default: fail('unknown glyph ' + ch + at);
      }
    }
  }

  if (clones.length === 0) fail('no clone start (@)');
  if (!def.stretch && blocks.length > 1) fail('non-stretch level has ' + blocks.length + ' nest blocks');

  const layout = { w, h, walls, targets, lava, doors };

  for (const side of ['N', 'S', 'W', 'E']) {
    const a = arrivalCell(layout, side);
    if (a !== null && walls.has(a)) fail(side + ' door opens onto a wall');
  }

  // T10: blocks are pushable objects, so they live in state, not layout.
  const state = {
    clones: clones.sort((a, b) => a - b),
    boxes: boxes.sort((a, b) => a - b),
    blocks: blocks.sort((a, b) => a - b),
    filled: [],
  };
  return { layout, state };
}

function isWin(layout, state) {
  const boxSet = new Set(state.boxes);
  for (const t of layout.targets) if (!boxSet.has(t)) return false;
  return true;
}

// T30 solver aid: cells a resting box can never leave. Every box move needs a
// pusher behind it (a push, or an arrival/mouth shove coming through a door);
// in a corner of two perpendicular REAL walls nothing can ever stand behind
// the box - a pusher would be inside a wall - except a body arriving through
// a door, so the doors' arrival cells stay live. Targets stay live because a
// box parked there is doing its job. State-independent, so computed once.
function deadCells(layout) {
  const dead = new Set();
  const live = new Set(layout.targets);
  for (const side of ['N', 'S', 'W', 'E']) {
    const a = arrivalCell(layout, side);
    if (a !== null) live.add(a);
  }
  const wall = (i) => layout.walls.has(i);
  for (let y = 1; y < layout.h - 1; y++) {
    for (let x = 1; x < layout.w - 1; x++) {
      const i = y * layout.w + x;
      if (wall(i) || live.has(i)) continue;
      if ((wall(i - layout.w) || wall(i + layout.w)) && (wall(i - 1) || wall(i + 1))) {
        dead.add(i);
      }
    }
  }
  return dead;
}

// True when the state can no longer be won for want of movable boxes. Boxes
// can MULTIPLY (boxout with 2+ windows), so the count check is only sound
// while the block population cannot support duplication.
function isDoomed(layout, dead, state) {
  const need = layout.targets.size;
  if (need === 0) return false;
  let live = 0;
  for (const b of state.boxes) if (!dead.has(b)) live++;
  if (live === 0) return true; // dead boxes can't even be duplicated
  return state.blocks.length < 2 && live < need;
}

// One tick. Pure: inputs are never mutated. Phase A resolves grid moves in
// sweep order; Phase B resolves portal transfers against the settled board.
function step(layout, state, dir) {
  const [dx, dy] = DIRS[dir];
  const w = layout.w;
  const delta = dy * w + dx;

  const filled = new Set(state.filled);
  const thresholds = new Set();
  for (const side of ['N', 'S', 'W', 'E']) {
    if (layout.doors[side] !== null) thresholds.add(layout.doors[side]);
  }
  const lavaOpen = (i) => layout.lava.has(i) && !filled.has(i);

  // occ: idx -> 'wall' | 'block' | 'box' | clone id (number). Live-updated.
  const occ = new Map();
  for (const i of layout.walls) occ.set(i, 'wall');
  for (const i of state.blocks) occ.set(i, 'block');
  for (const i of state.boxes) occ.set(i, 'box');
  const clones = state.clones.map((pos, id) => ({ id, pos, alive: true }));
  let nextId = clones.length;
  for (const c of clones) occ.set(c.pos, c.id);
  const blocksNow = () => {
    const bs = [];
    for (const [i, v] of occ) if (v === 'block') bs.push(i);
    return bs.sort((a, b) => a - b);
  };

  const events = [];
  const moveClone = (c, to) => {
    events.push({ t: 'step', from: c.pos, to });
    // T32: the push this move resolves may have landed something on the cell
    // the clone is vacating - only remove the entry if it is still the clone.
    if (occ.get(c.pos) === c.id) occ.delete(c.pos);
    occ.set(to, c.id);
    c.pos = to;
  };
  // A box landing on unfilled lava (portal arrival or mouth) sinks like a push.
  const settleBox = (to) => {
    if (lavaOpen(to)) {
      filled.add(to);
      events.push({ t: 'sink', at: to });
    } else {
      occ.set(to, 'box');
    }
  };

  // Sweep: furthest along dir first, ties by idx ascending.
  const along = (pos) =>
    dir === 'R' ? -(pos % w) :
    dir === 'L' ? pos % w :
    dir === 'D' ? -Math.floor(pos / w) :
    Math.floor(pos / w);
  const order = clones.slice().sort((a, b) => along(a.pos) - along(b.pos) || a.pos - b.pos);

  // T10 (A4): one block move, tried before anything enters it. True if the
  // block vacated its cell (slide, sink, out through a door, into another
  // block); false if it is pinned. A block never shoves what is in its way.
  const blockMove = (pos) => {
    const bdest = pos + delta;
    if (thresholds.has(bdest)) {
      // Blockout: the window leaves the level, so it re-emerges from every
      // OTHER window still on the grid (1->0, 2->2, 3->4). The exit itself
      // always succeeds - with one block the set of other windows is empty
      // and it is simply gone. Blocked mouths do not fire, like exits.
      occ.delete(pos);
      const fired = blocksNow().map(b => b + delta)
        .filter(m => !thresholds.has(m) && !occ.has(m));
      if (fired.length === 0) events.push({ t: 'blockout', from: pos, to: null, spawned: false });
      fired.forEach((m, k) => {
        events.push({ t: 'blockout', from: pos, to: m, spawned: k > 0 });
        if (lavaOpen(m)) {
          filled.add(m);
          events.push({ t: 'blocksink', at: m });
        } else occ.set(m, 'block');
      });
      return true;
    }
    const ob = occ.get(bdest);
    if (ob === undefined) {
      occ.delete(pos);
      if (lavaOpen(bdest)) {
        // The world it showed is unharmed - only the window sinks.
        filled.add(bdest);
        events.push({ t: 'blocksink', at: bdest });
      } else {
        occ.set(bdest, 'block');
        events.push({ t: 'blockstep', from: pos, to: bdest });
      }
      return true;
    }
    if (ob === 'block') {
      // Blockin: a window slides into a window the way a box would - through
      // the matching door, landing on the arrival cell. It never shoves
      // whatever is waiting there.
      const arr = arrivalCell(layout, FACE[dir]);
      if (arr === null || arr === pos || occ.has(arr)) return false;
      occ.delete(pos);
      events.push({ t: 'blockin', from: pos, block: bdest, to: arr });
      if (lavaOpen(arr)) {
        filled.add(arr);
        events.push({ t: 'blocksink', at: arr });
      } else occ.set(arr, 'block');
      return true;
    }
    if (ob === 'box') {
      // T27 (Will): resolve from the far end. A window advancing onto a box
      // swallows it - the box crosses the window's boundary on the LEADING
      // face (relative motion) and lands at that door's arrival cell - and
      // the window takes its cell. Only if the box has no way in is the
      // window truly pinned (and entering it becomes the fallback).
      const arr = arrivalCell(layout, LEAD[dir]);
      if (arr === null || arr === bdest || occ.has(arr)) return false;
      occ.delete(bdest);
      events.push({ t: 'boxin', from: bdest, block: bdest, to: arr, lead: true });
      settleBox(arr);
      occ.delete(pos);
      occ.set(bdest, 'block');
      events.push({ t: 'blockstep', from: pos, to: bdest });
      return true;
    }
    return false;
  };

  const pendingEnter = [];
  const pendingExit = [];
  const pendingFollow = [];
  const pending = new Set(); // ids of clones whose move resolves in Phase B

  // PHASE A - grid moves.
  for (const c of order) {
    const dest = c.pos + delta;
    if (thresholds.has(dest)) { pendingExit.push(c); pending.add(c.id); continue; }
    const o = occ.get(dest);
    // Walls are walls, boundary or not. (A5 shell-scoot lived here, T10 to
    // T24 - removed per Will: it undercut the pure sokobaning.)
    if (o === 'wall') continue;
    if (o === 'block') {
      // T10 (A4): push beats enter - you enter only when the block is pinned.
      // T32: a pusher is in motion, so its own cell counts as vacated while
      // its push resolves - a blockout mouth (or a swallowed box's arrival)
      // may land exactly where the pusher is stepping out of.
      occ.delete(c.pos);
      if (blockMove(dest)) { moveClone(c, dest); continue; }
      occ.set(c.pos, c.id); // pinned: the clone never moved after all
      pendingEnter.push(c); pending.add(c.id); continue;
    }
    if (o === 'box') {
      const bdest = dest + delta;
      occ.delete(c.pos); // T32: as above - every blocked path restores this
      const stay = () => occ.set(c.pos, c.id);
      if (thresholds.has(bdest)) {
        // Box pushed out through a door: fires at every free block mouth.
        const fired = [];
        for (const b of blocksNow()) {
          const m = b + delta;
          if (thresholds.has(m) || occ.get(m) !== undefined) continue;
          fired.push(m);
        }
        if (fired.length === 0) { stay(); continue; } // blocked
        occ.delete(dest);
        fired.forEach((m, k) => {
          events.push({ t: 'boxout', from: dest, to: m, spawned: k > 0 });
          settleBox(m);
        });
        moveClone(c, dest);
        continue;
      }
      const ob = occ.get(bdest);
      if (ob === 'block') {
        // T10 (A4): the block scoots first; the box goes in through the
        // matching door only if the block cannot move.
        if (blockMove(bdest)) {
          occ.delete(dest);
          occ.set(bdest, 'box');
          events.push({ t: 'push', from: dest, to: bdest });
          moveClone(c, dest);
          continue;
        }
        const arr = arrivalCell(layout, FACE[dir]);
        if (arr === null || occ.has(arr)) { stay(); continue; } // no matching door, or arrival taken
        occ.delete(dest);
        events.push({ t: 'boxin', from: dest, block: bdest, to: arr });
        settleBox(arr);
        moveClone(c, dest);
        continue;
      }
      if (ob !== undefined) { stay(); continue; } // wall, box or clone: blocked, no multi-push
      if (lavaOpen(bdest)) {
        occ.delete(dest);
        filled.add(bdest);
        events.push({ t: 'sink', at: bdest });
        moveClone(c, dest);
        continue;
      }
      occ.delete(dest);
      occ.set(bdest, 'box');
      events.push({ t: 'push', from: dest, to: bdest });
      moveClone(c, dest);
      continue;
    }
    if (typeof o === 'number') {
      // Walking into a self never merges (merge is portal-only). If the
      // occupant is itself waiting on a portal transfer, follow it in
      // Phase B once it has actually vacated; a blocked self is a wall.
      if (pending.has(o)) { pendingFollow.push(c); pending.add(c.id); }
      continue;
    }
    if (lavaOpen(dest)) {
      // T14: the body fills the pit - cell becomes floor for everyone after.
      events.push({ t: 'step', from: c.pos, to: dest });
      events.push({ t: 'die', at: dest });
      events.push({ t: 'fill', at: dest });
      filled.add(dest);
      occ.delete(c.pos);
      c.alive = false;
      continue;
    }
    moveClone(c, dest);
  }

  // PHASE B - portal transfers, against post-Phase-A occupancy.
  const enterArr = arrivalCell(layout, FACE[dir]);
  const pushedTo = new Set(); // boxes/blocks already shoved once this phase stay put
  for (const c of pendingEnter) {
    if (!c.alive) continue;
    if (enterArr === null) continue; // no door on that side: stays put
    const block = c.pos + delta;
    const o = occ.get(enterArr);
    if (o === c.id) {
      // Self-arrival: legal, ends where it started.
      events.push({ t: 'enter', from: c.pos, block, to: enterArr });
      continue;
    }
    if (o === 'box') {
      // T15: the door is just floor - coming through it shoves the arrival
      // box one cell onward (same direction: the entry face's inward normal
      // IS the direction of travel). Shoving it into another block or out a
      // door would move one box through two portals in a tick: blocked,
      // recorded as an open question rather than improvised.
      const bdest = enterArr + delta;
      if (thresholds.has(bdest) || occ.has(bdest)) continue; // stays put
      occ.delete(enterArr);
      if (lavaOpen(bdest)) {
        filled.add(bdest);
        events.push({ t: 'sink', at: bdest });
      } else {
        occ.set(bdest, 'box');
        pushedTo.add(bdest);
        events.push({ t: 'push', from: enterArr, to: bdest });
      }
      events.push({ t: 'enter', from: c.pos, block, to: enterArr });
      occ.delete(c.pos);
      occ.set(enterArr, c.id);
      c.pos = enterArr;
      continue;
    }
    if (o === 'block') {
      // T24: doors are transparent to windows too - the body coming through
      // shoves the arrival window one plain cell onward (slide or sink; a
      // second door in the same tick stays blocked, same as a box), so you
      // can follow the window you just pushed in and keep pushing it.
      const bdest = enterArr + delta;
      if (thresholds.has(bdest) || occ.has(bdest)) continue; // stays put
      occ.delete(enterArr);
      if (lavaOpen(bdest)) {
        filled.add(bdest);
        events.push({ t: 'blocksink', at: bdest });
      } else {
        occ.set(bdest, 'block');
        pushedTo.add(bdest);
        events.push({ t: 'blockstep', from: enterArr, to: bdest });
      }
      events.push({ t: 'enter', from: c.pos, block, to: enterArr });
      occ.delete(c.pos);
      occ.set(enterArr, c.id);
      c.pos = enterArr;
      continue;
    }
    if (o === 'wall') continue; // stays put
    if (typeof o === 'number') {
      events.push({ t: 'merge', at: enterArr, from: c.pos, via: 'enter' });
      occ.delete(c.pos);
      c.alive = false;
      continue;
    }
    events.push({ t: 'enter', from: c.pos, block, to: enterArr });
    occ.delete(c.pos);
    if (lavaOpen(enterArr)) {
      events.push({ t: 'die', at: enterArr });
      events.push({ t: 'fill', at: enterArr });
      filled.add(enterArr);
      c.alive = false;
      continue;
    }
    occ.set(enterArr, c.id);
    c.pos = enterArr;
  }

  for (const c of pendingExit) {
    if (!c.alive) continue;
    const from = c.pos;
    const fired = [];
    for (const b of blocksNow()) {
      const m = b + delta;
      if (thresholds.has(m)) continue;
      const om = occ.get(m);
      if (om === 'wall') continue; // does not fire
      if (om === 'block') {
        // T24: the exiting body shoves the mouth window one plain cell
        // onward, exactly like a mouth box; if it cannot move (or already
        // moved this phase), that mouth does not fire.
        const bd = m + delta;
        if (pushedTo.has(m) || thresholds.has(bd) || occ.has(bd)) continue;
        occ.delete(m);
        if (lavaOpen(bd)) {
          filled.add(bd);
          events.push({ t: 'blocksink', at: bd });
        } else {
          occ.set(bd, 'block');
          pushedTo.add(bd);
          events.push({ t: 'blockstep', from: m, to: bd });
        }
        fired.push({ m, kind: 'free' });
        continue;
      }
      if (om === 'box') {
        // T15: the exiting body pushes the mouth box one cell onward; if
        // the box cannot move (or was already shoved this phase), the
        // mouth does not fire. Into a block/threshold = two portals in one
        // tick: blocked, open question. Fan-out mouths stay independent.
        const bd = m + delta;
        if (pushedTo.has(m) || thresholds.has(bd) || occ.has(bd)) continue;
        occ.delete(m);
        if (lavaOpen(bd)) {
          filled.add(bd);
          events.push({ t: 'sink', at: bd });
        } else {
          occ.set(bd, 'box');
          pushedTo.add(bd);
          events.push({ t: 'push', from: m, to: bd });
        }
        fired.push({ m, kind: 'free' });
        continue;
      }
      if (typeof om === 'number' && om !== c.id) fired.push({ m, kind: 'merge' });
      else if (lavaOpen(m)) fired.push({ m, kind: 'die' });
      else fired.push({ m, kind: 'free' }); // om === c.id: occ ignores c itself
    }
    if (fired.length === 0) continue; // stays put
    occ.delete(from);
    c.alive = false;
    fired.forEach((f, k) => {
      if (f.kind === 'merge') {
        events.push({ t: 'merge', at: f.m, from, via: 'exit' });
        return;
      }
      events.push({ t: 'exit', from, to: f.m, spawned: k > 0 });
      if (f.kind === 'die') {
        events.push({ t: 'die', at: f.m });
        events.push({ t: 'fill', at: f.m });
        filled.add(f.m);
        return;
      }
      if (!c.alive) {
        c.alive = true;
        c.pos = f.m;
        occ.set(f.m, c.id);
      } else {
        const n = { id: nextId++, pos: f.m, alive: true };
        clones.push(n);
        occ.set(f.m, n.id);
      }
    });
  }

  // Followers: clones that walked into a portal-pending self. Sweep order put
  // each one after its leader, so chains march in a train. If the leader's
  // transfer failed (or self-arrived), its cell is still taken: stay put.
  for (const c of pendingFollow) {
    if (!c.alive) continue;
    const dest = c.pos + delta;
    if (occ.has(dest)) continue;
    moveClone(c, dest);
  }

  const outBoxes = [];
  for (const [i, v] of occ) if (v === 'box') outBoxes.push(i);
  const outState = {
    clones: clones.filter(c => c.alive).map(c => c.pos).sort((a, b) => a - b),
    boxes: outBoxes.sort((a, b) => a - b),
    blocks: blocksNow(),
    filled: Array.from(filled).sort((a, b) => a - b),
  };
  return { state: outState, events, changed: events.length > 0, win: isWin(layout, outState) };
}

function loadProgress() {
  try {
    let raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!raw) {
      // Migrate a flat pre-tracks save: those indices were all campaign.
      const v5 = JSON.parse(localStorage.getItem('nest-v5') || 'null');
      if (v5 && typeof v5 === 'object') {
        raw = { best: {}, unlocked: { c: v5.unlocked | 0 || 1 },
          coached: v5.coached || {}, audio: v5.audio };
        for (const k in (v5.best || {})) raw.best['c:' + k] = v5.best[k];
      }
    }
    if (raw && typeof raw === 'object') {
      progress.best = raw.best || {};
      progress.unlocked = (raw.unlocked && typeof raw.unlocked === 'object') ? raw.unlocked : {};
      progress.coached = raw.coached || {};
      if (raw.audio) audio = { sfx: raw.audio.sfx ? 1 : 0, music: raw.audio.music ? 1 : 0 };
    }
  } catch (e) { /* private mode or a corrupt blob: start fresh */ }
}
function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {}
}

function xOf(i) { return i % layout.w; }
function yOf(i) { return Math.floor(i / layout.w); }
function lerp(a, b, t) { return a + (b - a) * t; }

function loadLevel(t, i) { trackIndex = t; levelIndex = i; startLevel(TRACKS[t].levels[i]); }

// An editor draft rides the same path but owns no slot in LEVELS, so
// levelIndex goes to -1 and every progress write is gated on it.
function playDraft(def) { levelIndex = -1; startLevel(def); }

function startLevel(def) {
  stopAuto();
  levelDef = def;
  const parsed = parseLevel(def);
  layout = parsed.layout;
  state = parsed.state;
  initial = state;
  history = [];
  moves = 0;
  won = false;
  anim = null;
  bloom = null;
  closeOverlays();
  hideToast();
  showCoach(levelIndex);
  $('levels').textContent = levelIndex < 0 ? 'Editor' : 'Levels';
  resize();
  settle();
}

// One tile-maker for both lists: the level picker and the editor's drafts.
function tile(num, title, note, onPick) {
  const b = document.createElement('button');
  b.className = 'lv';
  b.innerHTML = '<b>' + num + '</b>';
  b.appendChild(document.createTextNode(title));
  b.appendChild(document.createElement('br'));
  const small = document.createElement('small');
  small.textContent = note;
  b.appendChild(small);
  if (onPick) b.addEventListener('click', onPick);
  $('grid').appendChild(b);
  return b;
}

function openPicker() {
  const grid = $('grid');
  $('pickerTitle').textContent = 'Levels';
  grid.textContent = '';
  let here = null;
  TRACKS.forEach((tr, t) => {
    if (!tr.levels.length) return;
    const solved = tr.levels.filter((_, i) => progress.best[bestKey(t, i)] !== undefined).length;
    const head = document.createElement('div');
    head.className = 'trackHead';
    head.textContent = tr.name + ' ';
    const count = document.createElement('small');
    count.textContent = solved + '/' + tr.levels.length;
    head.appendChild(count);
    grid.appendChild(head);
    tr.levels.forEach((def, i) => {
      const best = progress.best[bestKey(t, i)];
      const note = best !== undefined ? 'best ' + best : 'unsolved';

      if (t === trackIndex && i === levelIndex) { b.classList.add('here'); here = b; }
    });
  });
  tile('+', 'New level', 'editor', () => { play('ui'); openEditor(); });
  $('overlay').hidden = true;
  $('picker').hidden = false;
  // Three tracks make a long list: land the view on where you are.
  if (here) here.scrollIntoView({ block: 'center' });

// Drop any animation and show the current state exactly.

  placeOuter(); // blocks move now, and the parent world is anchored to one
  const def = levelDef;

function buildSprites() {
  const list = [];
  for (const i of state.blocks) list.push({ kind: 'block', a: i, b: i, fate: null, birth: null });
  for (const i of state.clones) list.push({ kind: 'clone', a: i, b: i, fate: null, birth: null });
  for (const i of state.boxes) list.push({ kind: 'box', a: i, b: i, fate: null, birth: null });
  return list;
}

// Which face of a block a body pinches into, and which it grows back out of,
// for a given direction of travel. Both are the door of the same name.
const IN_FACE = { R: 'W', L: 'E', D: 'N', U: 'S' };
const OUT_FACE = { R: 'E', L: 'W', D: 'S', U: 'N' };

// Turn one tick's events into sprites that carry their own animation.
// Sprites are tracked by the cell they currently occupy, so a chain like
// step -> die or enter -> die lands on the same sprite.
function compileAnim(prev, events, dir) {
  const [dx, dy] = DIRS[dir];
  const delta = dy * layout.w + dx;
  const list = [];
  for (const i of prev.blocks) list.push({ kind: 'block', a: i, b: i, fate: null, birth: null, live: true });
  for (const i of prev.clones) list.push({ kind: 'clone', a: i, b: i, fate: null, birth: null, live: true });
  for (const i of prev.boxes) list.push({ kind: 'box', a: i, b: i, fate: null, birth: null, live: true });
  const flashes = [];
  const sank = [];
  const pushedFrom = new Set(); // cells something was just shoved out of
  const at = (kind, idx) => list.find(s => s.live && s.kind === kind && s.b === idx);
  // Portal sprites squash and stretch along the direction they travelled.
  const axis = (s) => { s.axis = dx !== 0 ? 'x' : 'y'; return s; };

  for (const ev of events) {
    switch (ev.t) {
      case 'push': {
        const s = at('box', ev.from);
        if (s) s.b = ev.to;
        pushedFrom.add(ev.from);
        break;
      }
      case 'step': {
        const s = at('clone', ev.from);
        // T40: a step onto a cell something was shoved out of is a PUSH -
        // the body animates as strain, not a free stride.
        if (s) { s.b = ev.to; if (pushedFrom.has(ev.to)) s.pushing = true; }
        break;
      }
      case 'enter': case 'boxin': {
        const kind = ev.t === 'enter' ? 'clone' : 'box';
        if (ev.t === 'boxin' && !ev.lead) pushedFrom.add(ev.from);
        const s = at(kind, ev.from);
        // Pinch into the door mouth on the face we entered by, not the middle
        // of the block: that mouth is where the little world's door is drawn.
        // A swallowed box (ev.lead) went in backwards - the window advanced
        // over it - so its mouth and its copy's approach both flip sides.
        if (s) {
          s.b = ev.block; s.bxy = mouthXY(ev.block, ev.lead ? OUT_FACE[dir] : IN_FACE[dir]);
          s.fate = 'squeeze'; s.live = false; axis(s);
        }
        // The copy threads in through the door face while the original
        // squeezes into the block - both halves of the same body.
        const back = ev.lead ? -0.5 : 0.5;
        list.push(axis({
          kind, a: ev.to, b: ev.to, fate: null, birth: 'pop', live: true,
          axy: [xOf(ev.to) - dx * back, yOf(ev.to) - dy * back],
        }));
        flashes.push({ at: ev.block, kind: 'in' });
        break;
      }
      case 'exit': case 'boxout': {
        const kind = ev.t === 'exit' ? 'clone' : 'box';
        if (ev.t === 'boxout') pushedFrom.add(ev.from);
        if (!ev.spawned) {
          const s = at(kind, ev.from);
          // Walking off the edge: step past it in grid COORDS, since from+delta
          // wraps onto the next row.
          if (s) {
            s.fate = 'squeeze'; s.live = false;
            s.bxy = [xOf(ev.from) + dx, yOf(ev.from) + dy];
            axis(s);
          }
        }
        // ...and grow back out of the mouth on the far face.
        list.push(axis({
          kind, a: ev.to - delta, b: ev.to, fate: null, birth: 'pop', live: true,
          axy: mouthXY(ev.to - delta, OUT_FACE[dir]),
        }));
        flashes.push({ at: ev.to, kind: 'out' });
        break;
      }
      case 'merge': {
        // T33: merges only exist as portal arrivals (A6), so they animate
        // like one - the original squeezes into the door it went through and
        // a copy pops out at the survivor's cell, converging into it. The
        // old handling slid the body flat across the whole board, which read
        // as jank whenever the door was far from the survivor, and left
        // multi-mouth merges visibly out of unison.
        const s = at('clone', ev.from);
        if (s) {
          s.fate = 'squeeze'; s.live = false;
          if (ev.via === 'enter') {
            s.b = ev.from + delta;
            s.bxy = mouthXY(ev.from + delta, IN_FACE[dir]);
          } else {
            s.bxy = [xOf(ev.from) + dx, yOf(ev.from) + dy];
          }
          axis(s);
        }
        list.push(axis({
          kind: 'clone', a: ev.at, b: ev.at, fate: 'merge', birth: 'pop', live: false,
          axy: ev.via === 'enter'
            ? [xOf(ev.at) - dx * 0.5, yOf(ev.at) - dy * 0.5]
            : mouthXY(ev.at - delta, OUT_FACE[dir]),
        }));
        flashes.push({ at: ev.at, kind: 'merge' });
        break;
      }
      case 'die': {
        const s = at('clone', ev.at);
        if (s) { s.fate = 'die'; s.live = false; }
        flashes.push({ at: ev.at, kind: 'die' });
        break;
      }
      case 'sink': {
        const s = at('box', ev.at) || at('box', ev.at - delta);
        if (s) { s.b = ev.at; s.fate = 'sink'; s.live = false; }
        pushedFrom.add(ev.at - delta);
        sank.push(ev.at);
        break;
      }
      case 'fill': {
        // A body filled the pit: the die case already animates the fall,
        // this just cools the cell over the same tween.
        sank.push(ev.at);
        break;
      }
      case 'blockstep': {
        const s = at('block', ev.from);
        if (s) s.b = ev.to;
        pushedFrom.add(ev.from);
        break;
      }
      case 'blocksink': {
        // Direct push slides in from one cell back; a blockout/blockin
        // landing already has a sprite sat on the pit.
        const s = at('block', ev.at) || at('block', ev.at - delta);
        if (s) { s.b = ev.at; s.fate = 'sink'; s.live = false; }
        sank.push(ev.at);
        break;
      }
      case 'blockout': {
        pushedFrom.add(ev.from);
        if (!ev.spawned) {
          const s = at('block', ev.from);
          if (s) {
            s.fate = 'squeeze'; s.live = false;
            s.bxy = [xOf(ev.from) + dx, yOf(ev.from) + dy];
            axis(s);
          }
        }
        if (ev.to === null) break; // a lone window just leaves
        list.push(axis({
          kind: 'block', a: ev.to - delta, b: ev.to, fate: null, birth: 'pop', live: true,
          axy: mouthXY(ev.to - delta, OUT_FACE[dir]),
        }));
        flashes.push({ at: ev.to, kind: 'out' });
        break;
      }
      case 'blockin': {
        pushedFrom.add(ev.from);
        const s = at('block', ev.from);
        if (s) {
          s.b = ev.block; s.bxy = mouthXY(ev.block, IN_FACE[dir]);
          s.fate = 'squeeze'; s.live = false; axis(s);
        }
        list.push(axis({
          kind: 'block', a: ev.to, b: ev.to, fate: null, birth: 'pop', live: true,
          axy: [xOf(ev.to) - dx * 0.5, yOf(ev.to) - dy * 0.5],
        }));
        flashes.push({ at: ev.block, kind: 'in' });
        break;
      }
    }
  }
  return { list, flashes, sank };
}

function applyMove(dir) {
  if (won || overlayOpen()) return false;
  dismissCoach();
  const r = step(layout, state, dir);
  if (!r.changed) {
    bonkAt = performance.now();
    bonkVec = DIRS[dir];
    buzz(20);
    play('bonk');
    return false;
  }
  history.push({ state, moves });
  if (history.length > 1000) history.shift();
  lastDir = dir;
  lastMoveAt = performance.now();
  const prev = state;
  state = r.state;
  moves++;
  won = r.win;

  const kinds = new Set(r.events.map(e => e.t));
  if (reducedMotion.matches) {
    settle();
  } else {
    const { list, flashes, sank } = compileAnim(prev, r.events, dir);
    const portal = ['enter', 'exit', 'boxin', 'boxout', 'blockin', 'blockout', 'merge'].some(t => kinds.has(t));
    sprites = list;
    anim = { t0: performance.now(), p: 0, dur: portal ? PORTAL : TWEEN, flashes, sank };
    syncHud();
  }

  if (won) buzz([30, 50, 30]);
  else if (kinds.has('die') || kinds.has('merge')) buzz(40);
  else buzz(10);
  moveSfx(r.events, kinds, won);

  if (won) {
    bloom = reducedMotion.matches ? null : { t0: performance.now(), p: 0 };
    const at = levelIndex, atTrack = trackIndex;
    setTimeout(() => { if (won && levelIndex === at && trackIndex === atTrack) showWin(); },
      reducedMotion.matches ? 0 : BLOOM * 0.55);
  }
  return true;
}

// History entries are { state, moves } snapshots, and a reset is just one
// more entry - so undo after reset steps back to the board the reset threw
// away, and keeps stepping back through the moves before it.
function undo() {
  stopAuto();
  if (!history.length) return;
  play('undo');
  const h = history.pop();
  state = h.state;
  moves = h.moves;
  won = false;
  bloom = null;
  closeOverlays();
  settle();
}

function reset() {
  stopAuto();
  if (state === initial) return; // nothing to throw away
  play('reset');
  history.push({ state, moves });
  if (history.length > 1000) history.shift();
  state = initial;
  moves = 0;
  won = false;
  bloom = null;
  closeOverlays();
  settle();
}

function showWin() {
  hideToast();
  const def = levelDef;
  const draft = levelIndex < 0;
  if (!draft) {
    const key = bestKey(trackIndex, levelIndex);
    const prevBest = progress.best[key];
    if (prevBest === undefined || moves < prevBest) progress.best[key] = moves;
    saveProgress();
  }

  $('cardTitle').textContent = 'Solved';
  let body = 'in ' + moves + ' moves' + (def.par ? ' (par ' + def.par + ')' : '');
  if (draft) body += ' · draft';
  else if (progress.best[bestKey(trackIndex, levelIndex)] < moves) {
    body += ' · best ' + progress.best[bestKey(trackIndex, levelIndex)];
  }
  $('cardBody').textContent = body;
  $('next').hidden = draft || levelIndex >= TRACKS[trackIndex].levels.length - 1;
  $('toLevels').textContent = draft ? 'Editor' : 'Levels';
  $('overlay').hidden = false;
}

// --- Renderer ---------------------------------------------------------------

// T38 (Will): the boundary ring is not drawn any more - the interior gets the
// pixels, and a slim apron around it carries the shell frame + door mouths.
// The engine still owns the full grid; only the view is cropped.
const viewW = () => (layout.w - 2) * CELL + PAD * 2;
const viewH = () => (layout.h - 2) * CELL + PAD * 2;

function resize() {
  const availW = stage.clientWidth;
  const availH = stage.clientHeight;
  const iw = layout.w - 2, ih = layout.h - 2;
  CELL = Math.max(10, Math.floor(Math.min(
    availW / (iw + PAD_FRAC * 2), availH / (ih + PAD_FRAC * 2))));
  PAD = Math.ceil(CELL * PAD_FRAC);
  const cssW = viewW(), cssH = viewH();
  board.style.width = cssW + 'px';
  board.style.height = cssH + 'px';
  for (const cv of [board, bufA, bufB]) {
    cv.width = Math.round(cssW * DPR);
    cv.height = Math.round(cssH * DPR);
  }
  bufC.width = Math.max(1, Math.round(cssW * DPR * OUTER_RES));
  bufC.height = Math.max(1, Math.round(cssH * DPR * OUTER_RES));
  world.width = Math.round(availW * DPR);
  world.height = Math.round(availH * DPR);
  placeOuter();
  dirty = true;
}

// Where to put the giant copy of this level so that our board lands exactly in
// one of its nest-block cells. The scale falls out of drawBlock's own fit: if a
// block cell shows the world at k, the parent showing US must be 1/k bigger.
// With several blocks we live in the first one - a fixed choice, so the
// backdrop does not swim about as clones come and go.
function placeOuter() {
  // Blocks live in state now (T10), so the parent world tracks the first
  // window as it is pushed about - and leaves when the last window goes.
  const b = state ? state.blocks[0] : undefined;
  if (b === undefined) { outer = null; return; }
  const m = miniGeom();
  const s = 1 / m.k;
  // Block cell (x,y) sits at PAD + (x-1)*CELL in the cropped view.
  const dx = PAD + (xOf(b) - 1 + m.ox) * CELL, dy = PAD + (yOf(b) - 1 + m.oy) * CELL;
  outer = {
    x: board.offsetLeft - dx * s, y: board.offsetTop - dy * s,
    w: viewW() * s, h: viewH() * s,
  };
}

// Where the little world sits inside a nest-block cell, as fractions of the
// cell. The picture being nested is the CROPPED view (interior + apron), so
// the view is measured in cells: interior plus PAD/CELL of apron each side.
// Interior cell x (layout coords) centres at ox + k * (pc + x - 1 + 0.5).
function miniGeom() {
  const fit = 1 - BLOCK_INSET * 2;
  const pc = PAD / CELL;
  const vw = layout.w - 2 + pc * 2, vh = layout.h - 2 + pc * 2;
  const k = Math.min(fit / vw, fit / vh);
  return {
    k, pc, vw, vh,
    ox: BLOCK_INSET + (fit - vw * k) / 2,
    oy: BLOCK_INSET + (fit - vh * k) / 2,
  };
}

// How far along a block face (0..1) that side's door shows in the little world.
// The frame gap, the door glow inside and the squeeze anchor all read this, so
// by construction they land on the same point.
function doorFrac(side) {
  const d = layout.doors[side];
  if (d === null) return 0.5;
  const m = miniGeom();
  return side === 'N' || side === 'S'
    ? m.ox + m.k * (m.pc + xOf(d) - 0.5)
    : m.oy + m.k * (m.pc + yOf(d) - 0.5);
}

// The door mouth on one face of a block cell, in sprite grid coords: the point
// a body pinches into, and the point its copy grows out of.
function mouthXY(block, side) {
  const f = doorFrac(side), bx = xOf(block), by = yOf(block);
  if (side === 'N') return [bx - 0.5 + f, by - 0.5];
  if (side === 'S') return [bx - 0.5 + f, by + 0.5];
  if (side === 'W') return [bx - 0.5, by - 0.5 + f];
  return [bx + 0.5, by - 0.5 + f];
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// T14: pits are chilled holes, not fire - a body or a box fills one into
// floor. Static (no time pulse), so idle frames can skip repainting.
function drawPit(c, x, y) {
  const inset = CELL * 0.09;
  const s = CELL - inset * 2;
  const r = Math.max(2, CELL * 0.2);
  roundRect(c, x + inset, y + inset, s, s, r);
  c.fillStyle = '#4a4132';
  c.fill();
  // Inner shadow: deepest under the top lip, as if lit from above.
  const g = c.createLinearGradient(0, y + inset, 0, y + inset + s);
  g.addColorStop(0, 'rgba(0,0,0,0.45)');
  g.addColorStop(0.55, 'rgba(0,0,0,0)');
  c.fillStyle = g;
  roundRect(c, x + inset, y + inset, s, s, r);
  c.fill();
  // The far lip catches a sliver of light.
  c.strokeStyle = 'rgba(255,255,255,0.3)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(x + inset + r, y + inset + s - 0.5);
  c.lineTo(x + inset + s - r, y + inset + s - 0.5);
  c.stroke();
}

// A filled pit: flat slab, walkable, visibly once-a-hole.
function drawSlab(c, x, y) {
  c.fillStyle = '#ddd3bf';
  c.fillRect(x, y, CELL, CELL);
  const inset = CELL * 0.09;
  c.strokeStyle = 'rgba(74,65,50,0.3)';
  c.lineWidth = 1;
  roundRect(c, x + inset, y + inset, CELL - inset * 2, CELL - inset * 2, Math.max(2, CELL * 0.2));
  c.stroke();
}

// T34: the tile layer only changes when a move lands (a pit fills) or the
// board is re-laid-out, so it bakes once into tileCache and every pass of
// every frame blits it - it was costing a full grid of fills, strokes and
// gradients per pass. The door glow's idle pulse went static in the bake:
// idle frames never repainted anyway, so it only ever pulsed mid-move.
const tileCache = document.createElement('canvas');
const tileCtx = tileCache.getContext('2d');
let tileLayout = null, tileKey = '';

function buildTileCache() {
  const { w, h } = layout;
  const filled = new Set(state.filled);
  tileCache.width = Math.max(1, Math.round(w * CELL * DPR));
  tileCache.height = Math.max(1, Math.round(h * CELL * DPR));
  const c = tileCtx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = '#f3ecdf';
  c.fillRect(0, 0, w * CELL, h * CELL);
  for (let i = 0; i < w * h; i++) {
    const gx = xOf(i), gy = yOf(i);
    // T38: the ring is not stones any more - drawBoardFrame is the shell.
    if (gx === 0 || gy === 0 || gx === w - 1 || gy === h - 1) continue;
    const x = gx * CELL, y = gy * CELL;
    if (layout.walls.has(i)) continue; // drawn merged, below
    drawFloorCell(c, x, y);

    if (layout.lava.has(i)) {
      if (!filled.has(i)) drawPit(c, x, y);
      else drawSlab(c, x, y);
    }

    if (layout.targets.has(i)) {
      c.save();
      c.translate(x + CELL / 2, y + CELL / 2);
      c.rotate(Math.PI / 4);
      const s = CELL * 0.34;
      c.strokeStyle = 'rgba(74,67,54,0.42)';
      c.lineWidth = Math.max(1, CELL * 0.055);
      c.strokeRect(-s / 2, -s / 2, s, s);
      c.restore();
    }
  }
  const inWall = (x, y) =>
    x > 0 && y > 0 && x < w - 1 && y < h - 1 && layout.walls.has(y * w + x);
  drawWallMass(c, w, h, inWall);
  drawBoardFrame(c);
}

// T39/T41 (Will): walls are one soft slab. Every cell and every concave
// fillet goes into a SINGLE path filled once, so the silhouette is smooth
// the whole way round - rounded outside corners, filleted inside corners,
// no per-cell seams - and the one fill casts one clean shadow for depth.
function drawWallMass(c, w, h, inWall) {
  c.save();
  c.beginPath();
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const nb = { L: inWall(x - 1, y), R: inWall(x + 1, y),
        U: inWall(x, y - 1), D: inWall(x, y + 1) };
      if (inWall(x, y)) wallShape(c, x * CELL, y * CELL, nb, CELL * 0.3);
      else wallFillets(c, x * CELL, y * CELL, nb, CELL * 0.3);
    }
  }
  c.fillStyle = '#cfc0a4';
  c.shadowColor = 'rgba(110,95,70,0.3)';
  c.shadowBlur = CELL * 0.16;
  c.shadowOffsetY = CELL * 0.05;
  c.fill();
  c.restore();
}
function wallShape(c, x, y, nb, rad) {
  const x1 = x + CELL, y1 = y + CELL;
  const tl = nb.L || nb.U ? 0 : rad, tr = nb.R || nb.U ? 0 : rad;
  const br = nb.R || nb.D ? 0 : rad, bl = nb.L || nb.D ? 0 : rad;
  c.moveTo(x + tl, y);
  c.arcTo(x1, y, x1, y1, tr);
  c.arcTo(x1, y1, x, y1, br);
  c.arcTo(x, y1, x, y, bl);
  c.arcTo(x, y, x1, y, tl);
  c.closePath();
}
// A floor cell cornered by two walls gets a quarter-curve of wall bridging
// them, so inside corners are as smooth as outside ones.
function wallFillets(c, x, y, nb, rf) {
  const x1 = x + CELL, y1 = y + CELL;
  if (nb.L && nb.U) {
    c.moveTo(x, y + rf);
    c.arc(x + rf, y + rf, rf, Math.PI, Math.PI * 1.5);
    c.lineTo(x, y);
    c.closePath();
  }
  if (nb.R && nb.U) {
    c.moveTo(x1 - rf, y);
    c.arc(x1 - rf, y + rf, rf, Math.PI * 1.5, Math.PI * 2);
    c.lineTo(x1, y);
    c.closePath();
  }
  if (nb.R && nb.D) {
    c.moveTo(x1, y1 - rf);
    c.arc(x1 - rf, y1 - rf, rf, 0, Math.PI * 0.5);
    c.lineTo(x1, y1);
    c.closePath();
  }
  if (nb.L && nb.D) {
    c.moveTo(x + rf, y1);
    c.arc(x + rf, y1 - rf, rf, Math.PI * 0.5, Math.PI);
    c.lineTo(x, y1);
    c.closePath();
  }
}

// T38: the level's shell drawn the way a nest block draws its own edge - one
// violet line broken open wherever there is a door, so board and block speak
// the same language. Each door gets a glowing arch-mouth bulging out through
// the gap, plus a spill of light onto the arrival cell inside.
function drawBoardFrame(c) {
  const { w, h } = layout;
  const lw = Math.max(2, CELL * 0.09);
  const gap = CELL * 0.9;
  const x0 = CELL - lw / 2, y0 = CELL - lw / 2;
  const x1 = (w - 1) * CELL + lw / 2, y1 = (h - 1) * CELL + lw / 2;
  c.save();
  c.strokeStyle = 'rgba(154,134,203,0.95)';
  c.shadowColor = 'rgba(154,134,203,0.35)';
  c.shadowBlur = CELL * 0.14;
  c.lineWidth = lw;
  c.lineCap = 'round';
  const edge = (ax, ay, bx, by, side) => {
    c.beginPath();
    const d = layout.doors[side];
    if (d === null) { c.moveTo(ax, ay); c.lineTo(bx, by); }
    else {
      const horiz = ay === by;
      const at = (horiz ? xOf(d) : yOf(d)) * CELL + CELL / 2;
      const lo = horiz ? ax : ay, hi = horiz ? bx : by;
      const g0 = Math.max(lo, at - gap / 2), g1 = Math.min(hi, at + gap / 2);
      if (g0 > lo) { c.moveTo(ax, ay); horiz ? c.lineTo(g0, ay) : c.lineTo(ax, g0); }
      if (g1 < hi) { horiz ? c.moveTo(g1, ay) : c.moveTo(ax, g1); c.lineTo(bx, by); }
    }
    c.stroke();
  };
  edge(x0, y0, x1, y0, 'N');
  edge(x1, y0, x1, y1, 'E');
  edge(x0, y1, x1, y1, 'S');
  edge(x0, y0, x0, y1, 'W');
  c.restore();
  for (const side of ['N', 'S', 'W', 'E']) drawDoorMouth(c, side);
}

function drawDoorMouth(c, side) {
  const d = layout.doors[side];
  if (d === null) return;
  const { w, h } = layout;
  const px = side === 'W' ? CELL : side === 'E' ? (w - 1) * CELL : xOf(d) * CELL + CELL / 2;
  const py = side === 'N' ? CELL : side === 'S' ? (h - 1) * CELL : yOf(d) * CELL + CELL / 2;
  // Light spilling inward marks where the door lets out.
  const g = c.createRadialGradient(px, py, 0, px, py, CELL * 1.05);
  g.addColorStop(0, 'rgba(154,134,203,0.5)');
  g.addColorStop(1, 'rgba(154,134,203,0)');
  c.fillStyle = g;
  c.fillRect(px - CELL * 1.05, py - CELL * 1.05, CELL * 2.1, CELL * 2.1);
  // The mouth: an archway bulging outward through the gap in the frame.
  const a0 = side === 'N' ? Math.PI : side === 'S' ? 0 : side === 'W' ? Math.PI / 2 : -Math.PI / 2;
  const r = Math.max(3, PAD * 0.62);
  c.save();
  c.fillStyle = 'rgba(154,134,203,0.3)';
  c.strokeStyle = 'rgba(154,134,203,0.95)';
  c.shadowColor = 'rgba(154,134,203,0.5)';
  c.shadowBlur = CELL * 0.18;
  c.lineWidth = Math.max(2, CELL * 0.09);
  c.lineCap = 'round';
  c.beginPath();
  c.arc(px, py, r, a0, a0 + Math.PI);
  c.fill();
  c.stroke();
  c.restore();
}

function drawFloorCell(c, x, y) {
  c.fillStyle = '#ece4d3';
  c.fillRect(x, y, CELL, CELL);
  c.strokeStyle = 'rgba(92,80,60,0.06)';
  c.lineWidth = 1;
  c.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
}

function drawTiles(c) {
  const key = CELL + '|' + state.filled.join(',');
  if (tileLayout !== layout || tileKey !== key) {
    tileLayout = layout;
    tileKey = key;
    buildTileCache();
  }
  c.drawImage(tileCache, 0, 0, layout.w * CELL, layout.h * CELL);
  // A pit filled this tick fades to slab over the tween instead of snapping -
  // the cache holds the settled slab, so mid-tween those few cells redraw live.
  if (anim && anim.p < 1 && anim.sank.length) {
    const filled = new Set(state.filled);
    for (const i of anim.sank) {
      if (!filled.has(i)) continue;
      const x = xOf(i) * CELL, y = yOf(i) * CELL;
      drawFloorCell(c, x, y);
      drawPit(c, x, y);
      c.save();
      c.globalAlpha = anim.p;
      drawSlab(c, x, y);
      c.restore();
    }
  }
}

// Frame edges break open on sides where the level has a door, so the block
// itself shows which faces can be walked (or have a box pushed) into.
function drawBlockFrame(c, x, y) {
  const lw = Math.max(1, CELL * 0.06);
  // The gap IS the door cell at miniature scale, sat at the same fraction along
  // the face as the door glow inside it.
  const gap = Math.max(miniGeom().k * CELL, 3);
  const x0 = x + lw / 2, y0 = y + lw / 2;
  const x1 = x + CELL - lw / 2, y1 = y + CELL - lw / 2;
  c.save();
  c.strokeStyle = 'rgba(154,134,203,0.95)';
  c.shadowColor = 'rgba(154,134,203,0.35)';
  c.shadowBlur = CELL * 0.14;
  c.lineWidth = lw;
  c.lineCap = 'round';
  // Every edge is passed low-to-high along its one varying axis.
  const edge = (ax, ay, bx, by, side) => {
    c.beginPath();
    if (layout.doors[side] === null) {
      c.moveTo(ax, ay); c.lineTo(bx, by);
    } else {
      const horiz = ay === by;
      const lo = horiz ? ax : ay, hi = horiz ? bx : by;
      const at = (horiz ? x : y) + doorFrac(side) * CELL;
      const g0 = Math.max(lo, at - gap / 2), g1 = Math.min(hi, at + gap / 2);
      if (g0 > lo) { c.moveTo(ax, ay); horiz ? c.lineTo(g0, ay) : c.lineTo(ax, g0); }
      if (g1 < hi) { horiz ? c.moveTo(g1, ay) : c.moveTo(ax, g1); c.lineTo(bx, by); }
    }
    c.stroke();
  };
  edge(x0, y0, x1, y0, 'N');
  edge(x1, y0, x1, y1, 'E');
  edge(x0, y1, x1, y1, 'S');
  edge(x0, y0, x0, y1, 'W');
  c.restore();
}

// T34: the window chrome - bezel, solid fill, inner border and the shadowed
// door-gap frame - bakes into three cached layers per (layout, cell size).
// The shadowBlur strokes were being repainted per block, per pass, per frame;
// now the live picture is the only per-frame drawImage left in a block cell.
let shellCache = { layout: null, cell: 0 };

function blockShell() {
  if (shellCache.layout !== layout || shellCache.cell !== CELL) {
    shellCache = { layout, cell: CELL, pad: Math.ceil(CELL * 0.3) };
    const size = Math.round((CELL + shellCache.pad * 2) * DPR);
    const make = () => {
      const cv = document.createElement('canvas');
      cv.width = size; cv.height = size;
      const c = cv.getContext('2d');
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      c.translate(shellCache.pad, shellCache.pad);
      return [cv, c];
    };
    const grad = (c, c0, c1) => {
      const g = c.createLinearGradient(0, 0, 0, CELL);
      g.addColorStop(0, c0);
      g.addColorStop(1, c1);
      c.fillStyle = g;
      c.fillRect(0, 0, CELL, CELL);
    };
    let [cv, c] = make();          // no inner picture: solid violet + frame
    grad(c, '#cfc2ea', '#b2a2d8');
    drawBlockFrame(c, 0, 0);
    shellCache.solid = cv;
    [cv, c] = make();              // bezel the little world sits on
    grad(c, '#d7ccee', '#bcaede');
    shellCache.bezel = cv;
    [cv, c] = make();              // inner border + frame, drawn OVER the picture
    const m = miniGeom();
    const dw = m.vw * m.k * CELL, dh = m.vh * m.k * CELL;
    c.strokeStyle = 'rgba(154,134,203,0.5)';
    c.lineWidth = 1;
    c.strokeRect(m.ox * CELL - 0.5, m.oy * CELL - 0.5, dw + 1, dh + 1);
    drawBlockFrame(c, 0, 0);
    shellCache.frame = cv;
  }
  return shellCache;
}

// inner = the previous pass's board, blitted in as the little world.
function drawBlockAt(c, x, y, inner) {
  const sh = blockShell();
  const px = x - sh.pad, py = y - sh.pad, ps = CELL + sh.pad * 2;
  if (!inner) {
    c.drawImage(sh.solid, px, py, ps, ps);
    return;
  }
  c.drawImage(sh.bezel, px, py, ps, ps);
  const m = miniGeom();
  c.drawImage(inner, x + m.ox * CELL, y + m.oy * CELL,
    m.vw * m.k * CELL, m.vh * m.k * CELL);
  c.drawImage(sh.frame, px, py, ps, ps);
}

// The two halves of a pass-through share one tick: the body pinches away over
// the front of it and the copy grows over the back, overlapping just enough to
// read as one continuous motion rather than two things happening at once.
const SQUEEZE_WIN = [0, 0.62];
const POP_WIN = [0.45, 1];

// T10: blocks are sprites too now - a rigid window that slides, sinks, and
// threads doors whole (no needle stretch: it is a pane, not a body).
function drawBlockSprite(c, s, p, inner) {
  const win = s.fate === 'squeeze' ? SQUEEZE_WIN
    : s.birth === 'pop' && !s.fate ? POP_WIN : null;
  if (win) p = Math.max(0, Math.min(1, (p - win[0]) / (win[1] - win[0])));
  const e = 1 - Math.pow(1 - p, 3);
  const ax = s.axy ? s.axy[0] : xOf(s.a), ay = s.axy ? s.axy[1] : yOf(s.a);
  const bx = s.bxy ? s.bxy[0] : xOf(s.b), by = s.bxy ? s.bxy[1] : yOf(s.b);
  const x = lerp(ax, bx, e), y = lerp(ay, by, e);
  let scale = 1, alpha = 1;
  if (s.birth === 'pop') { scale = 0.34 + 0.66 * e; alpha = Math.min(1, e * 2.4); }
  if (s.fate === 'squeeze') { scale *= 1 - 0.75 * e; alpha *= Math.max(0, 1 - 1.15 * e); }
  else if (s.fate === 'sink') { scale *= 1 - 0.7 * e; alpha *= 1 - 0.75 * e; }
  if (alpha <= 0.01) return;
  c.save();
  c.globalAlpha = alpha;
  c.translate((x + 0.5) * CELL, (y + 0.5) * CELL);
  c.scale(scale, scale);
  c.translate(-CELL / 2, -CELL / 2);
  drawBlockAt(c, 0, 0, inner);
  c.restore();
}

function drawSprite(c, s, p, time) {
  const win = s.fate === 'squeeze' ? SQUEEZE_WIN
    : s.birth === 'pop' && !s.fate ? POP_WIN : null;
  if (win) p = Math.max(0, Math.min(1, (p - win[0]) / (win[1] - win[0])));
  const e = 1 - Math.pow(1 - p, 3);
  // Back-in for the pinch: a short brace away from the door, then a rush into
  // it. Everything else eases out.
  const eb = p * p * (3 * p - 2);
  const ax = s.axy ? s.axy[0] : xOf(s.a), ay = s.axy ? s.axy[1] : yOf(s.a);
  const bx = s.bxy ? s.bxy[0] : xOf(s.b), by = s.bxy ? s.bxy[1] : yOf(s.b);
  // The brace is mostly squash: pulling the whole body back would slide it into
  // whatever just shoved it, so damp the backwards part of the curve.
  const ep = s.fate === 'squeeze' ? (eb < 0 ? eb * 0.45 : eb) : e;
  let x = lerp(ax, bx, ep);
  let y = lerp(ay, by, ep);
  let scale = 1, alpha = 1;
  // Extra scale along / across the direction of travel: bodies go through a
  // door long and thin, and come out the far side stretched.
  let along = 1, across = 1;
  if (s.birth === 'pop') {
    scale = 0.34 + 0.66 * e;
    alpha = Math.min(1, e * 2.4);
    const st = Math.max(0, 1 - e * 1.45);                           // needle, gone by ~0.7
    const sq = Math.max(0, Math.sin((e - 0.55) / 0.45 * Math.PI));  // squash on the tail
    along = 1 + 0.85 * st - 0.16 * sq;
    across = 1 - 0.6 * st + 0.16 * sq;
  }
  if (s.fate === 'squeeze') {
    // brace = the anticipation part of the back-in curve: squash across the
    // door before the needle. Gone by the time the pinch proper starts.
    const pinch = Math.max(0, eb), brace = Math.max(0, -eb);
    scale *= 1 - 0.6 * pinch;
    alpha *= Math.max(0, 1 - 1.08 * pinch);
    along *= 1 + pinch - 1.1 * brace;
    across *= 1 - 0.65 * pinch + 1.5 * brace;
  }
  else if (s.fate === 'merge') { alpha *= 1 - Math.max(0, (e - 0.6) / 0.4); }
  else if (s.fate === 'die') { y += 0.3 * e; scale *= 1 - 0.8 * e; alpha *= 1 - e; }
  else if (s.fate === 'sink') { scale *= 1 - 0.7 * e; alpha *= 1 - 0.75 * e; }
  if (alpha <= 0.01) return;

  const horiz = s.axis === 'x';
  let kx = scale * (horiz ? along : across);
  let ky = scale * (horiz ? across : along);
  const cx = x * CELL + CELL / 2;
  const cy = y * CELL + CELL / 2;
  if (s.kind === 'clone') {
    let ox = 0, oy = 0;
    const mdx = bx - ax, mdy = by - ay;
    if (!s.fate && !s.birth && (mdx || mdy)) {
      // T40: the squelch. A push is one long squash against the load; a free
      // step is gather -> stretch -> landing splat -> settle.
      const st = s.pushing ? -0.24 * Math.sin(Math.PI * p) : 0.3 * squelch(p);
      if (Math.abs(mdx) >= Math.abs(mdy)) { kx *= 1 + st; ky *= 1 - st * 0.6; }
      else { ky *= 1 + st; kx *= 1 - st * 0.6; }
    }
    if (!reducedMotion.matches && bonkAt !== null && !s.fate && !s.birth) {
      // Splat: every self flattens against the wall it just walked into.
      const q = Math.min(1, Math.max(0, (time - bonkAt) / 180));
      const k = Math.sin(q * Math.PI);
      if (bonkVec[0]) { kx *= 1 - 0.32 * k; ky *= 1 + 0.26 * k; }
      else { ky *= 1 - 0.32 * k; kx *= 1 + 0.26 * k; }
      ox = bonkVec[0] * k * CELL * 0.12;
      oy = bonkVec[1] * k * CELL * 0.12;
    }
    drawClone(c, s, cx + ox, cy + oy, kx, ky, alpha, time, mdx, mdy);
    return;
  }
  const onTarget = layout.targets.has(Math.round(y) * layout.w + Math.round(x));
  const img = spriteImg(onTarget ? 'boxOn' : 'box');
  const half = CELL * (0.5 + SPRITE_PAD);
  c.globalAlpha = alpha;
  c.drawImage(img, cx - half * kx, cy - half * ky, half * 2 * kx, half * 2 * ky);
  c.globalAlpha = 1;
}

// The step squelch: a beat of gathering squash, a rush of stretch, a splat
// on landing that settles to rest. Returns the along-axis deform (-1..1).
function squelch(p) {
  if (p < 0.2) return -0.55 * Math.sin(p / 0.2 * Math.PI / 2);
  if (p < 0.55) return -0.55 + 1.55 * (1 - Math.cos((p - 0.2) / 0.35 * Math.PI)) / 2;
  const q = (p - 0.55) / 0.45;
  return Math.cos(q * Math.PI * 1.5) * (1 - q);
}

// T39 (Will): the player is an amoeba - a live blob whose rim ripples on two
// slow sine waves (seeded per body, so twins never wobble in unison), with
// eyes that look where it is going and blink every few seconds. Drawn as a
// path per frame; the pricey shadowBlur glow stays a cached image underneath.
function drawClone(c, s, cx, cy, kx, ky, alpha, time, mdx, mdy) {
  const t = reducedMotion.matches ? 0 : (time || 0);
  const seed = (s.a * 2.399) % (Math.PI * 2);
  const R = CELL * 0.37;
  // T40: lively right after a move, near-still once it has sat for a moment.
  const act = 0.3 + 0.7 * Math.max(0, Math.min(1, 1 - (t - lastMoveAt - 400) / 600));
  c.save();
  c.translate(cx, cy);
  c.scale(kx, ky);
  const gs = CELL * (0.5 + SPRITE_PAD);
  c.globalAlpha = alpha;
  c.drawImage(spriteImg('glow'), -gs, -gs, gs * 2, gs * 2);
  c.fillStyle = '#7aaede';
  c.beginPath();
  const N = 24;
  for (let i = 0; i <= N; i++) {
    const th = (i % N) / N * Math.PI * 2;
    const wob = 1 + act * (0.05 * Math.sin(3 * th + t * 0.0023 + seed)
      + 0.035 * Math.sin(5 * th - t * 0.0031 + seed * 1.7));
    // A pinch of squircle: bias the radius out at the diagonals so it keeps a
    // memory of the old square body without ever being one.
    const sq = 1 + 0.12 * Math.pow(Math.abs(Math.sin(2 * th)), 1.5);
    const rr = R * wob * sq;
    i ? c.lineTo(Math.cos(th) * rr, Math.sin(th) * rr) : c.moveTo(rr, 0);
  }
  c.closePath();
  c.fill();
  // Eyes: track the direction of travel (or the last one, at rest).
  let [lx, ly] = (mdx || mdy) ? [mdx, mdy] : DIRS[lastDir];
  const ll = Math.hypot(lx, ly) || 1;
  lx /= ll; ly /= ll;
  const er = Math.max(1.5, R * 0.3);
  const blink = !reducedMotion.matches && ((t * 0.001 + seed) % 3.8) < 0.15;
  for (const sx of [-1, 1]) {
    const ex = sx * R * 0.42, ey = -R * 0.2;
    if (blink) {
      c.strokeStyle = '#33506e';
      c.lineWidth = Math.max(1, er * 0.4);
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(ex - er * 0.7, ey);
      c.lineTo(ex + er * 0.7, ey);
      c.stroke();
      continue;
    }
    c.fillStyle = '#fff';
    c.beginPath();
    c.arc(ex, ey, er, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#33506e';
    c.beginPath();
    c.arc(ex + lx * er * 0.36, ey + (ly * er * 0.36) + er * 0.1, er * 0.55, 0, Math.PI * 2);
    c.fill();
  }
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.lineWidth = Math.max(1, R * 0.14);
  c.lineCap = 'round';
  c.beginPath();
  c.arc(0, R * 0.18, R * 0.36, Math.PI * 0.2, Math.PI * 0.8);
  c.stroke();
  c.restore();
  c.globalAlpha = 1;
}

// T34: clone and box bodies pre-render once per cell size - their shadowBlur
// fills were the single biggest per-frame cost on a busy board (every sprite,
// every feedback pass, every frame). Squash / needle / pop deforms scale the
// cached image instead; the corner radii distort imperceptibly for the
// 100-180ms a deform lasts.
const SPRITE_PAD = 0.45; // cells of margin baked around the body for its glow
let spriteCache = { cell: 0 };

function spriteImg(kind) {
  if (spriteCache.cell !== CELL) spriteCache = { cell: CELL };
  if (spriteCache[kind]) return spriteCache[kind];
  const pad = CELL * SPRITE_PAD;
  const cv = document.createElement('canvas');
  cv.width = cv.height = Math.ceil((CELL + pad * 2) * DPR);
  const c = cv.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const base = CELL * 0.7;
  const cx = pad + CELL / 2, cy = pad + CELL / 2;
  const r = Math.max(2, base * 0.26);
  if (kind === 'glow') {
    // The amoeba's halo: baked once so the live body never pays shadowBlur.
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, pad + CELL / 2);
    g.addColorStop(0, 'rgba(122,174,222,0.38)');
    g.addColorStop(0.55, 'rgba(122,174,222,0.16)');
    g.addColorStop(1, 'rgba(122,174,222,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, CELL + pad * 2, CELL + pad * 2);
  } else {
    const on = kind === 'boxOn';
    c.shadowColor = on ? 'rgba(147,196,147,0.4)' : 'rgba(233,188,96,0.4)';
    c.shadowBlur = CELL * 0.12;
    c.fillStyle = on ? '#93c493' : '#e9bc60';
    roundRect(c, cx - base / 2, cy - base / 2, base, base, r);
    c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = on ? 'rgba(58,110,58,0.5)' : 'rgba(146,103,26,0.5)';
    c.lineWidth = Math.max(1, base * 0.08);
    roundRect(c, cx - base / 2, cy - base / 2, base, base, r);
    c.stroke();
  }
  spriteCache[kind] = cv;
  return cv;
}

function drawFlashes(c, time) {
  if (!anim) return;
  // Clamped from below too: a rAF timestamp can lag the performance.now()
  // that stamped t0 in the input handler, and a negative p flips the ring
  // radius negative (IndexSizeError).
  const p = Math.max(0, Math.min(1, (time - anim.t0) / FLASH));
  if (p >= 1) return;
  for (const f of anim.flashes) {
    const cx = xOf(f.at) * CELL + CELL / 2;
    const cy = yOf(f.at) * CELL + CELL / 2;
    // Portal rings collapse inward where a body went in and bloom outward
    // where one came out; merge/death rings just expand.
    const portal = f.kind === 'in' || f.kind === 'out';
    const rad = f.kind === 'in' ? CELL * (0.74 - 0.42 * p) : CELL * (0.22 + 0.7 * p);
    c.save();
    c.globalAlpha = (1 - p) * (portal ? 0.55 : 1);
    c.strokeStyle = portal ? 'rgba(154,134,203,0.95)'
      : f.kind === 'merge' ? 'rgba(74,67,54,0.9)' : 'rgba(153,144,124,0.95)';
    c.shadowColor = c.strokeStyle;
    c.shadowBlur = CELL * 0.18;
    c.lineWidth = Math.max(1, CELL * (portal ? 0.05 : 0.09));
    c.beginPath();
    c.arc(cx, cy, rad, 0, Math.PI * 2);
    c.stroke();
    c.restore();
  }
}

// The win bloom is drawn inside every pass, so it cascades down the depths.
function drawBloom(c) {
  if (!bloom) return;
  const W = layout.w * CELL, H = layout.h * CELL;
  const g = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2,
    Math.max(W, H) * (0.15 + 0.85 * bloom.p));
  const a = (1 - bloom.p) * 0.5;
  g.addColorStop(0, 'rgba(147,196,147,' + a.toFixed(3) + ')');
  g.addColorStop(0.6, 'rgba(122,174,222,' + (a * 0.5).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(122,174,222,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
}

// bg = the parent pass: same world, but flashes and the win bloom stay home so
// the backdrop never strobes.
function drawScene(c, time, inner, bg, dpr) {
  c.setTransform(dpr || DPR, 0, 0, dpr || DPR, 0, 0);
  // Crop to the interior: layout cell (1,1) lands at (PAD, PAD). Everything
  // below draws in full-layout coords, so sprites mid-door just slide off.
  c.translate(PAD - CELL, PAD - CELL);
  drawTiles(c);
  const p = anim ? anim.p : 1;
  // Blocks first: everything else walks over (and through) them.
