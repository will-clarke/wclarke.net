    while (head < queue.length) {
      const s = queue[head++], hs = hash(s);
      for (const mv of ['U', 'D', 'L', 'R']) {
        const r = step(layout, s, mv);
        if (!r.changed) continue;
        const hn = hash(r.state);
        if (seen.has(hn)) continue;
        seen.set(hn, { prev: hs, mv });
        if (r.win) {
          const p = path(hn);
          edBanner('par ' + p.length + ' · ' + p, 'good');
          return;
        }
        if (seen.size > ED_CAP) {
          edBanner('DNF · gave up after ' + seen.size.toLocaleString() + ' states', 'bad');
          return;
        }
        queue.push(r.state);
      }
      if (performance.now() > until) {
        edBanner('solving… ' + seen.size.toLocaleString() + ' states', '');
        setTimeout(pump, 0);
        return;
      }
    }
    edBanner('unsolvable · ' + seen.size.toLocaleString() + ' states searched', 'bad');
  };

  edBanner('solving…', '');
  setTimeout(pump, 20);
}

// --- Code in, code out ------------------------------------------------------

const b64u = (s) => btoa(unescape(encodeURIComponent(s)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));

const isRow = (s) => s.length >= ED_MIN && !/[^#.*~N@$BP-]/.test(s);

function edExport() {
  const d = ed();
  return (d.name || 'Untitled') + '\n' + d.rows.join('\n') +
    '\n\nnest:' + b64u((d.name || 'Untitled') + '/' + d.rows.join('/'));
}

// Accepts either half of what edExport writes: the compact code wins if it is
// there, otherwise anything that looks like a grid row is the grid and the
// first line that does not is the name.
function edImport(txt) {
  let name = '', rows = [];
  const code = txt.match(/nest:([A-Za-z0-9_-]+)/);
  if (code) {
    try {
      const parts = unb64u(code[1]).split('/');
      name = parts[0];
      rows = parts.slice(1);
    } catch (e) { edBanner('that code is not readable', 'bad'); return; }
  } else {
    const lines = txt.split('\n').map(s => s.trim()).filter(Boolean);
    rows = lines.filter(isRow);
    name = lines.find(s => !isRow(s)) || '';
  }
  const n = rows.length;
  if (n < ED_MIN || n > ED_MAX) {
    edBanner('need ' + ED_MIN + '–' + ED_MAX + ' rows, found ' + n, 'bad');
    return;
  }
  if (rows.some(r => r.length !== n || !isRow(r))) {
    edBanner('rows must all be ' + n + ' legal glyphs wide (levels are square)', 'bad');
    return;
  }
  drafts.push({ name, rows });
  draftIx = drafts.length - 1;
  saveDrafts();
  openEditor();   // ...which puts the grid back in front of the code box
}

// --- Editor shell -----------------------------------------------------------

// Point the editor's chrome at whatever ed() is now - separate from opening it,
// because deleting a slot has to re-aim the live editor UNDER the drafts list.
function edSync() {
  edNote = '';
  $('edName').value = ed().name;
  $('edSize').textContent = ed().rows.length + '×' + ed().rows.length;
  for (const b of $('edPal').children) b.classList.toggle('on', b.dataset.g === edTool);
  edResize();
  edValidate();
}

function openEditor() {
  if (levelIndex >= 0) preEdit = levelIndex;
  closeOverlays();
  $('editor').hidden = false;
  $('edCode').hidden = true;
  $('edWrap').hidden = false;
  $('edCodeBtn').textContent = 'Code';
  edSync();
}

function openDrafts() {
  $('pickerTitle').textContent = 'Drafts';
  $('grid').textContent = '';
  drafts.forEach((d, i) => {
    const b = tile(i + 1, d.name || 'Untitled', d.rows.length + '×' + d.rows.length,
      () => { play('ui'); draftIx = i; openEditor(); });
    if (i === draftIx) b.classList.add('here');
    if (drafts.length < 2) return;
    const x = document.createElement('span');
    x.className = 'del';
    x.textContent = '×';
    // pointerdown, not click: the tile's own click must never also fire.
    x.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
      drafts.splice(i, 1);
      draftIx = Math.min(draftIx, drafts.length - 1);
      saveDrafts();
      edSync();
      openDrafts();
    });
    b.appendChild(x);
  });
  tile('+', 'New draft', 'blank 7×7', () => {
    play('ui');
    drafts.push(blankDraft(7));
    draftIx = drafts.length - 1;
    saveDrafts();
    openEditor();
  });
  $('overlay').hidden = true;
  $('picker').hidden = false;
}

$('edName').addEventListener('input', () => { ed().name = $('edName').value; saveDrafts(); });
$('edDrafts').addEventListener('click', () => { play('ui'); openDrafts(); });
$('edMinus').addEventListener('click', () => { play('ui'); edSetSize(ed().rows.length - 1); });
$('edPlus').addEventListener('click', () => { play('ui'); edSetSize(ed().rows.length + 1); });
$('edSolve').addEventListener('click', () => { play('ui'); edSolve(); });
$('edPlay').addEventListener('click', () => {
  const v = edCheck();
  if (!v.ok) { edNote = ''; edValidate(); return; }
  play('ui');
  playDraft(draftDef(ed()));
});
// The code box is the grid in another notation, so it takes the grid's place
// rather than stacking under it - on a short screen, stacking squeezed the
// canvas to nothing.
$('edCodeBtn').addEventListener('click', () => {
  play('ui');
  const open = $('edCode').hidden;
  $('edCode').hidden = !open;
  $('edWrap').hidden = open;
  $('edCodeBtn').textContent = open ? 'Grid' : 'Code';
  if (open) $('edText').value = edExport();
  else edResize();
});
$('edText').addEventListener('focus', () => $('edText').select());
$('edImport').addEventListener('click', () => { play('ui'); edImport($('edText').value); });
$('edClose').addEventListener('click', () => {
  play('ui');
  $('editor').hidden = true;
  // Leaving the editor onto a draft would strand you: the footer's only way
  // out would be back into the editor. So closing puts a real level back.
  if (levelIndex < 0) loadLevel(preEdit);
  else dirty = true;
  // Nor should Close leave #edit behind to reopen the editor on reload.
  try { window.history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
});

PAL.forEach(([g, label]) => {
  const b = document.createElement('button');
  b.dataset.g = g;
  b.innerHTML = '<b></b>';
  b.firstChild.textContent = g;
  b.appendChild(document.createTextNode(label));
  b.addEventListener('click', () => {
    edTool = g;
    play('ui');
    for (const s of $('edPal').children) s.classList.toggle('on', s === b);
  });
  $('edPal').appendChild(b);
});

// --- Input ------------------------------------------------------------------

const SWIPE = 24;
const REPEAT = 110;  // ms a drag must keep going before it walks another cell
let down = null;

stage.addEventListener('pointerdown', (e) => {
  // First finger down owns the gesture; a second one must not move the origin.
  if (!down) down = { id: e.pointerId, x: e.clientX, y: e.clientY, t: e.timeStamp };
});
// The move fires here, not on release: waiting for the finger to lift was the
// lag. Listening on window (not stage) so a drag that wanders off the board
// keeps reporting.
window.addEventListener('pointermove', (e) => {
  if (!down || e.pointerId !== down.id) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < SWIPE) return;
  // Then re-origin, so holding the drag walks cell by cell. The time gate is
  // what stops one fast flick from counting as two moves.
  if (down.fired && e.timeStamp - down.t < REPEAT) return;
  applyMove(ax > ay ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  down = { id: down.id, x: e.clientX, y: e.clientY, t: e.timeStamp, fired: true };
});
const release = (e) => { if (down && e.pointerId === down.id) down = null; };
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

const KEYS = {
  ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R',
  w: 'U', s: 'D', a: 'L', d: 'R',
};
window.addEventListener('keydown', (e) => {
  // The editor has real text fields; wasd there is typing, not walking.
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (KEYS[k]) { e.preventDefault(); applyMove(KEYS[k]); return; }
  if (k === 'Escape') closeOverlays();
  else if (overlayOpen()) return;
  else if (k === 'z' || k === 'u') undo();
  else if (k === 'r') reset();
});

// Both "Levels" buttons go back to wherever this level came from.
const goBack = () => { play('ui'); if (levelIndex < 0) openEditor(); else openPicker(); };

$('undo').addEventListener('click', undo);
$('reset').addEventListener('click', reset);
$('levels').addEventListener('click', goBack);
// Closing the drafts list just uncovers the editor it was opened from.
$('pickerClose').addEventListener('click', () => { play('ui'); $('picker').hidden = true; });
$('toLevels').addEventListener('click', goBack);
$('next').addEventListener('click', () => { play('ui'); loadLevel(Math.min(levelIndex + 1, LEVELS.length - 1)); });
$('replay').addEventListener('click', reset);
window.addEventListener('resize', () => {
  resize();
  if (!$('editor').hidden) edResize();
});

loadProgress();
loadDrafts();
syncAudioBtns();
// Resume at the first unsolved level that is already unlocked.
let start = 0;
while (start < progress.unlocked - 1 && progress.best[start] !== undefined) start++;
loadLevel(start);
if (location.hash === '#edit') openEditor();
requestAnimationFrame(frame);
</script>
